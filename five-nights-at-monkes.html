<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Five Nights at Monkes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=VT323&display=swap" rel="stylesheet">
<script src="glitchbox-config.js"></script>
<script src="glitchbox-save.js" data-pos="top-left"></script>
<style>
:root{--banana:#ffd23f;--jungle:#08120c;--leaf:#1d3a24;--rust:#c2452d;--crt:#8dffb0;--ink:#f3ecd8;--dim:#9a9a86;--panel:rgba(8,14,10,.9);--line:#2c4a33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:VT323,ui-monospace,monospace;color:var(--ink);user-select:none;-webkit-user-select:none;font-size:22px}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;font-size:inherit}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.hide{display:none!important}
.big-t{font-family:'Luckiest Guy',cursive;letter-spacing:1px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:3}
#clock{position:absolute;right:14px;top:10px;text-align:right;text-shadow:0 0 8px #000}
#clock b{display:block;font-family:'Luckiest Guy',cursive;font-size:38px;color:var(--banana);font-weight:400;line-height:1}
#clock small{font-size:22px;color:var(--ink);opacity:.85}
#power{position:absolute;left:14px;bottom:12px;font-size:24px;text-shadow:0 0 6px #000;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:8px}
#power b{color:var(--banana);font-weight:400;margin-left:6px}
#use{display:inline-flex;gap:3px;margin-left:10px;vertical-align:middle}
#use i{width:9px;height:18px;background:#3ddc84;border-radius:2px}
#use i.m{background:#ffd23f}#use i.h{background:#ff5a3c}
#role{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px 12px;font-size:20px;white-space:nowrap}
#role b{color:var(--banana);font-weight:400}
#calls{position:absolute;left:50%;top:44px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}
#calls button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:20px}
#calls button:hover{border-color:var(--banana)}
#sndBtn{position:absolute;right:14px;top:84px;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px 9px;font-size:20px}
/* office controls */
.cbtn{pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;width:96px;height:76px;border-radius:12px;background:rgba(20,24,20,.82);border:2px solid #4a5a48;font-size:26px;line-height:1;box-shadow:0 4px 0 #000}
.cbtn small{font-size:17px;opacity:.6;margin-top:3px}
.cbtn.on{background:#5a1a12;border-color:#ff6a4a;color:#ffd9cf;box-shadow:0 0 18px rgba(255,90,60,.5)}
.cbtn.lit.on{background:#4a3f0a;border-color:var(--banana);color:#fff6c8;box-shadow:0 0 18px rgba(255,210,63,.55)}
.cbtn.off{opacity:.25;pointer-events:none}
.cbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #000}
#ctl{position:fixed;inset:0;pointer-events:none;z-index:4}
.side{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
#sideL{left:12px}#sideR{right:12px}
#b_ht{position:absolute;left:calc(50% - 300px);bottom:16px}
#b_howl{position:absolute;left:calc(50% + 200px);bottom:16px;width:116px}
#b_howl.ring{animation:ring .25s infinite alternate;border-color:var(--banana)}
@keyframes ring{to{transform:translateY(-3px) rotate(2deg)}}
#b_cams{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);pointer-events:auto;width:min(380px,44vw);height:46px;border-radius:12px;background:rgba(141,255,176,.12);border:2px solid #4e9a68;color:var(--crt);font-size:26px}
#b_cams small{font-size:17px;opacity:.6;margin-left:6px}
#b_cams:hover{background:rgba(141,255,176,.22)}
/* cameras */
#camui{position:fixed;inset:0;pointer-events:none;z-index:4}
#map{position:absolute;right:12px;bottom:12px;width:330px;height:250px;background:rgba(4,14,8,.82);border:2px solid #2d6a44;border-radius:10px;pointer-events:auto}
#map svg{position:absolute;inset:0;width:100%;height:100%}
#map .cb{position:absolute;transform:translate(-50%,-50%);background:#0e2a18;border:2px solid #3f8f5c;color:var(--crt);border-radius:6px;font-size:17px;padding:0 5px;line-height:20px;white-space:nowrap}
#map .cb.on{background:var(--crt);color:#062010;border-color:#fff}
#map .cb.gl{animation:gl .15s infinite}
@keyframes gl{50%{opacity:.4}}
#map .you{position:absolute;transform:translate(-50%,-50%);color:var(--banana);font-size:17px;border:2px dashed var(--banana);border-radius:6px;padding:0 6px;line-height:18px}
#b_ban{position:absolute;left:12px;bottom:70px;pointer-events:auto;width:210px;height:62px;border-radius:12px;background:rgba(60,48,6,.9);border:2px solid var(--banana);color:#fff3b8;font-size:24px;overflow:hidden}
#b_ban small{font-size:16px;opacity:.7;margin-left:6px}
#b_ban i{position:absolute;left:0;bottom:0;height:5px;background:var(--banana)}
#b_ban.cd{opacity:.55}
#b_camdown{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);pointer-events:auto;width:min(380px,44vw);height:46px;border-radius:12px;background:rgba(141,255,176,.12);border:2px solid #4e9a68;color:var(--crt);font-size:26px}
/* monke player */
#mkui{position:fixed;inset:0;z-index:4;pointer-events:none}
#mkPanel{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:center;width:min(980px,96vw)}
.mk{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 8px;width:180px;text-align:center}
.mk h4{margin:0;font-family:'Luckiest Guy',cursive;font-weight:400;font-size:22px;color:var(--banana)}
.mk p{margin:0 0 4px;font-size:18px;color:var(--dim);min-height:20px}
.mk button{display:inline-block;margin:2px;padding:3px 9px;border-radius:8px;background:#3a1210;border:2px solid var(--rust);font-size:20px;position:relative;overflow:hidden}
.mk button[disabled]{opacity:.35;cursor:default}
#mkMap{position:absolute;left:50%;top:70px;transform:translateX(-50%);width:min(560px,80vw);height:min(330px,46vh);background:rgba(4,14,8,.82);border:2px solid #2d6a44;border-radius:10px}
#mkMap svg{position:absolute;inset:0;width:100%;height:100%}
#mkMap .rm{position:absolute;transform:translate(-50%,-50%);font-size:16px;color:#5fae7a;white-space:nowrap}
#mkMap .tok{position:absolute;transform:translate(-50%,-50%);font-size:26px;transition:left .3s,top .3s;filter:drop-shadow(0 0 4px #000)}
#mkMap .door{position:absolute;transform:translate(-50%,-50%);font-size:17px;padding:0 5px;border-radius:5px;background:#0e2a18;border:1px solid #3f8f5c}
#mkMap .door.shut{background:#5a1a12;border-color:#ff6a4a}
/* toasts */
#toasts{position:fixed;left:50%;top:84px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:6;pointer-events:none;width:min(92%,560px)}
.tst{background:rgba(8,14,10,.94);border:1px solid var(--line);border-radius:10px;padding:5px 14px;font-size:22px;text-align:center;animation:tin .2s ease-out;transition:opacity .5s}
.tst.good{border-color:#3ddc84;color:#c8ffe0}.tst.bad{border-color:var(--rust);color:#ffd0c4}.tst.call{border-color:var(--banana);color:#fff3b8;font-size:26px}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}
/* overlays */
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:8;padding:16px}
.ov.on{display:flex}
#title{flex-direction:column;background:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,.15),rgba(0,0,0,.82));text-align:center;gap:10px}
#title h1{font-family:'Luckiest Guy',cursive;font-weight:400;font-size:min(84px,11vw);line-height:.9;margin:0;color:var(--banana);text-shadow:0 5px 0 #6b3a06,0 0 30px rgba(255,210,63,.35);transform:rotate(-2deg)}
#title h1 span{display:block;font-size:.55em;color:var(--ink);text-shadow:0 4px 0 #3a2a10}
#title .tag{font-size:24px;color:var(--dim);margin:2px 0 12px}
.menu{display:flex;flex-direction:column;gap:9px;width:min(360px,86vw)}
.mb{background:#1a120a;border:3px solid #6b4a1a;border-radius:14px;padding:9px 12px;font-family:'Luckiest Guy',cursive;font-size:26px;color:var(--ink);box-shadow:0 5px 0 #000}
.mb:hover{border-color:var(--banana);color:var(--banana)}
.mb.pri{background:var(--banana);color:#2a1a04;border-color:#fff1a8}
.mb.pri:hover{color:#2a1a04;filter:brightness(1.08)}
.mb small{display:block;font-family:VT323,monospace;font-size:19px;opacity:.75;letter-spacing:0}
#sheetOv{background:rgba(0,0,0,.72)}
#sheet{background:#0b130d;border:3px solid var(--line);border-radius:16px;padding:18px 20px;width:min(560px,94vw);max-height:92vh;overflow:auto;text-align:center;box-shadow:0 10px 40px #000}
#sheet h2{font-family:'Luckiest Guy',cursive;font-weight:400;font-size:40px;margin:0 0 6px;color:var(--banana)}
#sheet p{margin:6px 0;font-size:22px;line-height:1.15}
#sheet .how{text-align:left}
#sheet .how b{color:var(--banana);font-weight:400}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.pick{background:#1a2a1e;border:2px solid var(--line);border-radius:10px;padding:5px 12px;font-size:24px}
.pick.on{border-color:var(--banana);color:var(--banana)}
.pick[disabled]{opacity:.3;cursor:default}
.sl{display:grid;grid-template-columns:90px 1fr 34px;gap:8px;align-items:center;text-align:left;font-size:22px}
.sl input{width:100%;accent-color:var(--banana)}
.pl{display:flex;justify-content:space-between;gap:10px;background:#13201a;border:1px solid var(--line);border-radius:10px;padding:5px 10px;margin:5px 0;font-size:22px;text-align:left}
.pl i{font-style:normal;color:var(--banana)}
.code{font-family:'Luckiest Guy',cursive;font-size:44px;letter-spacing:6px;color:var(--banana)}
input.tx{font-family:inherit;font-size:26px;background:#05100a;border:2px solid var(--line);color:var(--ink);border-radius:10px;padding:5px 10px;width:min(300px,80vw);text-align:center;text-transform:uppercase}
.err{color:#ff9a86;min-height:24px}
#intro{flex-direction:column;background:#000;text-align:center;cursor:pointer}
#intro h2{font-family:'Luckiest Guy',cursive;font-weight:400;font-size:min(80px,12vw);margin:0;color:var(--banana)}
#intro .t{font-size:30px;color:var(--dim);margin-bottom:18px}
#intro .note{background:#f3e7b5;color:#2a2210;transform:rotate(-1.5deg);padding:16px 20px;max-width:560px;font-size:24px;line-height:1.15;text-align:left;box-shadow:4px 6px 0 rgba(0,0,0,.5)}
#intro .skip{margin-top:16px;color:var(--dim);font-size:20px}
#six{flex-direction:column;background:#000;text-align:center}
#six b{font-family:'Luckiest Guy',cursive;font-weight:400;font-size:min(150px,22vw);color:var(--banana);animation:pop .6s ease-out}
#six span{font-size:30px;color:var(--ink)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
#rot{background:#000;flex-direction:column;text-align:center;z-index:20;font-size:28px}
#rot b{font-size:60px;display:block}
@media (max-height:520px){.cbtn{width:78px;height:56px;font-size:21px}.cbtn small{display:none}#map{width:250px;height:190px}#map .cb{font-size:14px;line-height:16px}#b_ban{width:170px;height:50px;font-size:20px;bottom:60px}#clock b{font-size:30px}#b_ht{left:calc(50% - 250px)}#b_howl{left:calc(50% + 150px);width:96px}.mk{width:150px}#role{font-size:17px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hide">
  <div id="clock"><b id="hr">12 AM</b><small id="nt">NIGHT 1</small></div>
  <div id="power">POWER<b id="pw">100%</b><span id="use"></span></div>
  <div id="role" class="hide"></div>
  <div id="calls" class="hide"><button data-call="WEST!">WEST!</button><button data-call="EAST!">EAST!</button><button data-call="VENT!">VENT!</button><button data-call="CLAPPY!">CLAPPY!</button><button data-call="HOWL!">HOWL!</button></div>
  <button id="sndBtn" title="Sound (M)">🔊</button>
</div>

<div id="ctl" class="hide">
  <div class="side" id="sideL"><button class="cbtn" id="b_dl" data-a="dl">DOOR<small>A</small></button><button class="cbtn lit" id="b_ll" data-a="ll">LIGHT<small>Q</small></button></div>
  <div class="side" id="sideR"><button class="cbtn" id="b_dr" data-a="dr">DOOR<small>D</small></button><button class="cbtn lit" id="b_lr" data-a="lr">LIGHT<small>E</small></button></div>
  <button class="cbtn" id="b_ht" data-a="ht">VENT<small>S</small></button>
  <button class="cbtn" id="b_howl" data-a="howl">HOWL<br>BACK<small>H</small></button>
  <button id="b_cams">▲ CAMERAS<small>SPACE</small></button>
</div>

<div id="camui" class="hide">
  <div id="map"></div>
  <button id="b_ban">🍌 DROP BANANA<small>B</small><i></i></button>
  <button id="b_camdown">▼ BACK TO OFFICE</button>
</div>

<div id="mkui" class="hide"><div id="mkMap"></div><div id="mkPanel"></div></div>
<div id="toasts"></div>

<div id="title" class="ov on">
  <h1>FIVE NIGHTS<span>AT MONKES</span></h1>
  <div class="tag">Monke Mountain Fun Jungle. Night keeper wanted. 12 AM to 6 AM.</div>
  <div class="menu">
    <button class="mb pri" id="goMP">PLAY WITH FRIENDS<small>1 to 5 online: split the doors and cameras, or let one friend BE the monkes</small></button>
    <button class="mb" id="goSolo">SOLO NIGHT<small id="soloSub">keep the monkes out until 6 AM</small></button>
    <button class="mb" id="goHow">HOW TO SURVIVE</button>
  </div>
</div>
<div id="intro" class="ov"></div>
<div id="six" class="ov"><b>6 AM</b><span id="sixSub"></span></div>
<div id="sheetOv" class="ov"><div id="sheet"></div></div>
<div id="rot" class="ov"><b>↻</b>Turn your phone sideways to keep watch.<br><small style="color:#9a9a86">The night is paused.</small></div>

<script>
'use strict';
// ═══════════════════════ basics ═══════════════════════
const $=id=>document.getElementById(id);
const HASH=location.hash;
const SMOKE=/^#(smoke|balance)/.test(HASH), DEBUG=/debug/.test(HASH);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let RS=0; // seeded RNG for sims; 0 = Math.random
function R(){if(!RS)return Math.random();RS=RS+0x6D2B79F5|0;let t=Math.imul(RS^RS>>>15,1|RS);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const LS={get(k,d){try{const v=localStorage.getItem('fnam.'+k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem('fnam.'+k,v)}catch(e){}}};

// ═══════════════════════ the building ═══════════════════════
const HOUR=45, HOURS=6;
const CAMS=[
  {id:'stage',  n:'BANANA STAGE',x:.50,y:.09,k:'1'},
  {id:'pit',    n:'BALL PIT',    x:.24,y:.33,k:'2'},
  {id:'whall',  n:'WEST HALL',   x:.13,y:.60,k:'3'},
  {id:'wcorner',n:'WEST CORNER', x:.30,y:.82,k:'4'},
  {id:'gift',   n:'GIFT SHOP',   x:.76,y:.33,k:'5'},
  {id:'ehall',  n:'EAST HALL',   x:.87,y:.60,k:'6'},
  {id:'ecorner',n:'EAST CORNER', x:.70,y:.82,k:'7'},
  {id:'kitchen',n:'SNACK BAR',   x:.50,y:.36,k:'8'},
  {id:'vent',   n:'AIR VENT',    x:.50,y:.62,k:'9'},
  {id:'toys',   n:'TOY ROOM',    x:.14,y:.09,k:'0'},
];
const CAMI=Object.fromEntries(CAMS.map((c,i)=>[c.id,i]));
const OFFICE={x:.50,y:.88};
const LINKS=[['stage','pit'],['pit','whall'],['whall','wcorner'],['wcorner','office'],['stage','gift'],['gift','ehall'],['ehall','ecorner'],['ecorner','office'],['stage','kitchen'],['kitchen','vent'],['vent','office'],['toys','pit']];
const camOf=loc=>loc==='ventA'||loc==='ventB'?'vent':loc;
const MK={
  bongo:{n:'Bongo',path:['stage','pit','whall','wcorner','W'],back:1,every:4.6,dwell:7.5,watch:true,side:'W',emoji:'🦍',
    tip:'Bongo is slow and loud. Heavy footsteps on the left mean he is in the West Hall. Chest beating means he is AT the west door: close it until he bangs and leaves.'},
  chip:{n:'Chip',path:['stage','gift','ehall','ecorner','E'],back:1,every:3.5,dwell:4.8,watch:true,side:'E',emoji:'🐵',
    tip:'Chip is quick and quiet. A chitter on the right means he is in the East Corner. Check the EAST light and shut the door fast. Watching him on camera freezes him.'},
  mimi:{n:'Mimi',path:['kitchen','ventA','ventB','V'],back:0,every:4.2,dwell:5,watch:false,side:'V',emoji:'🐒',
    tip:'Mimi crawls through the air vent. Creaking means she is close, knocking means she is at the grate. Close the VENT hatch until she scratches off.'},
};
const MKS=['bongo','chip','mimi'];
const EXTRA={clappy:{n:'Clappy',emoji:'🥁',tip:'Clappy winds up in the Toy Room. Once his meter hits the red he starts clanging (which riles the others). Drop a banana on him to reset it. If you hear the wind-up, he is loose: close the door where the clang comes from.'},
  howla:{n:'Howla',emoji:'🌑',tip:'Howla howls outside the window. Press HOWL BACK within a few seconds and she leaves. Miss it and she smashes a fuse (big power loss). Howling when she is not there wastes power.'},
  out:{n:'The dark',emoji:'🔌',tip:'The power ran out. Doors, lights, the vent hatch and the cameras all drain it. Open a door again as soon as the monke leaves.'}};
const ALLM=['bongo','chip','mimi','clappy','howla'];
const NIGHTS=[null,
  {bongo:3,chip:1,mimi:0,clappy:0,howla:0},
  {bongo:5,chip:4,mimi:3,clappy:0,howla:0},
  {bongo:6,chip:6,mimi:5,clappy:4,howla:3},
  {bongo:8,chip:8,mimi:7,clappy:7,howla:6},
  {bongo:11,chip:11,mimi:10,clappy:10,howla:9},
  {bongo:15,chip:13,mimi:13,clappy:14,howla:13}];
const NOTES=[null,
  'Hey new keeper. The monkes walk around at night, nobody knows why. Bongo is the big one. Heavy footsteps on the left? Flick the WEST light. If he is standing there, shut the door. Doors eat power, so open up again once he leaves. Chip pokes around the east side sometimes too.<br>- Gus',
  'Mimi found the air vent. Creaking in the duct means she is close, a knock means she is at the grate. Close the VENT hatch until she gives up.<br>Tip: staring at Bongo or Chip on the cameras keeps them frozen.<br>- Gus',
  'Bad news. Clappy, the cymbal toy, is awake. His clap meter fills up in the Toy Room. Drop a banana on him and he stops to eat. Let it fill and he comes for a door.<br>And if something howls outside the window, hit HOWL BACK quick or she smashes a fuse.<br>- Gus',
  'They are getting bolder. Bananas work on any monke: drop one in their room and they stop to eat for a while. The dispenser needs time to reload, so pick carefully.<br>- Gus',
  'Last night. Do not waste power. Do not answer a howl that never happened. See you at 6.<br>- Gus',
  'Gus did not leave a note tonight.'];
const PW={base:.12,door:.2,light:.16,hatch:.16,cam:.08,howlMiss:1.5,fuse:11};
const EAT=16, BCD=22, HOWL_WIN=4.6, BLOCK_T=1;
const VS_CD={bongo:7,chip:5,mimi:6,clappy:6,howla:34};
const CTL_ALL=['dl','ll','dr','lr','ht','cams','howl'];
const ROLESETS={1:[CTL_ALL],2:[['dl','ll','dr','lr','ht'],['cams','howl']],3:[['dl','ll','ht'],['dr','lr','howl'],['cams']],4:[['dl','ll'],['dr','lr'],['cams'],['ht','howl']]};
const CTL_NAME={dl:'west door',ll:'west light',dr:'east door',lr:'east light',ht:'vent hatch',cams:'cameras + bananas',howl:'howl back'};
function roleName(c){if(!c||!c.length)return'WATCHING';if(c.length===CTL_ALL.length)return'KEEPER';
  const s=c.join();if(s==='dl,ll,dr,lr,ht')return'OFFICE (doors + vent)';if(s==='cams,howl')return'CAMERAS + HOWL';if(s==='dl,ll,ht')return'WEST DOOR + VENT';if(s==='dr,lr,howl')return'EAST DOOR + HOWL';
  if(s==='cams')return'CAMERAS';if(s==='dl,ll')return'WEST DOOR';if(s==='dr,lr')return'EAST DOOR';if(s==='ht,howl')return'VENT + HOWL';return c.map(x=>CTL_NAME[x]).join(', ').toUpperCase()}
function assignRoles(cids,monke){const g=cids.filter(c=>c!==monke),out={};const set=ROLESETS[Math.min(4,g.length)]||[];g.forEach((c,i)=>out[c]=set[i]?set[i].slice():[]);if(monke)out[monke]=['monke'];return out}

// ═══════════════════════ the night (pure sim; host/solo run it) ═══════════════════════

// every player input goes through here (host/solo); guests send it over the net
function act(cid,a,arg){
  if(!G||G.ph!=='play'||G.wait>0)return;
  const C=ctlOf(cid);
  if(a==='dl'||a==='dr'||a==='ll'||a==='lr'||a==='ht'){
    if(!C.includes(a)||G.out)return;G[a]^=1;
    if(a==='ll'||a==='lr')ev(G[a]?'light_on':'light_off',a==='ll'?-.6:.6);
    else if(a==='ht')ev('hatch',-.3);else ev(G[a]?'door_close':'door_open',a==='dl'?-.8:.8);
    return;
  }
  if(a==='cam'){if(!C.includes('cams'))return;G.cams[cid]=G.out?-1:(arg|0);return}
  if(a==='banana'){
    if(!C.includes('cams')||G.out||G.bcd>0)return;const room=CAMS[arg|0]&&CAMS[arg|0].id;if(!room)return;
    G.bcd=BCD;G.bn[room]=EAT;G.stats.bananas++;ev('banana');let fed=0;
    for(const k of MKS){const m=G.mk[k];if(camOf(MK[k].path[m.loc])===room&&m.loc<MK[k].path.length-1){m.eat=EAT;fed++}}
    if(room==='toys'&&!G.cl.loose&&(G.lv.clappy>0||G.monke)){G.cl.g=0;G.cl.eat=EAT;G.cl.nc=0;fed++}
    if(fed)ev('munch');return;
  }
  if(a==='howl'){
    if(!C.includes('howl')||G.out)return;
    ev('howl_back');if(G.hw.on>0){G.hw.on=0;G.stats.howls++;msg('Howla backed off','good')}else{G.pw-=PW.howlMiss;G.stats.wasted++}
    return;
  }
  if(a==='m'&&isMonke(cid)){ // versus: the monke player
    const k=arg&&arg.k,op=arg&&arg.op;
    if(MK[k]){const m=G.mk[k],d=MK[k];if(G.mcd[k]>0||m.eat>0||m.loc===d.path.length-1||G.out)return;
      if(op==='back'){if(m.loc===0)return;advance(k,-1);G.mcd[k]=VS_CD[k]*.5;return}
      if(d.watch&&watched(camOf(d.path[m.loc]))){G.ev.push('!'+d.n+' is being watched on camera');return}
      advance(k);G.mcd[k]=VS_CD[k];return}
    if(k==='clappy'&&G.mcd.clappy<=0&&!G.cl.loose&&G.cl.eat<=0){G.cl.g=Math.min(100,G.cl.g+20);G.mcd.clappy=VS_CD.clappy;if(G.cl.g>=60)ev('clang',-.4);return}
    if(k==='howla'&&G.mcd.howla<=0&&G.hw.on<=0){startHowl();G.mcd.howla=VS_CD.howla;return}
  }
}

// ═══════════════════════ online (room relay, host runs the night) ═══════════════════════
//   guest→host {t:'hi',cid,name} {t:'hb',cid} {t:'in',cid,a,arg} {t:'seat',cid} {t:'bye',cid}
//   host→all   {t:'st',ph,pl:[[cid,name]],night,vs,monke,seed,roles}  {t:'w',...snapshot}  {t:'full',to}
//   anyone→all {t:'call',name,w}
const MAXP=5,GONE=15000;
const CODE_A='ABCDEFGHJKMNPQRSTUVWXYZ';
const rcode=n=>Array.from({length:n},()=>CODE_A[Math.floor(Math.random()*CODE_A.length)]).join('');
const MYID=rcode(8);
const NET={mode:'off',ws:null,code:'',lastHost:0,lastW:0,lastHb:0};
let HS=null,NAME=LS.get('name','');
const myName=()=>(NAME||'Keeper').slice(0,12);
function wsURL(room,role){const b=window.GLITCHBOX_WS&&!/PLACEHOLDER/i.test(window.GLITCHBOX_WS)?window.GLITCHBOX_WS:(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws';return b+'?room='+encodeURIComponent(room)+'&role='+role}
function netConnect(room,role){netClose();NET.code=room;NET.mode=role;NETROLE=role;ME=MYID;NET.lastHost=Date.now();let ws;
  try{ws=new WebSocket(wsURL(room,role))}catch(e){mpHome('Could not reach the game server.');return}
  NET.ws=ws;ws.onopen=()=>ws.send(JSON.stringify(role==='host'?{t:'create',code:room,max:MAXP}:{t:'join',code:room}));
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}onNet(m)};
  ws.onclose=()=>{if(NET.ws===ws){NET.ws=null;if(NET.mode!=='off')mpLost('Lost the connection to the room.')}}}
function netSend(o){if(NET.ws&&NET.ws.readyState===1)NET.ws.send(JSON.stringify(o))}
function netClose(){const w=NET.ws;NET.ws=null;if(w){w.onclose=null;try{w.close()}catch(e){}}}
function netOrHost(m){if(NETROLE==='host')hostIn(m);else netSend(m)}
function onNet(m){
  if(m.t==='created'){HS={ph:'lobby',players:[],night:1,vs:false,monke:null,seed:0,seen:{},roles:{}};hostIn({t:'hi',cid:MYID,name:myName()});return}
  if(m.t==='joined'||m.t==='start'){if(NET.mode==='guest')netSend({t:'hi',cid:MYID,name:myName()});return}
  if(m.t==='error'){const t=m.msg||'That did not work.';netClose();NET.mode='off';NETROLE='solo';mpHome(/No game/.test(t)?'No room with that code. Check the letters.':/full/.test(t)?'That room is full (5 players).':t);return}
  if(m.t==='left')return;
  if(m.t==='call'){toast((m.name||'?')+': '+m.w,'call',2200);return}
  if(NET.mode==='host'){hostIn(m);return}
  if(m.to&&m.to!==MYID)return;
  if(m.t==='st')clientState(m);
  else if(m.t==='w')applySnap(m);
  else if(m.t==='full'){netClose();NET.mode='off';NETROLE='solo';mpHome('That room is full (5 players).')}
}
const HP=cid=>HS.players.find(p=>p.cid===cid);
function hostIn(m){
  if(!HS)return;if(m.cid)HS.seen[m.cid]=Date.now();
  if(m.t==='hi'){const p=HP(m.cid);if(p)p.name=String(m.name||p.name).slice(0,12);else{if(HS.players.length>=MAXP){netSend({t:'full',to:m.cid});return}HS.players.push({cid:m.cid,name:String(m.name||'Keeper').slice(0,12)})}hostPush()}
  else if(m.t==='seat'){if(HS.ph!=='lobby'||!HS.vs)return;HS.monke=HS.monke===m.cid?null:HS.monke&&HP(HS.monke)?HS.monke:m.cid;hostPush()}
  else if(m.t==='in'){act(m.cid,m.a,m.arg)}
  else if(m.t==='bye')hostDrop(m.cid);
}
function hostDrop(cid){if(cid===MYID||!HP(cid))return;HS.players=HS.players.filter(p=>p.cid!==cid);
  if(HS.monke===cid){HS.monke=null;if(G&&G.ph==='play'){G.monke=null;msg('The monke player left. The monkes run on their own now.','bad')}}
  if(G&&G.ph==='play'){delete G.cams[cid];HS.roles=assignRoles(HS.players.map(p=>p.cid),HS.monke);G.roles=HS.roles;msg('A keeper left. Jobs were shuffled.','bad')}
  hostPush()}
function hostStart(){if(!HS)return;const guards=HS.players.filter(p=>p.cid!==HS.monke);if(!guards.length){toast('Somebody has to be a keeper!','bad');return}
  if(HS.vs&&!HS.monke){toast('Versus needs someone to play the monkes.','bad');return}
  HS.seed=1+Math.floor(Math.random()*1e9);HS.ph='play';HS.roles=assignRoles(HS.players.map(p=>p.cid),HS.vs?HS.monke:null);hostPush()}
function hostLobby(){if(!HS)return;HS.ph='lobby';hostPush()}
function hostTick(){if(NETROLE!=='host'||!HS)return;const now=Date.now();for(const p of HS.players.slice())if(p.cid!==MYID&&now-(HS.seen[p.cid]||now)>GONE)hostDrop(p.cid);if(now-(HS.lastPush||0)>2000)hostPush()}
function hostPush(){HS.lastPush=Date.now();const st={t:'st',ph:HS.ph,pl:HS.players.map(p=>[p.cid,p.name]),night:HS.night,vs:HS.vs,monke:HS.vs?HS.monke:null,seed:HS.seed,roles:HS.roles};netSend(st);clientState(st)}
let ST=null;
function clientState(m){
  const prev=ST;ST=m;NET.lastHost=Date.now();
  if(m.ph==='lobby'){if(mode!=='lobby'){mode='lobby';G=null;CAM.on=false;$('intro').classList.remove('on');$('six').classList.remove('on')}renderLobby();return}
  if(m.ph==='play'){
    if(!prev||prev.seed!==m.seed||mode!=='play'||!G){if(!m.roles[MYID])return;
      const lv=m.monke?{bongo:0,chip:0,mimi:0,clappy:0,howla:0}:NIGHTS[m.night];G=newNight(m.night,lv,m.roles,m.monke);beginNight()}

  ok(idle.w<=.25,'doing nothing loses night 1 ('+(idle.w*100|0)+'% wins)');
  ok(camp.w===0,'hiding behind every door runs out of power ('+(camp.w*100|0)+'% wins)');
  rd.forEach((r,i)=>ok(r.w>=(i<3?.7:.3),'a player who reacts to the cues survives night '+(i+1)+' ('+(r.w*100|0)+'% wins)'));
  ok(mash.w<rd[3].w,'mashing HOWL BACK does worse than reading ('+(mash.w*100|0)+'% vs '+(rd[3].w*100|0)+'%)');
  // page
  ok(!/—/.test(document.body.innerText+src.replace(/<script[\s\S]*?<\/script>/g,'')),'no em dashes in player text');
  ok(!/\bAI\b/.test(document.body.innerText),'says CPU, not AI');
  ok(!!document.querySelector('script[src="glitchbox-menu.js"]'),'quit button script present');
  G=null;ME='solo';
  const pre=document.createElement('pre');pre.id='smokeout';pre.textContent=(fail?'SMOKE FAIL':'SMOKE PASS')+' '+pass+'/'+(pass+fail)+'\n'+out.join('\n');document.body.appendChild(pre);document.title=(fail?'SMOKE FAIL ':'SMOKE PASS ')+pass+'/'+(pass+fail);
});
</script>
<script src="glitchbox-menu.js" data-pos="top-left" defer></script>
