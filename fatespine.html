      case 'r': add.enemy(E_SCRUBBER,x,y);  break;
      case 'k': add.enemy(E_KESH,x,y);      break;
      case 'U': add.enemy(E_AUDITOR,x,y);   break;
      case 'Z': add.enemy(E_ARCHIVIST,x,y); break;
    }
  });
  if(room.rowsB) TIL_B = parseRows(room.rowsB, ()=>{});
  if(room.beams) for(const b of room.beams) add.prop(PR_BEAM, b[0], 1, b[1], 40, 40);
  if(room.laser) add.prop(PR_LASER, 1, 9, 0, 18, 64);

  const F = SAVE.facts;
  if(PATCHES[id] && !room.kind) PATCHES[id](F, add);

  BODY = computeBody(F);
  const isFrac = room.kind === 'fracture';
  // THE LOANER RULE: a chamber hands you the power at the door, because a
  // trial is allowed to demand mastery of the very thing it grants.
  const powers = SAVE.powers | (isFrac ? room.power : 0);

  RUN = {
    id, isFrac, powers, node:NODES[id],
    par:room.par||0, gold:room.gold||0, forkCap:room.forkCap||0,
    forksLocked:!!room.forksLocked,
    pips:isFrac ? room.pips + (SAVE.soften?2:0) : 0,
    limit:room.limit||0, seal:room.seal||0,
    soften:!!SAVE.soften, lastWord:!!room.lastWord,
    props, enemies, splinterIds,
    startedFrom:opts.from||null,
  };

  // ── seed the world ──
  WI[I_SEED]   = 0x5f3a71 ^ (id.charCodeAt(0)*7919) ^ (id.length*104729);
  WI[I_HP]     = isFrac && room.gauntlet ? 1 : BODY.maxHp;
  WI[I_AMMO]   = BODY.ammo;
  WI[I_LAYER]  = 0;
  WF[PL+A_X]   = spawnTX*TW + TW/2;
  WF[PL+A_Y]   = spawnTY*TW + TW;
  WF[PL+A_FACE]= 1;
  WF[F_CHRONO] = isFrac ? 0 : 6.0;

  for(let i=0;i<enemies.length && i<MAXE;i++){
    const e = enemies[i], b = EN+i*EN_N, ib = ENI+i*EI_N;
    WF[b+E_X] = e.tx*TW + TW/2;
    WF[b+E_Y] = e.ty*TW + TW;
    WF[b+E_AX]= WF[b+E_X]; WF[b+E_AY]= WF[b+E_Y];
    WF[b+E_HP]= ENEMY_HP[e.type] || 3;
    WF[b+E_CD]= 0.4 + i*0.13;
    WI[ib+N_TYPE] = e.type; WI[ib+N_ALIVE] = 1;
    if(e.type===E_TURRET||e.type===E_CENSOR) WF[b+E_Y] = e.ty*TW + TW/2;
  }
  // Props rest on the ground. Authoring a plate one row high in a text grid
  // is far too easy, and a plate 32 px above the floor can never be stood on.
  const gridSolid = (tx,ty)=>{
    if(tx<0||ty<0||tx>=GW||ty>=GH) return true;
    const t = TIL_A[ty*GW+tx];
    return t===T_SOLID||t===T_BREAK||t===T_DOOR||t===T_ONEWAY;
  };
  const snapY = (tx,ty)=>{ for(let y=ty; y<ty+5 && y<GH-1; y++) if(gridSolid(tx,y+1)) return y; return ty; };
  const SNAP = {1:1,2:1,3:1,4:1,5:1,6:1,7:1};
  for(let i=0;i<props.length && i<MAXP;i++){
    const p = props[i], b = PR+i*PR_N, ib = PRI+i*PI_N;
    if(SNAP[p.type]) p.ty = snapY(p.tx, p.ty);
    WF[b+P_X] = p.tx*TW + TW/2;
    WF[b+P_Y] = p.ty*TW + TW;
    WF[b+P_W] = p.w; WF[b+P_H] = p.h; WF[b+P_VAL] = p.val;
    WI[ib+PI_TYPE] = p.type; WI[ib+PI_ALIVE] = 1;
    if(p.type===PR_BEAM){ WF[b+P_Y] = TW; WF[b+P_T] = p.val; }
    if(p.type===PR_LASER){ WF[b+P_X] = TW*1.5; }
  }
  countEnemies();

  // tapes and history start clean
  TAPE.fill(0); tapeBirth.fill(-1);
  ringMin = 0; ringRec();
}
function countEnemies(){
  let n = 0;
  for(let i=0;i<MAXE;i++) if(WI[ENI+i*EI_N+N_ALIVE]===1){
    const t = WI[ENI+i*EI_N+N_TYPE];
    if(t!==E_DOG && t!==E_ALLY) n++;
  }
  WI[I_EALIVE] = n;
}

// ══════════════════════════ 10. PARTICLE EMITTERS ══════════════════════════
// Never stored, never simulated. A particle's position is a pure function of
// (tick - spawnTick, seed, kind), so rewinding plays them backwards for free
// and they cost the snapshot exactly nothing.
const FXN = 512;
const FX = { tick:new Int32Array(FXN), kind:new Int8Array(FXN), x:new Float32Array(FXN),
             y:new Float32Array(FXN), a:new Float32Array(FXN), s:new Int32Array(FXN), head:0 };
const FX_HIT=1, FX_KILL=2, FX_FORK=3, FX_DUST=4, FX_SHOT=5, FX_ECHODIE=6,
      FX_PICKUP=7, FX_SPARK=8, FX_BLADE=9, FX_SLIP=10;
function emit(kind,x,y,a){
  const h = FX.head;
  FX.tick[h]=WI[I_TICK]; FX.kind[h]=kind; FX.x[h]=x; FX.y[h]=y; FX.a[h]=a||0;
  FX.s[h]=(WI[I_TICK]*2654435761 ^ (x*7|0) ^ (y*131|0))>>>0;
  FX.head=(h+1)%FXN;
}

// ══════════════════════════ 11. PHYSICS ════════════════════════════════════
const GRAV=2000, TERM=900, RUNMAX=260, RUNACC=2400, FRIC=3000,
      AIRACC=1400, AIRMAX=300, JUMPV=680, DASHV=1600, DASHTICKS=9;
const PW=18, PH=34;                                    // player AABB

function hitsSolid(cx, feet, w, h){
  const x0=Math.floor((cx-w/2)/TW), x1=Math.floor((cx+w/2-0.001)/TW);
  const y0=Math.floor((feet-h)/TW),  y1=Math.floor((feet-0.001)/TW);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty)) return true;
  return false;
}
function hitsSpike(cx, feet, w, h){
  const x0=Math.floor((cx-w/2)/TW), x1=Math.floor((cx+w/2-0.001)/TW);
  const y0=Math.floor((feet-h)/TW),  y1=Math.floor((feet-0.001)/TW);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) if(spikeAt(tx,ty)) return true;
  return false;
}
// Echoes are one-way platforms on their TOP EDGE ONLY and never a lateral
// solid. Being crushed by a past self would be unforgivable, so it cannot
// happen: they simply are not walls.
function ghostTop(cx, w, prevFeet, newFeet, skipIdx){
  let best = null;
  for(let i=0;i<MAXG;i++){
    if(i===skipIdx) continue;
    const gi = GSI+i*GS_N;
    if(!WI[gi+G_ALIVE]) continue;
    const b = GH0+i*AC_N, gx = WF[b+A_X], gy = WF[b+A_Y];
    const top = gy - PH;
    if(Math.abs(gx-cx) > (w/2 + 9)) continue;
    if(prevFeet <= top+2 && newFeet >= top){ if(best===null || top<best) best = top; }
  }
  return best;
}
// Move on one axis, resolve against tiles. Called with the actor already out
// of the wall, so a snap to the tile boundary is always correct.
function moveX(base, ibase, w, h){
  const vx = WF[base+A_VX];
  if(vx === 0) return;
  const nx = WF[base+A_X] + vx*DT;
  if(WF[base+A_PHASE] > 0){ WF[base+A_X] = nx; return; }   // phase-slipped
  if(!hitsSolid(nx, WF[base+A_Y], w, h)){ WF[base+A_X] = nx; if(ibase>=0) WI[ibase+AI_WALL]=0; return; }
  if(vx > 0) WF[base+A_X] = Math.floor((nx + w/2)/TW)*TW - w/2 - 0.01;
  else       WF[base+A_X] = Math.floor((nx - w/2)/TW)*TW + TW + w/2 + 0.01;
  WF[base+A_VX] = 0;
  WF[base+A_WALL] = vx > 0 ? 1 : -1;
  if(ibase>=0) WI[ibase+AI_WALL] = vx > 0 ? 1 : -1;
}
function moveY(base, ibase, w, h, gidx){
  const vy = WF[base+A_VY];
  const y0 = WF[base+A_Y];
  const ny = y0 + vy*DT;
  const phased = WF[base+A_PHASE] > 0;
  if(ibase>=0) WI[ibase+AI_GROUND] = 0;
  if(vy >= 0){                                            // falling
    if(!phased){
      // one-way tiles
      const tyN = Math.floor((ny-0.001)/TW);
      const x0=Math.floor((WF[base+A_X]-w/2)/TW), x1=Math.floor((WF[base+A_X]+w/2-0.001)/TW);
      for(let ty=Math.floor((y0-0.001)/TW); ty<=tyN; ty++){
        for(let tx=x0;tx<=x1;tx++){
          if(onewayAt(tx,ty)){
            const top = ty*TW;
            if(y0 <= top+1 && ny >= top){
              WF[base+A_Y]=top; WF[base+A_VY]=0;
              if(ibase>=0) WI[ibase+AI_GROUND]=1;
              return;
            }
          }
        }
      }
      // echoes as platforms (player only)
      if(gidx === -1){
        const gt = ghostTop(WF[base+A_X], w, y0, ny, -1);
        if(gt !== null){ WF[base+A_Y]=gt; WF[base+A_VY]=0; if(ibase>=0) WI[ibase+AI_GROUND]=2; return; }
        const ft = frozenBulletTop(WF[base+A_X], w, y0, ny);
        if(ft !== null){ WF[base+A_Y]=ft; WF[base+A_VY]=0; if(ibase>=0) WI[ibase+AI_GROUND]=3; return; }
      }
      if(hitsSolid(WF[base+A_X], ny, w, h)){
        WF[base+A_Y] = Math.floor(ny/TW)*TW - 0.01;
        WF[base+A_VY] = 0;
        if(ibase>=0) WI[ibase+AI_GROUND] = 1;
        return;
      }
    }
    WF[base+A_Y] = ny;
  } else {                                                // rising
    if(!phased && hitsSolid(WF[base+A_X], ny, w, h)){
      WF[base+A_Y] = Math.floor((ny-h)/TW)*TW + TW + h + 0.01;
      WF[base+A_VY] = 0;
      return;
    }
    WF[base+A_Y] = ny;
  }
}
// If a slip expires with you inside rock, you are ejected along the entry
// vector and it costs a heart. It never traps you.
function unstick(base){
  if(!hitsSolid(WF[base+A_X], WF[base+A_Y], PW, PH)) return false;
  for(let r=1;r<=96;r+=4){
    for(const d of [[0,-1],[1,0],[-1,0],[0,1],[1,-1],[-1,-1]]){
      const nx = WF[base+A_X]+d[0]*r, ny = WF[base+A_Y]+d[1]*r;
      if(!hitsSolid(nx,ny,PW,PH)){ WF[base+A_X]=nx; WF[base+A_Y]=ny; return true; }
    }
  }
  return true;
}

// ══════════════════════════ 12. BULLETS ════════════════════════════════════
function spawnBullet(x,y,vx,vy,owner,r){
  let idx = -1;
  for(let k=0;k<MAXB;k++){
    const i = (WI[I_BCUR]+k) % MAXB;
    if(!WI[BUI+i*BI_N+BI_ALIVE]){ idx=i; break; }
  }
  if(idx < 0) return -1;
  WI[I_BCUR] = (idx+1) % MAXB;
  const b = BU+idx*BU_N, ib = BUI+idx*BI_N;
  WF[b+B_X]=x; WF[b+B_Y]=y; WF[b+B_VX]=vx; WF[b+B_VY]=vy;
  WF[b+B_LIFE]=1.8; WF[b+B_R]=r||3;
  WI[ib+BI_ALIVE]=1; WI[ib+BI_OWNER]=owner; WI[ib+BI_FLAG]=0;
  return idx;
}
function killBullet(i){ WI[BUI+i*BI_N+BI_ALIVE]=0; }

// ══════════════════════════ 13. THE ACTOR STEP ═════════════════════════════
// The player and every echo run through this identical function. That is not
// tidiness — it is the reason an echo of you does exactly what you did.
function stepActor(base, ibase, btn, aim, gidx){
  const isGhost = gidx >= 0;
  const grounded = WI[ibase+AI_GROUND] !== 0;
  const dashing  = WF[base+A_DASHT] > 0;

  // ── timers ──
  const dec = (o)=>{ if(WF[base+o] > 0) WF[base+o] = Math.max(0, WF[base+o]-1); };
  dec(A_DASHCD); dec(A_COY); dec(A_JBUF); dec(A_IFR);
  if(WF[base+A_FIRECD]>0) WF[base+A_FIRECD]=Math.max(0,WF[base+A_FIRECD]-DT);
  if(WF[base+A_RELOAD]>0) WF[base+A_RELOAD]=Math.max(0,WF[base+A_RELOAD]-DT);
  if(WF[base+A_BLADET]>0) WF[base+A_BLADET]=Math.max(0,WF[base+A_BLADET]-DT);
  if(WF[base+A_BLADECD]>0)WF[base+A_BLADECD]=Math.max(0,WF[base+A_BLADECD]-DT);
  if(WF[base+A_STASCD]>0) WF[base+A_STASCD]=Math.max(0,WF[base+A_STASCD]-DT);
  if(WF[base+A_SWAPCD]>0) WF[base+A_SWAPCD]=Math.max(0,WF[base+A_SWAPCD]-DT);
  if(WF[base+A_SLIPCD]>0) WF[base+A_SLIPCD]=Math.max(0,WF[base+A_SLIPCD]-DT);
  if(WF[base+A_FLASH]>0)  WF[base+A_FLASH]=Math.max(0,WF[base+A_FLASH]-DT);
  if(WF[base+A_SQUASH]>0) WF[base+A_SQUASH]=Math.max(0,WF[base+A_SQUASH]-DT);
  if(WF[base+A_PHASE]>0){
    WF[base+A_PHASE]=Math.max(0,WF[base+A_PHASE]-DT);
    if(WF[base+A_PHASE]===0 && !isGhost){ if(unstick(base) && hitsSolid(WF[base+A_X],WF[base+A_Y],PW,PH)) hurtPlayer(1,base); }
  }
  WF[base+A_AIM] = aim;

  const carrying = !isGhost && WI[I_CARRY] > 0;
  const spdMul = carrying ? 0.85 : 1.0;

  // ── run ──
  const L = !!(btn & BTN_L), R = !!(btn & BTN_R);
  const dir = (R?1:0) - (L?1:0);
  if(dir) WF[base+A_FACE] = dir;
  if(!dashing){
    const acc = (grounded ? RUNACC*BODY.accel : AIRACC) * DT;
    const max = (grounded ? RUNMAX : AIRMAX) * spdMul;
    if(dir){
      WF[base+A_VX] += dir*acc;
      if(Math.abs(WF[base+A_VX]) > max && Math.sign(WF[base+A_VX])===dir)
        WF[base+A_VX] = dir*Math.max(max, Math.abs(WF[base+A_VX]) - FRIC*DT);
    } else if(grounded){
      const s = Math.sign(WF[base+A_VX]);
      WF[base+A_VX] -= s*Math.min(Math.abs(WF[base+A_VX]), FRIC*DT);
    } else {
      const s = Math.sign(WF[base+A_VX]);
      WF[base+A_VX] -= s*Math.min(Math.abs(WF[base+A_VX]), 240*DT);
    }
  }

  // ── wall cling (chrome arm only) ──
  const wallDir = WI[ibase+AI_WALL];
  const clinging = BODY.cling && !grounded && !dashing && wallDir!==0 && dir===wallDir && WF[base+A_VY] > 0;
  if(clinging) WF[base+A_VY] = Math.min(WF[base+A_VY], 60);

  // ── jump ──
  if(btn & BTN_JUMP){ WF[base+A_JBUF] = 6; } else if(WF[base+A_VY] < 0) WF[base+A_VY] *= 0.86;
  if(grounded) WF[base+A_COY] = BODY.coyote;
  if(WF[base+A_JBUF] > 0 && (WF[base+A_COY] > 0 || clinging) && !dashing){
    if(clinging && WF[base+A_COY] <= 0){
      WF[base+A_VY] = -380; WF[base+A_VX] = -wallDir*480;
    } else {
      WF[base+A_VY] = -JUMPV;
      emit(FX_DUST, WF[base+A_X], WF[base+A_Y], 0);
    }
    WF[base+A_JBUF]=0; WF[base+A_COY]=0;
    if(!isGhost) sfx('jump');
  }

  // ── dash ──
  if((btn & BTN_DASH) && WF[base+A_DASHCD]===0 && !dashing){
    let dx = dir, dy = 0;
    if(btn & BTN_JUMP) dy = -1;
    if(!dx && !dy){ dx = WF[base+A_FACE]; }
    const m = Math.hypot(dx,dy) || 1;
    WF[base+A_VX] = dx/m*DASHV; WF[base+A_VY] = dy/m*DASHV;
    WF[base+A_DASHT] = DASHTICKS; WF[base+A_DASHCD] = BODY.dashCd;
    emit(FX_SLIP, WF[base+A_X], WF[base+A_Y], Math.atan2(dy,dx));
    if(!isGhost) sfx('dash');
  }
  if(WF[base+A_DASHT] > 0){
    WF[base+A_DASHT]--;
    const t = WF[base+A_DASHT];
    if(t >= 2 && t <= 7) WF[base+A_IFR] = Math.max(WF[base+A_IFR], 2);
    if(t === 0){ WF[base+A_VX] *= 0.42; WF[base+A_VY] *= 0.30; }
  } else {
    WF[base+A_VY] = Math.min(TERM, WF[base+A_VY] + GRAV*DT);
  }

  // ── pistol ──
  if((btn & BTN_FIRE) && WF[base+A_FIRECD]===0 && WF[base+A_RELOAD]===0){
    const owner = isGhost ? (WI[GSI+gidx*GS_N+G_HOSTILE] ? -12-gidx : -2-gidx) : -1;
    let ammo = isGhost ? 1 : WI[I_AMMO];
    if(ammo > 0){
      const a = aim;
      spawnBullet(WF[base+A_X]+Math.cos(a)*16, WF[base+A_Y]-18+Math.sin(a)*16,
                  Math.cos(a)*900, Math.sin(a)*900, owner, 3);
      WF[base+A_FIRECD] = 0.14;
      emit(FX_SHOT, WF[base+A_X]+Math.cos(a)*18, WF[base+A_Y]-18+Math.sin(a)*18, a);
      if(!isGhost){ WI[I_AMMO]--; if(WI[I_AMMO]<=0) WF[base+A_RELOAD]=0.9; sfx('shot'); }
    }
  }
  if(!isGhost && WI[I_AMMO]<=0 && WF[base+A_RELOAD]===0) WI[I_AMMO] = BODY.ammo;

  // ── causal blade ──
  if((btn & BTN_BLADE) && (RUN.powers & P_BLADE) && WF[base+A_BLADECD]===0){
    WF[base+A_BLADET] = 0.25; WF[base+A_BLADECD] = 0.45;
    bladeSwing(base, aim, isGhost ? (-2-gidx) : -1);
    if(!isGhost) sfx('blade');
  }

  // ── integrate ──
  moveX(base, ibase, PW, PH);
  moveY(base, ibase, PW, PH, isGhost ? gidx : -1);
  if(WF[base+A_X] < PW/2) { WF[base+A_X] = PW/2; WF[base+A_VX]=0; }
  if(WF[base+A_X] > SCRW-PW/2){ WF[base+A_X]=SCRW-PW/2; WF[base+A_VX]=0; }

  if(!isGhost && hitsSpike(WF[base+A_X], WF[base+A_Y], PW, PH)) hurtPlayer(1, base);
}

// ══════════════════════════ 14. DAMAGE & POWERS ════════════════════════════
function hurtPlayer(n, base){
  base = base===undefined ? PL : base;
  if(WF[base+A_IFR] > 0 || WI[I_HP] <= 0) return;
  WI[I_HP] -= n; WI[I_DMG] += n;
  WF[base+A_IFR] = 48; WF[base+A_FLASH] = 0.3;
  emit(FX_HIT, WF[base+A_X], WF[base+A_Y]-16, 0);
  sfx('hurt'); shake(0.42);
}
function killEnemy(i, retro){
  const ib = ENI+i*EI_N, b = EN+i*EN_N;
  if(!WI[ib+N_ALIVE]) return;
  WI[ib+N_ALIVE] = 0;
  WI[I_KILLS]++;
  WF[F_CHRONO] = Math.min(6, WF[F_CHRONO] + 0.6);   // aggression refuels the clock
  emit(FX_KILL, WF[b+E_X], WF[b+E_Y]-16, 0);
  sfx('kill'); shake(0.22); hitstop(6);
  if(retro) WF[PL+A_DASHCD] = 0;                    // blade kills give the dash back
  // A causal-blade kill is retroactive: every shot that enemy ever fired
  // leaves the air in the same frame it dies.
  if(retro) for(let k=0;k<MAXB;k++) if(WI[BUI+k*BI_N+BI_ALIVE] && WI[BUI+k*BI_N+BI_OWNER]===i) killBullet(k);
  countEnemies();
}
function damageEnemy(i, n, fromX, retro){
  const b = EN+i*EN_N, ib = ENI+i*EI_N;
  const type = WI[ib+N_TYPE];
  if(type===E_DOG || type===E_ALLY) return false;
  // The Warden only bleeds from behind. That is the whole fight.
  if(type===E_WARDEN || (type===E_ARCHIVIST && WI[I_PHASE]===1)){
    const facing = Math.sign(WF[b+E_AIM]) || 1;
    const side = Math.sign(fromX - WF[b+E_X]);
    if(side === facing) return false;
  }
  WF[b+E_HP] -= n; WF[b+E_FLASH] = 0.18;
  emit(FX_HIT, WF[b+E_X], WF[b+E_Y]-14, 0);
  if(WF[b+E_HP] <= 0){
    if(type===E_KESH || type===E_AUDITOR || type===E_ARCHIVIST){ WI[I_BOSSDOWN] = 1; }
    killEnemy(i, retro);
    return true;
  }
  sfx('tick');
  return false;
}
function bladeSwing(base, aim, owner){
  const bx = WF[base+A_X], by = WF[base+A_Y]-17, reach = BODY.bladeReach;
  emit(FX_BLADE, bx, by, aim);
  for(let i=0;i<MAXE;i++){
    if(!WI[ENI+i*EI_N+N_ALIVE]) continue;
    const e = EN+i*EN_N, dx = WF[e+E_X]-bx, dy = (WF[e+E_Y]-16)-by;
    if(Math.hypot(dx,dy) > reach+16) continue;
    let d = Math.atan2(dy,dx) - aim;
    while(d >  Math.PI) d -= Math.PI*2;
    while(d < -Math.PI) d += Math.PI*2;
    if(Math.abs(d) < 0.96 && damageEnemy(i, 2, bx, true) && owner === -1
       && WI[PLI+AI_GROUND] === 0) noteAirKill();
  }
  // the blade also cuts echoes — the undo button for a bad fork
  if(owner === -1) for(let g=0;g<MAXG;g++){
    const gi = GSI+g*GS_N;
    if(!WI[gi+G_ALIVE] || WI[gi+G_HOSTILE]) continue;
    const gb = GH0+g*AC_N, dx = WF[gb+A_X]-bx, dy = (WF[gb+A_Y]-17)-by;
    if(Math.hypot(dx,dy) < reach+12){
      let d = Math.atan2(dy,dx) - aim;
      while(d >  Math.PI) d -= Math.PI*2;
      while(d < -Math.PI) d += Math.PI*2;
      if(Math.abs(d) < 0.96){ WI[gi+G_ALIVE]=0; emit(FX_ECHODIE, WF[gb+A_X], WF[gb+A_Y]-16, 0); }
    }
  }
  // and it deletes bullets it passes through
  for(let k=0;k<MAXB;k++){
    if(!WI[BUI+k*BI_N+BI_ALIVE]) continue;
    if(WI[BUI+k*BI_N+BI_OWNER] < 0) continue;
    const bb = BU+k*BU_N;
    if(Math.hypot(WF[bb+B_X]-bx, WF[bb+B_Y]-by) < reach) killBullet(k);
  }
}
// THE CUT asks for five, off the ground, inside three seconds. A sliding
// window of the last five kill times is the honest way to measure that.
function noteAirKill(){
  for(let k=0;k<4;k++) WF[F_K0+k] = WF[F_K0+k+1];
  WF[F_K0+4] = WF[F_TIME];
  let n = 0;
  for(let k=0;k<5;k++) if(WF[F_K0+k] > 0 && WF[F_TIME]-WF[F_K0+k] <= 3.0) n++;
  if(n > WI[I_HOLD]) WI[I_HOLD] = n;
}
function castStasis(x,y){
  WF[F_STASX]=x; WF[F_STASY]=y; WF[F_STAST]=1.8;
  WF[PL+A_STASCD]=3.5; WF[F_R5]++;                     // pin counter (chambers)
  emit(FX_SPARK,x,y,0); sfx('stasis');
}
function doSwap(){
  let best=-1, bt=1e9;
  for(let g=0; g<MAXG; g++){
    const gi=GSI+g*GS_N;
    if(!WI[gi+G_ALIVE] || WI[gi+G_HOSTILE]) continue;
    const gb=GH0+g*AC_N;
    if(Math.hypot(WF[gb+A_X]-WF[PL+A_X], WF[gb+A_Y]-WF[PL+A_Y]) > 600) continue;
    if(WI[gi+G_BIRTH] < bt){ bt=WI[gi+G_BIRTH]; best=g; }
  }
  if(best < 0){ WF[PL+A_FLASH]=0.12; return false; }
  const gb=GH0+best*AC_N;
  for(const f of [A_X,A_Y,A_VX,A_VY]){ const t=WF[PL+f]; WF[PL+f]=WF[gb+f]; WF[gb+f]=t; }
  WF[PL+A_SWAPCD]=2.0; WF[F_CHRONO]=Math.max(0,WF[F_CHRONO]-0.5);
  emit(FX_FORK,WF[PL+A_X],WF[PL+A_Y]-16,0); emit(FX_FORK,WF[gb+A_X],WF[gb+A_Y]-16,0);
  sfx('swap'); return true;
}
function doSlip(){
  WF[PL+A_PHASE]=0.45; WF[PL+A_SLIPCD]=2.0;
  if(!RUN.isFrac) WF[F_CHRONO]=Math.max(0,WF[F_CHRONO]-1.2);
  WF[F_R4]++;                                          // slip counter (chambers)
  emit(FX_SLIP,WF[PL+A_X],WF[PL+A_Y]-16,0); sfx('slip');
}
function frozen(x,y){
  return WF[F_STAST] > 0 && Math.hypot(x-WF[F_STASX], y-WF[F_STASY]) < 96;
}

// ══════════════════════════ 15. ENEMIES ════════════════════════════════════
// Six archetypes, one sentence each, and three of them exist purely to make
// your echoes mean something.
function nearestActor(x,y,includeGhosts){
  let bx=WF[PL+A_X], by=WF[PL+A_Y], bd=Math.hypot(bx-x,by-y), gi=-1;
  if(includeGhosts) for(let g=0;g<MAXG;g++){
    const q=GSI+g*GS_N;
    if(!WI[q+G_ALIVE] || WI[q+G_HOSTILE]) continue;
    const gb=GH0+g*AC_N, d=Math.hypot(WF[gb+A_X]-x, WF[gb+A_Y]-y);
    if(d<bd){ bd=d; bx=WF[gb+A_X]; by=WF[gb+A_Y]; gi=g; }
  }
  return {x:bx, y:by, d:bd, g:gi};
}
function losClear(x0,y0,x1,y1){
  const n = Math.ceil(Math.hypot(x1-x0,y1-y0)/16);
  for(let i=1;i<n;i++){
    const t=i/n;
    if(solidPx(x0+(x1-x0)*t, y0+(y1-y0)*t)) return false;
  }
  return true;
}
function stepEnemy(i){
  const ib = ENI+i*EI_N, b = EN+i*EN_N;
  if(!WI[ib+N_ALIVE]) return;
  const type = WI[ib+N_TYPE];
  if(WF[b+E_FLASH]>0) WF[b+E_FLASH]=Math.max(0,WF[b+E_FLASH]-DT);
  if(type !== E_SCRUBBER && frozen(WF[b+E_X], WF[b+E_Y]-16)) return;
  WF[b+E_T] += DT;
  if(WF[b+E_CD] > 0) WF[b+E_CD] -= DT;
  const P = nearestActor(WF[b+E_X], WF[b+E_Y], true);
  const soft = RUN.soften ? 0.8 : 1.0;

  switch(type){
  case E_WATCHER: {
    WF[b+E_Y] = WF[b+E_AY] + Math.sin(WF[b+E_T]*1.6)*64;
    WF[b+E_X] = WF[b+E_AX] + Math.cos(WF[b+E_T]*0.8)*20;
    if(WF[b+E_CD] <= 0 && P.d < 620 && losClear(WF[b+E_X],WF[b+E_Y]-14,P.x,P.y-18)){
      const a = Math.atan2(P.y-18-(WF[b+E_Y]-14), P.x-WF[b+E_X]);
      spawnBullet(WF[b+E_X],WF[b+E_Y]-14,Math.cos(a)*900*soft,Math.sin(a)*900*soft,i,4);
      WF[b+E_CD] = 1.6; emit(FX_SHOT,WF[b+E_X],WF[b+E_Y]-14,a);
    }
    break; }
  case E_SWEEPER: {
    const st = WI[ib+N_STATE];
    WF[b+E_VY] = Math.min(TERM, WF[b+E_VY]+GRAV*DT);
    if(st===0){                                    // patrol / look
      WF[b+E_VX] *= 0.86;
      if(WF[b+E_CD] <= 0 && Math.abs(P.y-WF[b+E_Y]) < 60 && P.d < 520){
        WI[ib+N_STATE]=1; WF[b+E_CD]=0.35*(RUN.soften?1.3:1);
        WF[b+E_TX]=Math.sign(P.x-WF[b+E_X])||1;
      }
    } else if(st===1){                             // telegraph
      if(WF[b+E_CD] <= 0){ WI[ib+N_STATE]=2; WF[b+E_CD]=0.9; WF[b+E_VX]=WF[b+E_TX]*320*soft; }
    } else {                                       // charge
      if(WF[b+E_CD] <= 0){ WI[ib+N_STATE]=0; WF[b+E_CD]=1.1; }
    }
    const nx = WF[b+E_X]+WF[b+E_VX]*DT;
    if(!hitsSolid(nx, WF[b+E_Y], 26, 26)) WF[b+E_X]=nx; else { WF[b+E_VX]=0; WI[ib+N_STATE]=0; WF[b+E_CD]=0.8; }
    const ny = WF[b+E_Y]+WF[b+E_VY]*DT;
    if(!hitsSolid(WF[b+E_X], ny, 26, 26)) WF[b+E_Y]=ny;
    else { WF[b+E_Y]=Math.floor(ny/TW)*TW-0.01; WF[b+E_VY]=0; }
    break; }
  case E_TURRET: {
    WF[b+E_AIM] += 0.70*DT;                        // 40 deg/s spiral
    if(WF[b+E_CD] <= 0){
      const a = WF[b+E_AIM];
      for(let k=0;k<1;k++){
        spawnBullet(WF[b+E_X],WF[b+E_Y],Math.cos(a)*420*soft,Math.sin(a)*420*soft,i,4);
      }
      WF[b+E_CD] = 0.18*(RUN.soften?1.4:1);
    }
    break; }
  case E_WARDEN: {
    const want = Math.atan2(0, P.x-WF[b+E_X]);
    const cur  = WF[b+E_AIM] >= 0 ? 0 : Math.PI;
    let target = (P.x > WF[b+E_X]) ? 1 : -1;
    WF[b+E_AIM] += (target - WF[b+E_AIM])*Math.min(1, 1.05*DT*3);
    WF[b+E_VY] = Math.min(TERM, WF[b+E_VY]+GRAV*DT);
    const dir = Math.sign(WF[b+E_AIM]) || 1;
    const nx = WF[b+E_X] + dir*80*DT;
    if(!hitsSolid(nx, WF[b+E_Y], 30, 40)) WF[b+E_X]=nx;
    const ny = WF[b+E_Y]+WF[b+E_VY]*DT;
    if(!hitsSolid(WF[b+E_X], ny, 30, 40)) WF[b+E_Y]=ny;
    else { WF[b+E_Y]=Math.floor(ny/TW)*TW-0.01; WF[b+E_VY]=0; }
    if(WF[b+E_CD] <= 0 && P.d < 560){
      const a = Math.atan2(P.y-20-(WF[b+E_Y]-22), P.x-WF[b+E_X]);
      spawnBullet(WF[b+E_X]+dir*20,WF[b+E_Y]-22,Math.cos(a)*640*soft,Math.sin(a)*640*soft,i,5);
      WF[b+E_CD]=1.2;
    }
    break; }
  case E_CENSOR: {
    // Brackets the nearest echo and deletes it. Makes an echo precious.
    WF[b+E_X] = WF[b+E_AX] + Math.sin(WF[b+E_T]*0.9)*120;
    if(WI[ib+N_STATE]===2){ if(WF[b+E_CD]<=0){ WI[ib+N_STATE]=0; } break; }
    let tg=-1, td=1e9;
    for(let g=0;g<MAXG;g++){
      const q=GSI+g*GS_N;
      if(!WI[q+G_ALIVE] || WI[q+G_HOSTILE]) continue;
      const gb=GH0+g*AC_N, d=Math.hypot(WF[gb+A_X]-WF[b+E_X], WF[gb+A_Y]-WF[b+E_Y]);
      if(d<td){ td=d; tg=g; }
    }
    if(tg<0){ WI[ib+N_STATE]=0; WI[ib+N_TGT]=-1; break; }
    if(WI[ib+N_TGT]!==tg){ WI[ib+N_TGT]=tg; WI[ib+N_STATE]=1; WF[b+E_CD]=0.6*(RUN.soften?1.4:1); }
    if(WI[ib+N_STATE]===1 && WF[b+E_CD]<=0){
      const q=GSI+tg*GS_N, gb=GH0+tg*AC_N;
      WI[q+G_ALIVE]=0; emit(FX_ECHODIE, WF[gb+A_X], WF[gb+A_Y]-16, 0);
      WI[ib+N_STATE]=2; WF[b+E_CD]=4.0; WI[ib+N_TGT]=-1; sfx('censor');
    }
    break; }
  case E_SCRUBBER: {
    const a = Math.atan2(WF[PL+A_Y]-16-WF[b+E_Y], WF[PL+A_X]-WF[b+E_X]);
    WF[b+E_X] += Math.cos(a)*90*DT; WF[b+E_Y] += Math.sin(a)*90*DT;
    if(Math.hypot(WF[PL+A_X]-WF[b+E_X], WF[PL+A_Y]-16-WF[b+E_Y]) < 128)
      WF[F_CHRONO] = Math.max(0, WF[F_CHRONO] - 2.0*DT);
    break; }
  case E_KESH:    stepKesh(i,b,ib,P,soft); break;
  case E_AUDITOR: stepAuditor(i,b,ib,P,soft); break;
  case E_ARCHIVIST: stepArchivist(i,b,ib,P,soft); break;
  case E_DOG: {
    const tx = WF[PL+A_X] - WF[PL+A_FACE]*40;
    WF[b+E_X] += Math.max(-220*DT, Math.min(220*DT, (tx-WF[b+E_X])*0.09));
    WF[b+E_VY] = Math.min(TERM, WF[b+E_VY]+GRAV*DT);
    const ny = WF[b+E_Y]+WF[b+E_VY]*DT;
    if(!hitsSolid(WF[b+E_X], ny, 22, 20)) WF[b+E_Y]=ny;
    else { WF[b+E_Y]=Math.floor(ny/TW)*TW-0.01; WF[b+E_VY]=0; }
    break; }
  case E_ALLY: {                                   // Kesh, fighting beside you
    const tx = WF[PL+A_X] - 70*(Math.sign(WF[PL+A_FACE])||1);
    WF[b+E_X] += Math.max(-240*DT, Math.min(240*DT, (tx-WF[b+E_X])*0.07));
    WF[b+E_VY] = Math.min(TERM, WF[b+E_VY]+GRAV*DT);
    const ny = WF[b+E_Y]+WF[b+E_VY]*DT;
    if(!hitsSolid(WF[b+E_X], ny, 22, 34)) WF[b+E_Y]=ny;
    else { WF[b+E_Y]=Math.floor(ny/TW)*TW-0.01; WF[b+E_VY]=0; }
    if(WF[b+E_CD] <= 0){
      let t=-1, td=1e9;
      for(let k=0;k<MAXE;k++){
        if(!WI[ENI+k*EI_N+N_ALIVE]) continue;
        const kt=WI[ENI+k*EI_N+N_TYPE];
        if(kt===E_DOG||kt===E_ALLY) continue;
        const d=Math.hypot(WF[EN+k*EN_N+E_X]-WF[b+E_X], WF[EN+k*EN_N+E_Y]-WF[b+E_Y]);
        if(d<td){ td=d; t=k; }
      }
      if(t>=0 && td<560){
        const a=Math.atan2(WF[EN+t*EN_N+E_Y]-16-(WF[b+E_Y]-20), WF[EN+t*EN_N+E_X]-WF[b+E_X]);
        spawnBullet(WF[b+E_X],WF[b+E_Y]-20,Math.cos(a)*820,Math.sin(a)*820,-9,3);
        WF[b+E_CD]=0.9;
      }
    }
    break; }
  }
}
// ── the three bosses, all reusing machinery that already exists ──
function stepKesh(i,b,ib,P,soft){
  WF[b+E_VY] = Math.min(TERM, WF[b+E_VY]+GRAV*DT);
  const phase = Math.floor(WF[b+E_T]/2.0) % 6;
  const dir = Math.sign(P.x - WF[b+E_X]) || 1;
  WF[b+E_AIM] = dir;
  let vx = 0;
  switch(phase){
    case 0: vx = dir*150; break;                                   // close
    case 1: if(WF[b+E_CD]<=0){                                     // three-round burst
              const a=Math.atan2(P.y-18-(WF[b+E_Y]-20), P.x-WF[b+E_X]);
              for(let k=-1;k<=1;k++) spawnBullet(WF[b+E_X],WF[b+E_Y]-20,
                Math.cos(a+k*0.16)*760*soft, Math.sin(a+k*0.16)*760*soft, i, 4);
              WF[b+E_CD]=0.55; } break;
    case 2: vx = -dir*220; break;                                  // back off
    case 3: if(WF[b+E_CD]<=0){                                     // ring
              for(let k=0;k<10;k++){ const a=k/10*Math.PI*2 + WF[b+E_T];
                spawnBullet(WF[b+E_X],WF[b+E_Y]-20,Math.cos(a)*380*soft,Math.sin(a)*380*soft,i,4); }
              WF[b+E_CD]=0.85; } break;
    case 4: vx = dir*300; if(WI[PLI+AI_GROUND] && WF[b+E_VY]===0 && WF[b+E_CD]<=0){ WF[b+E_VY]=-560; WF[b+E_CD]=1.4; } break;
    case 5: if(WF[b+E_CD]<=0){                                     // aimed pair
              const a=Math.atan2(P.y-18-(WF[b+E_Y]-20), P.x-WF[b+E_X]);
              spawnBullet(WF[b+E_X],WF[b+E_Y]-20,Math.cos(a)*980*soft,Math.sin(a)*980*soft,i,4);
              WF[b+E_CD]=0.42; } break;
  }
  const nx = WF[b+E_X]+vx*DT;
  if(!hitsSolid(nx, WF[b+E_Y], 24, 36)) WF[b+E_X]=nx;
  const ny = WF[b+E_Y]+WF[b+E_VY]*DT;
  if(!hitsSolid(WF[b+E_X], ny, 24, 36)) WF[b+E_Y]=ny;
  else { WF[b+E_Y]=Math.floor(ny/TW)*TW-0.01; WF[b+E_VY]=0; }
  if(WF[b+E_HP] <= 6 && !WI[ib+N_STATE]){          // summons at 60%
    WI[ib+N_STATE]=1;
    spawnEnemy(E_WATCHER, WF[b+E_X]-160, WF[b+E_Y]-160);
    spawnEnemy(E_WATCHER, WF[b+E_X]+160, WF[b+E_Y]-160);
  }
}
function stepAuditor(i,b,ib,P,soft){
  // He rewinds the floor. Your echoes keep replaying their tapes into geometry
  // that is no longer there — that is not a bug, that is the fight.
  if(WF[b+E_T] > 12.0){
    WF[b+E_T] = 0; WI[I_LAYER] = WI[I_LAYER] ? 0 : 1;
    WF[F_R3] = 0.4; sfx('swapfloor'); shake(0.5);
    for(let g=0;g<MAXG;g++){
      const q=GSI+g*GS_N, gb=GH0+g*AC_N;
      if(WI[q+G_ALIVE] && hitsSolid(WF[gb+A_X],WF[gb+A_Y],PW,PH)) WI[q+G_ALIVE]=0;
    }
    if(hitsSolid(WF[PL+A_X],WF[PL+A_Y],PW,PH)) unstick(PL);
  }
  if(WF[F_R3]>0) WF[F_R3]=Math.max(0,WF[F_R3]-DT);
  const dir = Math.sign(P.x-WF[b+E_X])||1;
  WF[b+E_X] += dir*70*DT;
  WF[b+E_Y] = WF[b+E_AY] + Math.sin(WF[b+E_T]*1.1)*70;
  if(WF[b+E_CD] <= 0){
    const a=Math.atan2(P.y-18-WF[b+E_Y], P.x-WF[b+E_X]);
    for(let k=-1;k<=1;k++) spawnBullet(WF[b+E_X],WF[b+E_Y],
      Math.cos(a+k*0.34)*560*soft, Math.sin(a+k*0.34)*560*soft, i, 4);
    WF[b+E_CD]=1.4;
  }
}
function stepArchivist(i,b,ib,P,soft){
  const hp = WF[b+E_HP];
  const ph = hp > 28 ? 0 : hp > 14 ? 1 : 2;
  if(WI[I_PHASE] !== ph){
    WI[I_PHASE] = ph; WF[b+E_CD] = 1.2; shake(0.8); sfx('phase');
    if(ph===2) spawnShades(2);
    if(ph===1) spawnEnemy(E_WATCHER, WF[b+E_X]-200, WF[b+E_Y]-140);
  }
  WF[b+E_VY] = Math.min(TERM, WF[b+E_VY]+GRAV*DT*0.4);
  const dir = Math.sign(P.x-WF[b+E_X])||1;
  WF[b+E_AIM] = dir;
  WF[b+E_X] += dir*(90+ph*40)*DT;
  WF[b+E_Y] = WF[b+E_AY] + Math.sin(WF[b+E_T]*1.3)*90;
  if(WF[b+E_CD] <= 0){
    const a = Math.atan2(P.y-18-WF[b+E_Y], P.x-WF[b+E_X]);
    if(ph===0){
      for(let k=-1;k<=1;k++) spawnBullet(WF[b+E_X],WF[b+E_Y],Math.cos(a+k*0.2)*720*soft,Math.sin(a+k*0.2)*720*soft,i,4);
      WF[b+E_CD]=0.9;
    } else if(ph===1){
      for(let k=0;k<12;k++){ const t=k/12*Math.PI*2+WF[b+E_T]*0.7;
        spawnBullet(WF[b+E_X],WF[b+E_Y],Math.cos(t)*420*soft,Math.sin(t)*420*soft,i,4); }
      WF[b+E_CD]=1.0;
    } else {
      for(let k=-2;k<=2;k++) spawnBullet(WF[b+E_X],WF[b+E_Y],Math.cos(a+k*0.15)*840*soft,Math.sin(a+k*0.15)*840*soft,i,4);
      WF[b+E_CD]=0.7;
    }
  }
  // PHASE 2 is a wall you cannot out-damage. Unless you left the frame.
  if(ph===1 && WF[F_R7] !== 1) WF[b+E_HP] = Math.max(WF[b+E_HP], 14.5);
}
function spawnEnemy(type,x,y){
  for(let i=0;i<MAXE;i++){
    if(WI[ENI+i*EI_N+N_ALIVE]) continue;
    const b=EN+i*EN_N, ib=ENI+i*EI_N;
    WF[b+E_X]=x; WF[b+E_Y]=y; WF[b+E_AX]=x; WF[b+E_AY]=y;
    WF[b+E_HP]=ENEMY_HP[type]||3; WF[b+E_CD]=0.5; WF[b+E_T]=0; WF[b+E_VX]=0; WF[b+E_VY]=0;
    WI[ib+N_TYPE]=type; WI[ib+N_ALIVE]=1; WI[ib+N_STATE]=0; WI[ib+N_TGT]=-1;
    countEnemies();
    return i;
  }
  return -1;
}
// Hostile echoes: your own tape, walked back at you. Free, because the tape
// machinery already exists — it just points the other way.
function spawnShades(n){
  const from = Math.max(0, WI[I_TICK]-600);
  for(let k=0;k<n;k++){
    const g = 4+k;
    if(g>=MAXG) break;
    const gi=GSI+g*GS_N, gb=GH0+g*AC_N;
    GTAPE.set(TAPE.subarray(from*4, WI[I_TICK]*4), g*4*TAPE_MAX);
    WI[gi+G_ALIVE]=1; WI[gi+G_CUR]=0; WI[gi+G_BIRTH]=from;
    WI[gi+G_END]=Math.max(60, WI[I_TICK]-from); WI[gi+G_BUF]=g; WI[gi+G_HOSTILE]=1;
    WF[gb+A_X]=200+k*760; WF[gb+A_Y]=SCRH-96; WF[gb+A_HP]=0;
  }
}

// ══════════════════════════ 16. PROPS ══════════════════════════════════════
function overlapsActorRect(px,py,w,h, ax,ay){
  return Math.abs(ax-px) < (w/2+PW/2) && (ay > py-h-PH) && (ay < py+8);
}
function anyActorOn(px,py,w,h){
  if(overlapsActorRect(px,py,w,h, WF[PL+A_X], WF[PL+A_Y])) return -1;
  for(let g=0;g<MAXG;g++){
    const gi=GSI+g*GS_N;
    if(!WI[gi+G_ALIVE] || WI[gi+G_HOSTILE]) continue;
    const gb=GH0+g*AC_N;
    if(overlapsActorRect(px,py,w,h, WF[gb+A_X], WF[gb+A_Y])) return g;
  }
  return -2;
}
function exitOpen(){
  if(room.exitNeedsDoor && WI[I_DOOR] !== 1) return false;
  if(roomId==='n3')  return WI[I_BOSSDOWN]===1 || WF[F_R2]===1;
  if(roomId==='n12'||roomId==='n13') return WI[I_BOSSDOWN]===1;
  if(roomId==='f5')  return WF[F_R0] >= 3;
  return true;
}
function stepProps(btn){
  let plates = 0, platesTotal = 0, allHeld = true;
  for(let i=0;i<MAXP;i++){
    const ib = PRI+i*PI_N;
    if(!WI[ib+PI_TYPE]) continue;
    const b = PR+i*PR_N, type = WI[ib+PI_TYPE];
    const x = WF[b+P_X], y = WF[b+P_Y], w = WF[b+P_W], h = WF[b+P_H];
    switch(type){
    case PR_EXIT:
      if(exitOpen() && overlapsActorRect(x,y,w,h,WF[PL+A_X],WF[PL+A_Y])) WI[I_EXIT] = 1;
      break;
    case PR_PLATE: {
      platesTotal++;
      const who = anyActorOn(x,y,w,h);
      const on  = who !== -2;
      if(room.plateLatch){ if(on) WI[ib+PI_STATE]=1; if(WI[ib+PI_STATE]) plates++; else allHeld=false; }
      else { WI[ib+PI_STATE] = on?1:0; if(on) plates++; else allHeld=false; }
      break; }
    case PR_SPLINTER:
      if(WI[ib+PI_ALIVE] && overlapsActorRect(x,y,w,h,WF[PL+A_X],WF[PL+A_Y])){
        WI[ib+PI_ALIVE]=0; WI[I_SPLINT] |= (1<<WF[b+P_VAL]);
        emit(FX_PICKUP,x,y,0); sfx('pickup');
      }
      break;
    case PR_CARRY:
      if(WI[ib+PI_ALIVE] && (btn & BTN_ACT) && overlapsActorRect(x,y,w,h,WF[PL+A_X],WF[PL+A_Y])){
        WI[ib+PI_ALIVE]=0; WI[I_CARRY]=WF[b+P_VAL];
        emit(FX_PICKUP,x,y,0); sfx('pickup');
      }
      break;
    case PR_JOIN:
      if((btn & BTN_ACT) && overlapsActorRect(x,y,w,h,WF[PL+A_X],WF[PL+A_Y])){ WF[F_R2]=1; WI[I_EXIT]=1; }
      break;
    case PR_TRANSMIT:
      if(overlapsActorRect(x,y,w,h,WF[PL+A_X],WF[PL+A_Y])) WI[I_HOLD]++;
      break;
    case PR_PRESS: {
      // 2.4 s cycle. Grabbing the key puts an arm under the ram; the only way
      // to keep the hand is to have somebody else's arm there — yours, earlier.
      WF[F_R0] = (WF[F_R0] + DT) % 2.4;
      if(WI[ib+PI_STATE]===0){
        const who = anyActorOn(x, y, w, h);
        if(who !== -2 && (who === -1 ? (btn & BTN_ACT)
            : (tapeBtn(GTAPE, WI[GSI+who*GS_N+G_BUF]*4*TAPE_MAX, Math.max(0, WI[GSI+who*GS_N+G_CUR]-1)) & BTN_ACT))){
          WI[ib+PI_STATE]=1; WI[I_DOOR]=1; WF[F_R1]=18;
          WI[I_WINDOW] = who === -1 ? 0 : Math.max(1, WI[I_TICK]-WI[I_FORKTICK]);
          sfx('grab');
        }
      } else if(WF[F_R1] > 0){
        WF[F_R1]--;
        if(WF[F_R1] === 0){                          // the ram lands
          shake(0.9); sfx('slam');
          const who = anyActorOn(x, y, w, h);
          if(who === -1){ WI[I_WINDOW]=0; WF[PL+A_IFR]=0; hurtPlayer(1); }
          else if(who >= 0){ WI[GSI+who*GS_N+G_ALIVE]=0; emit(FX_ECHODIE, WF[GH0+who*AC_N+A_X], WF[GH0+who*AC_N+A_Y]-16, 0); }
        }
      }
      break; }
    case PR_BEAM:
      if(WF[F_TIME] > WF[b+P_T]){
        WF[b+P_VY] = Math.min(1200, WF[b+P_VY] + 2600*DT);
        WF[b+P_Y] += WF[b+P_VY]*DT;
        if(WF[b+P_Y] > SCRH-40){ WF[b+P_Y]=SCRH-40; WF[b+P_VY]=0; }
        if(Math.abs(WF[PL+A_X]-x) < 34 && Math.abs(WF[PL+A_Y]-18-WF[b+P_Y]) < 36) hurtPlayer(2);
      }
      break;
    case PR_LASER: {
      WF[b+P_X] += 220*DT*(RUN.soften?0.8:1);
      if(WF[b+P_X] > SCRW+40) WF[b+P_X] = -40;
      if(Math.abs(WF[PL+A_X]-WF[b+P_X]) < 16 && WF[PL+A_PHASE] <= 0) hurtPlayer(1);
      break; }
    }
  }
  if(platesTotal){
    if(plates > WF[F_R6]) WF[F_R6] = plates;
    if(allHeld && plates === platesTotal){
      WI[I_PLATEF]++;
      if(WI[I_PLATEF] >= (room.plateHold||1) && WI[I_DOOR]===0){ WI[I_DOOR]=1; sfx('door'); shake(0.3); }
    } else if(!room.plateLatch) WI[I_PLATEF] = 0;
  }
  // rising fire (n1) — pressure, not a wall
  if(room.fire){
    const fy = SCRH - WF[F_TIME]*8;
    if(WF[PL+A_Y] > fy) hurtPlayer(1);
  }
}

// ══════════════════════════ 17. BULLETS ════════════════════════════════════
function hostileOwner(o){ return o >= 0 || o <= -12; }
function stepBullets(){
  for(let i=0;i<MAXB;i++){
    const ib = BUI+i*BI_N;
    if(!WI[ib+BI_ALIVE]) continue;
    const b = BU+i*BU_N;
    const isFrozen = frozen(WF[b+B_X], WF[b+B_Y]);
    WI[ib+BI_FLAG] = isFrozen ? 1 : 0;
    if(isFrozen) continue;                              // frozen shells are level geometry
    WF[b+B_X] += WF[b+B_VX]*DT; WF[b+B_Y] += WF[b+B_VY]*DT;
    WF[b+B_LIFE] -= DT;
    if(WF[b+B_LIFE] <= 0 || WF[b+B_X]<0 || WF[b+B_X]>SCRW || WF[b+B_Y]<0 || WF[b+B_Y]>SCRH){ killBullet(i); continue; }
    if(solidPx(WF[b+B_X], WF[b+B_Y])){ emit(FX_SPARK,WF[b+B_X],WF[b+B_Y],0); killBullet(i); continue; }
    const owner = WI[ib+BI_OWNER];
    if(hostileOwner(owner)){
      if(WF[PL+A_IFR] <= 0 && WF[PL+A_PHASE] <= 0 &&
         Math.abs(WF[b+B_X]-WF[PL+A_X]) < 12 && Math.abs(WF[b+B_Y]-(WF[PL+A_Y]-17)) < 20){
        if(!dogBlocked()){ hurtPlayer(1); }
        killBullet(i); continue;
      }
      for(let g=0;g<MAXG;g++){
        const gi=GSI+g*GS_N;
        if(!WI[gi+G_ALIVE] || WI[gi+G_HOSTILE]) continue;
        const gb=GH0+g*AC_N;
        if(Math.abs(WF[b+B_X]-WF[gb+A_X])<12 && Math.abs(WF[b+B_Y]-(WF[gb+A_Y]-17))<20){
          WF[gb+A_HP] -= 1;
          if(WF[gb+A_HP] <= -2){ WI[gi+G_ALIVE]=2; emit(FX_ECHODIE,WF[gb+A_X],WF[gb+A_Y]-16,0); }
          killBullet(i); break;
        }
      }
    } else {
      for(let e=0;e<MAXE;e++){
        if(!WI[ENI+e*EI_N+N_ALIVE]) continue;
        const eb=EN+e*EN_N;
        const t = WI[ENI+e*EI_N+N_TYPE];
        const hw = (t===E_ARCHIVIST||t===E_AUDITOR)?26:18, hh=(t===E_TURRET||t===E_CENSOR)?18:34;
        if(Math.abs(WF[b+B_X]-WF[eb+E_X])<hw && Math.abs(WF[b+B_Y]-(WF[eb+E_Y]-hh/2))<hh){
          if(damageEnemy(e, 1, WF[b+B_X]-WF[b+B_VX]*0.05, false) || true){ killBullet(i); }
          break;
        }
      }
      // your own bullets also hurt the things wearing your face
      if(WI[ib+BI_ALIVE]) for(let g=4;g<MAXG;g++){
        const gi=GSI+g*GS_N;
        if(!WI[gi+G_ALIVE] || !WI[gi+G_HOSTILE]) continue;
        const gb=GH0+g*AC_N;
        if(Math.abs(WF[b+B_X]-WF[gb+A_X])<14 && Math.abs(WF[b+B_Y]-(WF[gb+A_Y]-17))<22){
          WF[gb+A_HP] += 1;
          if(WF[gb+A_HP] >= 3){ WI[gi+G_ALIVE]=0; emit(FX_ECHODIE,WF[gb+A_X],WF[gb+A_Y]-16,0); }
          killBullet(i); break;
        }
      }
    }
  }
}
function dogBlocked(){
  for(let i=0;i<MAXE;i++){
    if(WI[ENI+i*EI_N+N_ALIVE] && WI[ENI+i*EI_N+N_TYPE]===E_DOG){
      const b=EN+i*EN_N;
      if(WF[b+E_CD] <= 0 && Math.hypot(WF[b+E_X]-WF[PL+A_X], WF[b+E_Y]-WF[PL+A_Y]) < 90){
        WF[b+E_CD] = 6.0; emit(FX_SPARK, WF[b+E_X], WF[b+E_Y]-12, 0); return true;
      }
    }
  }
  return false;
}
// Frozen shells are footing. This is the clause that turns bullet-hell into
// level geometry, and AMBER is built entirely on it.
function frozenBulletTop(cx, w, prevFeet, newFeet){
  if(WF[F_STAST] <= 0) return null;
  let best = null;
  for(let i=0;i<MAXB;i++){
    if(!WI[BUI+i*BI_N+BI_ALIVE] || !WI[BUI+i*BI_N+BI_FLAG]) continue;
    const b = BU+i*BU_N, top = WF[b+B_Y]-6;
    if(Math.abs(WF[b+B_X]-cx) > (w/2+7)) continue;
    if(prevFeet <= top+2 && newFeet >= top){ if(best===null || top<best) best=top; }
  }
  return best;
}

// ══════════════════════════ 18. THE TICK ═══════════════════════════════════
let runDeaths = 0, forkReleaseTick = -1;

function step(btn, aim, ext){
  WF[F_TIME] += DT;
  if(!RUN.isFrac) WF[F_CHRONO] = Math.min(6, WF[F_CHRONO] + 0.5*DT);
  if(WF[F_STAST] > 0) WF[F_STAST] = Math.max(0, WF[F_STAST]-DT);

  // ── player powers, all read back out of the tape so an echo could do them ──
  if((btn & BTN_STASIS) && (RUN.powers & P_STASIS) && WF[PL+A_STASCD]<=0){
    const r = Math.min(300, 300);
    castStasis(WF[PL+A_X]+Math.cos(aim)*r, WF[PL+A_Y]-17+Math.sin(aim)*r);
  }
  if((ext & X_SWAP) && (RUN.powers & P_SWAP) && WF[PL+A_SWAPCD]<=0) doSwap();
  if((ext & X_SLIP) && (RUN.powers & P_SLIP) && WF[PL+A_SLIPCD]<=0 && WF[PL+A_PHASE]<=0
     && (RUN.isFrac || WF[F_CHRONO] >= 1.2)) doSlip();

  stepActor(PL, PLI, btn, aim, -1);

  // ── echoes: the same function, fed from tape ──
  for(let g=0;g<MAXG;g++){
    const gi = GSI+g*GS_N;
    if(WI[gi+G_ALIVE] !== 1) continue;
    const gb = GH0+g*AC_N;
    if(frozen(WF[gb+A_X], WF[gb+A_Y]-17)) continue;      // a frozen echo waits its turn
    const base = WI[gi+G_BUF]*4*TAPE_MAX, cur = WI[gi+G_CUR];
    const gbtn = tapeBtn(GTAPE, base, cur), gaim = tapeAim(GTAPE, base, cur);
    stepActor(gb, GAI+g*AI_N, gbtn, gaim, g);
    WI[gi+G_CUR]++;
    if(WI[gi+G_CUR] >= WI[gi+G_END]){
      WI[gi+G_ALIVE] = WI[gi+G_HOSTILE] ? 0 : 2;         // yours leaves a corpse
      emit(FX_ECHODIE, WF[gb+A_X], WF[gb+A_Y]-16, 0);
    }
  }

  let liveEchoes = 0;
  for(let g=0; g<4; g++) if(WI[GSI+g*GS_N+G_ALIVE] === 1) liveEchoes++;
  if(liveEchoes > WI[I_MAXECHO]) WI[I_MAXECHO] = liveEchoes;

  for(let i=0;i<MAXE;i++) stepEnemy(i);
  stepBullets();
  stepProps(btn);
  roomSpecial();

  if(WI[I_TICK] < TAPE_MAX-2) WI[I_TICK]++;
}

// Per-room rules that are cheaper as five lines here than as a system.
function roomSpecial(){
  switch(roomId){
  case 'f2':
    if(WF[PL+A_Y] <= 96) WI[I_EXIT] = 1;
    if(WF[F_R5] >= 1 && WI[PLI+AI_GROUND] === 1 && WF[PL+A_Y] > SCRH-260) WI[I_EXIT] = -1;
    if(WF[F_R5] > 3) WI[I_EXIT] = -1;
    break;
  case 'f1':
    if(WI[I_DMG] > 0) WI[I_EXIT] = -1;
    break;
  case 'f4': {
    if(WI[I_HOLD] >= 5) WI[I_EXIT] = 1;
    // respawn the targets so the window is a skill test, not a supply problem
    for(let i=0;i<MAXE;i++){
      const ib=ENI+i*EI_N;
      if(WI[ib+N_TYPE]===E_WATCHER && !WI[ib+N_ALIVE]){
        const b=EN+i*EN_N;
        WF[b+E_CD] -= DT;
        if(WF[b+E_CD] < -1.6){ WI[ib+N_ALIVE]=1; WF[b+E_HP]=2; WF[b+E_CD]=0.6;
          WF[b+E_X]=WF[b+E_AX]; WF[b+E_Y]=WF[b+E_AY]; countEnemies(); }
      }
    }
    break; }
  case 'f5':
    if(WI[I_BOSSDOWN]===1){
      WI[I_BOSSDOWN]=0; WF[F_R0]++;
      if(WF[F_R0]===1) spawnEnemy(E_AUDITOR, SCRW/2, 260);
      else if(WF[F_R0]===2) spawnEnemy(E_WARDEN, SCRW-200, SCRH-64);
    }
    break;
  case 'n7':
    if(WI[I_HOLD] >= 720) WI[I_DOOR] = 1;
    break;
  }
  if(RUN.limit && WF[F_TIME] > RUN.limit) WI[I_EXIT] = -1;
}
function measure(){
  return {
    exit    : WI[I_EXIT] === 1,
    kills   : WI[I_KILLS],
    dmg     : WI[I_DMG],
    time    : WF[F_TIME],
    forks   : WI[I_FORKS],
    carried : WI[I_CARRY],
    window  : WI[I_WINDOW],
    bossDown: WI[I_BOSSDOWN] === 1,
    joined  : WF[F_R2] === 1,
    plates  : WF[F_R6],
    hold    : WI[I_HOLD]/60,
    deaths  : runDeaths,
  };
}

// ══════════════════════════ 19. REWIND, FORK, LAST WORD ════════════════════
// Holding R scrubs three ticks per rendered frame — 3x real time, one chrono
// second per game second undone. Releasing does not "resume"; it forks.

let rewindE = -1, pipsLeft = 0, scrubFlash = 0;

function canRewind(){
  if(!(RUN.powers & P_FORK)) return false;
  if(WI[I_TICK] <= ringMin) return false;
  if(RUN.isFrac) return rewindE >= 0 ? true : pipsLeft > 0;
  return WF[F_CHRONO] > 0;
}
function beginRewind(){
  if(rewindE >= 0 || !canRewind()) return;
  rewindE = WI[I_TICK];
  if(RUN.isFrac) pipsLeft--;
  WI[I_REWINDS]++;
  sfx('rewind');
}
function rewindTick(){
  if(WI[I_TICK] <= ringMin) return false;
  if(!RUN.isFrac && WF[F_CHRONO] <= 0) return false;
  // Chrono is spent, not simulated. The restore would hand it straight back —
  // it is in the snapshot like everything else — so carry it across by hand.
  const spent = WF[F_CHRONO];
  ringRestore(WI[I_TICK]-1);
  WF[F_CHRONO] = RUN.isFrac ? spent : Math.max(0, spent - DT);
  scrubFlash = 1;
  return true;
}
// The body you just abandoned stands up and keeps working. It is not a replay
// of the world — it is a replay of YOU, through the identical stepActor.
let nextBuf = 0;
function makeEcho(T, E){
  if(E <= T+3) return false;
  let slot = -1, oldest = 1e9;
  for(let g=0; g<4; g++){
    const gi = GSI+g*GS_N;
    if(WI[gi+G_ALIVE] !== 1){ slot = g; break; }
    if(WI[gi+G_BIRTH] < oldest){ oldest = WI[gi+G_BIRTH]; slot = g; }
  }
  if(slot < 0) return false;
  const buf = nextBuf; nextBuf = (nextBuf+1) % NBUF;
  GTAPE.set(TAPE.subarray(T*4, Math.min(E, TAPE_MAX)*4), buf*4*TAPE_MAX);
  tapeBirth[buf] = T;
  const gi = GSI+slot*GS_N, gb = GH0+slot*AC_N;
  WI[gi+G_ALIVE]=1; WI[gi+G_CUR]=0; WI[gi+G_BIRTH]=T;
  WI[gi+G_END]=E-T; WI[gi+G_BUF]=buf; WI[gi+G_HOSTILE]=0;
  for(let f=0; f<AC_N; f++) WF[gb+f] = WF[PL+f];
  WF[gb+A_HP] = 0;
  WI[GAI+slot*AI_N+AI_GROUND] = WI[PLI+AI_GROUND];
  WI[GAI+slot*AI_N+AI_WALL]   = WI[PLI+AI_WALL];
  WI[I_FORKS]++; WI[I_FORKTICK] = T;
  if(!RUN.isFrac) WF[F_CHRONO] = Math.max(0, WF[F_CHRONO]-0.75);
  emit(FX_FORK, WF[PL+A_X], WF[PL+A_Y]-16, 0);
  sfx('fork'); shake(0.3);
  return true;
}
function endRewind(slipHeld){
  if(rewindE < 0) return;
  const T = WI[I_TICK], E = rewindE;
  rewindE = -1;
  if(!RUN.forksLocked) makeEcho(T, E);
  if(slipHeld && (RUN.powers & P_SLIP) && WF[PL+A_SLIPCD] <= 0) doSlip();
  ringRec();
}

// LAST WORD — punch out of a live fight onto the Spine, mid-frame.
const PARK = {
  F:new Float64Array(WF_N), I:new Int32Array(WI_N),
  T:new Uint8Array(4*TAPE_MAX), G:new Uint8Array(4*TAPE_MAX*NBUF),
  birth:new Int32Array(NBUF), room:null, deaths:0, facts:0, active:false
};
function parkRoom(){
  PARK.F.set(WF); PARK.I.set(WI); PARK.T.set(TAPE); PARK.G.set(GTAPE);
  PARK.birth.set(tapeBirth);
  PARK.room = roomId; PARK.deaths = runDeaths; PARK.facts = SAVE.facts; PARK.active = true;
  sfx('park');
}
function unparkRoom(){
  if(!PARK.active) return false;
  loadRoom(PARK.room);
  WF.set(PARK.F); WI.set(PARK.I); TAPE.set(PARK.T); GTAPE.set(PARK.G);
  tapeBirth.set(PARK.birth);
  runDeaths = PARK.deaths;
  // The price: you traded your last six seconds of history for a rewritten world.
  ringMin = WI[I_TICK]; WF[F_CHRONO] = 0; rewindE = -1;
  ringRec();
  if(SAVE.facts !== PARK.facts){ WF[F_R7] = 1; lastWordPatch(SAVE.facts); }
  PARK.active = false;
  return true;
}
// A bounded list of slot edits — never a re-run of the whole spawner, which
// would duplicate or orphan half the roster.
function lastWordPatch(F){
  if(roomId === 'n13'){
    for(let i=0;i<MAXE;i++){
      const ib = ENI+i*EI_N;
      if(WI[ib+N_ALIVE] && WI[ib+N_TYPE]===E_WATCHER) WI[ib+N_ALIVE]=0;
    }
    if(F & F_KESH) spawnEnemy(E_ALLY, WF[PL+A_X]-70, WF[PL+A_Y]);
    countEnemies(); shake(1.0);
  } else if(roomId === 'n12' || roomId === 'n10'){
    for(let i=0;i<MAXE;i++){
      const ib = ENI+i*EI_N;
      if(WI[ib+N_ALIVE] && WI[ib+N_TYPE]===E_SWEEPER) WI[ib+N_ALIVE]=0;
    }
    if(F & F_KESH) spawnEnemy(E_ALLY, WF[PL+A_X]-70, WF[PL+A_Y]);
    countEnemies();
  }
}

// ══════════════════════════ 20. THE RUN LIFECYCLE ══════════════════════════
let MODE = 'title';          // title | spine | play | medal | cascade | frac | end
let medalCard = null, cascade = null, endingCard = null, fracCard = null;

function startNode(id, opts){
  loadRoom(id, opts);
  runDeaths = 0; rewindE = -1; nextBuf = 0;
  pipsLeft = RUN.pips;
  SAVE.seen[id] = 1;
  MODE = RUN.isFrac ? 'frac' : 'play';
  if(RUN.isFrac) fracCard = {t:0};
  musicEra(room.era);
}
function restartNode(){ startNode(roomId); }

function medalFor(s){
  if(!s.exit) return 0;
  let m = 1;
  if(s.time <= RUN.par) m = 2;
  if(s.time <= RUN.gold && s.dmg === 0 && s.forks <= RUN.forkCap && s.deaths === 0) m = 3;
  if(RUN.soften && m > 2) m = 2;                 // the valve can carry you, never anchor you
  return m;
}
function finishNode(){
  const s = measure();
  const id = roomId;

  if(RUN.isFrac){
    const passed = s.exit && !(room.maxDmg === 0 && s.dmg > 0);
    if(passed){
      const first = !(SAVE.powers & room.power);
      SAVE.powers |= room.power;
      if(s.time <= RUN.seal && !RUN.soften) SAVE.seals[id] = 1;
      SAVE.cleared[id] = 1;
      SAVE.splinters |= WI[I_SPLINT];
      saveGame();
      fracCard = null;
      medalCard = {frac:true, id, time:s.time, seal:!!SAVE.seals[id], first,
                   power:POWER_INFO.find(p=>p.bit===room.power), t:0};
      MODE = 'medal'; sfx('win');
    } else {
      SAVE.fails[id] = (SAVE.fails[id]||0) + 1;
      if(SAVE.fails[id] >= 12) SAVE.softenOffered = true;
      saveGame();
      startNode(id);                              // 0.4 s and you are back at the door
    }
    return;
  }

  if(!s.exit){                                    // ran out of clock in a story node
    SAVE.fails[id] = (SAVE.fails[id]||0) + 1;
    if(SAVE.fails[id] >= 12) SAVE.softenOffered = true;
    saveGame(); startNode(id); return;
  }

  const node = NODES[id];
  let oc = null;
  for(const o of node.outcomes) if(o.test(s)){ oc = o; break; }
  if(!oc) oc = node.outcomes[node.outcomes.length-1];

  const medal = medalFor(s);
  const prev  = SAVE.medals[id] || 0;
  const prevOutcome = SAVE.outcomes[id];
  const factsBefore = SAVE.facts;

  SAVE.medals[id] = Math.max(prev, medal);
  if(!SAVE.best[id] || s.time < SAVE.best[id]) SAVE.best[id] = s.time;
  SAVE.cleared[id] = 1;
  SAVE.outcomes[id] = oc.id;
  if(SAVE.medals[id] === 3) SAVE.anchored[id] = 1;   // gold is owned, not rented
  SAVE.splinters |= WI[I_SPLINT];
  if(WI[I_MAXECHO] >= 3) SAVE.paradox = Object.assign({}, SAVE.paradox, {[id]:1});

  const dropped = rebuildFacts();
  saveGame();

  medalCard = {
    id, medal, time:s.time, dmg:s.dmg, forks:s.forks, deaths:s.deaths,
    par:RUN.par, gold:RUN.gold, forkCap:RUN.forkCap,
    anchored:SAVE.medals[id]===3, paradox:WI[I_MAXECHO]>=3,
    outcome:oc, changed:oc.id !== prevOutcome, factsBefore, dropped, t:0
  };
  MODE = 'medal'; sfx('win');
}
function closeMedalCard(){
  const mc = medalCard;
  medalCard = null;
  if(mc && !mc.frac && mc.changed){
    cascade = {t:0, node:mc.id, before:mc.factsBefore, after:SAVE.facts,
               dropped:mc.dropped, line:mc.outcome.line};
    MODE = 'cascade'; sfx('cascade');
  } else {
    MODE = 'spine'; spineSel = ALL_NODES.indexOf(mc ? mc.id : 'n1');
    musicEra('SPINE');
  }
  if(SAVE.cleared['n13']) showEnding();
}
function showEnding(){
  let e = 'DEATH';
  const F = SAVE.facts;
  if(powerCount() >= 6 && splinterCount() >= 9) e = 'UNWRITTEN';
  else {
    let n = 0;
    if(F & F_MOTHER) n++;
    if(F & F_KESH) n++;
    if(F & F_DOC) n++;
    if(n >= 2) e = 'ESCAPE';
  }
  SAVE.ending = e; saveGame();
  endingCard = {e, t:0}; MODE = 'end';
}

// ══════════════════════════ 21. RENDER ═════════════════════════════════════
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', {alpha:false});
const mk = (w,h)=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; };
const tileCv = mk(SCRW, SCRH);  const tileCtx = tileCv.getContext('2d');
const blurA  = mk(320, 184);    const blurACtx = blurA.getContext('2d');
const blurB  = mk(160, 92);     const blurBCtx = blurB.getContext('2d');
const scanCv = mk(SCRW, SCRH);
let tileKey = '', lowFx = false, slowFrames = 0;

(function buildScanlines(){
  const c = scanCv.getContext('2d');
  c.fillStyle = 'rgba(0,0,0,.30)';
  for(let y=0;y<SCRH;y+=3) c.fillRect(0,y+1,SCRW,1);
})();

let shakeT = 0, shakeMag = 0, hitstopN = 0;
function shake(m){ shakeMag = Math.max(shakeMag, m); shakeT = 1; }
function hitstop(n){ hitstopN = Math.max(hitstopN, n); }

function fitCanvas(){
  const pad = 0;
  const w = window.innerWidth - pad, h = window.innerHeight - pad;
  const s = Math.min(w/SCRW, h/SCRH);
  cv.style.width  = Math.floor(SCRW*s)+'px';
  cv.style.height = Math.floor(SCRH*s)+'px';
}
window.addEventListener('resize', fitCanvas);

// ── the static tile layer, rendered once per (room, layer, era) ────────────
function paintTiles(){
  const key = roomId+'|'+WI[I_LAYER]+'|'+room.era+'|'+WI[I_DOOR];
  if(key === tileKey) return;
  tileKey = key;
  const g = tileCtx, E = era, L = layer();
  g.fillStyle = E.bg; g.fillRect(0,0,SCRW,SCRH);
  // a soft light source per era, painted straight into the tile layer
  // Backdrop architecture, seeded off the room id so it is the same every
  // visit. It never collides with anything — it is depth, not level.
  let bh0 = 2166136261;
  for(let i=0;i<roomId.length;i++){ bh0 ^= roomId.charCodeAt(i); bh0 = Math.imul(bh0,16777619); }
  let br = bh0 >>> 0;
  const bn = ()=>{ br ^= br<<13; br|=0; br ^= br>>>17; br ^= br<<5; br|=0; return (br>>>0)/4294967296; };
  for(let i=0;i<26;i++){
    const bw = 60+bn()*240, bhh = 40+bn()*220, bx = bn()*SCRW-40, by = bn()*SCRH-30;
    g.globalAlpha = .22; g.fillStyle = E.mid; g.fillRect(bx,by,bw,bhh);
    g.globalAlpha = .06; g.fillStyle = E.acc; g.fillRect(bx,by,bw,3);
    g.globalAlpha = .05; g.fillStyle = E.hi;
    for(let wx=bx+10; wx<bx+bw-10; wx+=20) for(let wy=by+12; wy<by+bhh-10; wy+=24) g.fillRect(wx,wy,8,10);
  }
  g.globalAlpha = 1;
  const grd = g.createRadialGradient(SCRW/2, room.era==='ASH'?SCRH:0, 40, SCRW/2, room.era==='ASH'?SCRH:0, 900);
  grd.addColorStop(0, E.acc+'22'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0,0,SCRW,SCRH);
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
    const t = L[y*GW+x], px = x*TW, py = y*TW;
    if(t===T_SOLID || (t===T_DOOR && WI[I_DOOR]===0) || t===T_BREAK){
      g.fillStyle = t===T_BREAK ? E.ink : E.mid;
      g.fillRect(px,py,TW,TW);
      g.fillStyle = E.ink;
      g.fillRect(px,py+TW-3,TW,3);
      if(y===0 || L[(y-1)*GW+x]===T_EMPTY || L[(y-1)*GW+x]===T_ONEWAY){
        g.fillStyle = E.acc; g.globalAlpha = t===T_BREAK ? 0.5 : 0.20;
        g.fillRect(px,py,TW,2); g.globalAlpha = 1;
      }
      if(t===T_BREAK){
        g.strokeStyle = E.acc; g.globalAlpha=.35; g.lineWidth=1;
        g.beginPath(); g.moveTo(px+4,py+6); g.lineTo(px+TW-4,py+TW-6); g.stroke();
        g.globalAlpha=1;
      }
      if(t===T_DOOR){
        g.fillStyle = E.acc; g.globalAlpha=.30;
        for(let k=4;k<TW;k+=8) g.fillRect(px+2,py+k,TW-4,3);
        g.globalAlpha=1;
      }
    } else if(t===T_ONEWAY){
      g.fillStyle = E.acc; g.globalAlpha=.72; g.fillRect(px,py,TW,3); g.globalAlpha=1;
      g.fillStyle = E.ink; g.fillRect(px,py+3,TW,2);
    } else if(t===T_SPIKE){
      g.fillStyle = E.ink;
      g.beginPath(); g.moveTo(px,py+TW); g.lineTo(px+TW/2,py+6); g.lineTo(px+TW,py+TW); g.fill();
      g.fillStyle = E.acc; g.fillRect(px+TW/2-1,py+6,2,3);
    }
  }
}

// ── silhouettes ────────────────────────────────────────────────────────────
function drawVek(g,x,y,face,col,opt){
  opt = opt || {};
  const sq = opt.squash || 0, h = 36 - sq*4, w = 20 + sq*3;
  g.save(); g.translate(x, y);
  g.fillStyle = col;
  g.beginPath();                                   // coat
  g.moveTo(-w/2, 0); g.lineTo(-w/2+2, -h+12);
  g.lineTo(-4, -h); g.lineTo(5, -h); g.lineTo(w/2-1, -h+13);
  g.lineTo(w/2-3, -h*0.42); g.lineTo(w/2+ (face>0?5:1), 0);
  g.closePath(); g.fill();
  g.fillRect(-w/2+3, -h*0.34, w-6, h*0.34);        // legs mass
  if(opt.chrome){ g.fillStyle = opt.rim || '#cfe9ff'; g.fillRect(face>0?4:-9, -h+13, 6, 13); }
  g.fillStyle = opt.rim || '#ffffff';               // rim light on the facing side
  g.globalAlpha = 0.75;
  g.fillRect(face>0 ? w/2-3 : -w/2, -h+11, 2, h-11);
  g.globalAlpha = 1;
  g.fillStyle = opt.eye || '#ffffff';
  g.fillRect(face>0 ? 1 : -4, -h+6, 3, 2);
  g.restore();
}
function drawEnemy(g, type, x, y, b, ib){
  const E = era, ink = E.ink, acc = E.acc;
  const flash = WF[b+E_FLASH] > 0;
  const hp = WF[b+E_HP], full = ENEMY_HP[type]||3;
  const erode = 1 - Math.max(0, Math.min(0.55, (1-hp/full)*0.55));
  g.save(); g.translate(x,y);
  g.fillStyle = flash ? '#ffffff' : ink;
  switch(type){
  case E_WATCHER:
    g.beginPath(); g.ellipse(0,-14,15*erode,10*erode,0,0,6.283); g.fill();
    g.fillStyle = flash?'#fff':acc; g.beginPath(); g.arc(0,-14,3.4,0,6.283); g.fill();
    g.globalAlpha=.35; g.fillRect(-15,-15,30,1); g.globalAlpha=1;
    break;
  case E_SWEEPER: {
    const st = WI[ib+N_STATE], d = WF[b+E_TX]||1;
    g.beginPath(); g.moveTo(d*17,-13); g.lineTo(-d*13,-26); g.lineTo(-d*13,0); g.closePath(); g.fill();
    g.fillStyle = st===1 ? '#ffffff' : acc;
    g.globalAlpha = st===1 ? 0.9 : 0.5;
    g.fillRect(-d*13, -26, 3, 26); g.globalAlpha=1;
    break; }
  case E_TURRET:
    g.beginPath(); g.arc(0,0,15*erode,0,6.283); g.fill();
    g.fillStyle = flash?'#fff':acc;
    g.save(); g.rotate(WF[b+E_AIM]); g.fillRect(0,-2.5,20,5); g.restore();
    g.globalAlpha=.5; g.beginPath(); g.arc(0,0,6,0,6.283); g.fill(); g.globalAlpha=1;
    break;
  case E_WARDEN: {
    const d = Math.sign(WF[b+E_AIM])||1;
    g.fillRect(-13,-40,26,40);
    g.fillStyle = flash?'#fff':acc;
    g.globalAlpha=.10;                              // the 140 deg arc it cannot be hurt through
    g.beginPath(); g.moveTo(0,-22);
    g.arc(0,-22, 150, d>0?-1.22:Math.PI-1.22, d>0?1.22:Math.PI+1.22);
    g.closePath(); g.fill(); g.globalAlpha=1;
    g.fillRect(d>0?9:-15, -40, 6, 40);
    break; }
  case E_CENSOR:
    g.fillRect(-14,-8,28,14);
    g.fillStyle = WI[ib+N_STATE]===1 ? '#ff4a4a' : (WI[ib+N_STATE]===2 ? '#404858' : acc);
    g.fillRect(-4,6,8,5);
    if(WI[ib+N_STATE]===1){
      const t = WI[ib+N_TGT], gb = GH0+t*AC_N;
      if(t>=0 && WI[GSI+t*GS_N+G_ALIVE]){
        g.strokeStyle='#ff4a4a'; g.lineWidth=2; g.globalAlpha=.8;
        g.strokeRect(WF[gb+A_X]-x-16, WF[gb+A_Y]-y-38, 32, 40);
        g.globalAlpha=1;
      }
    }
    break;
  case E_SCRUBBER:
    g.globalAlpha=.9;
    g.beginPath(); g.arc(0,-12,15,0.6,5.6); g.lineWidth=6; g.strokeStyle=flash?'#fff':ink; g.stroke();
    g.globalAlpha=1;
    g.strokeStyle=acc; g.lineWidth=1; g.globalAlpha=.4;
    g.beginPath(); g.arc(0,-12,26,0,6.283); g.stroke(); g.globalAlpha=1;
    break;
  case E_KESH: case E_ALLY:
    drawVek(g,0,0,Math.sign(WF[b+E_AIM])||1, flash?'#ffffff':(type===E_ALLY?'#8affc0':'#ff8a5a'),
            {rim:type===E_ALLY?'#d6ffe8':'#ffd6c0'});
    break;
  case E_AUDITOR:
    g.beginPath(); g.moveTo(0,-46); g.lineTo(24,-20); g.lineTo(0,4); g.lineTo(-24,-20); g.closePath(); g.fill();
    g.fillStyle=flash?'#fff':acc; g.fillRect(-12,-24,24,3); g.fillRect(-12,-16,24,3);
    break;
  case E_ARCHIVIST: {
    const ph = WI[I_PHASE];
    g.fillStyle = flash?'#ffffff':'#151515';
    g.beginPath(); g.moveTo(0,-58); g.lineTo(30,-26); g.lineTo(20,6); g.lineTo(-20,6); g.lineTo(-30,-26); g.closePath(); g.fill();
    g.fillStyle = '#ff2b2b';
    for(let k=0;k<=ph;k++) g.fillRect(-16+k*14, -40, 6, 6);
    g.globalAlpha=.25; g.fillRect(-30,-28,60,2); g.globalAlpha=1;
    break; }
  case E_DOG:
    g.fillRect(-13,-16,26,16); g.fillRect(11,-22,9,8);
    g.fillStyle=acc; g.fillRect(-15,-14,4,3);
    break;
  }
  g.restore();
  if((SAVE.facts & F_WITNESS) && type!==E_DOG && type!==E_ALLY && full<=12){
    ctx.fillStyle = '#ffffff'; ctx.globalAlpha=.55;
    for(let k=0;k<Math.ceil(hp);k++) ctx.fillRect(x-full*2.5+k*5, y-46, 3, 3);
    ctx.globalAlpha=1;
  }
}

// ── particles: analytic, never stored, therefore free to rewind ────────────
const FX_LIFE = {1:26, 2:40, 3:24, 4:16, 5:8, 6:34, 7:30, 8:14, 9:12, 10:18};
function drawParticles(g){
  const now = WI[I_TICK];
  for(let i=0;i<FXN;i++){
    const k = FX.kind[i]; if(!k) continue;
    const age = now - FX.tick[i];
    const life = FX_LIFE[k] || 20;
    if(age < 0 || age > life) continue;
    const s = FX.s[i], f = age/life;
    let n = 6, spd = 60, col = era.acc, sz = 3;
    if(k===FX_KILL){ n=16; spd=200; col=era.hi; sz=4; }
    else if(k===FX_HIT){ n=8; spd=140; col='#ffffff'; }
    else if(k===FX_FORK){ n=18; spd=170; col='#48e8ff'; sz=4; }
    else if(k===FX_ECHODIE){ n=18; spd=150; col='#48e8ff'; sz=3; }
    else if(k===FX_DUST){ n=5; spd=50; col=era.mid; sz=3; }
    else if(k===FX_SHOT){ n=3; spd=90; col=era.hi; sz=2; }
    else if(k===FX_PICKUP){ n=14; spd=110; col='#ffe14a'; sz=3; }
    else if(k===FX_SPARK){ n=7; spd=120; col=era.hi; sz=2; }
    else if(k===FX_BLADE){ n=10; spd=260; col='#ffffff'; sz=2; }
    else if(k===FX_SLIP){ n=9; spd=150; col='#b48aff'; sz=3; }
    g.globalAlpha = (1-f)*(1-f)*0.9;
    g.fillStyle = col;
    for(let j=0;j<n;j++){
      const h = (s ^ (j*2654435761)) >>> 0;
      let a = (h % 1000)/1000*Math.PI*2;
      if(k===FX_BLADE || k===FX_SHOT || k===FX_SLIP) a = FX.a[i] + ((h%200)/200-0.5)*1.1;
      const v = spd*(0.4 + ((h>>>10)%100)/100);
      const t = age/60;
      const px = FX.x[i] + Math.cos(a)*v*t;
      const py = FX.y[i] + Math.sin(a)*v*t + (k===FX_DUST?0:1) * 300*t*t*0.5;
      g.fillRect(px-sz/2, py-sz/2, sz, sz);
    }
  }
  g.globalAlpha = 1;
}

// ── the frame ──────────────────────────────────────────────────────────────
function renderWorld(){
  paintTiles();
  const g = ctx;
  g.save();
  if(shakeT > 0 && !lowFx){
    const m = shakeMag*shakeMag*9;
    g.translate((rngFx()-0.5)*m, (rngFx()-0.5)*m);
  }
  g.drawImage(tileCv, 0, 0);

  // rising fire (n1)
  if(room.fire){
    const fy = SCRH - WF[F_TIME]*8;
    const grd = g.createLinearGradient(0, fy-70, 0, SCRH);
    grd.addColorStop(0,'rgba(255,90,31,0)'); grd.addColorStop(.5,'rgba(255,90,31,.45)');
    grd.addColorStop(1,'rgba(255,215,120,.85)');
    g.fillStyle = grd; g.fillRect(0, fy-70, SCRW, SCRH-fy+70);
  }

  // props
  for(let i=0;i<MAXP;i++){
    const ib = PRI+i*PI_N, type = WI[ib+PI_TYPE];
    if(!type) continue;
    const b = PR+i*PR_N, x = WF[b+P_X], y = WF[b+P_Y];
    switch(type){
    case PR_EXIT: {
      const open = exitOpen();
      g.fillStyle = open ? era.acc : '#3a3f52';
      g.globalAlpha = open ? .18+0.10*Math.sin(WI[I_TICK]*0.09) : .12;
      g.fillRect(x-18, y-52, 36, 52); g.globalAlpha=1;
      g.strokeStyle = open ? era.hi : '#4a5064'; g.lineWidth=2;
      g.strokeRect(x-18, y-52, 36, 52);
      if(open){ g.fillStyle=era.hi; g.globalAlpha=.8; g.fillRect(x-2,y-52,4,52); g.globalAlpha=1; }
      break; }
    case PR_PLATE: {
      const on = WI[ib+PI_STATE];
      g.fillStyle = on ? era.acc : era.ink;
      g.fillRect(x-16, y-8, 32, 8);
      g.fillStyle = on ? era.hi : '#555c70';
      g.fillRect(x-16, y-9, 32, 2);
      if(on){ g.globalAlpha=.25; g.fillStyle=era.acc; g.fillRect(x-16,y-40,32,32); g.globalAlpha=1; }
      const lbl = 'ABCD'[WF[b+P_VAL]] || '';
      g.fillStyle = on?'#04121b':'#8a93ab'; g.font='bold 10px ui-monospace,monospace'; g.textAlign='center';
      g.fillText(lbl, x, y-1);
      break; }
    case PR_SPLINTER:
      if(!WI[ib+PI_ALIVE]) break;
      g.save(); g.translate(x, y-14+Math.sin(WI[I_TICK]*0.06)*4); g.rotate(WI[I_TICK]*0.03);
      g.fillStyle='#ffe14a'; g.beginPath();
      g.moveTo(0,-11); g.lineTo(7,0); g.lineTo(0,11); g.lineTo(-7,0); g.closePath(); g.fill();
      g.globalAlpha=.35; g.beginPath(); g.arc(0,0,17,0,6.283); g.fill(); g.globalAlpha=1;
      g.restore();
      break;
    case PR_CARRY:
      if(!WI[ib+PI_ALIVE]) break;
      if(WF[b+P_VAL]===1){
        g.fillStyle='#c78a6a'; g.fillRect(x-11,y-30,22,30);
        g.fillStyle='#ffd9a0'; g.fillRect(x-7,y-38,14,10);
      } else {
        g.fillStyle='#9a7a52'; g.fillRect(x-12,y-16,24,16); g.fillRect(x+10,y-22,8,8);
      }
      g.fillStyle=era.hi; g.globalAlpha=.6+0.3*Math.sin(WI[I_TICK]*0.1);
      g.font='9px ui-monospace,monospace'; g.textAlign='center';
      g.fillText('E', x, y-44); g.globalAlpha=1;
      break;
    case PR_PRESS: {
      const cyc = WF[F_R0]/2.4;
      const down = WI[ib+PI_STATE] ? (1 - WF[F_R1]/18) : Math.max(0, Math.sin(cyc*Math.PI*2)*0.45);
      g.fillStyle = era.ink; g.fillRect(x-40, y-150, 80, 12);
      g.fillStyle = '#5a6070';
      g.fillRect(x-30, y-150, 60, 20 + down*98);
      g.fillStyle = WI[ib+PI_STATE] ? '#5a6070' : era.acc;
      g.fillRect(x-30, y-132+down*98, 60, 8);
      if(!WI[ib+PI_STATE]){
        g.fillStyle='#ffe14a'; g.fillRect(x-6, y-14, 12, 14);
        g.globalAlpha=.5; g.beginPath(); g.arc(x,y-7,16,0,6.283); g.fill(); g.globalAlpha=1;
        g.fillStyle=era.hi; g.font='9px ui-monospace,monospace'; g.textAlign='center'; g.fillText('E', x, y+12);
      }
      break; }
    case PR_TRANSMIT: {
      const p = Math.min(1, WI[I_HOLD]/720);
      g.fillStyle=era.ink; g.fillRect(x-16,y-46,32,46);
      g.fillStyle=era.acc; g.fillRect(x-16, y-46+(1-p)*46, 32, p*46);
      g.strokeStyle=era.hi; g.lineWidth=1; g.strokeRect(x-16,y-46,32,46);
      g.fillStyle=era.hi; g.fillRect(x-1,y-64,2,18);
      break; }
    case PR_JOIN:
      g.strokeStyle='#ff8a5a'; g.lineWidth=2; g.setLineDash([5,4]);
      g.strokeRect(x-16,y-44,32,44); g.setLineDash([]);
      g.fillStyle='#ff8a5a'; g.font='9px ui-monospace,monospace'; g.textAlign='center';
      g.fillText('E · JOIN', x, y+12);
      break;
    case PR_BEAM:
      g.fillStyle = era.ink; g.fillRect(x-34, WF[b+P_Y]-18, 68, 32);
      g.fillStyle = era.acc; g.globalAlpha=.5; g.fillRect(x-34, WF[b+P_Y]-18, 68, 3); g.globalAlpha=1;
      if(WF[F_TIME] < WF[b+P_T]){
        g.strokeStyle='#ff5a1f'; g.globalAlpha=.35; g.setLineDash([4,6]); g.lineWidth=2;
        g.beginPath(); g.moveTo(x, WF[b+P_Y]+14); g.lineTo(x, SCRH); g.stroke();
        g.setLineDash([]); g.globalAlpha=1;
      }
      break;
    case PR_LASER:
      g.fillStyle='#ff2b2b'; g.globalAlpha=.85; g.fillRect(WF[b+P_X]-5, 0, 10, SCRH);
      g.globalAlpha=.20; g.fillRect(WF[b+P_X]-22, 0, 44, SCRH); g.globalAlpha=1;
      break;
    case PR_GHOSTPROP:
      g.globalAlpha = WF[b+P_VAL] ? .55 : .30;
      g.fillStyle = WF[b+P_VAL] ? '#ffd9a0' : '#4a4a52';
      if(WF[b+P_VAL]) g.fillRect(x-9,y-30,18,30); else g.fillRect(x-18,y-9,36,9);
      g.globalAlpha=1;
      break;
    }
  }

  // enemies
  for(let i=0;i<MAXE;i++){
    if(!WI[ENI+i*EI_N+N_ALIVE]) continue;
    drawEnemy(g, WI[ENI+i*EI_N+N_TYPE], WF[EN+i*EN_N+E_X], WF[EN+i*EN_N+E_Y], EN+i*EN_N, ENI+i*EI_N);
  }

  // bullets
  for(let i=0;i<MAXB;i++){
    if(!WI[BUI+i*BI_N+BI_ALIVE]) continue;
    const b = BU+i*BU_N, own = WI[BUI+i*BI_N+BI_OWNER], fr = WI[BUI+i*BI_N+BI_FLAG];
    if(fr){
      g.fillStyle = '#ffb01f'; g.fillRect(WF[b+B_X]-6, WF[b+B_Y]-6, 12, 12);
      g.strokeStyle = '#fff0c0'; g.lineWidth=1; g.strokeRect(WF[b+B_X]-7, WF[b+B_Y]-7, 14, 14);
    } else {
      g.fillStyle = hostileOwner(own) ? (era.name==='ZERO'?'#ff2b2b':era.hi) : '#8ff4ff';
      const r = WF[b+B_R];
      g.fillRect(WF[b+B_X]-r, WF[b+B_Y]-r*0.6, r*2, r*1.2);
      g.globalAlpha=.35;
      g.fillRect(WF[b+B_X]-r-WF[b+B_VX]*0.012, WF[b+B_Y]-r*0.5-WF[b+B_VY]*0.012, r*2, r);
      g.globalAlpha=1;
    }
  }

  // stasis sphere
  if(WF[F_STAST] > 0){
    const p = WF[F_STAST]/1.8;
    g.strokeStyle = '#ffb01f'; g.lineWidth = 2; g.globalAlpha = .35+0.25*p;
    g.beginPath(); g.arc(WF[F_STASX], WF[F_STASY], 96, 0, 6.283); g.stroke();
    g.globalAlpha = .10; g.fillStyle = '#ffb01f';
    g.beginPath(); g.arc(WF[F_STASX], WF[F_STASY], 96, 0, 6.283); g.fill();
    g.globalAlpha = .9; g.lineWidth = 3; g.strokeStyle = '#fff0c0';
    g.beginPath(); g.arc(WF[F_STASX], WF[F_STASY], 96, -Math.PI/2, -Math.PI/2 + p*6.283); g.stroke();
    g.globalAlpha = 1;
  }

  // echoes — alpha, hue and a dotted future arc so four of you stay readable
  const ECHO_COL = ['#48e8ff','#3ad8ff','#2ec6ff','#30b2ff','#ff6a6a','#ff8a8a'];
  for(let gi2=0; gi2<MAXG; gi2++){
    const q = GSI+gi2*GS_N;
    if(!WI[q+G_ALIVE]) continue;
    const gb = GH0+gi2*AC_N, hostile = WI[q+G_HOSTILE];
    const col = hostile ? '#ff4a4a' : ECHO_COL[gi2];
    g.globalAlpha = WI[q+G_ALIVE]===2 ? 0.18 : (hostile ? 0.75 : 0.38);
    drawVek(g, WF[gb+A_X], WF[gb+A_Y], WF[gb+A_FACE], col, {rim:col});
    g.globalAlpha = 1;
    if(WI[q+G_ALIVE]===1 && !hostile && !lowFx){
      // its next second, drawn — you are allowed to plan around your own past
      g.strokeStyle = col; g.globalAlpha = .35; g.setLineDash([2,5]); g.lineWidth=1.5;
      g.beginPath();
      let px = WF[gb+A_X], py = WF[gb+A_Y]-17, vx = WF[gb+A_VX], vy = WF[gb+A_VY];
      g.moveTo(px,py);
      const base = WI[q+G_BUF]*4*TAPE_MAX;
      for(let t=1;t<48;t++){
        const bb = tapeBtn(GTAPE, base, WI[q+G_CUR]+t);
        const d = ((bb&BTN_R)?1:0)-((bb&BTN_L)?1:0);
        vx += d*1400*DT; vx *= 0.94; vy = Math.min(TERM, vy+GRAV*DT);
        px += vx*DT; py += vy*DT;
        if(solidPx(px,py+17)){ vy = 0; py = Math.floor((py+17)/TW)*TW - 17; }
        if(t%2===0) g.lineTo(px,py);
      }
      g.stroke(); g.setLineDash([]); g.globalAlpha=1;
    }
  }

  // you
  const inv = WF[PL+A_IFR] > 0 && (WI[I_TICK] % 8) < 4;
  if(!inv){
    g.globalAlpha = WF[PL+A_PHASE] > 0 ? 0.45 : 1;
    drawVek(g, WF[PL+A_X], WF[PL+A_Y], WF[PL+A_FACE], WF[PL+A_FLASH]>0?'#ffffff':'#48e8ff',
            {chrome:!!(SAVE.facts & F_CHROME), rim:'#dffaff'});
    g.globalAlpha = 1;
  }
  if(WF[PL+A_BLADET] > 0){
    const a = WF[PL+A_AIM], p = 1 - WF[PL+A_BLADET]/0.25;
    g.strokeStyle='#ffffff'; g.lineWidth=3; g.globalAlpha=1-p;
    g.beginPath();
    g.arc(WF[PL+A_X], WF[PL+A_Y]-17, BODY.bladeReach, a-0.96+p*1.9, a-0.76+p*1.9);
    g.stroke(); g.globalAlpha=1;
  }
  if(WI[I_CARRY]===1){
    g.fillStyle='#c78a6a'; g.fillRect(WF[PL+A_X]-14, WF[PL+A_Y]-44, 28, 9);
  } else if(WI[I_CARRY]===2){
    g.fillStyle='#9a7a52'; g.fillRect(WF[PL+A_X]-12, WF[PL+A_Y]-42, 24, 8);
  }

  drawParticles(g);
  g.restore();
}

  // ── top-right: the clock, and your medal decided live, not after ──

    g.fillRect(x0, 20, Math.min(w, w*p/1.0*1.0), 8);
    g.fillStyle='#ffd24a'; g.fillRect(x0 + w*RUN.gold/RUN.par - 1, 16, 2, 16);
    g.fillStyle='#ffffff'; g.fillRect(x0 + w - 1, 16, 2, 16);
    g.font='bold 17px ui-monospace,monospace';
    g.fillStyle = t<=RUN.gold?'#ffd24a':(t<=RUN.par?'#cfe9ff':'#ff8a8a');

  if(RUN.lastWord && (RUN.powers & P_LASTWORD)){

  if(DEV){
    g.textAlign='left'; g.fillStyle='#4a5270'; g.font='9px ui-monospace,monospace';
    g.fillText('t'+WI[I_TICK]+' ring'+ringMin+' e'+WI[I_EALIVE]+' fx'+FX.head+' h'+worldHash(), 18, SCRH-30);

}

let spineSel = 0, stars = null;
function initStars(){
  stars = [];
  let s = 99991;
  for(let i=0;i<220;i++){
    s = (s*1103515245 + 12345) & 0x7fffffff;
    stars.push({x:(s%SCRW), y:((s>>9)%SCRH), z:((s>>5)%3)+1});
  }
}
function drawStars(g){

    g.fillRect(st.x, st.y, st.z===3?2:1, st.z===3?2:1);
  }
  g.globalAlpha = 1;
}

function epilogue(){
  const out = [];
  for(const id of NODE_ORDER){
    const oc = SAVE.outcomes[id];
    if(!oc) continue;
    const o = NODES[id].outcomes.find(z=>z.id===oc);
    if(o) out.push(o.line);
  }
  return out.slice(-6);
}

  g.fillStyle='#4a5270'; g.fillText('THE LEDGER', 24, fy); fy += 14;
  for(let i=0;i<16;i++){
    if(!(SAVE.facts & (1<<i))) continue;
    g.fillStyle = '#7c88a8';
    g.fillText('· '+FACT_NAMES[i][1], 24, fy); fy += 13;
    if(fy > SCRH-90) break;
  }
  g.fillStyle='#4a5270'; g.font='9px ui-monospace,monospace';
  g.fillText('POWERS '+powerCount()+'/6   SPLINTERS '+splinterCount()+'/9', 24, SCRH-58);
  let gold = 0; for(const id of NODE_ORDER) if(SAVE.medals[id]===3) gold++;
  g.fillText('GOLD '+gold+'/13   ANCHORED NIGHTS SURVIVE REWRITES', 24, SCRH-44);

  // edges
  for(const id of ALL_NODES){
    const n = NODES[id];
    for(const e of (n.edges||[])){
      const m = NODES[e[0]];
      const live = !e[1] || (SAVE.facts & e[1]);
      g.strokeStyle = live ? '#3d5a86' : '#241c30';
      g.lineWidth = live ? 2 : 1;
      if(!live) g.setLineDash([3,6]);
      g.beginPath();
      g.moveTo(n.x, n.y);
      g.bezierCurveTo((n.x+m.x)/2, n.y, (n.x+m.x)/2, m.y, m.x, m.y);
      g.stroke(); g.setLineDash([]);
    }
  }
  // nodes
  for(let i=0;i<ALL_NODES.length;i++){
    const id = ALL_NODES[i], n = NODES[id];
    const open = nodeOpen(id), done = SAVE.cleared[id], med = SAVE.medals[id]||0;
    const sel = i === spineSel;
    const r = n.frac ? 15 : 19;
    g.save(); g.translate(n.x, n.y);
    if(n.frac) g.rotate(Math.PI/4);
    g.beginPath();
    if(n.frac) g.rect(-r,-r,r*2,r*2);
    else { for(let k=0;k<6;k++){ const a=k/6*6.283; const px=Math.cos(a)*r, py=Math.sin(a)*r;
      k?g.lineTo(px,py):g.moveTo(px,py);} g.closePath(); }
    g.fillStyle = !open ? '#120c1c' : done ? (n.frac?'#3a2a08':'#152840') : '#1c1430';
    g.fill();

function factName(mask){
  for(let i=0;i<16;i++) if(mask & (1<<i)) return FACT_NAMES[i][1];
  return '—';
}
function wrapText(g, text, x, y, w, lh){
  const words = String(text).split(' ');
  let line = '';
  for(const wd of words){
    if(g.measureText(line+wd).width > w){ g.fillText(line, x, y); y += lh; line = ''; }
    line += wd+' ';
  }
  g.fillText(line, x, y);
  return y;
}

// ══════════════════════════ 24. MEDAL CARD & CASCADE ═══════════════════════
const thumbCache = {};
function thumbGrid(id){
  if(thumbCache[id]) return thumbCache[id];
  const r = ROOMS[id]; if(!r) return null;
  const g = new Int8Array(GW*GH);
  for(let x=0;x<GW;x++){ g[x]=T_SOLID; g[(GH-1)*GW+x]=T_SOLID; }
  for(let y=1;y<GH-1;y++){
    const s = r.rows[y-1]||'';
    g[y*GW]=T_SOLID; g[y*GW+GW-1]=T_SOLID;
    for(let x=1;x<GW-1;x++){
      const c = s[x]||'.';
      g[y*GW+x] = c==='#'?T_SOLID : c==='='?T_ONEWAY : c==='%'?T_BREAK : c==='D'?T_DOOR : T_EMPTY;
    }
  }
  return (thumbCache[id] = g);
}
// Four downstream arenas, redrawn with your change inside them. A picture,
// never a diff list — this is the whole legibility of the fate layer.
function drawThumb(g, id, x, y, w, h, lit){
  const grid = thumbGrid(id); if(!grid) return;
  const E = ERAS[ROOMS[id].era];
  const sx = w/GW, sy = h/GH;
  g.fillStyle = E.bg; g.fillRect(x,y,w,h);
  for(let ty=0;ty<GH;ty++) for(let tx=0;tx<GW;tx++){
    const t = grid[ty*GW+tx]; if(!t) continue;
    g.fillStyle = t===T_ONEWAY ? E.acc : E.mid;
    g.fillRect(x+tx*sx, y+ty*sy, Math.ceil(sx), Math.ceil(sy));
  }
  g.strokeStyle = lit ? E.acc : '#2a2038'; g.lineWidth = lit?2:1;
  g.strokeRect(x+.5, y+.5, w-1, h-1);
  g.fillStyle = lit ? '#dfe8ff' : '#4a5270';
  g.font='8px ui-monospace,monospace'; g.textAlign='center';
  g.fillText(NODES[id] ? (NODES[id].frac?'FRACTURE':NODES[id].t) : id, x+w/2, y+h+11);
}

// THE REWRITE — 1.6 s, and it must be a picture.
function drawCascade(dtms){
  const c = cascade; c.t += dtms;
  const g = ctx;
  drawSpine();
  g.fillStyle='rgba(3,2,8,.72)'; g.fillRect(0,0,SCRW,SCRH);
  const n = NODES[c.node];
  const p = Math.min(1, c.t/1600);

  // 0.00 the causality wave leaves the changed node
  const wave = p*1400;
  g.strokeStyle='#ffffff'; g.globalAlpha=Math.max(0,.8-p);
  g.lineWidth=3; g.beginPath(); g.arc(n.x, n.y, wave, 0, 6.283); g.stroke(); g.globalAlpha=1;

  // 0.25 shattered nodes go to static
  if(c.t > 250) for(const id of c.dropped){
    const m = NODES[id];
    for(let k=0;k<26;k++){
      g.fillStyle = (k%2) ? '#ffffff' : '#3a3450';
      g.globalAlpha=.6;
      g.fillRect(m.x-22+rngFx()*44, m.y-22+rngFx()*44, 4, 3);
    }
    g.globalAlpha=1;
    g.fillStyle='#6a5a80'; g.font='8px ui-monospace,monospace'; g.textAlign='center';
    g.fillText('UNWRITTEN', m.x, m.y+42);
  }
  // 0.50 new edges draw themselves like a plotter pen
  if(c.t > 500) for(const id of ALL_NODES){
    const a = NODES[id];
    for(const e of (a.edges||[])){
      if(!e[1]) continue;
      const wasLive = (c.before & e[1]), isLive = (c.after & e[1]);
      if(!isLive || wasLive) continue;
      const b = NODES[e[0]];
      g.strokeStyle='#ffe14a'; g.lineWidth=3;
      g.setLineDash([1400,1400]);
      g.lineDashOffset = 1400 - Math.min(1400, (c.t-500)*1.4);
      g.beginPath(); g.moveTo(a.x,a.y);
      g.bezierCurveTo((a.x+b.x)/2, a.y, (a.x+b.x)/2, b.y, b.x, b.y);
      g.stroke(); g.setLineDash([]); g.lineDashOffset=0;
    }
  }
  // 0.70 the portrait swaps a part with a spark
  g.fillStyle='#0a0710'; g.fillRect(0,0,360,SCRH);
  drawPortrait(g, 178, 150, 0.86, c.t > 700 ? c.after : c.before);
  if(c.t > 700 && c.t < 1000){
    g.fillStyle='#ffffff'; g.globalAlpha=1-(c.t-700)/300;
    for(let k=0;k<8;k++) g.fillRect(210+rngFx()*40, 190+rngFx()*90, 4, 4);
    g.globalAlpha=1;
  }
  // 0.95 the SPINE STRIP — downstream arenas redrawing with your change in them
  if(c.t > 950){
    const down = downstreamOf(c.node).slice(0,4);
    g.fillStyle='rgba(4,3,10,.9)'; g.fillRect(400, 40, 840, 100);
    for(let i=0;i<down.length;i++){
      const lit = c.t > 950 + i*120;
      drawThumb(g, down[i], 424+i*205, 52, 168, 62, lit);
    }
    g.fillStyle='#4a5270'; g.font='9px ui-monospace,monospace'; g.textAlign='left';
    g.fillText('DOWNSTREAM', 410, 52);
  }
  // 1.30 the epilogue line types itself
  if(c.t > 1300){
    g.textAlign='center'; g.fillStyle='#8fd9ff'; g.font='13px ui-monospace,monospace';
    const k = Math.floor((c.t-1300)/22);
    g.fillText(c.line.slice(0,k), 820, SCRH-70);
  }
  g.textAlign='center'; g.fillStyle='#4a5270'; g.font='10px ui-monospace,monospace';
  if(c.t > 500) g.fillText('ANY KEY', 820, SCRH-24);
  if(c.t > 4000) closeCascade();
}
function closeCascade(){
  cascade = null; MODE = 'spine';
  if(PARK.active){ if(unparkRoom()){ MODE = 'play'; } }
}
function downstreamOf(id){
  const seen = {}, out = [], q = [id];
  while(q.length){
    const cur = q.shift();
    for(const e of (NODES[cur].edges||[])){
      if(seen[e[0]]) continue;
      seen[e[0]] = 1; out.push(e[0]); q.push(e[0]);
    }
    if(out.length > 6) break;
  }
  return out;
}

// Everything synthesised. Nothing loads.
let AC = null, master = null, musicGain = null, musicTimer = null, curEraName = '';
let muted = SMOKE;
function audioInit(){
  if(AC || muted) return;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = 0.16; musicGain.connect(master);
  }catch(e){ muted = true; }
}
function tone(freq, dur, type, vol, when, slide){
  if(!AC || muted) return;
  const t = (when||AC.currentTime);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type||'square'; o.frequency.setValueAtTime(freq, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide), t+dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol||0.2, t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0008, t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur, vol, hp){
  if(!AC || muted) return;
  const n = Math.floor(AC.sampleRate*dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
  const s = AC.createBufferSource(); s.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = hp?'highpass':'lowpass'; f.frequency.value = hp||1200;
  const g = AC.createGain(); g.gain.value = vol||0.2;
  s.connect(f); f.connect(g); g.connect(master); s.start();
}

const ERA_MUSIC = {
  ASH  :{bpm:96,  root:55.00, scale:[0,3,5,7,10], hat:false},
  WIRE :{bpm:104, root:65.41, scale:[0,2,3,7,10], hat:true},
  GLASS:{bpm:112, root:82.41, scale:[0,2,5,7,9],  hat:true},
  SPINE:{bpm:120, root:92.50, scale:[0,1,5,6,10], hat:true},
  ZERO :{bpm:128, root:55.00, scale:[0,1,3,6,10], hat:true},
};
let musStep = 0;
function musicEra(name){
  if(muted) return;
  audioInit();
  if(!AC) return;
  if(curEraName === name && musicTimer) return;
  curEraName = name;
  if(musicTimer) clearInterval(musicTimer);
  const M = ERA_MUSIC[name] || ERA_MUSIC.SPINE;
  const spb = 60/M.bpm/2;
  musStep = 0;
  musicTimer = setInterval(()=>{
    if(!AC || muted || AC.state !== 'running') return;
    const t = AC.currentTime + 0.06, s = musStep % 16;
    const deg = M.scale[(musStep*3) % M.scale.length];
    if(s % 4 === 0){
      const o = AC.createOscillator(), g = AC.createGain();
      o.type='sine'; o.frequency.value = M.root;
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.5,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0008, t+spb*2);
      o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+spb*2.1);
    }
    if(s % 2 === 1){
      const f = M.root*4*Math.pow(2, deg/12);
      const o = AC.createOscillator(), g = AC.createGain();
      o.type='triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.22,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0008, t+spb*0.9);
      o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+spb);
    }
    if(M.hat && s % 2 === 0){
      const n = AC.createBufferSource(), len = Math.floor(AC.sampleRate*0.03);
      const buf = AC.createBuffer(1,len,AC.sampleRate), d = buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
      n.buffer = buf;
      const hp = AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6000;
      const g = AC.createGain(); g.gain.value=0.10;
      n.connect(hp); hp.connect(g); g.connect(musicGain); n.start(t);
    }
    musStep++;
  }, spb*1000);
}
