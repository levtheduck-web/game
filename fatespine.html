// ══════════════════════════ 30. SELF-TESTS (#smoke) ════════════════════════
// What this suite deliberately does NOT do: assert that a hand-recorded tape
// still clears its room. That test is circular — the tape cannot exist until
// the physics are frozen, and every tile nudge invalidates all of them at
// once, so it would go red on unrelated commits until somebody deleted it.
// Instead it asserts the things automation can actually prove: bit-exact
// rewind, ring wraparound, echo fidelity, fact-graph closure, retraction
// fanout, and a conservative platformer flood from every spawn to every exit.
function runSmoke(){
  const out = [], fail = [], groups = {};
  let group = 'boot';
  const G = n => { group = n; if(!groups[n]) groups[n] = {p:0,f:0}; };
  const ok = (name, cond, extra) => {
    (cond ? out : fail).push((cond?'PASS  ':'FAIL  ')+'['+group+'] '+name+(extra?'  ('+extra+')':''));
    groups[group][cond?'p':'f']++;
  };
  const t0 = (typeof performance!=='undefined'?performance.now():0);

  // a deterministic scripted controller — no Math.random anywhere near it
  function script(seed){
    let s = seed|0;
    return t => {
      s = (Math.imul(s, 1103515245) + 12345) & 0x7fffffff;
      const r = s >>> 8;
      let b = 0;
      if(r & 1) b |= BTN_R;
      if((r>>1) & 1) b |= BTN_L;
      if((r>>2) % 7 === 0) b |= BTN_JUMP;
      if((r>>4) % 23 === 0) b |= BTN_DASH;
      if((r>>6) % 11 === 0) b |= BTN_FIRE;
      return {btn:b, aim:((r>>8)%628)/100};
    };
  }
  function runScript(id, ticks, seed, sample){
    loadRoom(id); runDeaths = 0; rewindE = -1; nextBuf = 0;
    const f = script(seed), hashes = [];
    for(let t=0;t<ticks;t++){
      const i = f(t);
      tapeWrite(TAPE, 0, WI[I_TICK], i.btn, i.aim, 0);
      step(i.btn, tapeAim(TAPE,0,WI[I_TICK]), 0);
      ringRec();
      if(WI[I_HP] <= 0){ WI[I_HP] = 3; WF[PL+A_IFR] = 30; }
      if(sample && t % sample === 0) hashes.push(worldHash());
    }
    return hashes;
  }

  try {
  // ── G1 DETERMINISM ──────────────────────────────────────────────────────
  G('determinism');
  const a1 = runScript('n4', 900, 20260815, 50);
  const a2 = runScript('n4', 900, 20260815, 50);
  ok('900 scripted ticks hash identically', a1.join(',') === a2.join(','), a1.length+' samples');
  const a3 = runScript('n4', 900, 111, 50);
  ok('a different script diverges', a3.join(',') !== a1.join(','));
  let nan = false;
  for(let i=0;i<WF_N;i++) if(!isFinite(WF[i])) nan = true;
  ok('no NaN or Infinity anywhere in the world', !nan);
  ok('rngSim lives inside the snapshot', WI[I_SEED] !== 0);

  // ── G2 REWIND ROUND-TRIP ────────────────────────────────────────────────
  G('rewind');
  loadRoom('n4'); nextBuf = 0;
  const f2 = script(777); const marks = {};
  for(let t=0;t<300;t++){
    const i = f2(t);
    tapeWrite(TAPE,0,WI[I_TICK],i.btn,i.aim,0);
    step(i.btn, tapeAim(TAPE,0,WI[I_TICK]), 0);
    ringRec();
    marks[WI[I_TICK]] = worldHash();
  }
  const h300 = worldHash();
  ringRestore(120);
  ok('restoring tick 120 is bit-exact', worldHash() === marks[120], 'memcpy, not re-sim');
  ok('the tick counter came back with it', WI[I_TICK] === 120);
  let same = true;
  for(let t=120;t<300;t++){

  function flood(grid, sx, sy){
    const key = (x,y,j,h)=>((y*GW+x)*5+j)*8+h;
    const solid = (x,y)=>{
      if(x<0||y<0||x>=GW||y>=GH) return true;
      const t = grid[y*GW+x];
      return t===T_SOLID||t===T_BREAK;      // doors open; breakables need a slip
    };
    const stand = (x,y)=>{
      const b = grid[(y+1)*GW+x];
      return solid(x,y+1) || b===T_ONEWAY;
    };
    const seenS = new Uint8Array(GW*GH*5*8), reach = new Uint8Array(GW*GH);
    const q = [[sx,sy,4,6]];
    while(q.length){
      const [x,y,j,h] = q.pop();
      if(solid(x,y)) continue;
      const k = key(x,y,j,h);
      if(seenS[k]) continue;
      seenS[k] = 1; reach[y*GW+x] = 1;
      const grounded = stand(x,y);
      const nj = grounded ? 4 : j, nh = grounded ? 6 : h;
      for(const dx of [-1,1]) if(!solid(x+dx,y) && (grounded || nh>0))
        q.push([x+dx, y, nj, grounded?6:nh-1]);
      if(nj > 0 && !solid(x,y-1)) q.push([x, y-1, nj-1, nh]);
      if(!solid(x,y+1) && grid[(y+1)*GW+x] !== T_ONEWAY) q.push([x, y+1, 0, nh]);
      else if(grid[(y+1)*GW+x] === T_ONEWAY && !grounded) q.push([x, y+1, 0, nh]);
    }
    return reach;
  }

  // ── THE PRESS, played rather than asserted ────────────────────────────
  function pressPos(){
    for(let i=0;i<MAXP;i++) if(WI[PRI+i*PI_N+PI_TYPE] === PR_PRESS)
      return {x:WF[PR+i*PR_N+P_X], y:WF[PR+i*PR_N+P_Y], i};
    return null;
  }
  startNode('n5'); nextBuf = 0;
  let pp = pressPos();
  ok('THE HAND has a press in it', !!pp);
  WF[PL+A_X] = pp.x; WF[PL+A_Y] = pp.y;
  for(let t=0;t<30;t++){
    const b = t >= 10 ? BTN_ACT : 0;
    tapeWrite(TAPE,0,WI[I_TICK],b,0,0); step(b,0,0); ringRec();
  }
  ok('grabbing the key opens the way out', WI[I_DOOR] === 1);
  ok('doing it yourself costs you the arm', WI[I_WINDOW] === 0);
  ok('and the ram actually lands on you', WI[I_DMG] >= 1, 'dmg '+WI[I_DMG]);
  ok('which is the default outcome, not a fail state',
     NODES['n5'].outcomes.find(o=>o.test({exit:true,window:WI[I_WINDOW]})).id === 'ARM_TAKEN');
  startNode('n5'); nextBuf = 0;
  pp = pressPos();
  WF[PL+A_X] = pp.x; WF[PL+A_Y] = pp.y;
  for(let t=0;t<24;t++){
    const b = t >= 10 ? BTN_ACT : 0;
    tapeWrite(TAPE,0,WI[I_TICK],b,0,0); step(b,0,0); ringRec();
  }
  ringRestore(4);                                   // scrub back before the grab
  ok('the rewind un-grabs the key', WI[I_DOOR] === 0 && WI[I_WINDOW] === 0);
  ok('a fork leaves your past self walking into the press', makeEcho(4, 24));
  WF[PL+A_X] = pp.x - 260; WF[PL+A_Y] = pp.y;       // and you get clear
  for(let t=0;t<40;t++){ tapeWrite(TAPE,0,WI[I_TICK],0,0,0); step(0,0,0); ringRec(); }
  ok('the echo grabs the key for you', WI[I_DOOR] === 1);
  ok('inside the eighteen-tick window', WI[I_WINDOW] > 0 && WI[I_WINDOW] <= 18, 'window '+WI[I_WINDOW]);
  ok('YOU KEEP THE HAND',
     NODES['n5'].outcomes.find(o=>o.test({exit:true,window:WI[I_WINDOW]})).id === 'HAND_SAVED');
  ok('and it was the echo that paid for it', WI[GSI+G_ALIVE] !== 1 && WI[I_DMG] === 0);

  startNode('n10');
  for(let k=0;k<40;k++) simTick();
  const tickBefore = WI[I_TICK];
  parkRoom();
  startNode('n2'); for(let k=0;k<10;k++) simTick();
  ok('you really did leave the room', roomId === 'n2');
  unparkRoom();
  ok('LAST WORD puts you back in the exact frame', roomId === 'n10' && WI[I_TICK] === tickBefore);
  ok('and it costs you your history', WF[F_CHRONO] === 0 && ringMin === WI[I_TICK]);
  SAVE = keepSave2;
  medalCard = null; cascade = null; PARK.active = false; MODE = 'spine';

  } catch(err){
    fail.push('FAIL  ['+group+'] threw: '+(err && err.message)+'\n'+(err && err.stack || ''));
    groups[group] = groups[group] || {p:0,f:0}; groups[group].f++;
  }

  const total = out.length + fail.length;
  const head = (fail.length ? 'SMOKE FAIL ' : 'SMOKE PASS ') + out.length + '/' + total;
  document.title = head;
  let table = '';
  for(const k in groups) table += '  '+k.padEnd(14)+String(groups[k].p).padStart(4)+' pass'+
    (groups[k].f?('   '+groups[k].f+' FAIL'):'')+'\n';
  const ms = ((typeof performance!=='undefined'?performance.now():0) - t0).toFixed(0);
  const pre = document.createElement('pre');
  pre.id = 'smokeout';
  pre.textContent = head + '   ('+ms+' ms)\n\n' + table + '\n' + fail.concat(out).join('\n');
  document.body.appendChild(pre);
  window.__SMOKE__ = {pass:out.length, fail:fail.length, groups, log:fail.concat(out)};
  console.log(fail.length ? 'SMOKE FAIL' : 'SMOKE PASS');
}

if(DEV) window.__FS = {
  WF, WI, keys, get MODE(){return MODE;}, set MODE(v){MODE=v;},
  get SAVE(){return SAVE;}, set SAVE(v){SAVE=v;},
  get RUN(){return RUN;}, get roomId(){return roomId;},
  startNode, finishNode, closeMedalCard, step, simTick, measure, makeEcho,
  ringRestore, ringRec, rebuildFacts, nodeOpen, medalFor, parkRoom, unparkRoom,
  worldHash, loadRoom, PL, GH0, GSI, GS_N, AC_N, A_X, A_Y, I_EXIT, I_CARRY
};

// ══════════════════════════ GO ═════════════════════════════════════════════
if(SMOKE) runSmoke(); else boot();
</script>
