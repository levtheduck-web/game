"use strict";
/* ============================================================================
   FATESPINE — rewind the night, then rewrite the life.
   ----------------------------------------------------------------------------
   Three nested loops, all the same verb at different zoom:
     THE SECOND — hold R and time scrubs backwards; let go and the body you
                  abandoned stands up as an ECHO replaying your input tape.
     THE NIGHT  — one locked screen, one outcome, measured by what you did.
     THE LIFE   — outcomes write FACTS, facts redraw the Spine, and the edges
                  they draw are the only doors to the five power chambers.

   Determinism contract (asserted by #smoke, break any line and rewind lies):
     * DT is the literal 1/60. step() never reads Date/performance/Math.random,
       never touches the DOM, and never keeps a float alive between ticks.
     * The whole world is two flat typed arrays, WF (Float64) + WI (Int32).
       If step() reads it, it lives in there. No exceptions.
     * One snapshot per tick into a flat ring; rewind is a memcpy, never a
       re-simulation, so scrubbing is exact by construction.
     * Particles are never stored — they are an analytic function of
       (tick - spawnTick, seed), so they rewind for free.

   Hashes:  #smoke self-tests · #dev debug overlay · #n7 / #f3 jump to a room
   ========================================================================== */

const HASH  = location.hash.slice(1).toLowerCase();
const SMOKE = HASH.indexOf('smoke') !== -1;
const DEV   = HASH.indexOf('dev')   !== -1 || SMOKE;

// ══════════════════════════ 1. WORLD STATE LAYOUT ══════════════════════════
// Everything the simulation knows lives at a fixed offset in WF/WI. Named
// constants only — a magic number here is a bug you find three days later.

const DT = 1/60, TW = 32, GW = 40, GH = 23;
const SCRW = GW*TW, SCRH = GH*TW;                      // 1280 x 736, locked

const MAXG = 6, MAXE = 32, MAXB = 192, MAXP = 28;      // ghosts (4 yours + 2 hostile)

// -- float block offsets --
const GF = 0,                    GF_N = 24;
const PL = GF + GF_N,            AC_N = 24;            // one ACTOR = 24 floats
const GH0 = PL + AC_N;                                 // ghost i at GH0 + i*AC_N
const EN = GH0 + MAXG*AC_N,      EN_N = 14;
const BU = EN + MAXE*EN_N,       BU_N = 7;
const PR = BU + MAXB*BU_N,       PR_N = 8;
const WF_N = PR + MAXP*PR_N;

// global floats
const F_CHRONO=0, F_DOORT=1, F_PLATEH=2, F_STASX=3, F_STASY=4, F_STAST=5,
      F_SLIPT=6, F_TIME=7, F_R0=8, F_R1=9, F_R2=10, F_R3=11, F_R4=12,
      F_R5=13, F_R6=14, F_R7=15, F_K0=16;   // F_K0..F_K7 = room scratch ring

// actor floats (player and every ghost share this layout — one stepActor)
const A_X=0, A_Y=1, A_VX=2, A_VY=3, A_FACE=4, A_DASHT=5, A_DASHCD=6, A_COY=7,
      A_JBUF=8, A_IFR=9, A_FIRECD=10, A_RELOAD=11, A_BLADET=12, A_BLADECD=13,
      A_STASCD=14, A_SWAPCD=15, A_WALL=16, A_FLASH=17, A_GRND=18, A_AIM=19,
      A_SLIPCD=20, A_SQUASH=21, A_PHASE=22, A_HP=23;

// enemy floats
const E_X=0, E_Y=1, E_VX=2, E_VY=3, E_HP=4, E_CD=5, E_T=6, E_AIM=7,
      E_AX=8, E_AY=9, E_FLASH=10, E_PH=11, E_TX=12, E_TY=13;

// bullet floats / prop floats
const B_X=0, B_Y=1, B_VX=2, B_VY=3, B_LIFE=4, B_R=5, B_SP=6;
const P_X=0, P_Y=1, P_VX=2, P_VY=3, P_T=4, P_VAL=5, P_W=6, P_H=7;

// -- int block offsets --
const GI = 0,                    GI_N = 24;
const PLI = GI + GI_N,           AI_N = 4;
const GSI = PLI + AI_N,          GS_N = 6;
const GAI = GSI + MAXG*GS_N;                     // each echo gets its own AI_N block
const ENI = GAI + MAXG*AI_N,     EI_N = 4;
const BUI = ENI + MAXE*EI_N,     BI_N = 3;
const PRI = BUI + MAXB*BI_N,     PI_N = 3;
const WI_N = PRI + MAXP*PI_N;

const I_TICK=0, I_SEED=1, I_HP=2, I_KILLS=3, I_DMG=4, I_FORKS=5, I_AMMO=6,
      I_EXIT=7, I_GCOUNT=8, I_EALIVE=9, I_BCUR=10, I_CARRY=11, I_SPLINT=12,
      I_REWINDS=13, I_WINDOW=14, I_FORKTICK=15, I_DOOR=16, I_LAYER=17,
      I_PHASE=18, I_BOSSDOWN=19, I_PLATEF=20, I_HOLD=21, I_DEATHS=22, I_MAXECHO=23;

const AI_GROUND=0, AI_STATE=1, AI_WALL=2, AI_SP=3;
const G_ALIVE=0, G_CUR=1, G_BIRTH=2, G_END=3, G_BUF=4, G_HOSTILE=5;
const N_TYPE=0, N_ALIVE=1, N_STATE=2, N_TGT=3;
const BI_ALIVE=0, BI_OWNER=1, BI_FLAG=2;
const PI_TYPE=0, PI_ALIVE=1, PI_STATE=2;

const WF = new Float64Array(WF_N);
const WI = new Int32Array(WI_N);

// ══════════════════════════ 2. THE SNAPSHOT RING ═══════════════════════════
// One flat snapshot per tick. Six seconds deep — the same six seconds as the
// chrono bar, on purpose, so the meter can never promise what the ring cannot
// deliver. Record is two .set() calls; restore is two more, and exact.

const RING_N = 360;
const RF = new Float64Array(WF_N*RING_N);
const RI = new Int32Array (WI_N*RING_N);
let ringMin = 0;                       // oldest tick still in the ring

function ringRec(){
  const t = WI[I_TICK], k = ((t % RING_N) + RING_N) % RING_N;
  RF.set(WF, k*WF_N); RI.set(WI, k*WI_N);
  if(t - ringMin >= RING_N) ringMin = t - RING_N + 1;
}
function ringRestore(t){
  const k = ((t % RING_N) + RING_N) % RING_N;
  WF.set(RF.subarray(k*WF_N, (k+1)*WF_N));
  WI.set(RI.subarray(k*WI_N, (k+1)*WI_N));
  validateGhosts();
}
function ringClear(){ ringMin = WI[I_TICK]; ringRec(); }

// ══════════════════════════ 3. INPUT TAPES ═════════════════════════════════
// 4 bytes per tick per actor. The player reads its own aim back out of the
// tape before using it, so a ghost of you moves exactly as you did — no
// "close enough", no drift.
//   b0 buttons: 0 L 1 R 2 jump 3 dash 4 fire 5 blade 6 stasis 7 interact
//   b1/b2 aim quantised to 1/1024 turn, plus swap / slip / lastword bits
//   b3 parity (always 0; #smoke leans on it)
const TAPE_MAX = 5400;                            // 90 s cap on one attempt
const TAPE  = new Uint8Array(4*TAPE_MAX);
const NBUF  = 8;                                  // ghost tape buffers
const GTAPE = new Uint8Array(4*TAPE_MAX*NBUF);
const tapeBirth = new Int32Array(NBUF).fill(-1);  // which fork owns each buffer

const BTN_L=1, BTN_R=2, BTN_JUMP=4, BTN_DASH=8, BTN_FIRE=16, BTN_BLADE=32,
      BTN_STASIS=64, BTN_ACT=128;
const X_SWAP=4, X_SLIP=8, X_LW=16;

function tapeWrite(arr, base, tick, btn, aim, ext){
  if(tick < 0 || tick >= TAPE_MAX) return;
  const q = ((Math.round(aim/(Math.PI*2)*1024) % 1024) + 1024) % 1024;
  const o = base + tick*4;
  arr[o] = btn; arr[o+1] = q & 255; arr[o+2] = ((q>>8)&3) | ext; arr[o+3] = 0;
}
function tapeBtn(arr, base, tick){
  if(tick < 0 || tick >= TAPE_MAX) return 0;
  return arr[base + tick*4];
}
function tapeAim(arr, base, tick){
  if(tick < 0 || tick >= TAPE_MAX) return 0;
  const o = base + tick*4;
  return ((arr[o+1] | ((arr[o+2]&3)<<8)) / 1024) * Math.PI*2;
}
function tapeExt(arr, base, tick){
  if(tick < 0 || tick >= TAPE_MAX) return 0;
  return arr[base + tick*4 + 2] & ~3;
}
// A ghost is only real while the buffer it was cut from still belongs to it.
function validateGhosts(){
  for(let i=0;i<MAXG;i++){
    const gi = GSI + i*GS_N;
    if(WI[gi+G_ALIVE] && WI[gi+G_HOSTILE] === 0){
      if(tapeBirth[WI[gi+G_BUF]] !== WI[gi+G_BIRTH]) WI[gi+G_ALIVE] = 0;
    }
  }
}

// ══════════════════════════ 4. RANDOMNESS ══════════════════════════════════
// rngSim lives inside the snapshot, so rewinding rewinds luck too.
// rngFx is free-running and step() must never read it.
function rngSim(){
  let x = WI[I_SEED]|0;
  x ^= x<<13; x|=0; x ^= x>>>17; x ^= x<<5; x|=0;
  WI[I_SEED] = x;
  return ((x>>>0) / 4294967296);
}
let fxSeed = 22446688;
function rngFx(){
  let x = fxSeed|0;
  x ^= x<<13; x|=0; x ^= x>>>17; x ^= x<<5; x|=0;
  fxSeed = x;
  return ((x>>>0) / 4294967296);
}
// FNV-1a over the whole world — the determinism tests compare these.
function worldHash(){
  let h = 0x811c9dc5;
  for(let i=0;i<WF_N;i++){
    const v = Math.round(WF[i]*4096);
    h ^= (v & 255);       h = Math.imul(h, 16777619);
    h ^= ((v>>8) & 255);  h = Math.imul(h, 16777619);
    h ^= ((v>>16) & 255); h = Math.imul(h, 16777619);
  }
  for(let i=0;i<WI_N;i++){
    const v = WI[i];
    h ^= (v & 255);       h = Math.imul(h, 16777619);
    h ^= ((v>>8) & 255);  h = Math.imul(h, 16777619);
    h ^= ((v>>16) & 255); h = Math.imul(h, 16777619);
  }
  return h>>>0;
}

// ══════════════════════════ 8. SAVE ════════════════════════════════════════
const SAVE_KEY = 'fatespine.v1';
const FRESH = () => ({
  v:1, facts:0, powers:P_FORK, outcomes:{}, medals:{}, best:{}, anchored:{},
  seals:{}, cleared:{}, splinters:0, fails:{}, soften:false, seen:{}, ending:null
});
let SAVE = FRESH();

function saveGame(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); }catch(e){}
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(!d || d.v !== 1) return;
    SAVE = Object.assign(FRESH(), d);
    SAVE.powers |= P_FORK;
  }catch(e){ SAVE = FRESH(); }
}

// Facts are never edited in place — they are recomputed from the outcomes you
// have actually written, in node order, dropping any node whose door has since
// closed unless GOLD anchored it. The fact set only shrinks while retracting,
// so this provably reaches a fixpoint (asserted <= 16 passes by #smoke).
function rebuildFacts(){
  const dropped = [];
  for(let pass=0; pass<16; pass++){
    let F = 0, bad = null;
    for(const id of NODE_ORDER){
      const ocId = SAVE.outcomes[id];
      if(!ocId) continue;
      if(!SAVE.anchored[id] && !nodeOpen(id, F, true)){ bad = id; break; }
      const oc = NODES[id].outcomes.find(o=>o.id===ocId);
      if(oc){ F = (F | oc.set) & ~oc.clr; }
    }
    if(bad === null){ SAVE.facts = F; return dropped; }
    dropped.push(bad);
    delete SAVE.outcomes[bad]; delete SAVE.cleared[bad];
    delete SAVE.medals[bad];   delete SAVE.best[bad];
  }
  SAVE.facts = 0;
  return dropped;
}

// Is the door to this node open, given a fact set?
// `chain` skips the "previous node cleared" test during a fact rebuild, where
// clearedness is exactly what is being recomputed.
function nodeOpen(id, F, chain){
  const n = NODES[id];
  if(!n) return false;
  if(F === undefined) F = SAVE.facts;
  if(n.frac){
    if(n.need && !(F & n.need)) return false;
    if(n.needClear && !SAVE.cleared[n.needClear]) return false;
    return true;
  }
  if(!chain) for(const a of (n.after||[])) if(!SAVE.cleared[a]) return false;
  const r = n.req;
  if(r){
    if(r.any  && !(F & r.any)) return false;
    if(r.all  && (F & r.all) !== r.all) return false;
    if(r.none && (F & r.none)) return false;
  }
  if(n.reqPow && (SAVE.powers & n.reqPow) !== n.reqPow) return false;
  return true;
}
function splinterHas(i){ return (SAVE.splinters >> i) & 1; }
function splinterCount(){ let c=0; for(let i=0;i<9;i++) if(splinterHas(i)) c++; return c; }
function powerCount(){ let c=0; for(const p of POWER_INFO) if(SAVE.powers & p.bit) c++; return c; }

// ══════════════════════════ 9. ROOM LOADING ════════════════════════════════
// Tiles never mutate. Doors are a bit in WI, the Auditor's floor swap is an
// index in WI, and breakables stay solid — they are one tile thick so PHASE
// SLIP goes through them. Nothing in the world outlives a snapshot.

const T_EMPTY=0, T_SOLID=1, T_ONEWAY=2, T_SPIKE=3, T_BREAK=4, T_DOOR=5;

const E_WATCHER=1, E_SWEEPER=2, E_TURRET=3, E_WARDEN=4, E_CENSOR=5,
      E_SCRUBBER=6, E_KESH=7, E_AUDITOR=8, E_ARCHIVIST=9, E_DOG=10, E_ALLY=11;
const ENEMY_HP = {1:2, 2:3, 3:5, 4:4, 5:3, 6:2, 7:10, 8:12, 9:42, 10:99, 11:99};

const PR_EXIT=1, PR_PLATE=2, PR_SPLINTER=3, PR_CARRY=4, PR_PRESS=5,
      PR_TRANSMIT=6, PR_JOIN=7, PR_BEAM=8, PR_LASER=9, PR_GHOSTPROP=10;

let TIL_A = new Int8Array(GW*GH), TIL_B = null;
let roomId = 'n1', room = ROOMS.n1, era = ERAS.ASH;
let BODY = {maxHp:3, dashCd:42, ammo:10, accel:1.0, coyote:6, bladeReach:56, cling:false, pips:0};
let RUN  = null;      // load-time constants for the attempt in progress

function tileIdx(tx,ty){ return ty*GW+tx; }
function layer(){ return (WI[I_LAYER] && TIL_B) ? TIL_B : TIL_A; }
function tileAt(tx,ty){
  if(tx<0||ty<0||tx>=GW||ty>=GH) return T_SOLID;
  return layer()[ty*GW+tx];
}
function solidAt(tx,ty){
  const t = tileAt(tx,ty);
  if(t===T_SOLID||t===T_BREAK) return true;
  if(t===T_DOOR) return WI[I_DOOR]===0;
  return false;
}
function onewayAt(tx,ty){ return tileAt(tx,ty)===T_ONEWAY; }
function spikeAt(tx,ty){ return tileAt(tx,ty)===T_SPIKE; }
function solidPx(x,y){ return solidAt(Math.floor(x/TW), Math.floor(y/TW)); }

// Parse the 21 interior rows into a grid, forcing the outer wall.
function parseRows(rows, sink){
  const g = new Int8Array(GW*GH);
  for(let x=0;x<GW;x++){ g[tileIdx(x,0)] = T_SOLID; g[tileIdx(x,GH-1)] = T_SOLID; }
  for(let y=1;y<GH-1;y++){
    const s = rows[y-1] || '';
    g[tileIdx(0,y)] = T_SOLID; g[tileIdx(GW-1,y)] = T_SOLID;
    for(let x=1;x<GW-1;x++){
      const c = s[x] || '.';
      let t = T_EMPTY;
      switch(c){
        case '#': t=T_SOLID;  break;
        case '=': t=T_ONEWAY; break;
        case '^': t=T_SPIKE;  break;
        case '%': t=T_BREAK;  break;
        case 'D': t=T_DOOR;   break;
        case '.': break;
        default : if(sink) sink(c, x, y);
      }
      g[tileIdx(x,y)] = t;
    }
  }
  return g;
}

// fate" feels like in the thumbs.
function computeBody(F){

    maxHp     : (F & F_MOTHER) ? 4 : 3,
    dashCd    : (F & F_HAND)   ? 34 : 42,
