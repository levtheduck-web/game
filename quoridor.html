<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>QUORIDOR — Wall Maze Duel</title>
<style>
  :root{ --blue:#3aa0ff; --red:#ff4d6d; --gold:#ffd24a; --line:#22314e; --bg:#0a1120; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ min-height:100%; background:radial-gradient(120% 90% at 50% 0%, #101b33, #060a14); color:#eaf2ff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body{ display:flex; flex-direction:column; align-items:center; padding:14px 12px 40px; }
  h1{ font-size:clamp(24px,7vw,40px); font-weight:900; letter-spacing:.02em; margin-bottom:2px;
    background:linear-gradient(90deg,var(--blue),#8fd0ff 50%,var(--red)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tagline{ color:#7f93b6; font-size:13px; margin-bottom:12px; }
  .players{ display:flex; gap:12px; width:100%; max-width:600px; margin-bottom:10px; }
  .pcard{ flex:1; background:#0e1830; border:1px solid var(--line); border-radius:14px; padding:10px 12px; position:relative; overflow:hidden;
    transition:box-shadow .2s, border-color .2s; }
  .pcard.active{ border-color:currentColor; box-shadow:0 0 0 1px currentColor, 0 8px 26px rgba(0,0,0,.4); }
  .pcard.blue{ color:var(--blue); } .pcard.red{ color:var(--red); }
  .pname{ font-weight:800; font-size:14px; display:flex; align-items:center; gap:7px; }
  .dot{ width:13px; height:13px; border-radius:50%; background:currentColor; box-shadow:0 0 10px currentColor; }
  .prow{ display:flex; justify-content:space-between; align-items:baseline; margin-top:6px; color:#cfe0ff; }
  .clock{ font-variant-numeric:tabular-nums; font-weight:900; font-size:26px; color:#eaf2ff; }
  .clock.low{ color:var(--red); }
  .walls{ font-size:13px; color:#9fb2d0; }
  .walls b{ color:#eaf2ff; font-size:16px; }
  canvas{ display:block; width:min(94vw,560px); height:auto; touch-action:none; border-radius:12px;
    background:#0c1526; box-shadow:0 20px 60px rgba(0,0,0,.5); cursor:pointer; }
  .controls{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  button{ font:inherit; font-weight:800; font-size:15px; color:#dbe8ff; background:#15233f; border:1px solid var(--line);
    border-radius:11px; padding:11px 16px; cursor:pointer; transition:transform .06s, background .15s, border-color .15s; display:flex; align-items:center; gap:7px; }
  button:active{ transform:translateY(1px); }
  button.sel{ background:linear-gradient(180deg,#2f5fb0,#244a8f); border-color:#4d84e0; color:#fff; box-shadow:0 0 18px rgba(58,160,255,.35); }
  button.ghost{ background:transparent; }
  .hint{ margin-top:10px; color:#7f93b6; font-size:13px; text-align:center; max-width:560px; line-height:1.5; }
  .overlay{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:rgba(6,10,20,.82); backdrop-filter:blur(4px); z-index:20; padding:24px; text-align:center; }
  .overlay.hidden{ display:none; }
  .overlay h2{ font-size:clamp(32px,9vw,64px); font-weight:900; }
  .overlay p{ color:#9fb2d0; margin-top:8px; font-size:16px; }
  .wallpill{ display:inline-flex; }
</style>
</head>
<body>
  <h1>QUORIDOR</h1>
  <div class="tagline">Race to the far side — build walls to trap your rival.</div>

  <div class="players">
    <div class="pcard blue active" id="card-blue">
      <div class="pname"><span class="dot"></span> YOU (Blue)</div>
      <div class="prow"><span class="walls">Walls <b id="w-blue">10</b>/10</span><span class="clock" id="c-blue">1:00</span></div>
    </div>
    <div class="pcard red" id="card-red">
      <div class="pname"><span class="dot"></span> CPU (Red)</div>
      <div class="prow"><span class="walls">Walls <b id="w-red">10</b>/10</span><span class="clock" id="c-red">1:00</span></div>
    </div>
  </div>

  <canvas id="board"></canvas>

  <div class="controls">
    <button id="btn-move" class="sel">♟ Move</button>
    <button id="btn-h">▬ Wall H</button>
    <button id="btn-v">▮ Wall V</button>
    <button id="btn-new" class="ghost">↻ New</button>
  </div>
  <div class="hint" id="hint">Your turn. Tap a highlighted square to move. Pick a wall button then tap the board to place a wall (right-click flips orientation).</div>

  <div class="overlay hidden" id="overlay">
    <h2 id="ov-title">Blue wins!</h2>
    <p id="ov-sub"></p>
    <button id="ov-btn" class="sel" style="margin-top:22px;font-size:18px;">Play again</button>
  </div>

<script>
(()=>{
const N=9;                       // 9x9 cells
const CELL=52, GAP=12, MARGIN=16;
const SIZE = MARGIN*2 + N*CELL + (N-1)*GAP;
const cv=document.getElementById('board'), ctx=cv.getContext('2d');
let DPR=Math.min(window.devicePixelRatio||1,2);
cv.width=SIZE*DPR; cv.height=SIZE*DPR; cv.style.aspectRatio='1/1';
ctx.scale(DPR,DPR);

// ---- geometry helpers ----
const cellX=c=> MARGIN + c*(CELL+GAP);
const cellY=r=> MARGIN + r*(CELL+GAP);
const key=(r,c)=> r+','+c;

// ---- game state ----
let S;
function reset(){
  S={
    blue:{r:8,c:4, goal:0, walls:10, color:'#3aa0ff'},
    red :{r:0,c:4, goal:8, walls:10, color:'#ff4d6d'},
    H:new Set(), V:new Set(),          // wall crosspoints (r,c) 0..7
    turn:'blue', mode:'move', orient:'H',
    clock:{blue:60, red:60}, over:false, winner:null,
    hoverCell:null, hoverWall:null, legal:[]
  };
  computeLegal();
  syncUI();
  document.getElementById('overlay').classList.add('hidden');
  setMode('move');
  lastTick=performance.now();
}

// ---- wall/movement rules ----
function openBetween(H,V,a,b){
  const dr=b.r-a.r, dc=b.c-a.c;
  if(dr===1&&dc===0){ const r=a.r,c=a.c; return !(H.has(key(r,c))||H.has(key(r,c-1))); }
  if(dr===-1&&dc===0){ const r=b.r,c=a.c; return !(H.has(key(r,c))||H.has(key(r,c-1))); }
  if(dc===1&&dr===0){ const r=a.r,c=a.c; return !(V.has(key(r,c))||V.has(key(r-1,c))); }
  if(dc===-1&&dr===0){ const r=a.r,c=b.c; return !(V.has(key(r,c))||V.has(key(r-1,c))); }
  return false;
}
const onBoard=(r,c)=> r>=0&&r<N&&c>=0&&c<N;

function legalMoves(H,V,me,opp){
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  const out=[];
  for(const [dr,dc] of dirs){
    const n={r:me.r+dr,c:me.c+dc};
    if(!onBoard(n.r,n.c)) continue;
    if(!openBetween(H,V,me,n)) continue;
    if(!(n.r===opp.r&&n.c===opp.c)){ out.push(n); continue; }
    // opponent adjacent -> try jump straight
    const beyond={r:n.r+dr,c:n.c+dc};
    if(onBoard(beyond.r,beyond.c)&&openBetween(H,V,n,beyond)){ out.push(beyond); }
    else { // diagonal jumps
      for(const [pr,pc] of [[dc,dr],[-dc,-dr]]){
        const side={r:n.r+pr,c:n.c+pc};
        if(onBoard(side.r,side.c)&&openBetween(H,V,n,side)) out.push(side);
      }
    }
  }
  return out;
}

// BFS distance from a pawn to its goal row (walls only, pawns ignored). -1 if blocked.
function bfsDist(H,V,start,goalRow){
  const seen=new Uint8Array(N*N); const q=[[start.r,start.c,0]]; seen[start.r*N+start.c]=1;
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  for(let i=0;i<q.length;i++){
    const [r,c,d]=q[i];
    if(r===goalRow) return d;
    for(const [dr,dc] of dirs){
      const nr=r+dr,nc=c+dc;
      if(!onBoard(nr,nc)||seen[nr*N+nc]) continue;
      if(!openBetween(H,V,{r,c},{r:nr,c:nc})) continue;
      seen[nr*N+nc]=1; q.push([nr,nc,d+1]);
    }
  }
  return -1;
}

// ---- wall placement validity ----
function wallConflicts(H,V,orient,r,c){
  if(r<0||r>N-2||c<0||c>N-2) return true;
  if(orient==='H'){
    if(H.has(key(r,c))||H.has(key(r,c-1))||H.has(key(r,c+1))) return true;
    if(V.has(key(r,c))) return true;
  }else{
    if(V.has(key(r,c))||V.has(key(r-1,c))||V.has(key(r+1,c))) return true;
    if(H.has(key(r,c))) return true;
  }
  return false;
}
function wallLegal(H,V,orient,r,c){
  if(wallConflicts(H,V,orient,r,c)) return false;
  const H2=new Set(H), V2=new Set(V);
  (orient==='H'?H2:V2).add(key(r,c));
  return bfsDist(H2,V2,S.blue,S.blue.goal)>=0 && bfsDist(H2,V2,S.red,S.red.goal)>=0;
}

// ---- turn flow ----
function computeLegal(){
  const me=S[S.turn], opp=S[S.turn==='blue'?'red':'blue'];
  S.legal = (S.turn==='blue'&&S.mode==='move')? legalMoves(S.H,S.V,me,opp) : [];
}
function endTurnCheck(){
  if(S.blue.r===S.blue.goal){ win('blue'); return true; }
  if(S.red.r===S.red.goal){ win('red'); return true; }
  return false;
}
function win(who){
  S.over=true; S.winner=who;
  const ov=document.getElementById('overlay');
  document.getElementById('ov-title').textContent = who==='blue'?'You win! 🏆':'CPU wins';
  document.getElementById('ov-title').style.color = who==='blue'?'var(--blue)':'var(--red)';
  document.getElementById('ov-sub').textContent = who==='blue'?'You reached the top row first.':'Red reached the bottom row first.';
  ov.classList.remove('hidden');
  draw();
}
function switchTurn(){
  S.turn = S.turn==='blue'?'red':'blue';
  computeLegal(); syncUI();
  if(S.turn==='red' && !S.over){ setTimeout(aiMove, 480); }
}

// ---- player actions ----
function doMove(r,c){
  const me=S[S.turn]; me.r=r; me.c=c;
  if(endTurnCheck()) { draw(); return; }
  switchTurn(); draw();
}
function doWall(orient,r,c){
  if(!wallLegal(S.H,S.V,orient,r,c)) return false;
  (orient==='H'?S.H:S.V).add(key(r,c));
  S[S.turn].walls--;
  setMode('move');
  if(endTurnCheck()){ draw(); return true; }
  switchTurn(); draw(); return true;
}

// ---- AI (red) ----
function aiMove(){
  if(S.over) return;
  const H=S.H, V=S.V;
  const myDist = bfsDist(H,V,S.red,S.red.goal);
  const oppDist= bfsDist(H,V,S.blue,S.blue.goal);

  // best pawn move for red (minimize its own distance-to-goal)
  const moves=legalMoves(H,V,S.red,S.blue);
  let bestMove=null, bestMD=Infinity;
  for(const m of moves){
    const d=bfsDist(H,V,{r:m.r,c:m.c},S.red.goal);
    const dd=(d<0?99:d) - (m.r>S.red.r?0.01:0); // tiny bias toward advancing down
    if(dd<bestMD){ bestMD=dd; bestMove=m; }
  }

  // consider placing a wall if red has walls and isn't clearly ahead
  let bestWall=null, bestScore=0;
  const advantage = oppDist - myDist; // positive => red is closer/winning
  if(S.red.walls>0 && advantage < 3){
    for(let r=0;r<N-1;r++) for(let c=0;c<N-1;c++){
      for(const orient of ['H','V']){
        if(!wallLegal(H,V,orient,r,c)) continue;
        const H2=new Set(H),V2=new Set(V); (orient==='H'?H2:V2).add(key(r,c));
        const newOpp=bfsDist(H2,V2,S.blue,S.blue.goal);
        const newMy =bfsDist(H2,V2,S.red,S.red.goal);
        if(newOpp<0||newMy<0) continue;
        // reward slowing opponent, penalize hurting self
        const score=(newOpp-oppDist)*1.0 - (newMy-myDist)*1.15;
        if(score>bestScore){ bestScore=score; bestWall={orient,r,c}; }
      }
    }
  }

  // decision: wall if it meaningfully helps, else move
  const wallWorth = bestWall && bestScore>=1 && (oppDist<=myDist+1 || bestScore>=2);
  if(wallWorth){
    (bestWall.orient==='H'?S.H:S.V).add(key(bestWall.r,bestWall.c));
    S.red.walls--;
    if(endTurnCheck()){ draw(); return; }
    switchTurn(); draw();
  } else if(bestMove){
    S.red.r=bestMove.r; S.red.c=bestMove.c;
    if(endTurnCheck()){ draw(); return; }
    switchTurn(); draw();
  } else {
    switchTurn(); draw();
  }
}

// ---- input ----
function toLocal(e){
  const rect=cv.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(SIZE/rect.width);
  const y=(e.clientY-rect.top)*(SIZE/rect.height);
  return {x,y};
}
function cellAt(x,y){
  const c=Math.floor((x-MARGIN)/(CELL+GAP)), r=Math.floor((y-MARGIN)/(CELL+GAP));
  if(!onBoard(r,c)) return null;
  // ensure inside cell (not in gap)
  if(x> cellX(c)+CELL || y> cellY(r)+CELL) return null;
  return {r,c};
}
function wallAt(x,y,orient){
  const fr=(y-MARGIN)/(CELL+GAP), fc=(x-MARGIN)/(CELL+GAP);
  let r,c;
  if(orient==='H'){ r=Math.round(fr)-1; c=Math.floor(fc); }
  else { c=Math.round(fc)-1; r=Math.floor(fr); }
  r=Math.max(0,Math.min(N-2,r)); c=Math.max(0,Math.min(N-2,c));
  return {orient,r,c};
}

cv.addEventListener('pointermove',e=>{
  if(S.over||S.turn!=='blue') return;
  const {x,y}=toLocal(e);
  if(S.mode==='move'){ S.hoverCell=cellAt(x,y); S.hoverWall=null; }
  else { S.hoverWall=wallAt(x,y,S.orient); S.hoverCell=null; }
  draw();
});
cv.addEventListener('pointerleave',()=>{ S.hoverCell=null; S.hoverWall=null; draw(); });
cv.addEventListener('pointerdown',e=>{
  if(S.over||S.turn!=='blue') return;
  const {x,y}=toLocal(e);
  if(S.mode==='move'){
    const cell=cellAt(x,y); if(!cell) return;
    if(S.legal.some(m=>m.r===cell.r&&m.c===cell.c)) doMove(cell.r,cell.c);
  } else {
    if(S.blue.walls<=0) return;
    const w=wallAt(x,y,S.orient);
    doWall(w.orient,w.r,w.c);
  }
});
cv.addEventListener('contextmenu',e=>{
  e.preventDefault();
  if(S.mode!=='move'){ setMode(S.orient==='H'?'wallV':'wallH'); const {x,y}=toLocal(e); S.hoverWall=wallAt(x,y,S.orient); draw(); }
});

// ---- controls ----
function setMode(m){
  if(m==='move'){ S.mode='move'; }
  else if(m==='wallH'){ S.mode='wall'; S.orient='H'; }
  else if(m==='wallV'){ S.mode='wall'; S.orient='V'; }
  document.getElementById('btn-move').classList.toggle('sel', S.mode==='move');
  document.getElementById('btn-h').classList.toggle('sel', S.mode==='wall'&&S.orient==='H');
  document.getElementById('btn-v').classList.toggle('sel', S.mode==='wall'&&S.orient==='V');
  S.hoverCell=null; S.hoverWall=null;
  computeLegal(); draw();
}
document.getElementById('btn-move').onclick=()=>setMode('move');
document.getElementById('btn-h').onclick=()=>{ if(S.blue.walls>0) setMode('wallH'); };
document.getElementById('btn-v').onclick=()=>{ if(S.blue.walls>0) setMode('wallV'); };
document.getElementById('btn-new').onclick=reset;
document.getElementById('ov-btn').onclick=reset;

// ---- UI sync ----
function fmt(t){ t=Math.max(0,t); const s=Math.floor(t); return (s>=60?'1:00':'0:'+String(s).padStart(2,'0')); }
function syncUI(){
  document.getElementById('w-blue').textContent=S.blue.walls;
  document.getElementById('w-red').textContent=S.red.walls;
  document.getElementById('card-blue').classList.toggle('active', S.turn==='blue'&&!S.over);
  document.getElementById('card-red').classList.toggle('active', S.turn==='red'&&!S.over);
  const hint=document.getElementById('hint');
  if(S.over) hint.textContent = S.winner==='blue'?'You win! Press New to play again.':'CPU wins. Press New to play again.';
  else if(S.turn==='red') hint.textContent='CPU is thinking…';
  else if(S.mode==='move') hint.textContent='Your turn — tap a highlighted square to move.';
  else hint.textContent='Placing '+(S.orient==='H'?'horizontal':'vertical')+' wall — tap the board (right-click flips).';
  document.getElementById('btn-h').style.opacity=S.blue.walls>0?1:.4;
  document.getElementById('btn-v').style.opacity=S.blue.walls>0?1:.4;
}

// ---- clock ----
let lastTick=performance.now();
function tick(now){
  const dt=(now-lastTick)/1000; lastTick=now;
  if(S && !S.over){
    S.clock[S.turn]-=dt;
    if(S.clock[S.turn]<=0){ S.clock[S.turn]=0; win(S.turn==='blue'?'red':'blue');
      document.getElementById('ov-sub').textContent=(S.turn==='blue'?'Your':'Red\'s')+' clock ran out.'; }
    const cb=document.getElementById('c-blue'), cr=document.getElementById('c-red');
    cb.textContent=fmt(S.clock.blue); cr.textContent=fmt(S.clock.red);
    cb.classList.toggle('low',S.clock.blue<10); cr.classList.toggle('low',S.clock.red<10);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---- rendering ----
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function draw(){
  ctx.clearRect(0,0,SIZE,SIZE);
  // goal zones
  ctx.fillStyle='rgba(58,160,255,.07)'; ctx.fillRect(0,0,SIZE,cellY(0)+CELL*0+MARGIN); // top (blue goal)
  ctx.fillStyle='rgba(58,160,255,.09)'; ctx.fillRect(MARGIN,cellY(0),N*CELL+(N-1)*GAP,CELL);
  ctx.fillStyle='rgba(255,77,109,.09)'; ctx.fillRect(MARGIN,cellY(8),N*CELL+(N-1)*GAP,CELL);
  // cells
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    roundRect(cellX(c),cellY(r),CELL,CELL,8);
    ctx.fillStyle='#14213c'; ctx.fill();
    ctx.strokeStyle='rgba(120,150,200,.08)'; ctx.lineWidth=1; ctx.stroke();
  }
  // legal move hints
  if(S.turn==='blue'&&S.mode==='move'&&!S.over){
    for(const m of S.legal){
      ctx.beginPath(); ctx.arc(cellX(m.c)+CELL/2,cellY(m.r)+CELL/2,10,0,7);
      ctx.fillStyle= (S.hoverCell&&S.hoverCell.r===m.r&&S.hoverCell.c===m.c)?'rgba(58,160,255,.85)':'rgba(58,160,255,.35)';
      ctx.fill();
    }
  }
  // placed walls
  for(const kk of S.H){ const [r,c]=kk.split(',').map(Number); drawWall('H',r,c,'#e7c46b',1); }
  for(const kk of S.V){ const [r,c]=kk.split(',').map(Number); drawWall('V',r,c,'#e7c46b',1); }
  // hover ghost wall
  if(S.hoverWall&&S.mode==='wall'&&!S.over&&S.blue.walls>0){
    const w=S.hoverWall; const ok=wallLegal(S.H,S.V,w.orient,w.r,w.c);
    drawWall(w.orient,w.r,w.c, ok?'#59e6a0':'#ff5a76', .55);
  }
  // pawns
  drawPawn(S.red,'#ff4d6d','#ff98ac');
  drawPawn(S.blue,'#3aa0ff','#9fd0ff');
}
function drawWall(orient,r,c,col,alpha){
  ctx.save(); ctx.globalAlpha=alpha;
  let x,y,w,h;
  if(orient==='H'){ x=cellX(c); y=cellY(r)+CELL+ (GAP-8)/2; w=CELL*2+GAP; h=8; }
  else { x=cellX(c)+CELL+(GAP-8)/2; y=cellY(r); w=8; h=CELL*2+GAP; }
  roundRect(x,y,w,h,4); ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=12; ctx.fill();
  ctx.restore();
}
function drawPawn(p,col,hi){
  const x=cellX(p.c)+CELL/2, y=cellY(p.r)+CELL/2;
  ctx.beginPath(); ctx.arc(x,y,CELL*0.34,0,7);
  const g=ctx.createRadialGradient(x-5,y-6,3,x,y,CELL*0.4);
  g.addColorStop(0,hi); g.addColorStop(1,col);
  ctx.fillStyle=g; ctx.shadowColor=col; ctx.shadowBlur=18; ctx.fill(); ctx.shadowBlur=0;
  ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.stroke();
}

reset(); draw();
})();
</script>
</body>
</html>
