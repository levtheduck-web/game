<script>
"use strict";
/* WET PAINT — a single-file hiding game.
   Original code, art, writing and audio. No external assets, no network. */
const FONTDATA = {"alph": "0123456789abcdefghijklmnopqrstuv", "blob": "00000004444404aa00000aavavaa4fke5u4pp248jjcik8lid4400000248884284222480le4el0044v4400000448000v0000000040122488gehjlphe4c4444eeh1248vv2421he26aiv22vgu11he68guhhev124888ehhehheehhf12c04004000400448248g84200v0v008421248eh12404ehnlngeehhvhhhuhhuhhuehgggheuhhhhhuvgguggvvggugggehgnhhfhhhvhhhe44444e1111hhehikokihggggggvhrllhhhhplljhhehhhhheuhhugggehhhliduhhukihehge1hev444444hhhhhhehhhhha4hhhllrhhha4ahhhha4444v1248gv7444447g884221s44444s4ah0000000000v840000000e1fhfgguhhhu00eggge11fhhhf00ehvge698u8880fhhf1egguhhhh40c444e20222icggikokic44444e00qlllh00uhhhh00ehhhe0uhhugg0fhhf1100moggg00fge1u88u889600hhhhf00hhha400hllla00ha4ah0hhhf1e00v248v344c4434444444o44644o009li00", "w": 5, "h": 7, "first": 32};

/* ==================== 01_font.js ==================== */
/* ---------- 5x7 bitmap font baked into colour atlases ---------- */
const FW = 5, FH = 7, CW = 6, CH = 8;      // glyph 5x7 inside a 6x8 cell

function glyphRows(ch){
  const code = ch.charCodeAt(0);
  if (code < FONTDATA.first || code > FONTDATA.first + 94) return null;
  const off = (code - FONTDATA.first) * FH;
  const rows = [];
  for (let r = 0; r < FH; r++){
    const v = FONTDATA.alph.indexOf(FONTDATA.blob[off + r]);
    rows.push(v);                            // 5 bits, msb = leftmost pixel
  }
  return rows;
}

const ATLAS = {};                            // colour -> canvas of 16x6 cells
function bakeAtlas(colour){
  const cols = 16, rows = 6;
  const cv = document.createElement('canvas');
  cv.width = cols * CW; cv.height = rows * CH;
  const c = cv.getContext('2d');
  c.imageSmoothingEnabled = false;
  c.fillStyle = colour;
  for (let i = 0; i < 95; i++){
    const ch = String.fromCharCode(FONTDATA.first + i);
    const g = glyphRows(ch); if (!g) continue;
    const ox = (i % cols) * CW, oy = ((i / cols) | 0) * CH;
    for (let y = 0; y < FH; y++){
      const bits = g[y];
      for (let x = 0; x < FW; x++)
        if (bits & (1 << (FW - 1 - x))) c.fillRect(ox + x, oy + y, 1, 1);
    }
  }
  return cv;
}
function atlas(colour){
  if (!ATLAS[colour]) ATLAS[colour] = bakeAtlas(colour);
  return ATLAS[colour];
}

/* draw text with the baked atlas — never fillText */
function txt(c, s, x, y, colour, scale){
  colour = colour || UI.WHITE; scale = scale || 1;
  const a = atlas(colour);
  x = Math.round(x); y = Math.round(y);
  for (let i = 0; i < s.length; i++){
    const code = s.charCodeAt(i) - FONTDATA.first;
    if (code < 0 || code > 94){ x += CW * scale; continue; }
    if (code !== 0){                              // skip blitting spaces
      const sx = (code % 16) * CW, sy = ((code / 16) | 0) * CH;
      c.drawImage(a, sx, sy, CW, CH, x, y, CW * scale, CH * scale);
    }
    x += CW * scale;
  }
  return x;
}
const txtW = (s, scale) => s.length * CW * (scale || 1);
function txtC(c, s, cx, y, colour, scale){      // centred
  txt(c, s, Math.round(cx - txtW(s, scale) / 2), y, colour, scale);
}


/* ==================== 02_core.js ==================== */
/* ---------- engine spine: canvas, timestep, input, dialogue ---------- */
const VW = 320, VH = 240, STEP = 1 / 60;
const UI = { BLACK:'#000000', WHITE:'#FFFFFF', DIM:'#B4B4B4', GHOST:'#5A5A5A',
             SOUL:'#FF4444', GOLD:'#F5D648', BLOOD:'#6E1B1B', CYAN:'#59D8E6' };

const view = document.getElementById('view');
const vctx = view.getContext('2d');
const buf  = document.createElement('canvas'); buf.width = VW; buf.height = VH;
const ctx  = buf.getContext('2d', { alpha:false });

let SCALE = 1;
function nosmooth(c){
  c.imageSmoothingEnabled = false;
  c.webkitImageSmoothingEnabled = false;
  c.mozImageSmoothingEnabled = false;
  c.msImageSmoothingEnabled = false;
}
function resize(){
  SCALE = Math.max(1, Math.floor(Math.min(innerWidth / VW, innerHeight / VH)));
  view.width = VW * SCALE; view.height = VH * SCALE;
  view.style.width = (VW * SCALE) + 'px'; view.style.height = (VH * SCALE) + 'px';
  nosmooth(vctx); nosmooth(ctx);
}
addEventListener('resize', resize);

/* ---------- input ---------- */
const KEYMAP = {
  ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  KeyW:'up', KeyS:'down', KeyA:'left', KeyD:'right',
  KeyZ:'ok', Enter:'ok', KeyX:'no', ShiftLeft:'no', ShiftRight:'no',
  Backspace:'undo', KeyC:'menu', Escape:'pause', KeyM:'mute', KeyG:'ghost',
  KeyF:'fill', KeyQ:'dither', Tab:'peek', Space:'ok',
  Digit1:'s1', Digit2:'s2', Digit3:'s3', Digit4:'s4',
  Digit5:'s5', Digit6:'s6', Digit7:'s7', Digit8:'s8',
  BracketLeft:'brushdn', BracketRight:'brushup',
  KeyP:'pose', KeyO:'shape',
  Comma:'shadedn', Period:'shadeup', KeyE:'mirror', KeyR:'sig',
};
const held = {}, pressed = {}, buffered = {};
const BUFFER = 0.12;
let anyKeyYet = false;

function down(a){ return !!held[a]; }
function hit(a){                                  // consumes a buffered press
  if (buffered[a] > 0){ buffered[a] = 0; return true; }
  return false;
}
function peekHit(a){ return buffered[a] > 0; }
function clearHits(){ for (const k in buffered) buffered[k] = 0; }

addEventListener('keydown', e => {
  const a = KEYMAP[e.code];
  if (a === 'peek' || e.code === 'Space' || e.code.startsWith('Arrow') ||
      e.code === 'KeyZ' || e.code === 'KeyX' || e.code === 'Enter' ||
      e.code === 'Backspace') e.preventDefault();
  if (!anyKeyYet){ anyKeyYet = true; document.getElementById('boot').className = 'gone';
                   Audio_.start(); }
  if (e.repeat) return;                           // ignore auto-repeat entirely
  if (!a) return;
  held[a] = true; pressed[a] = true; buffered[a] = BUFFER;
  if (a === 'left' || a === 'right' || a === 'up' || a === 'down') dirPush(a);
  if (a === 'mute') Audio_.toggleMute();
});
addEventListener('keyup', e => {
  const a = KEYMAP[e.code]; if (!a) return;
  held[a] = false;
  if (a === 'left' || a === 'right' || a === 'up' || a === 'down') dirPop(a);
});
addEventListener('blur', () => { for (const k in held) held[k] = false; dirStack.length = 0; });

/* facing follows the press-order stack */
const dirStack = [];
function dirPush(d){ const i = dirStack.indexOf(d); if (i >= 0) dirStack.splice(i,1); dirStack.push(d); }
function dirPop(d){ const i = dirStack.indexOf(d); if (i >= 0) dirStack.splice(i,1); }
function topDir(){ return dirStack.length ? dirStack[dirStack.length-1] : null; }

function axis(){
  let ax = (down('right') ? 1 : 0) - (down('left') ? 1 : 0);
  let ay = (down('down')  ? 1 : 0) - (down('up')   ? 1 : 0);
  if (ax && ay){ ax *= 0.70711; ay *= 0.70711; }
  return [ax, ay];
}

/* ---------- primitives (no strokeRect, no gradients, no blur) ---------- */
function rect(c,x,y,w,h,col){ c.fillStyle = col; c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function frame(c,x,y,w,h,t,col){                  // border as four fillRects
  x=Math.round(x); y=Math.round(y); w=Math.round(w); h=Math.round(h);
  rect(c,x,y,w,t,col); rect(c,x,y+h-t,w,t,col);
  rect(c,x,y+t,t,h-2*t,col); rect(c,x+w-t,y+t,t,h-2*t,col);
}
function panel(c,x,y,w,h,t,col){ rect(c,x,y,w,h,UI.BLACK); frame(c,x,y,w,h,t,col||UI.WHITE); }

/* 17-step ordered-dither wash, baked once — never globalAlpha */
const BAYER = [ 0, 8, 2,10, 12, 4,14, 6, 3,11, 1, 9, 15, 7,13, 5 ];
const DITHER = [];
function bakeDither(){
  for (let s = 0; s <= 16; s++){
    const cv = document.createElement('canvas'); cv.width = 4; cv.height = 4;
    const c = cv.getContext('2d'); c.fillStyle = '#000';
    for (let i = 0; i < 16; i++) if (BAYER[i] < s) c.fillRect(i % 4, (i / 4) | 0, 1, 1);
    DITHER.push(c.createPattern(cv, 'repeat'));
  }
}
function wash(c, step){                            // step 0..16 of blackness
  step = Math.max(0, Math.min(16, Math.round(step)));
  if (!step) return;
  if (step >= 16){ rect(c,0,0,VW,VH,UI.BLACK); return; }
  c.fillStyle = DITHER[step]; c.fillRect(0,0,VW,VH);
}

/* ---------- screen shake ---------- */
let shakeAmp = 0, shakeT = 0, shakeX = 0, shakeY = 0, shakeAcc = 0;
function shake(amp){ shakeAmp = Math.max(shakeAmp, amp); shakeT = 0.25; }
function shakeUpdate(dt){
  if (shakeT <= 0){ shakeX = shakeY = 0; shakeAmp = 0; return; }
  shakeT -= dt; shakeAcc += dt;
  if (shakeAcc >= 1/30){
    shakeAcc = 0;
    const a = shakeAmp * Math.max(0, shakeT / 0.25);
    shakeX = Math.round(a * (Math.random()*2-1));
    shakeY = Math.round(a * (Math.random()*2-1));
  }
}

/* ---------- hitstop ---------- */
let hitstop = 0;
const freeze = t => { hitstop = Math.max(hitstop, t); };

/* ---------- typewriter dialogue ---------- */
const BOX = { x:16, y:152, w:288, h:72, tx:28, ty:163, lh:14, lines:3, wrap:44, cwrap:42 };
const Dlg = {
  pages:[], page:0, lines:[], shown:0, total:0, acc:0, done:false, active:false,
  rate:30, voice:null, lock:0, pause:0, chevron:0, onEnd:null, colour:UI.WHITE, mono:false,

  wrap(s, bullet){
    const out = [];
    const first = bullet ? BOX.wrap : BOX.cwrap;
    let words = s.split(' '), line = bullet ? '* ' : '';
    const limit = () => (out.length === 0 && bullet) ? first : BOX.cwrap;
    for (const w of words){
      const cand = line.length ? line + ' ' + w : (out.length===0&&bullet ? '* ' + w : w);
      if (cand.length > limit() && line.length){ out.push(line); line = w; }
      else line = cand;
    }
    if (line.length) out.push(line);
    return out;
  },
  queue(pages, opts){
    opts = opts || {};
    this.pages = pages.map(p => typeof p === 'string' ? { t:p } : p);
    this.page = -1; this.active = true; this.onEnd = opts.onEnd || null;
    this.voice = opts.voice || VOICE.plain;
    this.colour = opts.colour || UI.WHITE;
    this.mono = !!opts.mono;                        // lowercase inner monologue
    this.rate = opts.rate || (this.mono ? 24 : 30);
    this.next();
  },
  next(){
    this.page++;
    if (this.page >= this.pages.length){
      this.active = false;
      const f = this.onEnd; this.onEnd = null; if (f) f();
      return;
    }
    const p = this.pages[this.page];
    this.lines = this.wrap(p.t, !this.mono);
    if (this.lines.length > BOX.lines) this.lines = this.lines.slice(0, BOX.lines);
    this.total = this.lines.reduce((a,l) => a + l.length, 0);
    this.shown = 0; this.acc = 0; this.done = false; this.chevron = 0; this.pause = 0;
    if (p.voice) this.voice = p.voice;
  },
  update(dt){
    if (!this.active) return;
    if (this.lock > 0) this.lock -= dt;
    const fast = down('ok') || down('no');
    if (this.pause > 0){ this.pause -= dt * (fast ? 4 : 1); return; }
    if (!this.done){
      const rate = this.rate * (fast ? 4 : 1);
      this.acc += dt;
      while (this.acc >= 1 / rate && !this.done){
        this.acc -= 1 / rate;
        const ch = this.charAt(this.shown);
        this.shown++;
        if (this.shown >= this.total){ this.done = true; break; }
        if (ch !== ' '){
          if (!fast || this.shown % 3 === 0) Audio_.blip(this.voice);
        }
        const nx = this.charAt(this.shown);
        if (nx === ' ' || nx === undefined){
          if (ch === ',') this.pause = 0.08;
          else if (ch === ';' || ch === ':') this.pause = 0.10;
          else if (ch === '.' || ch === '!' || ch === '?') this.pause = 0.16;
        }
        if (this.pause > 0) break;
      }
    } else {
      this.chevron += dt;
      if (hit('ok') && this.lock <= 0) this.next();
    }
    if (!this.done && hit('ok') && this.lock <= 0){
      this.shown = this.total; this.done = true; this.lock = 0.12;
    }
  },
  charAt(i){
    let n = 0;
    for (const l of this.lines){
      if (i < n + l.length) return l[i - n];
      n += l.length;
    }
    return undefined;
  },
  draw(c){
    if (!this.active) return;
    panel(c, BOX.x, BOX.y, BOX.w, BOX.h, 2, UI.WHITE);
    let n = 0;
    for (let li = 0; li < this.lines.length; li++){
      const l = this.lines[li];
      const vis = Math.max(0, Math.min(l.length, this.shown - n));
      const indent = (li > 0 && !this.mono) ? 12 : 0;
      txt(c, l.slice(0, vis), BOX.tx + indent, BOX.ty + li * BOX.lh, this.colour);
      n += l.length;
    }
    if (this.done && this.chevron > 0.25){
      const bob = [0,0,1,2,2,1][Math.floor(this.chevron / 0.1) % 6];
      const y = 211 + bob;
      rect(c, 288, y,   7, 1, UI.WHITE);
      rect(c, 289, y+1, 5, 1, UI.WHITE);
      rect(c, 290, y+2, 3, 1, UI.WHITE);
      rect(c, 291, y+3, 1, 1, UI.WHITE);
    }
  }
};


/* ==================== 03_palette.js ==================== */
/* ---------- the 32-colour world palette (index = ramp*4 + value) ---------- */
const RAMPS = ['BRICK','OCHRE','MOSS','TEAL','SLATE','PLUM','SUGAR','PAPER'];
const PAL = [
  '#3B1F1A','#6E3A2C','#A85C3E','#D18C63',   // BRICK
  '#3A2E12','#6E5A22','#A88A38','#D8BE66',   // OCHRE
  '#16281A','#2C4A2E','#4E7C47','#86AF63',   // MOSS
  '#10262A','#1F4A50','#357C82','#6FB2B4',   // TEAL
  '#14161C','#2C313D','#4E5666','#838C9E',   // SLATE
  '#241428','#46264E','#6E3E7C','#A272B0',   // PLUM
  '#4A1F3A','#8A3763','#C2618E','#F0A0BE',   // SUGAR
  '#9C948A','#C7C0B2','#E8E4DA','#FFFFFF',   // PAPER
];
const WHITE_IDX = 31;                          // the unpainted Blank
const SHADEWORD = ['DEEP','SHADE','MID','LIGHT'];
const palName = i => RAMPS[i >> 2] + ' ' + (i & 3);

/* rgb + luminance per index */
const RGB = PAL.map(h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]);
const LUM = RGB.map(([r,g,b]) => 0.299*r + 0.587*g + 0.114*b);

/* ramp similarity, hand-authored, symmetric */
const RS_RAW = [
//BRICK OCHRE MOSS  TEAL  SLATE PLUM  SUGAR PAPER
  [1.00, 0.55, 0.12, 0.05, 0.10, 0.35, 0.30, 0.18],
  [0.55, 1.00, 0.35, 0.08, 0.10, 0.12, 0.18, 0.28],
  [0.12, 0.35, 1.00, 0.45, 0.22, 0.06, 0.05, 0.12],
  [0.05, 0.08, 0.45, 1.00, 0.50, 0.15, 0.08, 0.14],
  [0.10, 0.10, 0.22, 0.50, 1.00, 0.30, 0.18, 0.40],
  [0.35, 0.12, 0.06, 0.15, 0.30, 1.00, 0.60, 0.16],
  [0.30, 0.18, 0.05, 0.08, 0.18, 0.60, 1.00, 0.30],
  [0.18, 0.28, 0.12, 0.14, 0.40, 0.16, 0.30, 1.00],
];
const VSTEP = [1.00, 0.72, 0.26, 0.00];

const MATCH = new Float32Array(32 * 32);
(function bakeMatch(){
  for (let a = 0; a < 32; a++) for (let b = 0; b < 32; b++){
    let m;
    if (a === b) m = 1;
    else {
      m = VSTEP[Math.abs((a & 3) - (b & 3))] * RS_RAW[a >> 2][b >> 2];
      if (m < 0.05) m = 0;
    }
    MATCH[a * 32 + b] = m;
  }
})();
const matchRaw = (a,b) => MATCH[a * 32 + b];
const match = (a,b,textured) => textured ? Math.min(1, MATCH[a*32+b] + 0.10) : MATCH[a*32+b];

/* heat buckets for the results overlay */
function heatColour(m){
  if (m >= 0.95) return PAL[31];
  if (m >= 0.70) return PAL[10];
  if (m >= 0.40) return PAL[7];
  return PAL[2];
}

/* palette assertions the smoke test enforces */
function paletteAudit(){
  const out = [];
  out.push(['exact match is 1.00', matchRaw(13,13) === 1]);
  let s = 0, n = 0;
  for (let r = 0; r < 8; r++) for (let v = 0; v < 3; v++){ s += matchRaw(r*4+v, r*4+v+1); n++; }
  const sameRamp = s / n;
  out.push(['same-ramp dv=1 mean in [.66,.78] (' + sameRamp.toFixed(3) + ')', sameRamp >= 0.66 && sameRamp <= 0.78]);
  s = 0; n = 0;
  for (let r = 0; r < 7; r++) for (let v = 0; v < 4; v++){ s += matchRaw(r*4+v, (r+1)*4+v); n++; }
  const adj = s / n;
  out.push(['adjacent-ramp dv=0 mean in [.20,.58] (' + adj.toFixed(3) + ')', adj >= 0.20 && adj <= 0.58]);
  s = 0; n = 0;
  for (let a = 0; a < 32; a++) for (let b = 0; b < 32; b++)
    if (RS_RAW[a>>2][b>>2] < 0.15){ s += matchRaw(a,b); n++; }
  const far = n ? s / n : 0;
  out.push(['far-ramp mean < .12 (' + far.toFixed(3) + ')', far < 0.12]);
  out.push(['palette is 32 entries', PAL.length === 32]);
  out.push(['index 31 is white', PAL[31] === '#FFFFFF']);
  return out;
}


/* ==================== 04_art.js ==================== */
/* ---------- scene baking: one wrapper fills pixels, indices and tags ---------- */
const TAGNAMES = ['NOTHING'];
function tagId(name){
  let i = TAGNAMES.indexOf(name);
  if (i < 0){ i = TAGNAMES.length; TAGNAMES.push(name); }
  return i;
}

/* deterministic hash noise so scenes bake identically every time */
function nz(x, y, seed){
  let h = (x * 374761393 + y * 668265263 + (seed|0) * 1442695040888963407) | 0;
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

class Scene {
  constructor(w, h){
    this.w = w; this.h = h;
    this.cv = document.createElement('canvas'); this.cv.width = w; this.cv.height = h;
    this.c = this.cv.getContext('2d', { alpha:false }); nosmooth(this.c);
    this.idx = new Uint8Array(w * h).fill(WHITE_IDX);
    this.tag = new Uint8Array(w * h);
    this.solid = new Uint8Array(w * h);          // collision mask
    this.tagStack = [0];
  }
  /* paint-fill: the ONLY way scene pixels are written */
  pf(x, y, w, h, pi, tag){
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
    if (w <= 0 || h <= 0) return;
    const t = tag === undefined ? this.tagStack[this.tagStack.length-1] : (typeof tag === 'string' ? tagId(tag) : tag);
    this.c.fillStyle = PAL[pi];
    this.c.fillRect(x, y, w, h);
    const x0 = Math.max(0,x), x1 = Math.min(this.w, x+w);
    const y0 = Math.max(0,y), y1 = Math.min(this.h, y+h);
    for (let yy = y0; yy < y1; yy++){
      const row = yy * this.w;
      this.idx.fill(pi, row + x0, row + x1);
      this.tag.fill(t, row + x0, row + x1);
    }
  }
  px(x, y, pi, tag){ this.pf(x, y, 1, 1, pi, tag); }
  under(tag, fn){ this.tagStack.push(typeof tag === 'string' ? tagId(tag) : tag); fn(this); this.tagStack.pop(); }
  block(x, y, w, h){                              // collision only, no pixels
    x = Math.max(0, Math.round(x)); y = Math.max(0, Math.round(y));
    const x1 = Math.min(this.w, x + Math.round(w)), y1 = Math.min(this.h, y + Math.round(h));
    for (let yy = y; yy < y1; yy++) this.solid.fill(1, yy * this.w + x, yy * this.w + x1);
  }
  at(x, y){
    x = Math.max(0, Math.min(this.w-1, x|0)); y = Math.max(0, Math.min(this.h-1, y|0));
    return this.idx[y * this.w + x];
  }
  tagAt(x, y){
    x = Math.max(0, Math.min(this.w-1, x|0)); y = Math.max(0, Math.min(this.h-1, y|0));
    return this.tag[y * this.w + x];
  }
  solidAt(x, y){
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return 1;
    return this.solid[(y|0) * this.w + (x|0)];
  }

  /* ---- texture helpers: no backdrop may be a flat rectangle ---- */
  grain(x, y, w, h, base, alt, seed, density, tag){   // horizontal plank grain
    this.pf(x, y, w, h, base, tag);
    for (let yy = 0; yy < h; yy++){
      if ((yy + (nz(0,yy,seed) * 3 | 0)) % 4) continue;
      for (let xx = 0; xx < w; xx++)
        if (nz(xx, yy, seed) < (density || 0.72)) this.px(x+xx, y+yy, alt, tag);
    }
  }
  speck(x, y, w, h, base, alts, seed, density, tag){  // noisy stone / soil
    this.pf(x, y, w, h, base, tag);
    for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++){
      const r = nz(x+xx, y+yy, seed);
      if (r < density) this.px(x+xx, y+yy, alts[(r * 977 | 0) % alts.length], tag);
    }
  }
  checker(x, y, w, h, a, b, cell, tag){
    for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++)
      this.px(x+xx, y+yy, ((((x+xx)/cell)|0) + (((y+yy)/cell)|0)) % 2 ? b : a, tag);
  }
  stripe(x, y, w, h, a, b, wid, tag){
    for (let xx = 0; xx < w; xx++)
      this.pf(x+xx, y, 1, h, (((x+xx)/wid)|0) % 2 ? b : a, tag);
  }
  bricks(x, y, w, h, faceA, faceB, mortar, bw, bh, seed, tag){
    this.pf(x, y, w, h, mortar, tag);
    for (let ry = 0; ry * bh < h; ry++){
      const off = (ry % 2) * (bw >> 1);
      for (let rx = -1; rx * bw < w + bw; rx++){
        const bx = x + rx * bw + off + 1, by = y + ry * bh + 1;
        const f = nz(rx, ry, seed) < 0.42 ? faceB : faceA;
        const cx0 = Math.max(x, bx), cy0 = Math.max(y, by);
        const cx1 = Math.min(x + w, bx + bw - 1), cy1 = Math.min(y + h, by + bh - 1);
        if (cx1 > cx0 && cy1 > cy0) this.pf(cx0, cy0, cx1-cx0, cy1-cy0, f, tag);
        // weathering, so no brick is ever a flat rectangle
        for (let k = 0; k < 3; k++){
          if (nz(rx, ry, seed + 7 + k*5) > 0.72) continue;
          const wx = bx + 1 + (nz(rx, ry+k, seed+9) * (bw-3) | 0);
          const wy = by + (nz(rx+k, ry, seed+11) * (bh-2) | 0);
          if (wx >= x && wx < x+w && wy >= y && wy < y+h)
            this.px(wx, wy, k === 2 ? mortar : (f === faceA ? faceB : faceA), tag);
        }
      }
    }
  }
  vgrad(x, y, w, h, idxs, tag){                    // banded vertical ramp
    const n = idxs.length;
    for (let i = 0; i < n; i++){
      const y0 = y + Math.floor(h * i / n), y1 = y + Math.floor(h * (i+1) / n);
      this.pf(x, y0, w, y1-y0, idxs[i], tag);
    }
  }
}

/* ---------- spots: cover rect in world px; 1 body cell = 1 world pixel ---------- */
const MASK_SIZE = { STAND:[11,20], CURL:[15,14], LIE:[22,9], FLATTEN:[16,16] };

function mkSpot(o){
  const a = {};
  for (const p in MASK_SIZE){
    const [mw, mh] = MASK_SIZE[p];
    const cx = o.coverX + (o.coverW - mw) / 2;
    const cy = (p === 'FLATTEN') ? o.coverY + (o.coverH - mh) / 2
                                 : o.coverY + o.coverH - mh;
    a[p] = [Math.round(cx), Math.round(cy)];
  }
  o.anchors = a;
  o.absurd = o.absurd || [];
  o.textured = !!o.textured;
  return o;
}

/* bake a room's three buffers once */
const SCENES = {};
function getScene(key){
  if (!SCENES[key]){
    const s = new Scene(VW, VH);
    ROOMS[key].build(s);
    SCENES[key] = s;
  }
  return SCENES[key];

/* ---------- global run state ---------- */
const G = {
  st:'TITLE', round:0, night:1, room:'CH1',
  px:160, py:190, facing:'down', animDist:0, animIdle:0, running:false,
  shape:'BLOB', pose:'STAND', spot:null, spotIdx:0,
  grid:null, gridW:0, gridH:0,
  slots:new Uint8Array([31,31,31,31,31,31,31,31]), slot:0,
  slotTag:['','','','','','','',''],
  tags:new Set(), score:0, bars:null, prevSlot:1,
  prep:75, coneHit:false,
  caught:0, survived:0, history:[],
  tool:{ size:1, mirror:false, dither:false }, ghostMode:1,
  fade:0, fadeDir:0, fadeThen:null,
  best:0, seenIntro:{},
};

/* ---------- fade helper ---------- */
function fadeTo(fn, dur){
  G.fadeDir = 1; G.fadeThen = fn; G.fadeDur = dur || 0.35; G.fadeT = 0;
}
function fadeUpdate(dt){
  if (!G.fadeDir) return;
  G.fadeT += dt;
  const p = Math.min(1, G.fadeT / G.fadeDur);
  if (G.fadeDir === 1){
    G.fade = p * 16;
    if (p >= 1){ const f = G.fadeThen; G.fadeThen = null; G.fadeDir = -1; G.fadeT = 0; if (f) f(); }
  } else {
    G.fade = (1 - p) * 16;
    if (p >= 1){ G.fadeDir = 0; G.fade = 0; }
  }
}

/* ---------- the Looker patrolling the room ---------- */
const Looker = { x:0, y:0, wp:0, t:0, facing:'down', showPath:0, barked:false };
function lookerInit(room){
  const w = room.waypoints;
  if (!w){ Looker.x = -99; Looker.y = -99; return; }
  Looker.x = w[0][0]; Looker.y = w[0][1]; Looker.wp = 1; Looker.showPath = 1.5; Looker.barked = false;
}
function lookerUpdate(dt, room){
  const w = room.waypoints; if (!w) return;
  if (Looker.showPath > 0) Looker.showPath -= dt;
  const t = w[Looker.wp];
  const dx = t[0] - Looker.x, dy = t[1] - Looker.y;
  const d = Math.hypot(dx, dy);
  if (d < 1.5){ Looker.wp = (Looker.wp + 1) % w.length; return; }
  const sp = 40 * dt;
  Looker.x += dx / d * sp; Looker.y += dy / d * sp;
  Looker.facing = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
}
/* 60-degree, 72px cone drawn on the floor */
function inCone(x, y){
  const dx = x - Looker.x, dy = y - Looker.y;
  const d = Math.hypot(dx, dy);
  if (d > 72 || d < 1) return false;
  const fv = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] }[Looker.facing];
  const dot = (dx/d) * fv[0] + (dy/d) * fv[1];
  return dot > 0.866;                                  // half-angle 30 deg
}
function drawCone(c){
  if (Looker.x < 0) return;
  const fv = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] }[Looker.facing];
  for (let r = 8; r < 72; r += 2){
    const halfw = Math.round(r * 0.577);
    for (let s = -halfw; s <= halfw; s += 2){
      const px = Math.round(Looker.x + fv[0]*r - fv[1]*s);
      const py = Math.round(Looker.y + fv[1]*r + fv[0]*s);
      if ((px + py) % 4 === 0) rect(c, px, py, 1, 1, UI.GHOST);
    }
  }
}
function drawLooker(c){
  if (Looker.x < 0) return;
  const x = Math.round(Looker.x) - 7, y = Math.round(Looker.y) - 24;
  const bob = Math.sin(performance.now() / 420) > 0 ? 0 : 1;
  rect(c, x+1, y+bob, 13, 24, UI.BLACK);
  rect(c, x+2, y+1+bob, 11, 22, UI.DIM);
  rect(c, x+4, y+4+bob, 7, 5, UI.BLACK);
  rect(c, x+5, y+5+bob, 2, 2, UI.WHITE);
  rect(c, x+9, y+5+bob, 2, 2, UI.WHITE);
  rect(c, x+3, y+14+bob, 9, 1, UI.BLACK);
}

/* ---------- the Blank's world sprite (baked from the paint grid) ---------- */
let blankSprite = null, blankDirty = true;
function bakeBlank(){
  const m = maskFor(G.shape, G.pose);
  const cv = document.createElement('canvas');
  cv.width = m.w; cv.height = m.h;
  const c = cv.getContext('2d'); nosmooth(c);
  for (const cell of m.cells){
    c.fillStyle = PAL[G.grid[cell.i]];
    c.fillRect(cell.cx, cell.cy, 1, 1);
  }
  blankSprite = cv; blankDirty = false;
}
/* silhouette outline: only on boundary cells that differ from the world behind them */
function drawBlank(c, wx, wy, scene, outline){
  if (blankDirty) bakeBlank();
  const m = maskFor(G.shape, G.pose);
  c.drawImage(blankSprite, Math.round(wx), Math.round(wy));
  if (!outline || !scene) return;
  for (const cell of m.cells){
    if (!cell.edge) continue;
    const bx = Math.round(wx) + cell.cx, by = Math.round(wy) + cell.cy;
    const mine = G.grid[cell.i];
    // compare against the world pixel just outside the silhouette
    for (const [ox,oy] of [[-1,0],[1,0],[0,-1],[0,1]]){
      if (m.liveAt(cell.cx+ox, cell.cy+oy)) continue;
      const wcol = scene.at(bx+ox, by+oy);
      if (matchRaw(mine, wcol) < 0.55) rect(c, bx, by, 1, 1, PAL[mine]);
    }
  }
}

/* ---------- overworld ---------- */
const OW = { hint:'', hintT:0, prompt:null };

function enterRoom(key, spawn){
  G.room = key;
  const room = ROOMS[key];
  getScene(key);
  const st = spawn || room.start;
  G.px = st[0]; G.py = st[1];
  lookerInit(room);
  OW.prompt = null;
}

function owUpdate(dt){
  const room = ROOMS[G.room], scene = getScene(G.room);
  if (Dlg.active){ Dlg.update(dt); return; }
  if (room.waypoints) lookerUpdate(dt, room);

  const [ax, ay] = axis();
  G.running = down('no');
  const sp = (G.running ? 160 : 90) * dt;
  const d = topDir(); if (d) G.facing = d;

  const feetW = 12, feetH = 8;
  const canStand = (x, y) => {
    const x0 = Math.round(x - feetW/2), y0 = Math.round(y - feetH);
    for (let yy = y0; yy < y0 + feetH; yy++)
      for (let xx = x0; xx < x0 + feetW; xx++)
        if (scene.solidAt(xx, yy)) return false;
    return x0 >= 0 && x0 + feetW <= VW && y0 >= 0 && y0 + feetH <= VH;
  };
  let nx = G.px + ax * sp, ny = G.py;
  if (ax && canStand(nx, ny)) G.px = nx;
  ny = G.py + ay * sp;
  if (ay && canStand(G.px, ny)) G.py = ny;
  if (ax || ay){ G.animDist += Math.abs(ax*sp) + Math.abs(ay*sp); G.animIdle = 0; }
  else { G.animIdle += dt; }

  // the Looker's cone costs prep time, once
  if (room.waypoints && !G.coneHit && inCone(G.px, G.py - 6)){
    G.coneHit = true;
    OW.hint = '-15s  ' + (LOOKERS[room.looker] ? LOOKERS[room.looker].coneBark : 'SEEN.');
    OW.hintT = 2.4;
    Audio_.sfx('bad');
  }

  // interaction probe
  OW.prompt = null;
  const fv = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] }[G.facing];
  const probe = { x: G.px - 6 + fv[0]*12, y: G.py - 12 + fv[1]*12, w:12, h:12 };
  let best = null, bestOv = 0;
  const cands = [];
  for (const p of (room.props || [])) cands.push({ kind:'prop', r:p, p });
  for (const s of (room.spots || [])) cands.push({ kind:'spot', r:{ x:s.walk[0]-9, y:s.walk[1]-16, w:18, h:18 }, p:s });
  for (const cd of cands){
    const ov = Math.max(0, Math.min(probe.x+probe.w, cd.r.x+cd.r.w) - Math.max(probe.x, cd.r.x)) *
               Math.max(0, Math.min(probe.y+probe.h, cd.r.y+cd.r.h) - Math.max(probe.y, cd.r.y));
    if (ov > bestOv){ bestOv = ov; best = cd; }
  }
  if (best) OW.prompt = best;

  if (OW.hintT > 0) OW.hintT -= dt;

  if (hit('ok') && best){
    if (best.kind === 'spot'){
      if (G.spot === best.p) { readyUp(); }
      else { G.spot = best.p; G.st = 'EDITOR'; edOpen(); Audio_.sfx('confirm'); }
      return;
    }
    const p = best.p;
    if (p.talk) talkProp(p.talk);
  }
}

function owDraw(c){
  const room = ROOMS[G.room], scene = getScene(G.room);
  c.drawImage(scene.cv, 0, 0);
  if (room.waypoints && Looker.showPath > 0){
    const w = room.waypoints;
    for (let i = 0; i < w.length; i++){
      const a = w[i], b = w[(i+1) % w.length];
      const steps = Math.hypot(b[0]-a[0], b[1]-a[1]) / 5 | 0;
      for (let k = 0; k <= steps; k++){
        if (k % 2) continue;
        rect(c, a[0] + (b[0]-a[0]) * k/steps, a[1] + (b[1]-a[1]) * k/steps, 1, 1, UI.WHITE);
      }
    }
  }
  if (room.waypoints) drawCone(c);

  // spot markers
  for (const s of (room.spots || [])){
    const on = OW.prompt && OW.prompt.kind === 'spot' && OW.prompt.p === s;
    const mine = G.spot === s;
    frame(c, s.coverX-1, s.coverY-1, s.coverW+2, s.coverH+2, 1,
          on ? UI.GOLD : mine ? UI.CYAN : UI.GHOST);
    if (mine) txt(c, 'YOURS', s.coverX, s.coverY - 10, UI.CYAN);
  }

  const m = maskFor(G.shape, G.pose);
  drawBlank(c, G.px - m.w/2, G.py - m.h, scene, true);
  if (room.waypoints) drawLooker(c);

  // header
  rect(c, 0, 0, VW, 11, UI.BLACK);
  txt(c, room.label, 4, 2, UI.DIM);
  if (!room.hub){
    const t = Math.max(0, Math.ceil(G.prep));
    txt(c, 'PAINT ' + fmtClock(t), 254, 2, t < 11 ? UI.SOUL : UI.WHITE);
    txt(c, 'R' + (G.round+1) + '/N' + G.night, 96, 2, UI.DIM);
    if (G.spot) txt(c, 'CAMO ' + computeScore().total, 148, 2, UI.GOLD);
  }

  if (OW.hintT > 0){ rect(c, 0, 226, VW, 12, UI.BLACK); txtC(c, OW.hint, 160, 228, UI.GOLD); }
  else if (OW.prompt){
    rect(c, 0, 226, VW, 12, UI.BLACK);
    const p = OW.prompt;
    const label = p.kind === 'spot'
      ? (G.spot === p.p ? ('[Z] HIDE HERE  —  ' + p.p.name) : ('[Z] PAINT FOR: ' + p.p.name))
      : ('[Z] ' + p.p.name);
    txtC(c, label, 160, 228, UI.WHITE);
  }
  Dlg.draw(c);
}

const fmtClock = t => Math.floor(t/60) + ':' + String(Math.floor(t%60)).padStart(2,'0');


/* ==================== 07_editor.js ==================== */
/* ---------- body masks: 2 shapes x 4 poses, generated, then cached ---------- */
const MASKS = {};
function maskFor(shape, pose){
  const key = shape + '_' + pose;
  if (MASKS[key]) return MASKS[key];
  const [w, h] = MASK_SIZE[pose];
  const live = new Uint8Array(w * h);
  const R = { STAND:[3,1], CURL:[6,2], LIE:[4,1], FLATTEN:[4,1] }[pose];
  const r = shape === 'BLOB' ? R[0] : R[1];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    let on = true;
    const corners = [[r-1, r-1, x < r, y < r], [w-r, r-1, x >= w-r, y < r],
                     [r-1, h-r, x < r, y >= h-r], [w-r, h-r, x >= w-r, y >= h-r]];
    for (const [ccx, ccy, inx, iny] of corners){
      if (inx && iny && Math.hypot(x - ccx, y - ccy) > r + 0.35) on = false;
    }
    if (shape === 'CUBE' && x === 0 && y === 0) on = false;      // 1-cell chamfer
    if (shape === 'BLOB' && pose === 'STAND'){                    // narrow the head
      if (y < 3 && (x < 2 || x >= w-2)) on = false;
      if (y >= 4 && y <= 5 && (x === 0 || x === w-1)) on = false; // a suggestion of a neck
    }
    if (shape === 'BLOB' && pose === 'LIE' && y === 0 && (x < 3 || x >= w-3)) on = false;
    live[y*w + x] = on ? 1 : 0;
  }
  const liveAt = (x,y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : live[y*w + x];
  const cells = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    if (!live[y*w + x]) continue;
    const edge = !liveAt(x-1,y) || !liveAt(x+1,y) || !liveAt(x,y-1) || !liveAt(x,y+1);
    cells.push({ cx:x, cy:y, i:y*w + x, edge });
  }
  const m = { w, h, live, liveAt, cells, count:cells.length,
              edges:cells.filter(c => c.edge).length };
  MASKS[key] = m; return m;
}

/* ---------- the paint grid ---------- */
function newGrid(shape, pose){
  const m = maskFor(shape, pose);
  return new Uint8Array(m.w * m.h).fill(WHITE_IDX);
}
function resampleGrid(oldGrid, oldShape, oldPose, shape, pose){
  const a = maskFor(oldShape, oldPose), b = maskFor(shape, pose);
  const out = new Uint8Array(b.w * b.h).fill(WHITE_IDX);
  for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++){
    const sx = Math.min(a.w-1, Math.round((x + 0.5) / b.w * a.w - 0.5));
    const sy = Math.min(a.h-1, Math.round((y + 0.5) / b.h * a.h - 0.5));
    out[y*b.w + x] = oldGrid[sy*a.w + sx];
  }
  return out;
}
function setPose(shape, pose){
  if (G.grid) G.grid = resampleGrid(G.grid, G.shape, G.pose, shape, pose);
  else G.grid = newGrid(shape, pose);
  G.shape = shape; G.pose = pose;
  const m = maskFor(shape, pose); G.gridW = m.w; G.gridH = m.h;
  blankDirty = true;
}
/* the wall pixel under body cell (cx,cy) at the committed spot */
function wallAt(cx, cy){
  const sc = getScene(G.room), a = G.spot.anchors[G.pose];
  return sc.at(a[0] + cx, a[1] + cy);
}

/* the animated white reset — the ritual at the top of every round */
const Drain = { t:0, drops:[] };
function whiteReset(){
  const m = maskFor(G.shape, G.pose);
  Drain.t = 0.8; Drain.drops = [];
  for (let i = 0; i < 26; i++)
    Drain.drops.push({ x: Math.random()*m.w, y: Math.random()*m.h,
                       v: 26 + Math.random()*40, c: G.grid ? G.grid[(Math.random()*G.grid.length)|0] : 2 });
  G.grid = newGrid(G.shape, G.pose);
  blankDirty = true;
  Audio_.sfx('drain');
}

/* ---------- editor ---------- */
const ED = {
  cx:0, cy:0, rep:0, meter:0, meterT:0, undo:[], painting:false,
  lastX:0, lastY:0, peek:0, dropper:false, dx:0, dy:0, sampled:null, recent:[],
};
function edOpen(){
  const m = maskFor(G.shape, G.pose);
  ED.cx = m.w >> 1; ED.cy = m.h >> 1; ED.undo = []; ED.dropper = false;
  ED.dx = G.spot.anchors[G.pose][0] + m.w/2; ED.dy = G.spot.anchors[G.pose][1] + m.h/2;
  edMeter();
}
function edPushUndo(){
  ED.undo.push(G.grid.slice());
  if (ED.undo.length > 16) ED.undo.shift();
}
function edPaintAt(x, y, col){
  const m = maskFor(G.shape, G.pose);
  const sz = G.tool.size;
  for (let oy = 0; oy < sz; oy++) for (let ox = 0; ox < sz; ox++){
    const px = x + ox - ((sz-1) >> 1), py = y + oy - ((sz-1) >> 1);
    if (!m.liveAt(px, py)) continue;
    let c = col;
    if (G.tool.dither) c = ((px + py) % 2) ? G.slots[G.prevSlot] : G.slots[G.slot];
    G.grid[py*m.w + px] = c;
    if (G.tool.mirror){
      const mx = m.w - 1 - px;
      if (m.liveAt(mx, py)) G.grid[py*m.w + mx] = G.tool.dither ? (((mx+py)%2) ? G.slots[G.prevSlot] : G.slots[G.slot]) : c;
    }
  }
  blankDirty = true;
}
function edMeter(){
  const s = computeScore();
  ED.meter = Math.max(0, Math.min(5, Math.round(s.total / 20)));
}

function edUpdate(dt){
  if (ED.dropper) return dropperUpdate(dt);
  const m = maskFor(G.shape, G.pose);

  if (hit('pause')){ closeEditor(); return; }
  if (down('peek')) ED.peek = Math.min(1.2, ED.peek + dt); else ED.peek = Math.max(0, ED.peek - dt*3);

  // cursor with auto-repeat
  const dirs = [['left',-1,0],['right',1,0],['up',0,-1],['down',0,1]];
  let moved = false;
  for (const [k, dx, dy] of dirs){
    if (hit(k)){ ED.cx += dx; ED.cy += dy; ED.rep = -0.14; moved = true; }
  }
  if (!moved){
    let ax = (down('right')?1:0) - (down('left')?1:0);
    let ay = (down('down')?1:0) - (down('up')?1:0);
    if (ax || ay){
      ED.rep += dt;
      while (ED.rep >= 1/12){ ED.rep -= 1/12; ED.cx += ax; ED.cy += ay; moved = true; }
    } else ED.rep = 0;
  }
  ED.cx = Math.max(0, Math.min(m.w-1, ED.cx));
  ED.cy = Math.max(0, Math.min(m.h-1, ED.cy));

  // paint (hold Z, interpolated so fast strokes leave no gaps)
  if (down('ok')){
    if (!ED.painting){ edPushUndo(); ED.painting = true; ED.lastX = ED.cx; ED.lastY = ED.cy; }
    const steps = Math.max(1, Math.round(Math.hypot(ED.cx-ED.lastX, ED.cy-ED.lastY)));
    for (let i = 1; i <= steps; i++){
      edPaintAt(Math.round(ED.lastX + (ED.cx-ED.lastX)*i/steps),
                Math.round(ED.lastY + (ED.cy-ED.lastY)*i/steps), G.slots[G.slot]);
    }
    ED.lastX = ED.cx; ED.lastY = ED.cy;
    if (moved) Audio_.sfx('brush');
  } else if (ED.painting){ ED.painting = false; }

  if (hit('no')){ ED.dropper = true; Audio_.sfx('menu'); return; }

  for (let i = 0; i < 8; i++) if (hit('s'+(i+1))){
    if (i !== G.slot){ G.prevSlot = G.slot; G.slot = i; Audio_.sfx('menu'); }
  }
  if (hit('fill')){
    edPushUndo();
    if (down('no')){ for (const c of m.cells) G.grid[c.i] = G.slots[G.slot]; }   // BASE COAT
    else floodFill(ED.cx, ED.cy, G.slots[G.slot]);
    blankDirty = true; Audio_.sfx('fill');
  }
  if (hit('brushdn')) G.tool.size = Math.max(1, G.tool.size - 1);
  if (hit('brushup')) G.tool.size = Math.min(3, G.tool.size + 1);
  if (hit('mirror')) G.tool.mirror = !G.tool.mirror;
  if (hit('dither')) G.tool.dither = !G.tool.dither;
  if (hit('shadedn')){ const s = G.slots[G.slot]; G.slots[G.slot] = (s & ~3) | Math.max(0, (s&3)-1); }
  if (hit('shadeup')){ const s = G.slots[G.slot]; G.slots[G.slot] = (s & ~3) | Math.min(3, (s&3)+1); }
  if (hit('ghost')) G.ghostMode = (G.ghostMode + 1) % 3;
  if (hit('undo') && ED.undo.length){ G.grid = ED.undo.pop(); blankDirty = true; Audio_.sfx('menu'); }

  ED.meterT += dt;
  if (ED.meterT >= 0.25){ ED.meterT = 0; edMeter(); }
}
function floodFill(x, y, col){
  const m = maskFor(G.shape, G.pose);
  const target = G.grid[y*m.w + x];
  if (target === col) return;
  const q = [[x,y]];
  while (q.length){
    const [cx, cy] = q.pop();
    if (!m.liveAt(cx,cy)) continue;
    if (G.grid[cy*m.w + cx] !== target) continue;
    G.grid[cy*m.w + cx] = col;
    q.push([cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]);
  }
}

/* ---------- the eyedropper: the whole scene, a roaming crosshair ---------- */
function dropperUpdate(dt){
  const [ax, ay] = axis();
  ED.dx = Math.max(0, Math.min(VW-1, ED.dx + ax * 176 * dt));
  ED.dy = Math.max(0, Math.min(VH-1, ED.dy + ay * 176 * dt));
  if (hit('ok')){
    const sc = getScene(G.room);
    const idx = sc.at(ED.dx, ED.dy), tg = sc.tagAt(ED.dx, ED.dy);
    G.slots[G.slot] = idx;
    G.slotTag[G.slot] = TAGNAMES[tg];
    G.tags.add(TAGNAMES[tg]);
    ED.sampled = { idx, tag:TAGNAMES[tg] };
    ED.recent.unshift(idx); if (ED.recent.length > 8) ED.recent.pop();
    Audio_.sfx('drop');
  }
  for (let i = 0; i < 8; i++) if (hit('s'+(i+1))){ G.prevSlot = G.slot; G.slot = i; Audio_.sfx('menu'); }
  if (hit('no') || hit('pause')){ ED.dropper = false; Audio_.sfx('menu'); }
}

/* ---------- editor rendering ---------- */
const CELL = 8, GX = 8, GY = 10;
function edDraw(c){
  rect(c, 0, 0, VW, VH, UI.BLACK);
  if (ED.dropper) return dropperDraw(c);

  const m = maskFor(G.shape, G.pose), sc = getScene(G.room), a = G.spot.anchors[G.pose];
  const scale = Math.min(CELL, Math.floor(176 / m.w), Math.floor(160 / m.h));

  // the wall patch behind the grid
  if (G.ghostMode === 2 || G.ghostMode === 1)
    c.drawImage(sc.cv, a[0], a[1], m.w, m.h, GX, GY, m.w*scale, m.h*scale);

  for (const cell of m.cells){
    const x = GX + cell.cx*scale, y = GY + cell.cy*scale;
    const mine = G.grid[cell.i], wall = sc.at(a[0]+cell.cx, a[1]+cell.cy);
    if (G.ghostMode === 0){ rect(c, x, y, scale, scale, PAL[mine]); }
    else if (G.ghostMode === 1){
      // WEAVE: 2px checker of your colour against the wall's

  txt(c, fmtClock(Math.max(0, Math.ceil(G.prep))), 192, 124, UI.WHITE);

/* ==================== 08_score.js ==================== */
/* ---------- scoring: five bars, deterministic, no RNG ---------- */
function stdev(arr){
  if (!arr.length) return 0;
  let m = 0; for (const v of arr) m += v; m /= arr.length;
  let s = 0; for (const v of arr) s += (v - m) * (v - m);
  return Math.sqrt(s / arr.length);
}

function computeScore(){
  if (!G.spot || !G.grid) return { total:0, paint:0, texture:0, pose:0, spot:0, nerve:0, cellM:null };
  const m = maskFor(G.shape, G.pose);
  const sc = getScene(G.room), a = G.spot.anchors[G.pose], tex = G.spot.textured;

  // 1. PAINT (50) — edge cells count triple
  let num = 0, den = 0;
  const cellM = new Float32Array(m.w * m.h).fill(-1);
  const bodyL = [], wallL = [];
  for (const cell of m.cells){
    const wall = sc.at(a[0] + cell.cx, a[1] + cell.cy);
    const mine = G.grid[cell.i];
    const mv = match(mine, wall, tex);
    cellM[cell.i] = mv;
    const w = cell.edge ? 3 : 1;
    num += w * mv; den += w;
    bodyL.push(LUM[mine]); wallL.push(LUM[wall]);
  }
  const raw = den ? num / den : 0;                  // unclamped weighted match, 0..1
  let paint = 50 * raw;
  // flattening only helps if there is actually something to flatten:
  // a single-colour base coat earns no craft bonus.
  const distinct = new Set(); for (const cell of m.cells) distinct.add(G.grid[cell.i]);
  if (G.pose === 'FLATTEN' && distinct.size > 1) paint *= 1.15;
  paint = Math.min(50, paint);

  // 2. TEXTURE (12) — does your roughness match the surface's?
  // a flat body over a varied surface reads as a sticker — punish it hard
  const texture = 12 * (1 - Math.min(1, Math.abs(stdev(bodyL) - stdev(wallL)) / 18));

  // 3. POSE (20)
  const poseFit = (G.shape === G.spot.wantShape && G.pose === G.spot.wantPose) ? 1.00
                : (G.pose === G.spot.wantPose) ? 0.65
                : (G.shape === G.spot.wantShape) ? 0.50 : 0.20;
  const pose = 20 * poseFit;

  // 4. SPOT (12) — plausibility: does your body actually fit here?
  const sp = G.spot;
  let overhang = 0;
  overhang += Math.max(0, sp.coverX - a[0]);
  overhang += Math.max(0, (a[0] + m.w) - (sp.coverX + sp.coverW));
  overhang += Math.max(0, sp.coverY - a[1]);
  overhang += Math.max(0, (a[1] + m.h) - (sp.coverY + sp.coverH));
  const slack = (sp.coverW - m.w) + (sp.coverH - m.h);
  let pl;
  if (sp.absurd.indexOf(G.pose) >= 0) pl = 0.15;
  else if (overhang > 2) pl = 0.15;
  else if (overhang > 0 || slack > 26) pl = 0.60;
  else pl = 1.00;
  const spot = 12 * pl;

  // 5. NERVE (6) — you get paid for choosing danger
  const nerve = 6 * (sp.exposure / 5);

  const total = Math.round(paint + texture + pose + spot + nerve);
  return { total, paint, texture, pose, spot:spot, nerve, poseFit, pl, cellM, raw,
           overhang, wantShape:sp.wantShape, wantPose:sp.wantPose };
}

const GRADES = [[92,'THE WALL ITSELF'],[80,'A'],[66,'B'],[50,'C'],[34,'D'],[-1,'IS THAT A GUY']];
function gradeFor(s){ for (const [t, g] of GRADES) if (s >= t) return g; return 'IS THAT A GUY'; }
const GRADEWORD = s => s >= 92 ? 'SEAMLESS' : s >= 80 ? 'CLOSE' : s >= 66 ? 'PASSABLE'
                     : s >= 50 ? 'ROUGH' : s >= 34 ? 'OBVIOUS' : 'A WHITE SHAPE';

/* which bar leaked the most points — drives the critique line and the bark */
function worstCategory(b){
  const loss = [['PAINT', 50 - b.paint], ['TEXTURE', 12 - b.texture], ['POSE', 20 - b.pose],
                ['SPOT', 12 - b.spot], ['NERVE', 6 - b.nerve]];
  loss.sort((x, y) => y[1] - x[1]);
  return loss[0][0];
}
function critiqueLine(b){
  const w = worstCategory(b);
  if (w === 'PAINT')   return 'YOUR COLOUR IS THE PROBLEM. THE EDGES MOST OF ALL.';
  if (w === 'TEXTURE') return b.texture < 6
                              ? 'FLAT PAINT ON A ROUGH SURFACE. IT READS AS A STICKER.'
                              : 'YOUR ROUGHNESS DOES NOT MATCH THIS SURFACE.';
  if (w === 'POSE')    return 'WRONG SHAPE FOR THIS PLACE. TRY ' + b.wantShape + ' + ' + b.wantPose + '.';
  if (w === 'SPOT')    return 'YOU DO NOT FIT HERE. PARTS OF YOU ARE SIMPLY OUT IN THE OPEN.';
  return 'SAFE CHOICE. SAFE DOES NOT PAY.';
}

/* worst 5x5 window — the double-take zooms here */
function worstWindow(){
  const m = maskFor(G.shape, G.pose), b = computeScore();
  let best = null, bestV = 2;
  for (let y = 0; y <= m.h - 5; y++) for (let x = 0; x <= m.w - 5; x++){
    let s = 0, n = 0;
    for (let oy = 0; oy < 5; oy++) for (let ox = 0; ox < 5; ox++){
      const v = b.cellM[(y+oy)*m.w + (x+ox)];
      if (v >= 0){ s += v; n++; }
    }
    if (n < 6) continue;
    const mean = s / n;
    if (mean < bestV){ bestV = mean; best = { x, y, mean }; }
  }
  return best || { x:0, y:0, mean:1 };
}


/* ==================== 09_hide.js ==================== */
/* ---------- THE HIDE: the seeker walks the room and checks the hiding places ---------- */
const HIDE = {
  t:0, len:75, susp:0, breath:100, found:false, over:false, overT:0,
  sk:{ x:0, y:0, fx:0, fy:1, mode:'WALK', target:null, pauseT:0, order:[], oi:0, pass:1 },
  rivals:[], msgs:[], stare:0, relocT:0, doubleT:0, lastInspect:null, canMove:false,
};

function hideBegin(){
  const room = ROOMS[G.room];
  const b = computeScore(); G.bars = b; G.score = b.total;
  HIDE.t = 0; HIDE.len = room.hideLen || 75;
  HIDE.susp = 0; HIDE.breath = 100; HIDE.found = false; HIDE.over = false; HIDE.overT = 0;
  HIDE.msgs = []; HIDE.stare = 0; HIDE.relocT = 0; HIDE.doubleT = 0; HIDE.lastInspect = null;

  // the other Blanks hide too, and are scored by the same yardstick
  const others = room.spots.filter(s => s !== G.spot);
  HIDE.rivals = RIVAL_NAMES.map((n, i) => ({
    name: n,
    score: n === 'SPLOTCH' ? 14 + ((G.round * 7 + i * 13) % 12)
                           : 44 + ((G.round * 11 + i * 29) % 40),
    spot: others[(i * 2 + G.round) % others.length],
    found: false,
  }));

  // the seeker checks every spot, in a shuffled order
  const order = room.spots.map((s, i) => i);
  for (let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = order[i]; order[i] = order[j]; order[j] = t;
  }
  const sk = HIDE.sk;
  sk.order = order; sk.oi = 0; sk.pass = 1; sk.mode = 'WALK'; sk.pauseT = 0;
  sk.x = room.start[0]; sk.y = room.start[1] + 8;
  sk.target = room.spots[order[0]];
  G.st = 'HIDE';
  Audio_.music('hunt', 92 + (100 - G.score) * 0.35);
  pushMsg(LOOKERS[room.looker].name + ' IS LOOKING.');
}
function pushMsg(s){ HIDE.msgs.unshift({ s, t: 3.2 }); if (HIDE.msgs.length > 3) HIDE.msgs.pop(); }

/* is the seeker's cone on a point? */
function skSees(x, y){
  const sk = HIDE.sk;
  const dx = x - sk.x, dy = y - sk.y, d = Math.hypot(dx, dy);
  if (d > 84 || d < 1) return 0;
  const dot = (dx/d) * sk.fx + (dy/d) * sk.fy;
  if (dot < 0.80) return 0;
  return 1 - d / 84;                                   // 0..1, closer = stronger
}

function hideUpdate(dt){
  if (HIDE.over){
    HIDE.overT += dt;
    if (Dlg.active){ Dlg.update(dt); return; }
    if (HIDE.overT > 0.6 && hit('ok')) resultsBegin();
    return;
  }
  if (Dlg.active){ Dlg.update(dt); return; }

  HIDE.t += dt;
  const room = ROOMS[G.room], sk = HIDE.sk;
  const myAnchor = G.spot.anchors[G.pose];
  const myX = myAnchor[0] + G.gridW/2, myY = myAnchor[1] + G.gridH/2;

  // ---- breath ----
  const holding = down('no') && HIDE.breath > 0;
  if (holding){ HIDE.breath = Math.max(0, HIDE.breath - 34*dt); }
  else HIDE.breath = Math.min(100, HIDE.breath + 14*dt);

  // ---- relocate: only when it is not looking anywhere near you ----
  const seen = skSees(myX, myY);
  const inspectingMe = sk.mode === 'INSPECT' && sk.target === G.spot;
  // you may only slip away when it is far off AND not stood there studying your spot
  const canMove = !seen && !inspectingMe && Math.hypot(sk.x - myX, sk.y - myY) > 92;
  HIDE.canMove = canMove;
  if (HIDE.relocT > 0) HIDE.relocT -= dt;
  if (canMove && HIDE.relocT <= 0 && hit('ok')){
    const list = room.spots;
    let i = list.indexOf(G.spot);
    for (let k = 1; k <= list.length; k++){
      const cand = list[(i + k) % list.length];
      if (HIDE.rivals.some(r => !r.found && r.spot === cand)) continue;
      G.spot = cand; break;
    }
    const b = computeScore(); G.bars = b; G.score = b.total;
    HIDE.relocT = 1.2; HIDE.susp = Math.min(100, HIDE.susp + 8);
    pushMsg('YOU MOVED TO ' + G.spot.name + '.');
    Audio_.sfx('brush');
  }

  // ---- seeker ----
  if (sk.mode === 'WALK'){
    const t = sk.target;
    const tx = t.walk[0], ty = t.walk[1];
    const dx = tx - sk.x, dy = ty - sk.y, d = Math.hypot(dx, dy);
    if (d < 2){
      sk.mode = 'INSPECT'; sk.pauseT = 0;
      // face the spot it came to check
      const cdx = (t.coverX + t.coverW/2) - sk.x, cdy = (t.coverY + t.coverH/2) - sk.y;
      const cd = Math.hypot(cdx, cdy) || 1; sk.fx = cdx/cd; sk.fy = cdy/cd;
      HIDE.lastInspect = t;
    } else {
      const sp = 46 * dt;
      sk.x += dx/d * sp; sk.y += dy/d * sp;
      sk.fx = dx/d; sk.fy = dy/d;
    }
  } else if (sk.mode === 'INSPECT'){
    sk.pauseT += dt;
    const t = sk.target;
    // rivals hidden here get resolved
    for (const r of HIDE.rivals){
      if (r.found || r.spot !== t) continue;
      if (sk.pauseT > 1.1){
        const bar = 34 + HIDE.t * 0.55 + (sk.pass - 1) * 18;
        if (r.score < bar){
          r.found = true;
          pushMsg(r.name + ' WAS FOUND.');
          Audio_.sfx('bad');
        }
      }
    }
    // you
    if (t === G.spot){
      HIDE.stare = 1;
      // a great paint job is looked straight at and survives it; a bad one does not
      const miss = Math.max(0, 1 - G.score/100);
      const base = 54 * Math.pow(miss, 1.6) + (sk.pass - 1) * 3;
      let rate = base;
      if (holding) rate *= 0.42;
      HIDE.susp += rate * dt;
      if (down('left') || down('right') || down('up') || down('down')){
        HIDE.susp += 30 * dt;                          // flinching is fatal
      }
    }
    if (sk.pauseT > 2.2){
      sk.mode = 'WALK'; sk.oi++;
      if (sk.oi >= sk.order.length){ sk.oi = 0; sk.pass++; }
      sk.target = room.spots[sk.order[sk.oi]];
      // a near miss makes it come back
      if (t === G.spot && HIDE.susp > 55 && HIDE.doubleT === 0){
        HIDE.doubleT = 1; sk.target = t; sk.oi--;
        pushMsg('...IT IS COMING BACK.');
      }
    }
  }

  // passive attention while it merely walks past
  if (sk.mode === 'WALK' && seen > 0){
    let rate = 20 * Math.pow(Math.max(0, 1 - G.score/100), 1.6) * seen;
    if (holding) rate *= 0.42;
    HIDE.susp += rate * dt;
    HIDE.stare = Math.max(HIDE.stare, seen);
  } else if (sk.mode !== 'INSPECT' || sk.target !== G.spot){
    HIDE.susp -= 4 * dt;
    HIDE.stare = Math.max(0, HIDE.stare - dt * 2);
  }
  HIDE.susp = Math.max(0, HIDE.susp);

  for (const m of HIDE.msgs) m.t -= dt;
  HIDE.msgs = HIDE.msgs.filter(m => m.t > 0);

  if (HIDE.susp >= 100) return hideEnd(true);
  if (HIDE.t >= HIDE.len) return hideEnd(false);
}

function hideEnd(found){
  HIDE.found = found; HIDE.over = true; HIDE.overT = 0;
  G.st = 'HIDE';
  Audio_.music(null);
  const L = LOOKERS[ROOMS[G.room].looker];
  if (found){
    G.caught++;
    Audio_.sfx('ko');
    Dlg.queue(L.capture, { voice:L.voice });
  } else {
    G.survived++;
    Audio_.sfx('win');
    const cat = worstCategory(G.bars);
    const line = G.score >= 88 ? L.barks.great : G.score >= 74 ? L.barks.near
               : (L.barks[cat] || L.barks.PAINT);
    Dlg.queue([{ t: line }, ...L.depart], { voice:L.voice, mono:false });
  }
}

/* ---------- drawing ---------- */
function hideDraw(c){
  const room = ROOMS[G.room], sc = getScene(G.room), sk = HIDE.sk;
  c.drawImage(sc.cv, 0, 0);

  // every hidden Blank is actually in the room
  for (const r of HIDE.rivals){
    if (r.found) continue;
    drawRival(c, r);
  }
  if (blankDirty) bakeBlank();
  const a = G.spot.anchors[G.pose];
  c.drawImage(blankSprite, a[0], a[1]);

  drawSkCone(c);
  drawSeekerWorld(c, sk.x, sk.y, LOOKERS[room.looker]);

  // found rivals get a marker where they were
  for (const r of HIDE.rivals){
    if (!r.found) continue;
    const ra = r.spot.anchors[r.spot.wantPose];
    txt(c, 'X', ra[0] + 4, ra[1] + 4, UI.SOUL);
  }

  // ---- HUD ----
  rect(c, 0, 0, VW, 22, UI.BLACK);
  txt(c, 'SUSPICION', 4, 2, UI.WHITE);
  rect(c, 4, 12, 108, 7, UI.BLOOD);
  const sw = Math.round(108 * Math.min(100, HIDE.susp) / 100);
  const hot = HIDE.susp >= 80 && (frameCount % 6 < 3);
  rect(c, 4, 12, sw, 7, hot ? UI.WHITE : (HIDE.susp > 55 ? UI.SOUL : UI.GOLD));

  txt(c, 'BREATH', 124, 2, HIDE.breath > 25 ? UI.DIM : UI.SOUL);
  rect(c, 124, 12, 64, 7, UI.BLOOD);
  rect(c, 124, 12, Math.round(64 * HIDE.breath / 100), 7, UI.CYAN);

  const left = Math.max(0, Math.ceil(HIDE.len - HIDE.t));
  txt(c, 'TIME ' + fmtClock(left), 202, 2, UI.WHITE);
  const alive = HIDE.rivals.filter(r => !r.found).length + 1;
  txt(c, 'HIDING ' + alive + '/' + (HIDE.rivals.length + 1), 202, 12, UI.DIM);
  txt(c, 'CAMO ' + G.score, 268, 2, UI.GOLD);

  // messages
  for (let i = 0; i < HIDE.msgs.length; i++){
    const s2 = HIDE.msgs[i].s, y = 25 + i*11;
    rect(c, 2, y - 1, txtW(s2) + 4, 10, UI.BLACK);
    txt(c, s2, 4, y, i === 0 ? UI.WHITE : UI.GHOST);
  }

  // the tense bit
  if (HIDE.stare > 0.05 && !HIDE.over){
    const y = 200;
    rect(c, 0, y, VW, 12, UI.BLACK);
    txtC(c, HIDE.sk.mode === 'INSPECT' && HIDE.sk.target === G.spot
            ? 'IT IS LOOKING RIGHT AT YOU. HOLD STILL.'
            : 'IT IS LOOKING THIS WAY.', 160, y + 2, UI.SOUL);
    if (frameCount % 30 < 15) frame(c, 0, 0, VW, VH, 1, UI.SOUL);
  }

  rect(c, 0, 226, VW, 14, UI.BLACK);
  if (HIDE.over){
    txtC(c, HIDE.found ? 'FOUND.' : 'NOT FOUND.', 160, 228, HIDE.found ? UI.SOUL : UI.GOLD);
  } else {
    txtC(c, 'X HOLD BREATH' + (HIDE.canMove ? '    Z MOVE SPOTS' : '    DO NOT MOVE'),
         160, 228, UI.DIM);
  }
  Dlg.draw(c);
}
function drawSkCone(c){
  const sk = HIDE.sk;
  // brighter while it has actually stopped to look at something
  const staring = sk.mode === 'INSPECT';
  const col = staring ? UI.WHITE : UI.GHOST;
  const gap = staring ? 3 : 4;
  for (let r = 10; r < 84; r += 2){
    const halfw = Math.round(r * 0.62);
    for (let s = -halfw; s <= halfw; s += 2){
      const px = Math.round(sk.x + sk.fx*r - sk.fy*s);
      const py = Math.round(sk.y + sk.fy*r + sk.fx*s);
      if (px < 0 || py < 0 || px >= VW || py >= VH) continue;
      if ((px + py) % gap === 0) rect(c, px, py, 1, 1, col);
    }
  }
}

/* ---------- audio: everything synthesised, nothing sampled ---------- */
const Audio_ = {
  ctx:null, master:null, muted:false, voices:0, track:null, bpm:96,
  nextNote:0, step:0, timer:null,

  start(){
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.35;
    const comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 8;
    comp.attack.value = 0.003; comp.release.value = 0.12;
    this.master.connect(comp); comp.connect(this.ctx.destination);
    this.timer = setInterval(() => this.scheduler(), 25);
  },
  toggleMute(){
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.35;
  },
  tone(type, freq, dur, gain, when, slideTo){
    if (!this.ctx || this.muted) return;
    if (this.voices > 8) return;
    const t = when || this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
    this.voices++;
    o.onended = () => { this.voices--; };
  },
  noise(dur, gain, when, f0, f1){
    if (!this.ctx || this.muted) return;
    const t = when || this.ctx.currentTime;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const b = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const s = this.ctx.createBufferSource(); s.buffer = b;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.setValueAtTime(f0 || 1200, t);
    if (f1) bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = this.ctx.createGain(); g.gain.value = gain;
    s.connect(bp); bp.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur);
  },
  blip(v){
    v = v || VOICE.plain;
    const det = 1 + (Math.random()*0.07 - 0.035);
    this.tone(v.type, v.freq * det, v.dur, v.gain);
  },
  sfx(k){
    const C = this.ctx; if (!C) return;
    const t = C.currentTime;
    switch(k){
      case 'menu':     this.tone('square', 440, 0.04, 0.06); break;
      case 'confirm':  this.tone('square', 660, 0.06, 0.08); this.tone('square', 880, 0.06, 0.05, t+0.05); break;
      case 'back':     this.tone('square', 300, 0.07, 0.06); break;
      case 'brush':    this.noise(0.03, 0.035, t, 2600); break;
      case 'fill':     this.noise(0.14, 0.05, t, 500, 2000); break;
      case 'drop':     this.tone('sine', 900, 0.14, 0.11, t, 280); this.noise(0.04, 0.05, t, 1800); break;
      case 'drain':    this.tone('sine', 700, 0.30, 0.10, t, 180); this.noise(0.04, 0.04, t+0.02, 900); break;
      case 'commit':   this.tone('triangle', 220, 0.20, 0.10); this.tone('triangle', 330, 0.20, 0.07, t+0.06); break;
      case 'encounter':this.tone('square', 180, 0.10, 0.10); this.tone('square', 150, 0.16, 0.10, t+0.10);
                       this.noise(0.12, 0.05, t, 800, 2400); break;
      case 'hurt':     this.tone('sawtooth', 200, 0.16, 0.13, t, 90); this.noise(0.09, 0.07, t, 400); break;
      case 'heal':     this.tone('sine', 520, 0.10, 0.09); this.tone('sine', 780, 0.12, 0.07, t+0.08); break;
      case 'perfect':  [523,659,784,1047].forEach((f,i) => this.tone('square', f, 0.09, 0.08, t+i*0.05)); break;
      case 'good':     this.tone('square', 523, 0.08, 0.07); this.tone('square', 659, 0.09, 0.06, t+0.06); break;
      case 'bad':      this.tone('sawtooth', 150, 0.16, 0.09, t, 80); break;
      case 'ko':       this.tone('sawtooth', 330, 0.9, 0.13, t, 80);
                       for (let i = 0; i < 8; i++) this.noise(0.05, 0.05, t + i*0.03, 1600); break;
      case 'win':      [392,523,659,784].forEach((f,i) => this.tone('triangle', f, 0.16, 0.09, t+i*0.09)); break;
      case 'meh':      this.tone('triangle', 330, 0.2, 0.08); this.tone('triangle', 262, 0.3, 0.08, t+0.16); break;
    }
  },
  music(name, bpm){ this.track = name; this.bpm = bpm || 96; this.step = 0; this.nextNote = 0; },
  scheduler(){
    const C = this.ctx; if (!C || this.muted || !this.track) return;
    const spb = 60 / this.bpm / 2;                       // eighth notes
    if (!this.nextNote) this.nextNote = C.currentTime;
    while (this.nextNote < C.currentTime + 0.1){
      this.playStep(this.step, this.nextNote);
      this.step++; this.nextNote += spb;
    }
  },
  playStep(s, t){
    const A = [220,246.94,261.63,293.66,329.63,349.23,392];    // A natural minor
    const bar = s % 16;
    if (this.track === 'sweep'){
      if (bar % 2 === 0) this.tone('square', A[(s*3) % 7] * 2, 0.07, 0.035, t);
      if (bar % 8 === 0) this.tone('triangle', A[s % 3] / 2, 0.28, 0.075, t);
      if (bar % 4 === 2) this.noise(0.03, 0.022, t, 5200);
    } else if (this.track === 'reveal'){
      if (bar % 4 === 0) this.tone('triangle', A[(s*2) % 7], 0.30, 0.055, t);
      if (bar % 8 === 4) this.tone('sine', A[(s) % 7] * 2, 0.24, 0.035, t);
    } else if (this.track === 'coda'){
      if (bar % 8 === 0) this.tone('sine', A[(s/8) % 7 | 0], 1.2, 0.05, t);
    } else if (this.track === 'hub'){
      if (bar % 6 === 0) this.tone('triangle', A[(s*5) % 7], 0.22, 0.045, t);
      if (bar % 16 === 0) this.tone('sine', A[0] / 2, 0.8, 0.04, t);
    }
  },
};


/* ==================== 14_boot.js ==================== */
/* ---------- title ---------- */
const TITLE = { t:0 };
function titleReset(){
  TITLE.t = 0;
  G.round = 0; G.night = 1; G.caught = 0; G.survived = 0; G.history = [];
  G.tags = new Set(); G.best = 0; G.seenIntro = {};
  G.slots = new Uint8Array([31,31,31,31,31,31,31,31]);
  G.slotTag = ['','','','','','','',''];
  G.spot = null;
  setPose('BLOB','STAND');
  enterRoom('CH1');
}
function titleUpdate(dt){
  TITLE.t += dt;
  if (hit('ok')){
    Dlg.queue([{t:'YOU ARE A BLANK. PURE WHITE, STRAIGHT OUT OF THE TIN.'},
               {t:'THE RULES ARE SIMPLE. PAINT YOURSELF TO MATCH SOMETHING.'},
               {t:'THEN GET INTO IT AND DO NOT MOVE WHILE THEY LOOK.'}],
              { voice:VOICE.plain, onEnd(){ newRound(); } });
    G.st = 'PAINT';
  }
}
function titleDraw(c){
  rect(c, 0, 0, VW, VH, UI.BLACK);
  const sc = getScene('CH1');
  c.drawImage(sc.cv, 0, 56, 320, 128, 0, 56, 320, 128);
  wash(c, 9);
  txtC(c, 'WET PAINT', 160, 34, UI.WHITE, 3);
  txtC(c, 'PAINT YOURSELF. HOLD STILL.', 160, 68, UI.GOLD);
  // a Blank half-painted into the brick
  const bob = Math.round(Math.sin(TITLE.t * 2));
  for (let y = 0; y < 20; y++) for (let x = 0; x < 11; x++){
    if (x === 0 && y === 0) continue;
    const painted = y > 9;
    rect(c, 155 + x, 118 + y + bob, 1, 1, painted ? PAL[1 + (x % 2)] : PAL[31]);
  }
  if (Math.floor(TITLE.t * 2) % 2) txtC(c, 'PRESS Z', 160, 182, UI.WHITE);
  txtC(c, 'ARROWS MOVE   Z CONFIRM   X CANCEL / HOLD BREATH', 160, 208, UI.DIM);
  txtC(c, 'AN ORIGINAL GAME  —  NO ASSETS, NO NETWORK', 160, 222, UI.GHOST);
  Dlg.draw(c);
}

/* ---------- pause ---------- */
let paused = false;
function pauseDraw(c){
  wash(c, 12);
  panel(c, 84, 78, 152, 84, 2, UI.WHITE);
  txtC(c, 'PAUSED', 160, 90, UI.GOLD);
  txtC(c, 'Z  RESUME', 160, 110, UI.WHITE);
  txtC(c, 'M  ' + (Audio_.muted ? 'UNMUTE' : 'MUTE'), 160, 124, UI.WHITE);
  txtC(c, 'X  QUIT TO TITLE', 160, 138, UI.DIM);
}

/* ---------- main loop ---------- */
let frameCount = 0, last = 0, acc = 0;
function update(dt){
  fadeUpdate(dt);
  if (G.fadeDir) return;
  if (paused){
    if (hit('ok') || hit('pause')) paused = false;
    if (hit('no')){ paused = false; G.st = 'TITLE'; titleReset(); }
    return;
  }
  if (hit('pause') && (G.st === 'PAINT' || G.st === 'HIDE') && !Dlg.active){ paused = true; return; }

  switch(G.st){
    case 'TITLE':  titleUpdate(dt); break;
    case 'PAINT':
      if (!Dlg.active && G.spot !== null) { /* timer only runs once you can act */ }
      if (!Dlg.active){
        G.prep -= dt;
        if (G.prep <= 0){ G.prep = 0; if (G.spot) { readyUp(); break; }
                          else { G.spot = ROOMS[G.room].spots[0]; readyUp(); break; } }
      }
      owUpdate(dt); break;
    case 'EDITOR':
      if (!Dlg.active){
        G.prep -= dt;
        if (G.prep <= 0){ G.prep = 0; closeEditor(); readyUp(); break; }
      }
      edUpdate(dt); break;
    case 'HIDE':   hideUpdate(dt); break;
    case 'RESULT': resultsUpdate(dt); break;
  }
  shakeUpdate(dt);
  for (const k in buffered) if (buffered[k] > 0) buffered[k] -= dt;
}
function render(){
  switch(G.st){
    case 'TITLE':  titleDraw(ctx); break;
    case 'PAINT':  owDraw(ctx); break;
    case 'EDITOR': edDraw(ctx); break;
    case 'HIDE':   hideDraw(ctx); break;
    case 'RESULT': resultsDraw(ctx); break;
  }
  if (paused) pauseDraw(ctx);
  if (G.fade > 0) wash(ctx, G.fade);
  vctx.fillStyle = '#000'; vctx.fillRect(0, 0, view.width, view.height);
  vctx.drawImage(buf, 0, 0, VW, VH, shakeX*SCALE, shakeY*SCALE, VW*SCALE, VH*SCALE);
}
function loop(now){
  requestAnimationFrame(loop);
  if (!last) last = now;
  let dt = (now - last) / 1000; last = now;
  acc += Math.min(dt, 0.25);
  let steps = 0;
  while (acc >= STEP && steps < 5){
    if (hitstop > 0) hitstop -= STEP; else update(STEP);
    acc -= STEP; steps++; frameCount++;
  }
  render();
}

/* ---------- boot ---------- */
function boot(){
  bakeDither();
  resize();
  setPose('BLOB','STAND');
  for (const k of MAPS) getScene(k);
  enterRoom('CH1');
  G.st = 'TITLE';
  const h = location.hash;
  const m = h.match(/^#m(\d)$/);
  if (m){
    const n = parseInt(m[1], 10);
    if (n >= 1 && n <= MAPS.length){ G.round = n - 1; newRound(); }
  }
  if (h === '#paint'){
    G.round = 0; newRound();
    G.spot = ROOMS.CH1.spots[0]; G.st = 'EDITOR'; edOpen();
  }
  requestAnimationFrame(loop);
  if (location.hash === '#smoke') runSmoke();
}


/* ==================== 15_smoke.js ==================== */
/* ---------- headless self-test: #smoke ---------- */
function runSmoke(){
  const out = [];
  const ok = (n, c) => out.push((c ? 'PASS  ' : 'FAIL  ') + n);
  const guard = (n, fn) => { try { fn(); ok(n, true); } catch(e){ ok(n + ' -> ' + e.message, false); } };

  for (const [n, c] of paletteAudit()) ok(n, c);
  ok('font has 95 glyphs', FONTDATA.blob.length === 95 * 7);
  ok('atlas bakes', atlas(UI.WHITE).width === 96 && atlas(UI.WHITE).height === 48);

  let maskOk = true, edgeOk = true;
  for (const sh of ['BLOB','CUBE']) for (const po of ['STAND','CURL','LIE','FLATTEN']){
    const m = maskFor(sh, po);
    if (m.count < 100 || m.count > m.w * m.h) maskOk = false;
    if (m.edges < 20) edgeOk = false;
  }
  ok('all 8 masks have sane cell counts', maskOk);
  ok('all 8 masks have edge cells', edgeOk);

  // maps
  let fits = true, walkOk = true, bad = '';
  for (const key of MAPS){
    const room = ROOMS[key], sc = getScene(key);
    for (const s of room.spots){
      const m = maskFor(s.wantShape, s.wantPose);
      if (m.w > s.coverW || m.h > s.coverH){ fits = false; bad = key + '/' + s.id; }
      for (const p in s.anchors){
        const a = s.anchors[p], mm = maskFor(s.wantShape, p);
        if (a[0] < 0 || a[1] < 0 || a[0]+mm.w > VW || a[1]+mm.h > VH){ fits = false; bad = key+'/'+s.id+'/'+p; }
      }
      if (sc.solidAt(s.walk[0], s.walk[1])){ walkOk = false; bad = key+'/'+s.id+' walk'; }
    }
    if (room.spots.length < 4){ fits = false; bad = key + ' too few spots'; }
  }
  ok('every ideal pose fits its cover rect' + (bad ? ' (' + bad + ')' : ''), fits);
  ok('every spot is reachable on foot' + (!walkOk ? ' (' + bad + ')' : ''), walkOk);
  ok('5 maps', MAPS.length === 5);

  let flat = '', offPal = false;
  for (const key of MAPS){
    const sc = getScene(key), seen = new Set();
    for (let i = 0; i < sc.idx.length; i += 7){ seen.add(sc.idx[i]); if (sc.idx[i] > 31) offPal = true; }
    if (seen.size < 4) flat = key;
  }
  ok('no map is flat' + (flat ? ' (' + flat + ')' : ''), !flat);
  ok('every scene pixel is inside the 32-colour palette', !offPal);

  // ---- scoring ----
  G.round = 0; newRound(); Dlg.active = false;
  const room = ROOMS.CH1;
  G.spot = room.spots[0];
  setPose(G.spot.wantShape, G.spot.wantPose);
  const white = computeScore();
  const m0 = maskFor(G.shape, G.pose), a0 = G.spot.anchors[G.pose], sc0 = getScene('CH1');
  for (const cell of m0.cells) G.grid[cell.i] = sc0.at(a0[0]+cell.cx, a0[1]+cell.cy);
  blankDirty = true;
  const perfect = computeScore();
  ok('a pure white body scores badly (' + white.total + ')', white.total < 45);
  ok('copying the wall exactly scores high (' + perfect.total + ')', perfect.total >= 88);

  const edgeCell = m0.cells.find(c => c.edge), midCell = m0.cells.find(c => !c.edge);
  const bak = G.grid.slice();
  G.grid[edgeCell.i] = WHITE_IDX; const dEdge = perfect.raw - computeScore().raw;
  G.grid = bak.slice();
  G.grid[midCell.i] = WHITE_IDX; const dMid = perfect.raw - computeScore().raw;
  G.grid = bak.slice();
  ok('an edge cell is worth ~3x an interior one (' + dEdge.toFixed(4) + ' vs ' + dMid.toFixed(4) + ')',
     dMid > 0 && dEdge/dMid > 2.5 && dEdge/dMid < 3.5);

  setPose('BLOB','LIE');
  const wrong = computeScore();
  ok('the wrong pose is a disaster (' + wrong.total + ')', wrong.total < perfect.total - 20);
  setPose(room.spots[0].wantShape, room.spots[0].wantPose);
  G.grid = bak.slice(); blankDirty = true;

  const wallIdx = sc0.at(a0[0] + (m0.w>>1), a0[1] + (m0.h>>1));
  for (const cell of m0.cells) G.grid[cell.i] = wallIdx;
  const flatCoat = computeScore();
  ok('base coat alone caps below 67 (' + flatCoat.total + ')', flatCoat.total < 67);
  G.grid = bak.slice(); blankDirty = true;

  // ---- the hide phase is where camo pays off ----
  const runHide = (grid, holdBreath) => {
    G.grid = grid.slice(); blankDirty = true;
    G.spot = room.spots[0]; setPose(room.spots[0].wantShape, room.spots[0].wantPose);
    hideBegin(); Dlg.active = false;
    held.no = !!holdBreath;
    let steps = 0;
    while (!HIDE.over && steps < 60 * 200){ hideUpdate(STEP); steps++; }
    held.no = false;
    return { found: HIDE.found, secs: steps/60, score: G.score };
  };
  const whiteGrid = new Uint8Array(m0.w*m0.h).fill(WHITE_IDX);
  const rBad = runHide(whiteGrid, false);
  const rGood = runHide(bak, false);
  ok('a pure white body gets found (camo ' + rBad.score + ')', rBad.found);
  ok('a wall-perfect body survives the round (camo ' + rGood.score + ')', !rGood.found);
  ok('the round always ends', rBad.secs < 200 && rGood.secs < 200);

  const rBadBreath = runHide(whiteGrid, true);
  ok('holding your breath buys real time (' + rBad.secs.toFixed(1) + 's vs ' + rBadBreath.secs.toFixed(1) + 's)',
     rBadBreath.secs > rBad.secs + 1);

  // the seeker really does patrol and check spots (needs a body that survives long enough)
  G.grid = bak.slice(); blankDirty = true;
  hideBegin(); Dlg.active = false;
  const startX = HIDE.sk.x, startY = HIDE.sk.y;
  const visited = new Set();
  for (let i = 0; i < 60*60; i++){
    hideUpdate(STEP);
    if (HIDE.sk.mode === 'INSPECT') visited.add(HIDE.sk.target.id);
    if (HIDE.over) break;
  }
  ok('the seeker walks (moved from its start)', Math.hypot(HIDE.sk.x-startX, HIDE.sk.y-startY) > 20);
  ok('the seeker inspects several hiding places (' + visited.size + ')', visited.size >= 3);

  // rivals hide, and the worst of them gets found
  G.grid = bak.slice(); blankDirty = true;
  hideBegin(); Dlg.active = false;
  ok('three other Blanks hide too', HIDE.rivals.length === 3);
  ok('rivals occupy real spots', HIDE.rivals.every(r => r.spot && r.spot !== G.spot));
  for (let i = 0; i < 60*200 && !HIDE.over; i++) hideUpdate(STEP);
  ok('the worst-painted rival gets found', HIDE.rivals.find(r => r.name === 'SPLOTCH').found);

  // relocating while unobserved
  hideBegin(); Dlg.active = false;
  HIDE.sk.x = 10; HIDE.sk.y = 232; HIDE.sk.mode = 'WALK'; HIDE.sk.fx = -1; HIDE.sk.fy = 0;
  const before = G.spot;
  buffered.ok = BUFFER; hideUpdate(STEP);
  ok('you can move spots while it is not looking', G.spot !== before);
  // ...and cannot slip away while it is stood there studying your spot
  hideBegin(); Dlg.active = false;
  HIDE.sk.mode = 'INSPECT'; HIDE.sk.target = G.spot;
  HIDE.sk.x = G.spot.walk[0]; HIDE.sk.y = G.spot.walk[1];
  const pinned = G.spot;
  buffered.ok = BUFFER; hideUpdate(STEP);
  ok('you cannot slip away mid-inspection', G.spot === pinned);

  guard('every map has a seeker with a full bark set', () => {
    for (const key of MAPS){
      const r = ROOMS[key];
      if (!LOOKERS[r.looker]) throw new Error(key + ' has no seeker');
      const L = LOOKERS[r.looker];
      for (const k of ['PAINT','TEXTURE','POSE','SPOT','NERVE','near','great'])
        if (!L.barks[k]) throw new Error(r.looker + ' missing bark ' + k);
      if (!L.intro || !L.capture || !L.depart) throw new Error(r.looker + ' missing lines');
    }
  });
  guard('grades cover the whole 0..100 range', () => {
    for (let s = 0; s <= 100; s += 5) if (!gradeFor(s)) throw new Error('no grade at ' + s);
  });
  guard('rounds cycle through every map and roll into night 2', () => {
    titleReset();
    for (let i = 0; i < MAPS.length; i++){
      G.round = i; newRound();
      if (G.room !== MAPS[i]) throw new Error('round ' + i + ' -> ' + G.room);
    }
    G.round = MAPS.length; newRound();
    if (G.room !== MAPS[0] || G.night !== 2) throw new Error('did not wrap into night 2');
  });

  // run every screen
  const screens = ['TITLE','PAINT','EDITOR','HIDE','RESULT'];
  for (const s of screens){
    guard('600 steps + render on ' + s, () => {
      G.round = 0; newRound(); Dlg.active = false;
      G.spot = ROOMS.CH1.spots[0]; setPose('CUBE','FLATTEN');
      G.grid = bak.slice(); blankDirty = true;
      G.bars = computeScore(); G.score = G.bars.total;
      if (s === 'EDITOR') edOpen();
      if (s === 'HIDE'){ hideBegin(); Dlg.active = false; }
      if (s === 'RESULT'){ hideBegin(); Dlg.active = false; hideEnd(false); Dlg.active = false; resultsBegin(); }
      G.st = s;
      for (let i = 0; i < 600; i++){ update(STEP); render(); }
    });
  }
  guard('the eyedropper screen runs', () => {
    G.round = 0; newRound(); Dlg.active = false;
    G.spot = ROOMS.CH1.spots[0];
    G.st = 'EDITOR'; edOpen(); ED.dropper = true;
    for (let i = 0; i < 120; i++){ update(STEP); render(); }
    ED.dropper = false;
  });
  guard('being found resolves to the result screen', () => {
    G.round = 0; newRound(); Dlg.active = false;
    G.spot = ROOMS.CH1.spots[0]; setPose('CUBE','FLATTEN');
    G.grid = new Uint8Array(G.grid.length).fill(WHITE_IDX); blankDirty = true;
    hideBegin(); Dlg.active = false;
    for (let i = 0; i < 60*200 && !HIDE.over; i++) hideUpdate(STEP);
    if (!HIDE.found) throw new Error('a white body was not found');
    Dlg.active = false; resultsBegin();
    for (let i = 0; i < 200; i++){ update(STEP); render(); }
  });

  titleReset(); G.st = 'TITLE';
  const fails = out.filter(l => l.startsWith('FAIL'));
  console.log('%c' + out.join('\n'), 'font-family:monospace');
  const box = document.createElement('div');
  box.id = 'smokeout';
  box.style.cssText = 'position:fixed;left:0;top:0;z-index:99;background:#000;color:#0f0;'
    + 'font:11px monospace;padding:6px;white-space:pre;max-height:100vh;overflow:auto';
  box.textContent = out.join('\n') + '\n\n' + (fails.length ? fails.length + ' FAILURES' : 'ALL ' + out.length + ' PASSED');
  document.body.appendChild(box);
}


boot();
</script>
