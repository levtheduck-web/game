<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4a0b1b">
<title>Mog Academy</title>
<script src="glitchbox-config.js"></script>
<script src="glitchbox-save.js" data-pos="top-left"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Graduate&family=Oswald:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
/* ══════════ MOG ACADEMY · varsity yearbook look: maroon felt, cream paper, gold letters ══════════ */
:root{
  --maroon:#5c1022;--maroon2:#3f0817;--maroon3:#7d1b33;--maroon4:#9c2742;
  --cream:#f6edd9;--cream2:#e9dabb;--cream3:#d8c49b;
  --gold:#f2b632;--gold2:#c98a12;--gold3:#ffe08a;
  --ink:#1f1a1d;--ink2:#4b4045;--ink3:#7a6c70;
  --flex:#ff5b3a;--stare:#21b3e0;--drip:#9a63ff;--mew:#27c977;--aura:#ffcf2e;
  --good:#27c977;--bad:#ff4d4d;
  --hd:'Graduate',Rockwell,'Arial Black',serif;--ui:'Oswald','Arial Narrow',Impact,sans-serif;--mk:'Permanent Marker','Comic Sans MS',cursive;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--maroon2);color:var(--cream);font-family:var(--ui);letter-spacing:.02em;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
body{background:
  radial-gradient(1200px 700px at 50% -10%,rgba(255,200,120,.13),transparent 60%),
  radial-gradient(900px 600px at 50% 120%,rgba(0,0,0,.45),transparent 70%),
  repeating-radial-gradient(circle at 17% 23%,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),
  linear-gradient(180deg,#63122a,#420a1a 70%,#33060f)}
#crestbg{position:fixed;left:50%;top:50%;width:min(80vmin,620px);height:min(80vmin,620px);transform:translate(-50%,-50%);opacity:.06;pointer-events:none;background-size:contain;background-repeat:no-repeat;background-position:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit}
.hidden{display:none!important}
.scr{position:fixed;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.scr.on{display:block}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px calc(28px + var(--safe-b))}
h1,h2,h3{font-family:var(--hd);font-weight:400;margin:0;letter-spacing:.03em}
.mk{font-family:var(--mk)}

/* buttons: varsity patches */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:10px 20px;border-radius:12px;font-family:var(--hd);font-size:19px;
  color:var(--cream);background:linear-gradient(180deg,var(--maroon4),var(--maroon3));box-shadow:0 4px 0 var(--maroon2),0 8px 18px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.08);
  position:relative;transition:transform .08s,box-shadow .08s,filter .15s;text-align:center;line-height:1.1}
.btn::after{content:'';position:absolute;inset:5px;border:2px dashed rgba(255,235,200,.28);border-radius:8px;pointer-events:none}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--maroon2),0 4px 10px rgba(0,0,0,.3)}
.btn.gold{color:var(--ink);background:linear-gradient(180deg,#ffd35a,var(--gold) 55%,#e09b18);box-shadow:0 4px 0 #8a5a06,0 10px 22px rgba(0,0,0,.4)}
.btn.gold::after{border-color:rgba(90,40,0,.35)}
.btn.cream{color:var(--ink);background:linear-gradient(180deg,#fff7e6,var(--cream2));box-shadow:0 4px 0 #a99067,0 8px 18px rgba(0,0,0,.3)}
.btn.cream::after{border-color:rgba(90,60,30,.25)}
.btn.small{min-height:40px;font-size:15px;padding:8px 14px}
.btn:disabled{filter:grayscale(.8) brightness(.7);cursor:default;transform:none}
.btn .sub{display:block;font-family:var(--ui);font-size:12px;letter-spacing:.08em;opacity:.8;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.28);border:1.5px solid rgba(246,237,217,.25);
  color:var(--cream);font-family:var(--ui);font-size:14px;letter-spacing:.06em}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.back{position:fixed;left:50px;top:10px;z-index:30}
a.quit{display:inline-block;color:var(--cream3);font-size:14px;letter-spacing:.1em;text-decoration:none;padding:10px;opacity:.85}
a.quit:hover{color:var(--gold)}

/* paper cards with tape */
.card{background:var(--cream);color:var(--ink);border-radius:6px;padding:18px;position:relative;box-shadow:0 2px 0 var(--cream3),0 14px 30px rgba(0,0,0,.4);
  background-image:repeating-linear-gradient(180deg,transparent 0 27px,rgba(60,100,170,.13) 27px 28px);transform:rotate(var(--rot,0deg))}
.card.plain{background-image:none}
.card::before,.card.tape2::after{content:'';position:absolute;top:-11px;left:22px;width:84px;height:24px;background:rgba(255,236,170,.72);transform:rotate(-4deg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.card.tape2::after{left:auto;right:22px;transform:rotate(5deg)}
.card.notape::before{display:none}
.card h2,.card h3{color:var(--maroon)}
.card .ink2{color:var(--ink2)}
.patch{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:7px;font-family:var(--hd);font-size:13px;letter-spacing:.06em;color:var(--cream);
  background:var(--maroon3);outline:1.5px dashed rgba(255,235,200,.45);outline-offset:-4px;white-space:nowrap}
.patch.gold{background:var(--gold);color:var(--ink);outline-color:rgba(80,40,0,.4)}

/* ── TITLE ── */
#s-title .wrap{display:flex;flex-direction:column;align-items:center;min-height:100%;justify-content:center;padding-top:22px}
.logo{font-family:var(--hd);font-size:clamp(44px,9vw,92px);line-height:.88;text-align:center;color:var(--gold);letter-spacing:.02em;
  -webkit-text-stroke:3px var(--maroon2);paint-order:stroke fill;text-shadow:0 4px 0 var(--cream),0 8px 0 var(--maroon2),0 16px 30px rgba(0,0,0,.5);margin:6px 0 4px}
.motto{font-family:var(--hd);font-size:13px;letter-spacing:.32em;color:var(--cream2);opacity:.85;margin-bottom:6px;text-align:center}
.title-mid{display:flex;align-items:center;justify-content:center;gap:24px;width:100%;flex-wrap:wrap}
#title-cv{width:min(360px,80vw);height:min(300px,40vh);display:block;-webkit-mask-image:linear-gradient(180deg,#000 78%,transparent);mask-image:linear-gradient(180deg,#000 78%,transparent)}
.menu{display:flex;flex-direction:column;gap:12px;width:min(380px,92vw)}
.menu .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.menu .btn.big{min-height:66px;font-size:22px}
@media (max-width:640px){.wrap{padding-top:62px}#s-title .wrap{padding-top:58px}.codebig{font-size:38px}#s-mini .mhud{left:12px;top:54px}#s-mini .tbar{left:12px;top:88px}.pop.dmg{font-size:26px}}
.tagline{font-family:var(--mk);color:var(--gold3);font-size:17px;transform:rotate(-2deg);margin:2px 0 10px;text-align:center}

/* ── generic forms ── */
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.field label{font-size:13px;letter-spacing:.14em;color:var(--ink2)}
.inp{height:48px;border-radius:10px;border:2px solid var(--cream3);background:#fffaf0;padding:0 14px;font-size:20px;color:var(--ink);font-family:var(--ui);outline:none;width:100%}
.inp:focus{border-color:var(--gold2)}
.inp.code{font-family:var(--hd);letter-spacing:.3em;text-transform:uppercase;text-align:center}
.status{min-height:22px;font-size:15px;color:var(--ink2);margin-top:8px}
.status.err{color:#c0392b}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.look-edit{display:flex;gap:14px;align-items:center}
.look-edit canvas{width:150px;height:170px;flex:0 0 auto;background:radial-gradient(circle at 50% 60%,#fff 0,#f0e3c6 70%);border-radius:10px;box-shadow:inset 0 0 0 2px var(--cream3)}
.look-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.look-btns button{min-height:40px;border-radius:9px;background:var(--cream2);color:var(--ink);font-size:14px;letter-spacing:.06em;box-shadow:0 3px 0 var(--cream3)}
.look-btns button:active{transform:translateY(2px);box-shadow:none}

/* ── LOBBY ── */
.codebig{font-family:var(--hd);font-size:46px;letter-spacing:.2em;color:var(--maroon);text-align:center;line-height:1}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:12px}
.pl{background:#fffaf0;border-radius:10px;padding:8px;text-align:center;box-shadow:0 3px 0 var(--cream3);position:relative;color:var(--ink)}
.pl img{width:100%;aspect-ratio:1/1.1;object-fit:contain;display:block}
.pl .nm{font-family:var(--hd);font-size:14px;color:var(--maroon);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .badge{position:absolute;top:6px;left:6px;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--gold);color:var(--ink);font-family:var(--hd)}
.pl .kick{position:absolute;top:4px;right:4px;font-size:12px;color:#a33;padding:2px 6px}
.pl.away{opacity:.55}
#qr{display:flex;justify-content:center;margin:10px 0}
.lobtop{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.lobtop #qr{margin:0}
@media (max-width:640px){.lobtop{justify-content:center}#qr img,#qr canvas{width:120px!important;height:120px!important}}
#qr img,#qr canvas{border:8px solid #fff;border-radius:8px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--cream3)}
.set-row:last-child{border-bottom:0}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:6px 11px;border-radius:8px;background:var(--cream2);color:var(--ink);font-size:14px}
.seg button.on{background:var(--maroon);color:var(--cream)}
.seg button:disabled{opacity:.6;cursor:default}

/* ── PLANNER ── */
.plan-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.plan-top h2{font-size:26px;color:var(--gold)}
.ladder{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
@media (max-width:820px){.ladder{grid-template-columns:repeat(4,1fr)}}
@media (max-width:480px){.ladder{grid-template-columns:repeat(3,1fr)}}
.yb{background:#fffaf0;border-radius:4px;padding:6px 6px 8px;box-shadow:0 3px 0 var(--cream3),0 8px 14px rgba(0,0,0,.25);text-align:center;position:relative;color:var(--ink);transform:rotate(var(--r,0deg))}
.yb canvas,.yb img{width:100%;aspect-ratio:1/1.12;display:block;background:linear-gradient(180deg,#9bb7d6,#6d8fb6);border-radius:2px}
.yb .nm{font-family:var(--hd);font-size:11.5px;color:var(--maroon);margin-top:5px;line-height:1.1;min-height:26px}
.yb.locked canvas,.yb.locked img{filter:brightness(.15) saturate(0)}
.yb.next{outline:3px solid var(--gold);outline-offset:3px}
.yb .stamp{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-14deg);font-family:var(--hd);font-size:clamp(10px,1.3vw,16px);color:#d62828;border:3px solid #d62828;padding:1px 6px;border-radius:5px;background:rgba(255,250,240,.7);letter-spacing:.06em}
.statbars{display:flex;flex-direction:column;gap:8px}
.sb{display:grid;grid-template-columns:78px 1fr 36px;align-items:center;gap:8px;font-size:14px;letter-spacing:.08em;color:var(--ink2)}
.sb .bar{height:14px;border-radius:7px;background:var(--cream2);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.sb .bar i{display:block;height:100%;border-radius:7px;transition:width .6s}
.sb b{font-family:var(--hd);color:var(--ink);text-align:right}
.trainrow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:820px){.trainrow{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.trainrow{grid-template-columns:1fr 1fr}}
.tbtn{background:#fffaf0;border-radius:10px;padding:10px;text-align:left;box-shadow:0 3px 0 var(--cream3);color:var(--ink);display:flex;flex-direction:column;gap:2px;min-height:86px}
.tbtn:active{transform:translateY(2px);box-shadow:none}
.tbtn .e{font-size:26px;line-height:1}
.tbtn b{font-family:var(--hd);font-size:15px;color:var(--maroon)}
.tbtn small{font-size:12.5px;color:var(--ink2);letter-spacing:.03em}
.rankline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.rk{font-family:var(--hd);font-size:12px;padding:3px 8px;border-radius:6px;background:var(--cream2);color:var(--ink3)}
.rk.on{background:var(--maroon);color:var(--gold)}
.rk.done{background:var(--cream3);color:var(--ink)}

/* ── SCOUT / VS ── */
.scout{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
@media (max-width:640px){.scout{grid-template-columns:1fr}}
.scout ul{margin:8px 0 0;padding-left:20px;font-size:17px;line-height:1.45}
.scout .quote{font-family:var(--mk);font-size:20px;color:var(--maroon);margin:6px 0}
.vsrow{display:grid;grid-template-columns:70px 64px 64px;gap:4px 12px;font-size:14px;align-items:center;margin-top:10px}
.vsrow .h{font-family:var(--hd);color:var(--maroon);font-size:12px}

/* ── BATTLE ── */
#s-battle.on{display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;padding:8px 12px 0 88px}
.plate{background:rgba(20,6,10,.55);border-radius:10px;padding:7px 10px 8px;border:1.5px solid rgba(246,237,217,.14);min-width:0}
.plate.r{text-align:right}
.plate .nm{display:flex;gap:8px;align-items:center;font-family:var(--hd);font-size:17px;white-space:nowrap;overflow:hidden}
.plate.r .nm{justify-content:flex-end}
.plate .nm span{overflow:hidden;text-overflow:ellipsis}
.abar{height:18px;border-radius:9px;background:rgba(0,0,0,.45);margin-top:6px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.1)}
.abar i{position:absolute;top:0;bottom:0;left:0;border-radius:9px;background:linear-gradient(180deg,#ffe48a,var(--gold) 60%,#d48a0c);transition:width .5s cubic-bezier(.2,.9,.3,1)}
.abar i.ghost{background:#ff6b5a;transition:width .9s .35s}
.plate.r .abar i{left:auto;right:0}
.abar.low i:not(.ghost){background:linear-gradient(180deg,#ffa3a3,#ff5a5a)}
.aline{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-size:13px;letter-spacing:.06em;color:var(--cream2)}
.plate.r .aline{flex-direction:row-reverse}
.pips{display:flex;gap:4px}
.pips i{width:18px;height:18px;border-radius:5px;background:rgba(0,0,0,.4);border:1.5px solid rgba(255,207,46,.35);display:grid;place-items:center;font-style:normal;font-size:11px;color:transparent}
.pips i.on{background:var(--aura);border-color:#fff3b0;color:var(--ink);box-shadow:0 0 10px rgba(255,207,46,.7)}
.mid{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:2px}
.ring{width:62px;height:62px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--hd);font-size:22px}
.beatno{font-size:11px;letter-spacing:.18em;color:var(--cream3)}
.hype{font-family:var(--hd);font-size:11px;color:var(--gold);letter-spacing:.1em}
.stage{position:relative;min-height:0}
#bcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.bub{position:absolute;max-width:230px;padding:8px 12px;border-radius:14px;background:#fffaf0;color:var(--ink);font-family:var(--mk);font-size:17px;line-height:1.15;
  box-shadow:0 6px 14px rgba(0,0,0,.35);transform:translate(-50%,-100%) scale(.6);opacity:0;transition:transform .18s,opacity .18s;pointer-events:none;white-space:nowrap}
.bub.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
.bub::after{content:'';position:absolute;bottom:-9px;left:var(--tail,30%);border:10px solid transparent;border-top-color:#fffaf0;border-bottom:0}
.bub.say{z-index:6;font-size:16px;background:#fff3c4}
.bub.say::after{border-top-color:#fff3c4}
.bub small{display:block;font-family:var(--ui);font-size:11px;letter-spacing:.12em;color:var(--ink3);margin-top:2px}
.lockchip{position:absolute;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.55);font-size:13px;letter-spacing:.12em;transform:translateX(-50%);white-space:nowrap}
.lockchip.ok{background:var(--good);color:#04210f}
.caption{position:absolute;left:50%;top:9%;transform:translateX(-50%);text-align:center;pointer-events:none;width:min(92%,640px)}
.caption:not(:empty){background:rgba(20,4,9,.62);border-radius:16px;padding:8px 14px 10px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.caption .c1{font-family:var(--hd);font-size:clamp(22px,4.4vw,40px);color:var(--cream);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.4)}
.caption .c2{font-family:var(--mk);font-size:clamp(15px,2.6vw,21px);color:var(--gold3);margin-top:4px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.caption.pop{animation:cap .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes cap{from{transform:translateX(-50%) scale(.4);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.pop{position:absolute;font-family:var(--mk);font-size:26px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;pointer-events:none;white-space:nowrap;animation:popup 1.5s ease-out forwards;transform:translate(-50%,-50%)}
.pop.dmg{font-family:var(--hd);font-size:34px;color:#ff6a5a}
.pop.gain{color:var(--aura)}
.pop.tag{font-size:20px;color:var(--gold3)}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
.kocap{position:absolute;left:50%;bottom:12%;transform:translateX(-50%) rotate(-3deg);font-family:var(--mk);font-size:clamp(24px,4.5vw,44px);color:var(--gold3);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;white-space:nowrap;pointer-events:none;animation:cap .4s cubic-bezier(.2,1.6,.4,1) both}
.stampbig{position:absolute;left:var(--x,50%);top:42%;font-family:var(--hd);font-size:clamp(40px,9vw,92px);color:#e02727;border:6px solid #e02727;border-radius:12px;padding:0 18px;
  transform:translate(-50%,-50%) rotate(-12deg);background:rgba(255,245,235,.12);pointer-events:none;animation:stamp .32s cubic-bezier(.3,1.7,.5,1) both;letter-spacing:.05em;
  text-shadow:0 0 1px #e02727;mix-blend-mode:normal}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-12deg) scale(3);opacity:0}to{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:1}}
.controls{padding:6px 10px calc(10px + var(--safe-b));background:linear-gradient(180deg,rgba(20,4,9,0),rgba(20,4,9,.65) 30%)}
.callrow{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:7px;font-size:13px;letter-spacing:.1em;color:var(--cream2)}
.callrow button{width:40px;height:34px;border-radius:9px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.18);font-size:18px}
.callrow button:hover{border-color:var(--gold)}
.callrow button:disabled{opacity:.3;cursor:default}
.callrow .lbl{font-family:var(--hd);font-size:13px;color:var(--gold3)}
.moves{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:900px;margin:0 auto}
.mv{position:relative;border-radius:12px;padding:8px 4px 7px;background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 70%,#000));color:#fff;
  box-shadow:0 4px 0 color-mix(in srgb,var(--c) 45%,#000),0 8px 16px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .08s,filter .2s,opacity .2s}
.mv .e{font-size:26px;line-height:1.05}
.mv b{font-family:var(--hd);font-size:17px;letter-spacing:.04em;-webkit-text-stroke:1px rgba(0,0,0,.35);paint-order:stroke fill}
.mv small{font-size:11.5px;letter-spacing:.06em;opacity:.92;white-space:nowrap}

<script>
"use strict";
// ════════════════════ ENGINE (pure rules, no DOM - also runs in node for the balance sims) ════════════════════
/*ENGINE-START*/
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// 53-bit string hash: online picks are committed as hash(pick+nonce) first, so nobody can peek and switch
function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}

const MOVES=['flex','stare','drip','mew','aura'];
const TRI=['flex','stare','drip'];
const BEATS={stare:'flex',flex:'drip',drip:'stare'};     // STARE beats FLEX, FLEX beats DRIP, DRIP beats STARE
const LOSES={flex:'stare',drip:'flex',stare:'drip'};     // LOSES[x] = the pose that beats x
const isTri=m=>m==='flex'||m==='stare'||m==='drip';
const STAT_OF={flex:'flex',stare:'stare',drip:'drip',mew:'jaw',aura:'aura'};
const CFG={
  AURA:1000,      // everyone starts a mog-off with 1000 aura; 0 = MOGGED
  TRI:200,        // winning a FLEX / STARE / DRIP exchange
  MIRROR:90,      // same pose: the better-trained one wins a little
  MIRROR_GAP:6,   // ...if they're at least this much better, else it's a standoff
  GUARD0:.45, GUARD_JAW:.30,   // MEW takes 45-75% less from a pose (more jaw = more locked in)
  SUPER:420,      // AURA landing on a pose
  WHIFF:160,      // AURA into a MEW: unbothered, the aura farmer eats it
  CLASH:160,      // AURA vs AURA: the bigger aura wins
  STALE:.7,       // same pose twice in a row: the crowd has seen it
  CALLED:1.25,    // win with the pose you called (while they were still choosing)
  BACK:1.25, BACK_AT:.25,   // under 25% aura and you win one: WE'RE SO BACK
  CH_MAX:3,       // MEW charges, AURA needs all three
  HYPE:.06,       // the crowd gets louder every beat: +6% damage per beat, so mog-offs don't drag
  MAX_BEATS:15
};
const mult=s=>.75+clamp(s||0,0,100)/100*.5;
function fighter(stats,aura){aura=aura||CFG.AURA;return{stats:Object.assign({flex:30,stare:30,drip:30,jaw:30,aura:30},stats||{}),aura,max:aura,ch:0,last:null,call:null,callOK:false}}
function guardOf(F){return CFG.GUARD0+CFG.GUARD_JAW*clamp(F.stats.jaw,0,100)/100}
function dmgOf(W,mv,base,tags,beat){
  let d=base*mult(W.stats[STAT_OF[mv]])*(1+CFG.HYPE*(beat||0));
  if(isTri(mv)&&W.last===mv){d*=CFG.STALE;tags.push('stale')}
  if(W.call===mv&&W.callOK){d*=CFG.CALLED;tags.push('called')}
  if(W.aura<=W.max*CFG.BACK_AT){d*=CFG.BACK;tags.push('back')}
  return d}
// One beat. ma/mb = the two poses (null = froze, didn't pick). Doesn't change A/B: applyRes does.
function resolve(A,B,ma,mb,beat){
  if(ma==='aura'&&A.ch<CFG.CH_MAX)ma=null; if(mb==='aura'&&B.ch<CFG.CH_MAX)mb=null;
  if(ma&&!MOVES.includes(ma))ma=null; if(mb&&!MOVES.includes(mb))mb=null;
  const r={ma,mb,da:0,db:0,ca:0,cb:0,win:null,kind:'',ta:[],tb:[]};
  const P={a:[A,ma,r.ta],b:[B,mb,r.tb]};
  const hit=(w,base,mv,scale)=>{const [W,,tw]=P[w],l=w==='a'?'b':'a';const d=Math.round(dmgOf(W,mv,base,tw,beat)*(scale==null?1:scale));if(l==='a')r.da=d;else r.db=d;r.win=w};
  const gain=(s,n)=>{const F=P[s][0];const v=Math.max(-F.ch,Math.min(CFG.CH_MAX-F.ch,n));if(s==='a')r.ca=v;else r.cb=v};
  if(!ma&&!mb){r.kind='bothfroze';return r}
  if(!ma||!mb){
    const w=ma?'a':'b',mv=ma||mb;r.kind='froze';P[w==='a'?'b':'a'][2].push('froze');
    if(isTri(mv))hit(w,CFG.TRI,mv);else if(mv==='aura'){hit(w,CFG.SUPER,'aura');gain(w,-9)}else{gain(w,1);r.win=w}
    return r}
  const ta=isTri(ma),tb=isTri(mb);
  if(ta&&tb){
    if(ma===mb){const g=A.stats[ma]-B.stats[ma];
      if(Math.abs(g)<CFG.MIRROR_GAP){r.kind='standoff';return r}
      r.kind='mirror';hit(g>0?'a':'b',CFG.MIRROR,ma);return r}
    r.kind='tri';hit(BEATS[ma]===mb?'a':'b',CFG.TRI,BEATS[ma]===mb?ma:mb);return r}
  if(ma==='mew'&&mb==='mew'){r.kind='mewmew';gain('a',1);gain('b',1);return r}
  if(ma==='aura'&&mb==='aura'){r.kind='clash';gain('a',-9);gain('b',-9);const g=A.stats.aura-B.stats.aura;
    if(Math.abs(g)>=CFG.MIRROR_GAP)hit(g>0?'a':'b',CFG.CLASH,'aura');return r}
  // exactly one MEW or one AURA from here
  if(ma==='mew'&&mb==='aura'||mb==='mew'&&ma==='aura'){                     // AURA into a MEW: whiff
    const m=ma==='mew'?'a':'b',u=m==='a'?'b':'a';r.kind='whiff';gain(u,-9);gain(m,1);P[m][2].push('unbothered');hit(m,CFG.WHIFF,'mew');return r}
  const s=isTri(ma)?'b':'a',sp=P[s][1],o=s==='a'?'b':'a';                  // s = the side playing MEW or AURA against a pose
  if(sp==='aura'){r.kind='super';gain(s,-9);hit(s,CFG.SUPER,'aura');return r}
  // a pose into a MEW: locked in, takes the hit soft and charges
  r.kind='mewhit';gain(s,1);P[s][2].push('lockedin');hit(o,CFG.TRI,P[o][1],1-guardOf(P[s][0]));return r}
function applyRes(A,B,r){A.aura=Math.max(0,A.aura-r.da);B.aura=Math.max(0,B.aura-r.db);A.ch=clamp(A.ch+r.ca,0,CFG.CH_MAX);B.ch=clamp(B.ch+r.cb,0,CFG.CH_MAX);
  A.last=r.ma;B.last=r.mb;A.call=B.call=null;A.callOK=B.callOK=false}
// who wins on the bell if nobody got mogged by the last beat
function decision(A,B){const a=A.aura/A.max,b=B.aura/B.max;return Math.abs(a-b)>1e-6?(a>b?'a':'b'):(A.ch>=B.ch?'a':'b')}

// ════════ RIVALS: every CPU has a readable habit, listed on its scouting report ════════
// w = base weights · habit = the pattern you can exploit · adapt = counters your most-used pose · anti = punishes repeats
// callP = how often it calls a pose · honest = how often that call is true · lieLate = its lies come late in the bell
// auraP = how keen it is to AURA at 3 charges · fear = how much it MEWs when you sit on 3 charges · react = reads YOUR calls
const RIVALS=[
 {id:'nathan',name:'NPC Nathan',tag:'Freshman',venue:'hall',aura:800,st:{flex:14,stare:14,drip:14,jaw:14,aura:10},
  w:{flex:1,stare:1,drip:1,mew:.45},habit:null,adapt:0,anti:0,callP:.7,honest:.95,lieLate:0,auraP:.6,fear:.15,react:0,
  look:{skin:0,hair:7,hc:1,top:6,tier:0,acc:0,eye:0},
  quote:'fr fr no cap',lose:'bro i was not ready',win:'wait did i win?? W',sign:'have a good summer i guess. fr',

  if(op.ch>=CFG.CH_MAX)w.mew+=R.fear*4;

  if(R.habit==='repeatWin'&&lastRes==='me'&&isTri(lastMe))w[lastMe]+=6;

function musDecode(){if(!AU.ctx||!AU.mraw||AU.mbuf)return;const ab=AU.mraw;AU.mraw=null;
  const ok=b=>{const d=b.getChannelData(0),sr=b.sampleRate;let mi=0;for(let i=0,n=Math.min(d.length,sr*.45|0);i<n;i++)if(Math.abs(d[i])>.3){mi=i;break}AU.moff=mi/sr;AU.mbuf=b};

  if(MUS.next<c.currentTime-.3)MUS.next=c.currentTime+.05;
  while(MUS.next<c.currentTime+.15){const st=MUS.step%16,bar=(MUS.step>>4)%S.bars,at=MUS.next;
    if(MUS.trk==='menu'){
      if(st===0||st===8)note('bd',null,{at,vol:st?.18:.26,len:.4,r:.2});
      if(st===4||st===12)note('tap',null,{at,vol:.16,len:.2,r:.1});
      if(st===0){note(S.bass[bar]<50?'tb':'ce',S.bass[bar],{at,vol:.2,len:s16*14,r:.4,a:.05});for(const n of S.ch[bar])note('vn',n+12,{at,vol:.045,a:.25,len:s16*15,r:.5})}

  if(d.win===s&&!d.final){p.wins++;p.st.aura=Math.min(100,p.st.aura+5);p.rk=Math.min(3,p.wins)}}}
function hostRoundDone(){for(const d of Object.values(HS.duels))if(d.live&&!d.credited){d.credited=1;creditDuel(d)}
  G.phase='standings';G.until=now()+(G.round>=G.set.rounds?8000:7000);pushState()}
function hostFinal(){for(const d of Object.values(HS.duels))d.live=false;
  const ps=G.players.filter(p=>!p.late).slice().sort((a,b)=>b.wins-a.wins||b.dealt-a.dealt);const [p,q]=ps;
  const a=pside(p),b=pside(q),diff=p.wins-q.wins;a.aura=1000+80*Math.max(0,diff);b.aura=1000+80*Math.max(0,-diff);
  const d=new Duel({id:'final',a,b,T:G.set.timer*1000,now:now(),final:true});d.live=true;d.auto.a=!!p.away;d.auto.b=!!q.away;HS.duels.final=d;G.fin='final';G.phase='final';G.until=0;pushState()}
function hostAwards(){const ps=G.players.filter(p=>!p.late),top=(f,min)=>{let b=null;for(const p of ps){const v=f(p);if(v>(min||0)&&(!b||v>b[1]))b=[p.cid,v]}return b};const A=[];
  A.push({e:'👑',t:'CHAD',c:G.champ,v:'ascended'});
  const add=(e,t,f,fmt,min)=>{const b=top(f,min);if(b)A.push({e,t,c:b[0],v:fmt(b[1])})};
  add('✨','MOST AURA',p=>p.dealt,v=>v+' aura dealt');add('📣','CALLED IT',p=>p.called,v=>v+' called shots');add('🤐','LOCKED IN',p=>p.mews,v=>v+' mews');
  add('🏋️','GYM RAT',p=>p.cls.gym||0,v=>Math.round(v*100)+'% max rep');add('👁️','HUNTER EYES',p=>p.cls.stare||0,v=>Math.round(v*100)+'% stare');
  add('🕶️','DRIP LORD',p=>p.cls.fit||0,v=>Math.round(v*100)+'% fit check');add('🗿','JAWLINE',p=>p.cls.mew||0,v=>Math.round(v*100)+'% lock in');
  add('💀','MOST MOGGED',p=>p.taken,v=>v+' aura lost');add('🥶','FROZE UP',p=>p.froze,v=>v+' frozen bells');return A}
function hostTick(){if(MODE!=='host')return;const t=now();
  for(const p of G.players)if(p.cid!==MY_CID&&!p.away&&t-(HS.seen[p.cid]||t)>AWAY_MS){p.away=true;HS.dirty=true;for(const d of Object.values(HS.duels)){const s=sideOf(d,p.cid);if(s&&d.live)d.auto[s]=true}}
  for(const d of Object.values(HS.duels)){if(!d.live)continue;d.tick(t);if(d.needRv){d.needRv=false;hostOut({t:'rv',d:d.id,n:d.n})}if(d.ev.length){d.ev.length=0;HS.dirty=true}}
  if(G.phase==='class'&&(t>HS.clsEnd||G.players.filter(p=>!p.away&&!p.late||HS.cls[p.cid]!=null).every(p=>HS.cls[p.cid]!=null)&&t>G.cls.at))hostClassDone();
  else if(G.phase==='classres'&&t>=G.until)hostDuels();
  else if(G.phase==='duels'&&Object.values(HS.duels).filter(d=>d.live).every(d=>d.ph==='done'))hostRoundDone();
  else if(G.phase==='standings'&&t>=G.until){if(G.round>=G.set.rounds)hostFinal();else hostNextRound()}
  else if(G.phase==='final'){const d=HS.duels.final;if(d&&d.ph==='done'&&!d.credited){d.credited=1;creditDuel(d);const w=d.S[d.win];G.champ=w.cid;const p=P(w.cid);if(p)p.rk=4;G.phase='ascend';G.until=t+12500;G.awards=hostAwards();pushState()}}
  else if(G.phase==='ascend'&&t>=G.until){G.phase='over';G.until=0;pushState()}
  if(HS.dirty&&t-HS.lastPush>110||t-HS.lastPush>1000)pushState()}

function handleNet(m){
  if(m.t==='created'){if(MODE==='host'){G.code=net.code;if(G.phase==='off'){G.phase='lobby';G.host=MY_CID;G.players=[newPlayer(MY_CID,myName(),PROF.look)]}pushState()}return}
  if(m.t==='joined'){net.send(hiMsg());return}
  if(m.t==='start'){if(MODE==='guest')net.send(hiMsg());return}
  if(m.t==='error'){if(G.phase==='off'||MODE==='guest'&&!lastHostMsg){net.close();MODE='off';G.phase='off';onlineStatus(m.msg||'Could not join.',true);if(SCREEN!=='s-online')show('s-online')}else toast(m.msg||'Server error');return}
  if(m.t==='left')return;
  if(m.t==='rx'){floatRx(m);return}
  if(MODE==='host'){hostMsg(m);return}
  if(m.to&&m.to!==MY_CID)return;
  lastHostMsg=now();clientHandle(m)}
function hiMsg(){return{t:'hi',cid:MY_CID,name:myName(),look:PROF.look}}
function sendLook(){if(MODE==='guest')net.send({t:'look',cid:MY_CID,name:myName(),look:PROF.look});else if(MODE==='host'){const p=P(MY_CID);if(p){p.look=cleanLook(PROF.look);p.name=uniqueName(myName(),MY_CID);pushState()}}}
function clientHandle(m){
  if(m.t==='st'){const was=G.phase;G.duels=m.du||[];G.untilAt=now()+(m.u||0);
    // the host already owns the real state: only guests copy it in
    if(MODE!=='host'){G.phase=m.ph;G.host=m.h;G.set=m.set;G.round=m.r;G.cls=m.cls;G.clsRes=m.cr;G.fin=m.fin;G.champ=m.ch;G.awards=m.aw;
      G.players=m.pl.map(a=>({cid:a[0],name:a[1],look:a[2],st:a[3],wins:a[4],dealt:a[5],rk:a[6],away:!!a[7],late:!!a[8],called:a[9],mews:a[10],taken:a[11]}));
      if(G.cls&&G.cls.in!=null)G.cls.atLocal=now()+G.cls.in}
    else if(G.cls)G.cls.atLocal=G.cls.at;
    if(MODE==='guest'&&!P(MY_CID)&&G.phase!=='off')net.send(hiMsg());
    onlineRender(was);return}
  if(m.t==='tst'){toast(m.m);return}
  if(m.t==='rv'){if(MODE==='guest'&&MYPICK&&MYPICK.d===m.d&&MYPICK.n===m.n){net.send({t:'rp',cid:MY_CID,d:m.d,n:m.n,m:MYPICK.m,k:MYPICK.k});lastRp=now()}return}
  if(m.t==='kick'){dropToHome('The host removed you from the room.');return}
  if(m.t==='full'){dropToHome('That room is full (8 students max).');return}
  if(m.t==='who'){net.send(hiMsg());return}}
function myDuel(){return G.duels.find(d=>d.a.cid===MY_CID||d.b.cid===MY_CID)}
function netPick(m){const d=myDuel();if(!d||d.ph!=='choose')return false;const s=d.a.cid===MY_CID?'a':'b';
  if(MODE==='host'){const D=HS.duels[d.id];if(!D||!D.lock(s,m,now()))return false;HS.dirty=true;hostTick();return true}
  const k=rcode(10);MYPICK={d:d.id,n:d.n,m,k};net.send({t:'cm',cid:MY_CID,d:d.id,n:d.n,h:commitHash(MY_CID,d.id,d.n,m,k)});return true}
function netCall(m){const d=myDuel();if(!d||d.ph!=='choose')return false;const s=d.a.cid===MY_CID?'a':'b';
  if(MODE==='host'){const D=HS.duels[d.id];if(!D||!D.doCall(s,m,now()))return false;HS.dirty=true;hostTick();return true}
  net.send({t:'call',cid:MY_CID,d:d.id,n:d.n,c:m});return true}

    if(!BAT||BAT.mode!=='net'||BAT.duelId!==md.id){if(md.ph==='done'&&SCREEN!=='s-battle'){hallShow();return}
      BAT=null;startBattle({mode:'net',snap:md,me:s,duelId:md.id,venue:md.fin?'prom':['hall','gym','cafe','library','roof'][(G.round+G.duels.indexOf(md))%5],onEnd:()=>{if(MODE!=='off'&&G.phase!=='final')hallShow()}})}
