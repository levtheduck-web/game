<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c9ecff">
<title>Soap Rocket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<script src="glitchbox-config.js"></script>
<script src="glitchbox-save.js" data-pos="top-right"></script>
<style>
:root{
  --ink:#2b1f40; --ink2:#4b3f6b; --pink:#ff8fc2; --pink2:#ffd6ea; --cream:#fffaf3; --sky:#bfe6ff; --sky2:#e7f6ff;
  --mint:#8ee8c8; --lemon:#ffd95a; --lilac:#c9b6ff; --red:#f2443b; --peach:#ffb38a; --white:#ffffff;
  --shadow:0 6px 0 var(--ink); --r:22px;
  --font:'Fredoka',system-ui,sans-serif; --head:'Lilita One','Fredoka',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#bfe6ff,#fde9f3);font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.off{display:none!important}
button{font-family:inherit;color:inherit}

/* ---------- sticker kit ---------- */
.btn{--c:var(--pink);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.45em;font-family:var(--head);font-size:clamp(17px,2.1vw,26px);letter-spacing:.02em;
  background:var(--c);border:4px solid var(--ink);border-radius:18px;padding:.42em 1.05em .5em;box-shadow:0 6px 0 var(--ink);cursor:pointer;
  transform:rotate(var(--rot,0deg));transition:transform .13s cubic-bezier(.3,1.6,.5,1),box-shadow .1s;white-space:nowrap;color:var(--ink)}
.btn:hover,.btn:focus-visible{transform:rotate(var(--rot,0deg)) translateY(-3px) scale(1.04);outline:none}
.btn:focus-visible,.btn.kfocus{box-shadow:0 6px 0 var(--ink),0 0 0 4px var(--lemon)!important;transform:rotate(var(--rot,0deg)) translateY(-3px) scale(1.04)}
.item:focus-visible,.tab:focus-visible,.sw:focus-visible,.seg button:focus-visible,.mini:focus-visible,.item.kfocus,.tab.kfocus,.sw.kfocus,.seg button.kfocus,.mini.kfocus{outline:4px solid var(--lemon);outline-offset:2px}
.btn:active{transform:rotate(var(--rot,0deg)) translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn[disabled]{filter:grayscale(.7) opacity(.6);cursor:default}
.btn.sm{font-size:clamp(14px,1.5vw,18px);padding:.3em .8em .36em;border-width:3px;box-shadow:0 4px 0 var(--ink);border-radius:14px}
.btn.big{font-size:clamp(22px,3vw,38px);padding:.38em 1.1em .46em}
.btn .k{font-family:var(--font);font-weight:700;font-size:.62em;background:var(--ink);color:#fff;border-radius:8px;padding:.1em .45em;letter-spacing:0}
.btn.ghost{--c:#fff}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow)}
.tag{display:inline-block;font-weight:700;font-size:13px;background:var(--ink);color:#fff;border-radius:9px;padding:2px 9px;letter-spacing:.03em}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 12px 4px;box-shadow:0 3px 0 var(--ink)}
h1,h2,h3{font-family:var(--head);font-weight:400;margin:0;letter-spacing:.02em}
.outline-text{color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:flex;z-index:20;pointer-events:none;animation:scrIn .32s cubic-bezier(.2,1.3,.4,1)}
.screen>*{pointer-events:auto}
.screen.dim{background:radial-gradient(ellipse at 70% 40%,rgba(255,255,255,0),rgba(43,31,64,.42))}
.screen.veil{background:rgba(201,236,255,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
@keyframes scrIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.screen.still,.lab-drawer.still{animation:none}   /* the same screen redrawn after a pick: no fade-in again */
.trophy-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media (max-width:640px){ .trophy-grid{grid-template-columns:minmax(0,1fr)} }
.panel.help-panel{width:min(1560px,96vw)}
/* Menus with a top bar (Back, bubbles, sound): the panel always starts below the bar, even when it's tall on a short screen. */
@media (min-height:601px) and (min-width:601px){
  #s-quick,#s-gp,#s-players,#s-help,#s-trophies,#s-online,#s-lobby{padding:64px 0 12px}
  #s-quick>.panel,#s-gp>.panel,#s-players>.panel,#s-help>.panel,#s-trophies>.panel,#s-online>.panel,#s-lobby>.panel{max-height:100%}
}
.topbar{position:fixed;top:14px;left:18px;right:150px;display:flex;align-items:center;gap:12px;z-index:30;pointer-events:none}
.topbar>*{pointer-events:auto}
.wallet{font-family:var(--head);font-size:22px}
.wallet .b{display:inline-block;width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff 0 18%,#e8f8ff 30%,#b9e3ff 70%,#d9c9ff);vertical-align:-3px;margin-right:2px}

/* title */
#s-title{align-items:stretch}
#s-title .col{display:flex;flex-direction:column;justify-content:center;gap:16px;padding:70px 0 40px clamp(20px,5vw,80px);width:min(640px,92vw)}
.logo{font-family:var(--head);line-height:.86;font-size:clamp(58px,9.5vw,132px);color:#fff;-webkit-text-stroke:clamp(7px,1vw,12px) var(--ink);paint-order:stroke fill;
  text-shadow:0 clamp(7px,1vw,12px) 0 var(--ink);transform:rotate(-4deg);margin-bottom:6px;position:relative}
.logo .a{color:var(--pink)} .logo .b{color:var(--lemon);display:inline-block;transform:translateX(.22em) rotate(3deg)}
br.nb{display:none} @media (max-width:600px){ br.nb{display:initial} }
.logo small{display:block;font-family:var(--font);font-weight:700;-webkit-text-stroke:5px #fff;paint-order:stroke fill;text-shadow:none;font-size:clamp(14px,1.5vw,19px);color:var(--ink);letter-spacing:.02em;margin:18px 0 0 6px;transform:rotate(4deg)}
.menu{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.menu .row{display:flex;gap:12px;flex-wrap:wrap}
.mysoap{font-weight:700;font-size:14px;background:rgba(255,255,255,.88);border:3px solid var(--ink);border-radius:12px;padding:4px 6px 4px 12px;box-shadow:0 3px 0 var(--ink);margin:-4px 0 2px;max-width:min(600px,86vw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.mysoap span{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1} .mysoap .btn.sm{font-size:12px;padding:1px 8px 2px;border-width:2px;box-shadow:0 2px 0 var(--ink);flex:none}
.mysoap b{font-family:var(--head);font-weight:400;font-size:16px} .mysoap span{opacity:.7;font-weight:600}
@media (max-height:520px){ .mysoap{display:none} }
.bubbles-deco{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#s-title .col{position:relative;z-index:1}
.bubbles-deco i{position:absolute;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 32% 28%,#fff 0 14%,rgba(255,255,255,.55) 22%,rgba(190,230,255,.35) 60%,rgba(215,195,255,.55));opacity:.9;animation:floatUp linear infinite}
@keyframes floatUp{from{transform:translateY(0) scale(1)}to{transform:translateY(-120vh) scale(1.15)}}

/* panels */
.panel{margin:auto;width:min(1100px,95vw);max-height:92vh;display:flex;flex-direction:column;gap:14px;padding:22px 24px 24px;position:relative}
.panel>header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.panel>header h2{font-size:clamp(28px,3.4vw,44px);flex:1}
.scroll{overflow:auto;min-height:0;scrollbar-width:thin}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font-family:var(--head);font-size:18px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 14px 7px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.tab.on{background:var(--lemon);transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.item{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px 12px 10px;box-shadow:0 5px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative;transition:transform .12s}
.item:hover{transform:translateY(-3px) rotate(-.6deg)}
.item.on{background:var(--pink2);outline:4px solid var(--pink);outline-offset:-9px}
.item.sel{transform:translateY(-3px) scale(1.02);box-shadow:0 8px 0 var(--ink)}
.item h3{font-size:20px}
.item p{margin:0;font-size:13.5px;line-height:1.3;color:var(--ink2)}
.item .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-weight:700}
.swatch{height:54px;border-radius:12px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:28px;position:relative;overflow:hidden}
.swatch.modsw{height:auto;aspect-ratio:220/124}
.swatch.modsw span{font-size:46px;filter:drop-shadow(0 3px 0 rgba(43,31,64,.35))}
.swatch.pic{height:auto;aspect-ratio:220/124;padding:0;background:#eaf6ff}
.swatch.pic img{width:100%;height:100%;object-fit:cover;display:block}
.swatch .bar{width:64%;height:62%;border-radius:12px;border:3px solid var(--ink);box-shadow:inset -6px -6px 0 rgba(0,0,0,.08),inset 5px 5px 0 rgba(255,255,255,.45)}
.price{font-family:var(--head);font-size:18px}
.price.cant{opacity:.42}
.price.can{color:#0f7a4f}
.swatch.pic{position:relative} .swatch .mbadge{position:absolute;right:6px;bottom:4px;font-size:20px;line-height:1;filter:drop-shadow(0 2px 0 rgba(43,31,64,.35))}
.swatch.sudsw{position:relative;overflow:hidden} .swatch.sudsw i{position:absolute;border-radius:50%;transform:translate(-50%,-50%);border:3px solid var(--ink);box-shadow:inset -4px -5px 0 rgba(0,0,0,.12),inset 4px 4px 0 rgba(255,255,255,.55)}
.newdot{position:absolute;top:-12px;right:-12px;background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:999px;font:700 12px var(--font);padding:1px 7px;box-shadow:0 2px 0 var(--ink)}
@media (max-height:520px){.newdot{font-size:10px;padding:0 5px;border-width:2px;top:-11px;right:-15px}}
@media (max-height:520px){
  #s-pause .panel{gap:8px;padding:12px 16px} #s-pause .btn{padding:6px 14px;font-size:17px} #s-pause header h2{font-size:24px!important}
  .res-panel{gap:6px;padding:10px 14px 12px} .res-panel header h2{font-size:22px!important} .res-sum .big{font-size:18px} .res-sum .tag{font-size:11px}
  .res-panel .hint{padding:4px 10px;font-size:13px} .res-panel .hint .btn{font-size:13px;padding:2px 10px}
  .res-panel .btn{padding:5px 12px;font-size:15px} .res-panel .btn.big{font-size:17px}
}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;font-weight:700;font-size:14px}
.stats .sb{height:14px;border:3px solid var(--ink);border-radius:9px;background:#fff;position:relative;overflow:hidden}
.stats .sb i{position:absolute;left:0;top:0;bottom:0;background:var(--mint);border-right:3px solid var(--ink)}
.stats .sb b{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--c) 0 5px,transparent 5px 9px)}
.stats .d{font-size:13px;min-width:34px;text-align:right}
.up{color:#15935f}.dn{color:#d2384a}
label.opt{display:flex;align-items:center;gap:10px;font-weight:600}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:13px;overflow:hidden;box-shadow:0 3px 0 var(--ink);background:#fff}
.seg button{border:0;background:transparent;font-weight:700;font-size:15px;padding:6px 12px;cursor:pointer;border-right:3px solid var(--ink)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--lemon)}
.seg button[disabled]{opacity:.35;cursor:default}
input.field{font-family:var(--head);font-size:24px;border:4px solid var(--ink);border-radius:14px;padding:6px 12px;width:200px;text-transform:uppercase;box-shadow:0 4px 0 var(--ink);outline:none;color:var(--ink);background:#fff}
input.field.name{text-transform:none;font-family:var(--font);font-weight:700;font-size:19px;width:220px}

/* garage */
.gar-list{margin:76px 0 18px clamp(10px,2vw,24px);width:min(640px,96vw);max-height:calc(100vh - 96px)}
.gar-card{position:fixed;right:clamp(10px,2vw,24px);bottom:18px;width:min(400px,92vw);max-height:calc(100vh - 90px);overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.fxl{display:flex;flex-direction:column;gap:2px;font-weight:700;font-size:13.5px}
.fxl .p{color:#15935f}.fxl .m{color:#d2384a}
@media (max-width:1180px) and (min-width:601px){ .gar-list{width:calc(100vw - 470px);min-width:320px} }
@media (max-height:600px){
  #s-garage .grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
  #s-garage .item{padding:6px 6px 5px;gap:3px;border-radius:14px;box-shadow:0 3px 0 var(--ink)}
  #s-garage .item p{display:none}
  #s-garage .item h3{font-size:14px;line-height:1.1}
  #s-garage .item .swatch{height:auto;aspect-ratio:220/124}
  #s-garage .item .swatch.modsw span{font-size:30px}
  #s-garage .item .foot{font-size:12px} #s-garage .item .price{font-size:15px}
  #s-garage .item .tag{font-size:10px;padding:1px 6px}
  .gar-act{position:sticky;bottom:-10px;background:var(--cream);padding:6px 0 4px;margin-bottom:-4px}
}
@media (max-height:600px) and (min-width:601px){
  .gar-card{width:min(360px,44vw);top:62px;bottom:10px;padding:10px 12px;gap:6px}
  .gar-card h3{font-size:19px!important} .gar-card p{font-size:12.5px!important}
  .gar-card .stats{font-size:12px;gap:2px 8px} .gar-card .stats .sb{height:11px;border-width:2px}
  .gar-list{margin-top:62px;max-height:calc(100vh - 72px);width:calc(100vw - min(360px,44vw) - 44px)}
  .gar-list>header h2{font-size:24px} .gar-list .tab{font-size:15px;padding:4px 10px}
}
/* soap lab */
.scroll.more::after,.screen>.panel.more::after{content:'▾';position:sticky;bottom:0;display:block;height:34px;margin-top:-34px;background:linear-gradient(rgba(255,250,243,0),var(--cream) 70%);pointer-events:none;text-align:center;font-weight:700;color:var(--ink2);line-height:46px;font-size:18px;z-index:2;flex:none;order:99}
.lplayer{justify-content:flex-start;gap:8px;align-items:center;text-align:left}
.lplayer img{width:54px;height:30px;object-fit:cover;border-radius:8px;border:2px solid var(--ink);flex:none}
.lplayer .lp{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.lplayer .lp small{font-weight:600;font-size:11.5px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(70vw,720px)}
.soapstrip{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;flex-wrap:wrap}
.soapstrip img{width:76px;height:43px;object-fit:cover;border-radius:9px;border:2px solid var(--ink);flex:none}
.soapstrip .ss{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1}
.soapstrip .ssb{display:flex;gap:6px;flex:none;flex-wrap:wrap}
.soapstrip .ss small{font-weight:700;font-size:11px;opacity:.65;text-transform:uppercase;letter-spacing:.04em}
.soapstrip .ss b{font-family:var(--head);font-weight:400;font-size:19px}
.soapstrip .ss span{font-size:12.5px;font-weight:600;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(560px,60vw)}
@media (max-height:600px){ .soapstrip{padding:4px 8px;gap:8px} .soapstrip img{width:56px;height:32px} .soapstrip .ss b{font-size:15px} .soapstrip .ss span{font-size:11px} .soapstrip .ss small{display:none} .soapstrip .btn.sm{font-size:12px;padding:2px 8px} }
@media (max-width:600px){ .seg button{font-size:13px;padding:5px 8px} .set-grid{gap:8px 8px!important} .soapstrip .ss span{max-width:70vw} }
.paste-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.paste-row input.field{flex:1;min-width:160px;width:auto;font-size:15px}
.lab-nav .mid{display:flex;gap:6px;flex-wrap:nowrap}
.lab-nav{container-type:inline-size;display:block!important}   /* one row always: labels shrink to icons when the list is narrow */
.lab-navin{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
@container (max-width:560px){ .lab-nav .mid .tl{display:none} }
@container (max-width:340px){ .lab-nav .nx{display:none} }
.lab-list>header .nm{display:inline-block;max-width:11em;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;white-space:nowrap}
#s-garage .lab-card h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drawtools .btn.on{--c:var(--lemon)}
@media (pointer:coarse){ .lab-tabs .tab{min-height:36px;min-width:36px;justify-content:center} }
/* Phones: the side card's effect list shows whole lines only: two, or one when an unlock box is showing too. */
@media (max-height:600px), (max-width:600px){ #s-garage .lab-card .fxl{flex-shrink:0} #s-garage .lab-card .lab-need ~ .fxl{max-height:calc(1.25em + 1px)} }
#s-garage .lab-list{width:min(580px,47vw)}
#s-garage .lab-card{width:min(400px,36vw);padding:12px 14px;gap:7px}
#s-garage .lab-card .stats{grid-template-columns:auto 1fr auto auto 1fr auto;gap:4px 7px;font-size:12.5px}
#s-garage .lab-card .stats .sb{height:12px}
#s-garage .lab-card .stats .d{min-width:26px;font-size:11.5px}
#s-garage .lab-card .fxl{flex-direction:row;flex-wrap:wrap;gap:2px 10px;font-size:12.5px}
#s-garage .lab-card h3{font-size:22px!important}
@media (max-width:1180px) and (min-width:601px){ #s-garage .lab-list{width:calc(100vw - min(400px,36vw) - 60px);min-width:300px} }
.lab-list{gap:10px}
.lab-list>header{gap:8px}
.lab-list>header h2{flex:0 1 auto;margin-right:auto}
.lab-tabs{gap:6px;flex:none}
.lab-tabs .tab{font-size:16px;padding:5px 10px 6px;display:flex;align-items:center;gap:4px}
.lab-tabs .tab em{font-style:normal;font-family:var(--font);font-weight:700;font-size:11px;background:var(--ink);color:#fff;border-radius:6px;padding:0 5px;line-height:1.5}
.lab-tabs .tabgap{width:2px;align-self:stretch;background:rgba(43,31,64,.25);border-radius:2px;margin:2px 2px}
.lab-nav{display:flex;gap:8px;align-items:center}
.lab-h{font-family:var(--head);font-weight:400;font-size:20px;margin:14px 0 8px} .lab-h:first-child{margin-top:2px} .lab-h small{font-family:var(--font);font-weight:700;font-size:13px;opacity:.7;margin-left:6px}
.lab-intro{background:var(--lemon);border:3px solid var(--ink);border-radius:16px;padding:10px 14px;font-weight:600;line-height:1.35;margin-bottom:12px;box-shadow:0 4px 0 var(--ink)}
.lab-intro .btn{margin-top:6px}
.tip{margin:6px 0 0;font-weight:600;font-size:13.5px;opacity:.8;line-height:1.3}
.lab-pot{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;align-items:start;margin-bottom:12px}
.potcol{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pot{width:92px;height:104px;border:4px solid var(--ink);border-top-width:0;border-radius:6px 6px 34px 34px;background:linear-gradient(90deg,#f4f7ff,#fff 40%,#e9eefc);box-shadow:0 5px 0 var(--ink);position:relative;overflow:hidden}
.pot:before{content:'';position:absolute;left:-4px;right:-4px;top:0;height:8px;background:var(--ink);border-radius:4px}
.potin{position:absolute;left:0;right:0;bottom:0;top:8px;display:flex;flex-direction:column-reverse}
.potin i{display:block;border-top:2px solid rgba(43,31,64,.35);transition:height .25s}
.potside{display:flex;flex-direction:column;gap:3px;font-weight:600;font-size:13.5px}
.potside b{font-family:var(--head);font-weight:400;font-size:21px}
.potside .pct{font-style:normal;font-weight:700;font-size:13px;color:#7a4f9a}
.potside .btn{align-self:flex-start;margin-top:4px}
.quals{display:grid;grid-template-columns:auto 1fr auto;gap:3px 10px;align-items:center;font-weight:700;font-size:13.5px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 12px}
.quals .q{display:contents}

  const v = _mv, vc = MIRROR.cam;

  v.view.subVectors(v.p, v.cam);
  if (v.view.dot(v.n) > 0) return;

  v.rot.extractRotation(camera.matrixWorld);
  v.look.set(0, 0, -1).applyMatrix4(v.rot).add(v.cam);

  v.q.x = (Math.sign(v.clip.x) + pm.elements[8]) / pm.elements[0];
  v.q.y = (Math.sign(v.clip.y) + pm.elements[9]) / pm.elements[5];
  v.q.z = -1; v.q.w = (1 + pm.elements[10]) / pm.elements[14];

  for (const f of FLOORS) f.userData.U.tRefl.value = null;

  for (const o of HIDE_ALWAYS) o.visible = true;
  for (const f of FLOORS) f.userData.U.tRefl.value = MIRROR.rt.texture;
}

// ---------------------------------------------------------------------------
// Ghost laps: your best lap on each track is recorded (15 samples a second)
// and replayed as a see-through soap when you race alone.
// ---------------------------------------------------------------------------
const GHOST = { rec: [], recT: 0, play: null, view: null, mat: null, tag: null };
const GHOST_HZ = 15;
const ghostKey = (id) => 'soaprocket.ghost.' + id;
function ghostLoad(id) { try { const g = JSON.parse(localStorage.getItem(ghostKey(id)) || 'null'); return g && g.s && g.s.length > 20 ? g : null; } catch (e) { return null; } }
function ghostSave(id, lapTime, samples, lo) {

}
function ghostClear() {
  if (GHOST.view) { scene.remove(GHOST.view.root); GHOST.view.release(); const k = HIDE_IN_MIRROR.indexOf(GHOST.view.root); if (k >= 0) HIDE_IN_MIRROR.splice(k, 1); }

}
// Called from raceSetup.
function ghostSetup() {

  const g = ghostLoad(RACE.trackId); if (!g) return;
  GHOST.play = g;

  if (!GHOST.mat) { GHOST.mat = new THREE.MeshBasicMaterial({ color: 0x8fcfff, transparent: true, opacity: 0.55, depthWrite: false }); GHOST.mat.userData.keep = true; }
  if (!GHOST.ink) { GHOST.ink = outlineMat(0.7, 0x4a78b8); GHOST.ink.transparent = true; GHOST.ink.opacity = 0.4; GHOST.ink.depthWrite = false; GHOST.ink.userData.keep = true; }

// Record the player and drive the ghost (once per frame).
const _gf = { x: 0, y: 0, z: 0, yaw: 0, gnx: 0, gnz: 0, accLong: 0, lean: 0, land: 0, vis: 1, thr: 0.4, brk: 0, boosting: false, alive: true };
function ghostFrame(dt, t) {
  const me = RACE.me;
  if (!me || RACE.attract) return;
  const racing = RACE.phase === 'race' && !me.finished;
  if (racing) {
    // Sample on the race clock, so pauses and hidden tabs never stretch the ghost.
    const lapT = RACE.t - me.lapStart;
    while (GHOST.rec.length <= lapT * GHOST_HZ) {
      GHOST.rec.push([Math.round(me.x * 100) / 100, Math.round(me.z * 100) / 100, Math.round(me.y * 100) / 100, Math.round(me.yaw * 1000) / 1000, Math.round(me.vis * 100) / 100, me.boosting ? 1 : 0]);
      if (GHOST.rec.length > 9000) break;
    }
  }
  const v = GHOST.view, g = GHOST.play;
  if (!v || !g) return;
  // It beat you: it gets the gold pedestal at the ceremony.
  if (RACE.phase === 'podium' && PODIUM.ghostAt) { const A = PODIUM.ghostAt; _gf.x = A.x; _gf.y = A.y; _gf.z = A.z; _gf.yaw = A.yaw; _gf.vis = 1; _gf.boosting = false; v.sync(_gf, dt, t); GHOST.mat.opacity = 0.55; if (GHOST.ink) GHOST.ink.opacity = 0.4; v.root.visible = true; return; }

  const a = g.s[i], b = g.s[i + 1];

  _gf.yaw = a[3] + wrapA(b[3] - a[3]) * f; _gf.vis = a[4]; _gf.boosting = !!a[5];
  v.sync(_gf, dt, t);
  // Fade the ghost when you're right on top of it.
  const d = Math.hypot(_gf.x - me.x, _gf.z - me.z);
  GHOST.mat.opacity = 0.55 * clamp((d - 0.6) / 2, 0.2, 1); if (GHOST.ink) GHOST.ink.opacity = 0.4 * clamp((d - 0.6) / 2, 0.2, 1);

}
// A lap just finished: keep it if it beat the stored best, and show the gap.
function ghostLap(lapTime) {
  const id = RACE.trackId;
  const solo = !!RACE.soloRun;
  const prev = GHOST.play ? GHOST.play.t : (ghostLoad(id) || {}).t;
  if (solo) {
    const g = RACE.ghostResult || (RACE.ghostResult = { beat: false, by: 0, first: !prev });
    if (prev && isFinite(prev)) {
      const dlt = lapTime - prev;
      feed(dlt <= 0 ? 'Beat your ghost by ' + (-dlt).toFixed(2) + 's!' : 'Ghost ahead by ' + dlt.toFixed(2) + 's');

  GP.on = true; GP.diff = d; GP.rev = UI.gpRev; GP.idx = 0; GP.pts = { me: 0 }; const used = [barColor(myLoadout())]; GP.roster = names.map((n) => ({ name: n, lo: randomLoadout(rnd, d === 'scrub' ? 2 : 1, used), kind: 'cpu' }));

};
function gpNext() {
  const t = TRACKS[GP.idx];

  ents.sort((a, b) => (GP.pts[a.key] || 0) - (GP.pts[b.key] || 0));

}
function gpRecord(order) {

  GP.idx++;
}
function gpStandings() {
  const rows = Object.entries(GP.pts).map(([k, v]) => ({ k, v, name: k === 'me' ? offlineName() : k })).sort((a, b) => b.v - a.v);

}

const STAT_WORD = { top: 'speed', wetTop: 'wet speed', grip: 'grip', turn: 'turning', accel: 'getaway', wear: 'lasts', dryMu: 'dry floor', sudsR: 'suds size', sudsCost: 'suds cost', sudsT: 'suds time', regen: 'boost refill', bUse: 'boost lasts', bThrust: 'boost push', bTop: 'boost speed', bubbles: 'bubbles won', draft: 'tailgate charge', spinT: 'spin-outs', wallKeep: 'wall glance', chip: 'chips', mass: 'weight' };
const STAT_FLIP = new Set(['wear', 'dryMu', 'sudsCost', 'bUse', 'spinT', 'chip']);   // lower is better
function stChips(st) {
  return `<div class="chips">${Object.entries(st || {}).map(([k, v]) => {
    if (!STAT_WORD[k] || typeof v !== 'number' || Math.abs(v - 1) < 0.005) return k === 'chipless' ? '<span class="c p">+ never chips</span>' : '';
    if (k === 'mass') return `<span class="c n">${v > 1 ? 'heavier' : 'lighter'}</span>`;
    const good = STAT_FLIP.has(k) ? v < 1 : v > 1;
    return `<span class="c ${good ? 'p' : 'm'}">${good ? '+' : '-'} ${STAT_WORD[k]}</span>`;
  }).join('')}</div>`;
}
function qualsHtml(rec) {
  const q = recipeQualities(rec), ok = inIdeal(q), n = ok.filter(Boolean).length, tot = Object.values(rec.oils || {}).reduce((a, b) => a + b, 0);
  const tips = n === 5 && tot ? [] : soapTips(q, tot);
  const rows = QUALS.map(([, name, [a, b], what], i) => `<div class="q ${ok[i] ? 'ok' : ''}" title="${esc(what)}"><span class="qn">${name}</span><div class="qb"><span class="zone" style="left:${a}%;width:${b - a}%"></span><i style="left:${clamp(q[i], 0, 100)}%"></i></div><b>${Math.round(q[i])}</b><small>${esc(what)}</small></div>`).join('');
  return `<div class="quals">${rows}<div class="qsum ${n === 5 ? 'ok' : ''}">${n === 5 && tot ? '⭐ Balanced recipe: every quality in the green zone, like a real soapmaker aims for.' : n + ' of 5 qualities in the green zone. Outside it, your soap gets good at one thing and bad at another.'}${tips.map((t) => `<span class="qtip">💡 ${esc(t)}</span>`).join('')}</div></div>`;
}
function stampSvg(kind, letter, fill = '#2b1f40') {
  const p = STAMP_PATHS[kind];
  const inner = p ? `<path d="${p}" fill="${fill}"/>`
    : kind === 'bubble' ? '<circle cx="-0.14" cy="0.08" r="0.24"/><circle cx="0.2" cy="-0.14" r="0.15"/><circle cx="0.22" cy="0.22" r="0.09"/>'
    : kind === 'paw' ? '<ellipse cx="0" cy="0.12" rx="0.22" ry="0.18"/><ellipse cx="-0.26" cy="-0.12" rx="0.08" ry="0.1"/><ellipse cx="-0.09" cy="-0.26" rx="0.08" ry="0.1"/><ellipse cx="0.09" cy="-0.26" rx="0.08" ry="0.1"/><ellipse cx="0.26" cy="-0.12" rx="0.08" ry="0.1"/>'
    : kind === 'flower' ? [0, 1, 2, 3, 4, 5].map((k) => { const a = k / 6 * 360; return `<ellipse cx="${(Math.cos(a / 57.3) * 0.2).toFixed(3)}" cy="${(Math.sin(a / 57.3) * 0.2).toFixed(3)}" rx="0.15" ry="0.1" transform="rotate(${a} ${(Math.cos(a / 57.3) * 0.2).toFixed(3)} ${(Math.sin(a / 57.3) * 0.2).toFixed(3)})"/>`; }).join('') + '<circle r="0.11"/>'
    : kind === 'smile' ? `<circle r="0.38" fill="none" stroke="${fill}" stroke-width="0.07"/><path d="M-0.18 0.1 Q0 0.3 0.18 0.1" fill="none" stroke="${fill}" stroke-width="0.07" stroke-linecap="round"/><circle cx="-0.13" cy="-0.1" r="0.05"/><circle cx="0.13" cy="-0.1" r="0.05"/>`
    : kind === 'letter' ? `<text x="0" y="0.27" font-size="0.8" text-anchor="middle" font-family="Lilita One, sans-serif">${esc(letter || '?')}</text>`
    : kind === 'logo' ? '<rect x="-0.4" y="-0.22" width="0.8" height="0.44" rx="0.12"/><circle cx="0.18" cy="-0.3" r="0.14" fill="#fff" stroke="#2b1f40" stroke-width="0.05"/>'
    : '<path d="M-0.3 -0.3 L0.3 0.3 M0.3 -0.3 L-0.3 0.3" stroke="#2b1f40" stroke-width="0.08" opacity=".35"/>';
  return `<svg viewBox="-0.55 -0.55 1.1 1.1" width="100%" height="100%" fill="${fill}">${inner}</svg>`;
}
function patCss(id, rec) {
  const a = hex(rec.col), b = hex(rec.col2);
  switch (id) {
    case 'layers': return `background:linear-gradient(to top,${b} 0 44%,#fff 44% 56%,${a} 56%)`;
    case 'swirl': return `background:radial-gradient(ellipse at 30% 30%,${b} 0 14%,transparent 15%),radial-gradient(ellipse at 70% 65%,${b} 0 18%,transparent 19%),conic-gradient(from 40deg,${a},${b},${a},${b},${a})`;
    case 'split': return `background:linear-gradient(135deg,${a} 0 50%,${b} 50%)`;
    case 'speckle': return `background:radial-gradient(${b} 18%,transparent 22%) 0 0/9px 9px,${a}`;
    case 'ombre': return `background:linear-gradient(${a},${b})`;
    case 'galaxy': return `background:radial-gradient(#fff 8%,transparent 12%) 3px 4px/11px 13px,radial-gradient(circle at 60% 40%,${b},transparent 60%),#1d1838`;
    case 'confetti': return `background:linear-gradient(30deg,transparent 40%,${b} 40% 50%,transparent 50%) 0 0/16px 14px,linear-gradient(-40deg,transparent 45%,#8fd3ff 45% 55%,transparent 55%) 6px 3px/18px 16px,${a}`;
    default: return `background:${a}`;
  }
}

function labOilsHtml(rec) {

  const pot = LAB.empty ? '' : Object.entries(rec.oils).map(([k, n]) => `<i style="height:${n / POT_MAX * 100}%;background:${hex(OILS[k].col)}" title="${OILS[k].name}: ${n}"></i>`).join('');
  const intro = !P.lab.made ? `<div class="lab-intro"><b>Welcome to the Soap Lab!</b> Every racer makes their own soap.<span class="long"> Real soap is oils turned into soap, and each oil changes how hard, slippery and bubbly the bar is.</span> Pour in oils, pick a mold, colour it, then race it.${LAB.after ? ' <button class="btn sm ghost" data-act="labSkip">Skip: race the starter soap</button>' : ''}</div>` : '';
  const tiles = Object.entries(OILS).map(([k, o]) => {
    const n = LAB.empty ? 0 : rec.oils[k] || 0, key = 'o:' + k;
    return `<div class="item oil ${n ? 'on' : ''}"><div class="oilrow"><span class="bottle" style="--oc:${hex(o.col)}"></span><h3>${o.name}</h3></div><p>${o.blurb}</p>
      <div class="foot"><button class="mini" data-act="oilSub" data-arg="${k}" ${n && !(tot <= 1 && !LAB.empty) ? '' : 'disabled'} aria-label="Less ${o.name}">−</button><b class="cnt">${n}</b><button class="mini" data-act="oilAdd" data-arg="${k}" ${!LAB.empty && tot >= POT_MAX ? 'disabled' : ''} aria-label="More ${o.name}">+</button><span style="flex:1"></span>${lockTag(key)}</div></div>`;
  }).join('');
  return `${intro}<div class="lab-pot"><div class="potcol"><div class="pot"><div class="potin">${pot}</div></div>
    <div class="potside"><b>${LAB.empty ? 'Empty pot' : tot + ' scoop' + (tot === 1 ? '' : 's') + ' of oil'}</b>${LAB.empty ? '' : `<em class="pct">${Object.entries(rec.oils).sort((a, b) => b[1] - a[1]).map(([k, n]) => Math.round(n / tot * 100) + '% ' + OILS[k].name.replace(/ (oil|butter)$/, '').toLowerCase()).join(', ')}</em>`}<span>Each scoop is one part of the recipe (up to ${POT_MAX}).</span>
      <button class="btn sm ghost" data-act="oilEmpty">Empty the pot</button></div></div>${qualsHtml(LAB.empty ? { oils: {} } : rec)}</div>
    <div class="grid oil-grid">${tiles}</div>`;
}
function labMoldHtml(rec) {

  const special = Object.entries(MOLDS).filter(([, m]) => m.model).map(([id, m]) => { const th = THUMBS['bar:' + m.bar]; return `<div class="item mold ${rec.mold === id ? 'on' : ''}" data-act="labMold" data-arg="${id}">${th ? `<div class="swatch pic"><img src="${th}" alt=""></div>` : ''}<h3>${m.name}</h3><p>${m.blurb}</p><div class="foot">${lockTag('o:' + id)}</div></div>`; }).join('');

function labCardInner() {

      ok('lab: an old save turns its bars into soaps (and keeps the one you raced)', P.soaps.length === 3 && act.name === 'Pumice Grip' && labOwns('m:pumice') && labOwns('o:golden') && !labOwns('o:galaxy'), P.soaps.map((r) => r.name).join(', '));
      P = keepP; ensureSoaps();
      // The Lab screen: live edits, previews of locked things, unlocking, the shelf.
      ACT.lab(); const id0 = activeSoap().id, n0 = activeSoap().oils.olive;
      ACT.oilAdd('olive');
      ok('lab: pouring a scoop changes your soap straight away', UI.cur === 'garage' && activeSoap().oils.olive === n0 + 1 && activeSoap().id === id0);
      const b0 = P.bubbles; P.bubbles = 1000; ACT.labMold('star');
      ok('lab: a locked mold is only previewed until you unlock it', LAB.preview && LAB.preview.mold === 'star' && activeSoap().mold === 'classic' && LAB.need.includes('o:star'));
      ACT.labUnlock();
      ok('lab: unlocking pays and makes it yours', activeSoap().mold === 'star' && !LAB.preview && P.bubbles === 1000 - MOLDS.star.price && labOwns('o:star'));
      ACT.soapNew('mini'); ACT.soapCopy(activeSoap().id);
      ok('lab: new and copied soaps get their own ids', new Set(P.soaps.map((r) => r.id)).size === P.soaps.length && P.soaps.length >= 3);
      ACT.labMake();
      ok('lab: Make it! counts your soap', P.lab.made >= 1 && !!LAB.madeT);
      ACT.labDrawer(''); P.bubbles = b0;
      // The shower tray: same kick, different soaps.
      trayInit();
      const kick = (r) => { const s = traySim(cleanLoadout({ soap: R(r) })); s.vx = TRAY_KICK / s.S.mass; s.moving = true; for (let k = 0; k < 120 * 25 && (s.moving || k < 3); k++) trayStep(s, CFG.dt); return s; };
      const kc = kick({}), kl = kick({ size: 0.82 }), kh = kick({ size: 1.15, mix: ['oat'] }), kg = kick({ clear: 1, oils: { olive: 6, coconut: 2, castor: 2 } }), kp = kick({ mix: ['pumice'] });
      ok('tray: a Test kick slides a classic bar down the tray to knock the far rim (like the video)', kc.dist > 9.5 && kc.dist < 10.8 && kc.hits === 1, kc.dist.toFixed(2) + ' soap lengths, ' + kc.hits + ' knock');
      const ks = kick({ mold: 'long', size: 0.8, clear: 1, oils: { olive: 6, coconut: 2, castor: 2 } });
      ok('tray: a light, slick soap can reach the 11-length goal; the starter can not', ks.dist >= 11 && kc.dist < 11, ks.dist.toFixed(2) + ' vs ' + kc.dist.toFixed(2));
      const sl = traySim(cleanLoadout({ soap: R({}) })); sl.x = 0; sl.z = 0; sl.yaw = 0.9; sl.vx = 6; sl.w = 6; sl.moving = true; for (let k = 0; k < 60; k++) trayStep(sl, CFG.dt);
      ok('tray: a spinning soap still slides in a straight line (no rocket steering it)', Math.abs(sl.z) < 0.02, 'drifted ' + sl.z.toFixed(3));
      ok('tray: the same kick sends a light soap further than a heavy one', kl.dist > kh.dist * 1.4, kl.dist.toFixed(1) + ' vs ' + kh.dist.toFixed(1));
      ok('tray: a slick glycerin soap out-glides a gritty pumice one', kg.dist > kp.dist, kg.dist.toFixed(1) + ' vs ' + kp.dist.toFixed(1));
      const sw = traySim(cleanLoadout({ soap: R({}) })); sw.x = 0; sw.z = 0; sw.vx = 7; sw.vz = -2.4; sw.yaw = Math.atan2(sw.vx, sw.vz); sw.moving = true;
      let hit = null, vt0 = 0; for (let k = 0; k < 600 && !hit; k++) { vt0 = Math.abs(sw.vz); trayStep(sw, CFG.dt); if (sw.hits) hit = { vt: Math.abs(sw.vz), vn: sw.vx }; }
      ok('tray: the rim bounces a soap back but it keeps sliding along it', hit && hit.vn < 0 && hit.vt > vt0 * 0.55, hit ? 'back ' + hit.vn.toFixed(2) + ', along ' + vt0.toFixed(2) + ' -> ' + hit.vt.toFixed(2) : 'no hit');
      const sp = traySim(cleanLoadout({ soap: R({}) })); TRAY.s = sp; trayKick(1, 0, 8, 0.6);
      ok('tray: a flick that catches one end sets the soap spinning', Math.abs(sp.w) > 2, sp.w.toFixed(2));
      TRAY.s = null;
      // No leaks: soap shapes and paint are let go when a race is cleared.
      raceSetup({ track: 'shower', laps: 1, cpus: 7, diff: 'lather', mode: 'quick' }); clearRacers();
      const held = [...SOAPGEO.values()].reduce((a, e) => a + e.n, 0);
      ok('lab: clearing a race lets go of its soaps', held <= 4, held + ' still held');
      showTitle();
    }
    // A full CPU race finishes.
    raceSetup({ track: 'tub', laps: 1, cpus: 5, diff: 'scrub', mode: 'quick' });
    RACE.me.kind = 'cpu'; RACE.cpus.push(new CpuDriver(RACE.me, 'scrub', 3));
    RACE.phase = 'count'; RACE.t = -0.01;
    let steps = 0; while (steps < 120 * 90 && !RACE.racers.every((r) => r.finished)) { raceStep(CFG.dt); handleEvents(); steps++; }
    const fin = RACE.racers.filter((r) => r.finished).length;
    ok('CPU race: everyone finishes 1 lap of the tub in 90 s', fin === RACE.racers.length, fin + '/' + RACE.racers.length + ' in ' + (steps / 120).toFixed(1) + 's');
    for (const d of [...TRACKS, ...TRACKS.map((t) => TRACK_BY[t.id + '-r'])]) {
      raceSetup({ track: d.id, laps: 1, cpus: 7, diff: 'lather', mode: 'quick' });
      RACE.me.kind = 'cpu'; RACE.cpus.push(new CpuDriver(RACE.me, 'lather', 4));
      RACE.phase = 'count'; RACE.t = -0.01; steps = 0;
      while (steps < 120 * 100 && !RACE.racers.every((r) => r.finished)) { raceStep(CFG.dt); handleEvents(); steps++; }
      const f = RACE.racers.filter((r) => r.finished);
      const times = f.map((r) => r.finishT).sort((a, b) => a - b);
      ok(d.id + ': 8 CPUs finish a lap', f.length === 8, f.length + '/8, first ' + (times[0] || 0).toFixed(1) + 's last ' + (times[times.length - 1] || 0).toFixed(1) + 's');
    }
  } catch (e) { ok('no exceptions', false, e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : String(e)); }
  const pre = document.createElement('pre'); pre.id = 'smokeout'; pre.textContent = out.join('\n'); pre.style.cssText = 'position:fixed;inset:10px;z-index:999;background:#fff;overflow:auto;font:12px monospace;padding:10px;border:3px solid #000';
  document.body.appendChild(pre);
  document.title = (fail ? 'SMOKE FAIL ' : 'SMOKE PASS ') + pass + '/' + (pass + fail);
}
