<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c9ecff">
<title>Soap Rocket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<script src="glitchbox-config.js"></script>
<script src="glitchbox-save.js" data-pos="top-right"></script>
<style>
:root{
  --ink:#2b1f40; --ink2:#4b3f6b; --pink:#ff8fc2; --pink2:#ffd6ea; --cream:#fffaf3; --sky:#bfe6ff; --sky2:#e7f6ff;
  --mint:#8ee8c8; --lemon:#ffd95a; --lilac:#c9b6ff; --red:#f2443b; --peach:#ffb38a; --white:#ffffff;
  --shadow:0 6px 0 var(--ink); --r:22px;
  --font:'Fredoka',system-ui,sans-serif; --head:'Lilita One','Fredoka',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#bfe6ff,#fde9f3);font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.off{display:none!important}
button{font-family:inherit;color:inherit}

/* ---------- sticker kit ---------- */
.btn{--c:var(--pink);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.45em;font-family:var(--head);font-size:clamp(17px,2.1vw,26px);letter-spacing:.02em;
  background:var(--c);border:4px solid var(--ink);border-radius:18px;padding:.42em 1.05em .5em;box-shadow:0 6px 0 var(--ink);cursor:pointer;
  transform:rotate(var(--rot,0deg));transition:transform .13s cubic-bezier(.3,1.6,.5,1),box-shadow .1s;white-space:nowrap;color:var(--ink)}
.btn:hover,.btn:focus-visible{transform:rotate(var(--rot,0deg)) translateY(-3px) scale(1.04);outline:none}
.btn:active{transform:rotate(var(--rot,0deg)) translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn[disabled]{filter:grayscale(.7) opacity(.6);cursor:default}
.btn.sm{font-size:clamp(14px,1.5vw,18px);padding:.3em .8em .36em;border-width:3px;box-shadow:0 4px 0 var(--ink);border-radius:14px}
.btn.big{font-size:clamp(22px,3vw,38px);padding:.38em 1.1em .46em}
.btn .k{font-family:var(--font);font-weight:700;font-size:.62em;background:var(--ink);color:#fff;border-radius:8px;padding:.1em .45em;letter-spacing:0}
.btn.ghost{--c:#fff}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow)}
.tag{display:inline-block;font-weight:700;font-size:13px;background:var(--ink);color:#fff;border-radius:9px;padding:2px 9px;letter-spacing:.03em}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 12px 4px;box-shadow:0 3px 0 var(--ink)}
h1,h2,h3{font-family:var(--head);font-weight:400;margin:0;letter-spacing:.02em}
.outline-text{color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:flex;z-index:20;pointer-events:none;animation:scrIn .32s cubic-bezier(.2,1.3,.4,1)}
.screen>*{pointer-events:auto}
.screen.dim{background:radial-gradient(ellipse at 70% 40%,rgba(255,255,255,0),rgba(43,31,64,.42))}
.screen.veil{background:rgba(201,236,255,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
@keyframes scrIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.topbar{position:fixed;top:14px;left:18px;right:150px;display:flex;align-items:center;gap:12px;z-index:30;pointer-events:none}
.topbar>*{pointer-events:auto}
.wallet{font-family:var(--head);font-size:22px}
.wallet .b{display:inline-block;width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff 0 18%,#e8f8ff 30%,#b9e3ff 70%,#d9c9ff);vertical-align:-3px;margin-right:2px}

/* title */
#s-title{align-items:stretch}
#s-title .col{display:flex;flex-direction:column;justify-content:center;gap:16px;padding:70px 0 40px clamp(20px,5vw,80px);width:min(640px,92vw)}
.logo{font-family:var(--head);line-height:.86;font-size:clamp(58px,9.5vw,132px);color:#fff;-webkit-text-stroke:clamp(7px,1vw,12px) var(--ink);paint-order:stroke fill;
  text-shadow:0 clamp(7px,1vw,12px) 0 var(--ink);transform:rotate(-4deg);margin-bottom:6px;position:relative}
.logo .a{color:var(--pink)} .logo .b{color:var(--lemon);display:inline-block;transform:translateX(.22em) rotate(3deg)}
.logo small{display:block;font-family:var(--font);font-weight:700;-webkit-text-stroke:5px #fff;paint-order:stroke fill;text-shadow:none;font-size:clamp(14px,1.5vw,19px);color:var(--ink);letter-spacing:.02em;margin:18px 0 0 6px;transform:rotate(4deg)}
.menu{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.menu .row{display:flex;gap:12px;flex-wrap:wrap}
.bubbles-deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bubbles-deco i{position:absolute;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 32% 28%,#fff 0 14%,rgba(255,255,255,.55) 22%,rgba(190,230,255,.35) 60%,rgba(215,195,255,.55));opacity:.9;animation:floatUp linear infinite}
@keyframes floatUp{from{transform:translateY(0) scale(1)}to{transform:translateY(-120vh) scale(1.15)}}

/* panels */
.panel{margin:auto;width:min(1100px,95vw);max-height:92vh;display:flex;flex-direction:column;gap:14px;padding:22px 24px 24px;position:relative}
.panel>header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.panel>header h2{font-size:clamp(28px,3.4vw,44px);flex:1}
.scroll{overflow:auto;min-height:0;scrollbar-width:thin}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font-family:var(--head);font-size:18px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 14px 7px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.tab.on{background:var(--lemon);transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.item{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px 12px 10px;box-shadow:0 5px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative;transition:transform .12s}
.item:hover{transform:translateY(-3px) rotate(-.6deg)}
.item.on{background:var(--pink2);outline:4px solid var(--pink);outline-offset:-9px}
.item.sel{transform:translateY(-3px) scale(1.02);box-shadow:0 8px 0 var(--ink)}
.item h3{font-size:20px}
.item p{margin:0;font-size:13.5px;line-height:1.3;color:var(--ink2)}
.item .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-weight:700}
.swatch{height:54px;border-radius:12px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:28px;position:relative;overflow:hidden}
.swatch.modsw{height:auto;aspect-ratio:220/124}
.swatch.modsw span{font-size:46px;filter:drop-shadow(0 3px 0 rgba(43,31,64,.35))}
.swatch.pic{height:auto;aspect-ratio:220/124;padding:0;background:#eaf6ff}
.swatch.pic img{width:100%;height:100%;object-fit:cover;display:block}
.swatch .bar{width:64%;height:62%;border-radius:12px;border:3px solid var(--ink);box-shadow:inset -6px -6px 0 rgba(0,0,0,.08),inset 5px 5px 0 rgba(255,255,255,.45)}
.price{font-family:var(--head);font-size:18px}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;font-weight:700;font-size:14px}
.stats .sb{height:14px;border:3px solid var(--ink);border-radius:9px;background:#fff;position:relative;overflow:hidden}
.stats .sb i{position:absolute;left:0;top:0;bottom:0;background:var(--mint);border-right:3px solid var(--ink)}
.stats .sb b{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--c) 0 5px,transparent 5px 9px)}
.stats .d{font-size:13px;min-width:34px;text-align:right}
.up{color:#15935f}.dn{color:#d2384a}
label.opt{display:flex;align-items:center;gap:10px;font-weight:600}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:13px;overflow:hidden;box-shadow:0 3px 0 var(--ink);background:#fff}
.seg button{border:0;background:transparent;font-weight:700;font-size:15px;padding:6px 12px;cursor:pointer;border-right:3px solid var(--ink)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--lemon)}
input.field{font-family:var(--head);font-size:24px;border:4px solid var(--ink);border-radius:14px;padding:6px 12px;width:200px;text-transform:uppercase;box-shadow:0 4px 0 var(--ink);outline:none;color:var(--ink);background:#fff}
input.field.name{text-transform:none;font-family:var(--font);font-weight:700;font-size:19px;width:220px}

/* garage */
.gar-list{margin:76px 0 18px clamp(10px,2vw,24px);width:min(640px,96vw);max-height:calc(100vh - 96px)}
.gar-card{position:fixed;right:clamp(10px,2vw,24px);bottom:18px;width:min(400px,92vw);max-height:calc(100vh - 90px);overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.fxl{display:flex;flex-direction:column;gap:2px;font-weight:700;font-size:13.5px}
.fxl .p{color:#15935f}.fxl .m{color:#d2384a}
@media (max-width:1180px) and (min-width:601px){ .gar-list{width:calc(100vw - 470px);min-width:320px} }
@media (max-height:600px) and (min-width:601px){
  .gar-card{width:min(360px,44vw);top:62px;bottom:10px;padding:10px 12px;gap:6px}
  .gar-card h3{font-size:19px!important} .gar-card p{font-size:12.5px!important}
  .gar-card .stats{font-size:12px;gap:2px 8px} .gar-card .stats .sb{height:11px;border-width:2px}
  .gar-list{margin-top:62px;max-height:calc(100vh - 72px);width:calc(100vw - min(360px,44vw) - 44px)}
  .gar-list>header h2{font-size:24px} .gar-list .tab{font-size:15px;padding:4px 10px}
}
/* grand prix */
.gp-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.gp-row .item{cursor:default;padding:8px}
.gp-row h3{font-size:clamp(13px,1.45vw,20px)}
/* track cards */
.trk{display:flex;flex-direction:column;gap:6px}
.grid.trk-grid{grid-template-columns:repeat(auto-fill,minmax(164px,1fr))}
.trk-grid .item p{font-size:12.5px}
.trk canvas{width:100%;aspect-ratio:16/10;border-radius:12px;border:3px solid var(--ink);background:#e9f6ff;display:block}

/* results */
.res-panel{width:min(600px,95vw);margin:70px 22px auto auto;max-height:calc(100vh - 86px)!important}
.res-panel.gp{width:min(880px,96vw)}
.res-panel.gp .res-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:start}
.res-panel .stand .reward{font-size:13.5px}
.res-grid{display:flex;flex-direction:column;gap:10px}
.res-panel table.res{border-spacing:0 4px;font-size:14px}
.res-panel table.res td{padding:4px 9px}
.res-panel table.res td:first-child{font-size:18px;width:44px}
.res-panel h2{font-size:clamp(26px,3vw,38px)!important}
.res-panel{max-height:96vh;padding:16px 18px 18px;gap:10px}
.res-panel table.res td{padding:3px 9px}
.res-panel .btn.big{font-size:clamp(18px,2.2vw,26px)}
.res-panel .btn{font-size:clamp(15px,1.7vw,20px)}
.res-panel .reward{padding:1px 0;font-size:14px}
.res-panel .card h3{font-size:19px!important}
@media (max-width:760px){.res-panel{margin:62px auto 8px}}
table.res{width:100%;border-collapse:separate;border-spacing:0 6px;font-weight:700}
table.res td{background:#fff;padding:7px 10px;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
table.res td:first-child{border-left:3px solid var(--ink);border-radius:12px 0 0 12px;font-family:var(--head);font-size:22px;width:56px;text-align:center}
table.res td:last-child{border-right:3px solid var(--ink);border-radius:0 12px 12px 0;text-align:right}
table.res tr.me td{background:var(--pink2)}
table.res.trophy td{font-size:15px;padding:5px 10px}
table.res.trophy td:first-child{font-family:var(--font);font-weight:700;font-size:15px;width:auto;text-align:left}
table.res.trophy th{font-size:13px;text-transform:uppercase;letter-spacing:.04em;opacity:.7}
.chip{display:inline-block;width:16px;height:16px;border-radius:6px;border:3px solid var(--ink);vertical-align:-3px;margin-right:6px}
.reward{display:flex;justify-content:space-between;font-weight:700;padding:3px 0;border-bottom:2px dashed rgba(43,31,64,.2)}
.reward b{font-family:var(--head);font-weight:400}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;font-family:var(--head)}
.hcard{position:absolute;background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:4px 14px 6px}
#hPos{left:16px;top:14px;background:var(--pink);transform:rotate(-3deg);padding:0 16px 4px;display:flex;align-items:baseline;gap:2px}
#hPos.bump{animation:posUp .45s cubic-bezier(.2,1.8,.4,1)}
#hPos.bumpd{animation:posDn .35s ease-out}
@keyframes posUp{0%{transform:rotate(-3deg) scale(1.35)}100%{transform:rotate(-3deg) scale(1)}}
@keyframes posDn{0%{transform:rotate(-3deg) translateY(6px);filter:saturate(.3)}100%{transform:rotate(-3deg)}}
#hPos b{font-weight:400;font-size:56px;line-height:1;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill}
#hPos small{font-size:26px;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
#hPos span{font-size:22px;margin-left:4px}
#hLap{left:16px;top:96px;background:var(--lemon);font-size:22px;transform:rotate(2deg)}
#hTime{left:16px;top:146px;font-size:19px;font-family:var(--font);font-weight:700;padding:3px 12px 4px}
#hTime small{display:block;font-size:12px;opacity:.7;margin-top:-2px}
#hCoins{left:124px;top:146px;font-size:19px;font-family:var(--font);font-weight:700;padding:3px 12px 4px;display:flex;align-items:center;gap:6px;background:var(--lemon)}
#hCoins i{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 35% 35%,#fff5c0,#ffc93c 60%,#e0a020)}
#hBoard{position:absolute;left:16px;top:205px;display:flex;flex-direction:column;gap:3px;font-family:var(--font);font-weight:700;font-size:13px}
#hBoard div{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.85);border:2px solid var(--ink);border-radius:9px;padding:1px 8px 1px 4px;width:150px}
#hBoard div.me{background:var(--pink2)}
#hBoard i{width:12px;height:12px;border-radius:4px;border:2px solid var(--ink);flex:none}
#hBoard em{font-style:normal;font-family:var(--head);width:16px;text-align:center}
#hBoard span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hMap{position:absolute;right:14px;top:56px;width:min(210px,24vw);height:auto;aspect-ratio:1;filter:drop-shadow(0 4px 0 var(--ink))}
#hMeters{position:absolute;left:16px;bottom:16px;display:flex;gap:12px;align-items:flex-end}
.meter{width:150px;background:#fff;border:4px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:5px 10px 8px}
.meter .l{display:flex;justify-content:space-between;font-size:16px}
.meter .l .k{font-family:var(--font);font-weight:700;font-size:11px;background:var(--ink);color:#fff;border-radius:6px;padding:1px 6px;align-self:center}
.meter .t{height:18px;border:3px solid var(--ink);border-radius:9px;background:#efe9ff;overflow:hidden;position:relative;margin-top:3px}
.meter .t i{position:absolute;left:0;top:0;bottom:0;width:50%;border-right:3px solid var(--ink);transition:width .08s}
#mSoap .t i{background:linear-gradient(#ffb3d6,var(--pink))}
#mBoost .t i{background:linear-gradient(#ffe48a,#ff9a3c)}
#mBoost.full{animation:pulse .7s ease-in-out infinite alternate}
#mBoost.charging{box-shadow:0 5px 0 var(--ink),0 0 0 4px #8ee8c8,0 0 18px 4px rgba(142,232,200,.9)}
#mBoost.charging .k{background:#15935f}
#mSuds .t i{background:linear-gradient(#ffffff,#bfe6ff)}
@keyframes pulse{to{transform:translateY(-3px) rotate(-1.5deg)}}
#hDrops{position:absolute;inset:0;overflow:hidden}
#hDrops i{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95) 0 12%,rgba(255,255,255,.25) 22%,rgba(210,235,255,.12) 55%,rgba(120,150,190,.35) 100%);box-shadow:inset -2px -3px 4px rgba(40,60,100,.25),0 1px 2px rgba(255,255,255,.4);backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px);animation:dropFade 1.6s ease-in forwards}
@keyframes dropFade{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(26px) scale(.9)}}
#hTags{position:fixed;inset:0;pointer-events:none;z-index:11;font-family:var(--head)}
#hTags .tag3{position:absolute;transform:translate(-50%,-100%);font-family:var(--font);font-weight:700;font-size:13px;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:1px 8px;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
#hTags .tag3.emo{animation:popIn .35s cubic-bezier(.2,1.8,.4,1) both;padding:0 8px 2px}
#hTags .tag3 i{display:inline-block;width:10px;height:10px;border-radius:3px;border:2px solid var(--ink);margin-right:5px;vertical-align:-1px}
.ctrlcard{display:grid;grid-template-columns:auto auto;gap:6px 14px;font-family:var(--font);font-weight:700;font-size:15px;background:rgba(255,255,255,.94);border:4px solid var(--ink);border-radius:18px;padding:12px 18px;box-shadow:0 6px 0 var(--ink);animation:popIn .45s cubic-bezier(.2,1.6,.4,1) both}
.ctrlcard b{background:var(--ink);color:#fff;border-radius:7px;padding:1px 8px;text-align:center;font-weight:700}
#hCenter{position:absolute;left:0;right:0;top:24%;display:flex;flex-direction:column;align-items:center;gap:6px}
.pop{font-size:clamp(46px,8vw,104px);color:#fff;-webkit-text-stroke:clamp(6px,.9vw,10px) var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);animation:popIn .5s cubic-bezier(.2,1.8,.4,1) both}
.pop.c2{color:var(--lemon)} .pop.c3{color:var(--pink)} .pop.c4{color:var(--mint)} .pop.sm{font-size:clamp(26px,4vw,48px);-webkit-text-stroke-width:6px;text-shadow:0 5px 0 var(--ink)}
@keyframes popIn{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(-3deg);opacity:1}}
.fadeout{animation:fadeOut .45s ease-in both!important}
@keyframes fadeOut{to{opacity:0;transform:scale(1.25) rotate(4deg)}}
#hFeed{position:absolute;right:16px;bottom:18px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-family:var(--font);font-weight:700}
body.touch #hFeed{right:auto;left:50%;transform:translateX(-50%);top:62px;bottom:auto;align-items:center}
body.touch #hCenter{top:40%}
#hFeed div{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:3px 10px;box-shadow:0 3px 0 var(--ink);animation:feedIn .3s cubic-bezier(.2,1.6,.4,1) both;font-size:15px}
@keyframes feedIn{from{transform:translateX(40px);opacity:0}}
#hSpeed{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:16px;font-family:var(--font);font-weight:700;opacity:.0}
.hint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);font-family:var(--font);font-weight:700;background:rgba(255,255,255,.92);border:3px solid var(--ink);border-radius:14px;padding:6px 14px;box-shadow:0 4px 0 var(--ink);font-size:15px;white-space:nowrap}
.hint b{background:var(--ink);color:#fff;border-radius:6px;padding:0 6px;margin:0 2px}

/* touch */
#touch{position:fixed;inset:0;z-index:12;pointer-events:none}
.tb{position:absolute;pointer-events:auto;border:4px solid var(--ink);border-radius:50%;background:rgba(255,255,255,.82);box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:20px;touch-action:none}
.tb.on{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);background:var(--lemon)}
#tL{left:22px;bottom:30px;width:92px;height:92px;font-size:36px}
#tR{left:130px;bottom:30px;width:92px;height:92px;font-size:36px}
#tGo{right:24px;bottom:28px;width:112px;height:112px;background:rgba(142,232,200,.92);font-size:26px}

// ---------------------------------------------------------------------------

const HASH = location.hash || '';

const now = () => performance.now();
function mulberry(seed) {
  let a = seed >>> 0;

}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const ordS = (n) => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return s[(v - 20) % 10] || s[v] || s[0]; };

const NOISE_P = new Uint8Array(512);

// ---------------------------------------------------------------------------
const ASSET_V = "202611040804";
const LODS = { hi: 'models/soap-rocket-hi.glb', mid: 'models/soap-rocket-mid.glb', lo: 'models/soap-rocket-lo.glb' };

let MODELS_OK = false;

async function loadModels(onProg) {
  const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);

  await Promise.all(keys.map(async (k) => {
    const g = await loader.loadAsync(LODS[k] + '?v=' + ASSET_V);

// ==== 07-racer.js ====
// ---------------------------------------------------------------------------
// Racer physics. Velocity is split into forward and sideways parts: grip scrubs
// the sideways part (some of it carved back into forward speed), friction is a
// constant drag (very low when wet, like the soap in the video) and quadratic
// drag sets top speed. Walls barely bounce and let the bar slide along them.
// ---------------------------------------------------------------------------
const SUDS = {
  list: [], nextId: 1,
  add(x, z, r, owner, life = CFG.sudsLife, id) {
    const s = { id: id || (owner && owner.netId ? owner.netId + ':' + this.nextId++ : 'l' + this.nextId++), x, z, r, owner, born: RACE.t, life, t: life };
    this.list.push(s); FX.sudsSpawn(s);
    return s;
  },
  at(x, z, who) {
    let v = 0;
    for (const s of this.list) {
      if (s.owner === who && RACE.t - s.born < 0.9) continue;
      const d = Math.hypot(x - s.x, z - s.z);
      if (d < s.r) { let k = (1 - d / s.r) * 2.2 * Math.min(1, s.t / 1.5); if (s.weak) k = Math.min(k, 0.3); if (k > v) v = Math.min(1, k); }

  update(dt) { for (const s of this.list) s.t -= dt; const dead = this.list.filter((s) => s.t <= 0); if (dead.length) { this.list = this.list.filter((s) => s.t > 0); for (const s of dead) FX.sudsGone(s); } },
  clear() { for (const s of this.list) FX.sudsGone(s); this.list = []; },

// Ghost laps: your best lap on each track is recorded (15 samples a second)

const GHOST = { rec: [], recT: 0, play: null, view: null, mat: null, tag: null };
const GHOST_HZ = 15;
const ghostKey = (id) => 'soaprocket.ghost.' + id;

function ghostSave(id, lapTime, samples, lo) {

}
function ghostClear() {

}

// Record the player and drive the ghost (once per frame).
const _gf = { x: 0, y: 0, z: 0, yaw: 0, gnx: 0, gnz: 0, accLong: 0, lean: 0, land: 0, vis: 1, thr: 0.4, brk: 0, boosting: false, alive: true };
function ghostFrame(dt, t) {
  const me = RACE.me;
  if (!me || RACE.attract) return;
  const racing = RACE.phase === 'race' && !me.finished;
  if (racing) {
    GHOST.recT += dt;
    while (GHOST.recT >= 1 / GHOST_HZ) {
      GHOST.recT -= 1 / GHOST_HZ;
      GHOST.rec.push([Math.round(me.x * 100) / 100, Math.round(me.z * 100) / 100, Math.round(me.y * 100) / 100, Math.round(me.yaw * 1000) / 1000, Math.round(me.vis * 100) / 100, me.boosting ? 1 : 0]);
    }
  }
  const v = GHOST.view, g = GHOST.play;
  if (!v || !g) return;

  const a = g.s[i], b = g.s[i + 1];

// A lap just finished: keep it if it beat the stored best, and show the gap.
function ghostLap(lapTime) {

// ---- quick race ----------------------------------------------------------------
function trackCanvas(id, w = 320, h = 200) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const c = cv.getContext('2d'); const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#e7f6ff'); g.addColorStop(1, '#fdeef6'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  getTrack(id).drawMap(c, w, h, { detail: 1, pad: 18 });
  return cv.toDataURL();
}
const TRACK_IMG = {};
function trackCards(sel, act, rev = 0) {
  return TRACKS.map((t) => {
    const img = TRACK_IMG[t.id] || (TRACK_IMG[t.id] = trackCanvas(t.id));
    const tid = trackId(t.id, rev); const best = P.best[tid] ? fmtT(P.best[tid]) : '-';
    const md = (P.medals || {})[tid] || 0, tg = MEDALS[tid];
    const medalLine = tg ? (md === 1 ? '🥇 Gold!' : (md ? MEDAL_ICON[md] + ' ' : '') + 'next ' + MEDAL_NAME[md ? md - 1 : 3].toLowerCase() + ' ' + fmtT(tg[md ? md - 2 : 2])) : '';
    return `<div class="item trk ${sel === t.id ? 'on' : ''}" data-act="${act}" data-arg="${t.id}">
      <img src="${img}" style="width:100%;border-radius:12px;border:3px solid var(--ink);display:block" alt="">
      <h3>${t.name}</h3><p>${t.blurb}</p>
      <div class="foot"><span>${'💧'.repeat(t.diff)}</span><span style="font-size:13px">Best lap ${best}</span></div>
      <div style="font-size:12.5px;font-weight:700;opacity:.85">${medalLine}</div></div>`;
  }).join('');
}
const seg = (name, opts, cur) => `<div class="seg">${opts.map(([v, l]) => `<button class="${String(v) === String(cur) ? 'on' : ''}" data-act="seg" data-arg="${name}:${v}">${l}</button>`).join('')}</div>`;
function showQuick() {
  setMode('attract');

    <button class="btn" data-act="startQuick" style="--c:var(--mint)">Start <span class="k">ENTER</span></button></header>
    <div class="scroll"><div class="grid trk-grid">${trackCards(q.track, 'pickTrack', q.rev)}</div></div>
    <div style="display:flex;gap:22px;flex-wrap:wrap;align-items:center">
      <label class="opt">Laps ${seg('laps', [[2, '2'], [3, '3'], [5, '5']], q.laps)}</label>
      <label class="opt">Racers ${seg('cpus', [[0, 'Me vs my ghost'], [3, '4'], [5, '6'], [7, '8']], q.cpus)}</label>
      <label class="opt">CPU ${seg('diff', [['rinse', 'Rinse'], ['lather', 'Lather'], ['scrub', 'Scrub']], q.diff)}</label>
      <label class="opt">Direction ${seg('rev', [[0, 'Normal'], [1, 'Reverse']], q.rev)}</label>
    </div></div>`, 'veil');
}
ACT.quick = () => showQuick();
ACT.pickTrack = (id) => { UI.quick.track = id; showQuick(); };
ACT.seg = (arg) => {

function showGP() {
  setMode('attract');
  const d = UI.gpDiff || 'rinse';
  const cup = (k) => { const c = P.cups[k + (UI.gpRev ? '-r' : '')]; return c === 1 ? '🥇' : c === 2 ? '🥈' : c === 3 ? '🥉' : '◯'; };
  screen('gp', `${topbar('title')}<div class="panel card"><header><h2>Bath Cup Grand Prix</h2>

    <div class="gp-row">${TRACKS.map((t, k) => `<div class="item"><img src="${TRACK_IMG[t.id] || (TRACK_IMG[t.id] = trackCanvas(t.id))}" style="width:100%;border-radius:10px;border:3px solid var(--ink)"><h3>${k + 1}. ${t.name}</h3></div>`).join('')}</div>
    <div style="display:flex;gap:16px 22px;align-items:center;flex-wrap:wrap"><label class="opt">CPU ${seg('diff', [['rinse', 'Rinse ' + cup('rinse')], ['lather', 'Lather ' + cup('lather')], ['scrub', 'Scrub ' + cup('scrub')]], d)}</label>
    <label class="opt">Direction ${seg('rev', [[0, 'Normal'], [1, 'Reverse']], UI.gpRev)}</label>
    <span style="font-weight:600">Prize: ${{ rinse: '240 / 160 / 100', lather: '300 / 200 / 120', scrub: '420 / 280 / 170' }[d]} bubbles</span></div>
    </div></div>`, 'veil');
}
ACT.gp = () => showGP();
ACT.startGP = () => {
  const d = UI.gpDiff || 'rinse';
  const rnd = mulberry((Math.random() * 1e9) | 0);
  const names = [...CPU_NAMES].sort(() => rnd() - 0.5).slice(0, 7);
  GP.on = true; GP.diff = d; GP.rev = UI.gpRev; GP.idx = 0; GP.pts = { me: 0 }; GP.roster = names.map((n) => ({ name: n, lo: randomLoadout(rnd, d === 'scrub' ? 2 : 1), kind: 'cpu' }));
  for (const n of names) GP.pts[n] = 0;
  gpNext();
};
function gpNext() {
  const t = TRACKS[GP.idx];
  // Grid: reverse of the standings so the leader starts at the back.
  const ents = [{ name: myName(), lo: myLoadout(), kind: 'me', key: 'me' }, ...GP.roster.map((e) => ({ ...e, key: e.name }))];
  ents.sort((a, b) => (GP.pts[a.key] || 0) - (GP.pts[b.key] || 0));
  startRace({ track: trackId(t.id, GP.rev), laps: 3, diff: GP.diff, mode: 'gp', gp: GP, grid: ents });
}
function gpRecord(order) {
  order.forEach((r, k) => { const key = r.kind === 'me' ? 'me' : r.name; GP.pts[key] = (GP.pts[key] || 0) + (GP_PTS[k] || 0); });
  GP.idx++;
}
function gpStandings() {
  const rows = Object.entries(GP.pts).map(([k, v]) => ({ k, v, name: k === 'me' ? myName() : k })).sort((a, b) => b.v - a.v);
  return rows;
}

  const rows = res.order.map((r) => `<tr class="${r === me ? 'me' : ''}"><td>${r.place}</td><td><span class="chip" style="background:${hex(r.color)}"></span>${esc(r.name)}${tagOf(r)}</td><td>${r.projected ? '<span style="opacity:.6">still racing</span>' : fmtT(r.finishT)}</td><td>${isFinite(r.bestLap) ? 'best ' + fmtT(r.bestLap) : ''}</td></tr>`).join('');
  const rw = res.rewards.map(([l, v]) => `<div class="reward"><span>${esc(l)}</span><b>+${v}</b></div>`).join('');
  let gpHtml = '', buttons = '', trophy = '', head = me ? (me.place === 1 ? 'You win!' : ord(me.place) + ' place') : 'Race over';
  if (res.standings) {

    gpHtml = `<div class="card stand" style="padding:10px 14px;box-shadow:none"><h3 style="font-size:20px">Cup standings ${done ? '(final)' : `after race ${res.gpAfter} of ${TRACKS.length}`}</h3>${st.map((x, k) => `<div class="reward" style="${x.k === 'me' ? 'color:#c2185b' : ''}"><span>${k + 1}. ${esc(x.name)}</span><b>${x.v} pts</b></div>`).join('')}</div>`;
    if (done) {
      const pos = res.cup.pos;
      head = pos === 1 ? 'You win the cup!' : ord(pos) + ' in the cup';
      trophy = `<div class="pop ${pos === 1 ? 'c2' : 'c4'} sm" style="text-align:center;animation-delay:.3s;margin:-4px 0 2px">${pos <= 3 ? ['🥇 GOLD CUP!', '🥈 SILVER CUP!', '🥉 BRONZE CUP!'][pos - 1] + ' +' + res.cup.prize : 'No trophy this time'}</div>`;
      buttons = `<button class="btn" data-act="gp" style="--c:var(--lemon)">New cup</button><button class="btn" data-act="garage" style="--c:var(--sky)">Garage</button><button class="btn ghost" data-act="title">Menu</button>`;
    } else buttons = `<button class="btn big" data-act="gpNext" style="--c:var(--mint)">Next race: ${TRACKS[GP.idx].name}${GP.rev ? ' Reverse' : ''}</button><button class="btn" data-act="garage" style="--c:var(--sky)">Garage</button><button class="btn sm ghost" data-act="title">Quit cup</button>`;
  } else if (RACE.online) {
    buttons = `<button class="btn big" data-act="lobbyBack" style="--c:var(--pink)">Back to the room</button><button class="btn" data-act="garage" style="--c:var(--sky)">Garage</button><button class="btn ghost" data-act="leaveOnline">Leave room</button>`;
  } else buttons = `<button class="btn big" data-act="again" style="--c:var(--mint)">Race again <span class="k">ENTER</span></button><button class="btn" data-act="garage" style="--c:var(--sky)">Garage</button><button class="btn" data-act="quick" style="--c:var(--lemon)">Change track</button><button class="btn ghost" data-act="title">Menu</button>`;
  if (res.solo) {
    const g = res.ghost;
    head = g && g.beat ? 'Ghost beaten!' : g && !g.first ? 'Ghost wins this time' : 'Ghost saved';
    trophy = `<div class="hint" style="position:static;transform:none;align-self:flex-start">${g && g.beat ? 'Your best lap beat your ghost by ' + g.by.toFixed(2) + 's' : g && !g.first ? 'Your ghost is still faster. Race it again!' : 'Race this track again to chase your own ghost.'}</div>`;
  }
  screen('results', `${topbar()}<div class="panel card res-panel ${res.standings ? 'gp' : ''}">

function setSetting(k, v) {
  const S = P.set;
  if (k === 'sound') { S.sound = +v; audioVol(); if (!S.sound) loopsOff(); }
  else if (k === 'vol') { S.vol = +v; audioVol(); }
  else if (k === 'quality') { S.quality = v; setQuality(v === 'auto' ? QN : v); }
  else if (k === 'shake') S.shake = +v;
  else if (k === 'cam') S.cam = +v;
  else if (k === 'touch') { S.touch = v; applyTouch(); }
  else if (k === 'fps') { S.fps = +v; $('fps') && ($('fps').style.display = S.fps ? '' : 'none'); }
  saveProfile();
}

  const stat = (n, l) => `<div class="pill" style="flex-direction:column;align-items:flex-start;border-radius:16px;padding:6px 14px"><b style="font-family:var(--head);font-size:26px;font-weight:400">${n}</b><span style="font-size:13px">${l}</span></div>`;

// Drive one racer with fixed inputs on a fresh track and report what happened.
function simRun(trackId, setup, secs, ctrl) {
  const T = getTrack(trackId);
  const r = new Racer('test', { bar: 'rosy', rocket: 'twin', mods: [] }, 'cpu');
  const g = T.gridSlot(0); r.reset(g.x, g.z, g.yaw, g.i); r.y = T.heightAt(g.x, g.z, g.i);
  setup && setup(r, T);

  let px = r.x, pz = r.z;
  while (t < secs) {
    ctrl && ctrl(r, t, T);
    r.step(dt, T, true);
    log.maxV = Math.max(log.maxV, r.speed); log.dist += Math.hypot(r.x - px, r.z - pz); px = r.x; pz = r.z;
    for (const e of r.events) if (e.type === 'wall') log.walls++;
    r.events.length = 0; t += dt;
  }
  log.r = r; return log;
}

    const T0 = getTrack('floor'); const sf = T0.surface.bind(T0);
    T0.surface = (x, z, o = {}) => { sf(x, z, o); if (T0._forceWet != null) { o.wet = T0._forceWet; o.mat = 0; o.pud = 0; } return o; };
    const gw = glide(1), gd = glide(0);
    T0.surface = sf; T0._forceWet = null;
    ok('a kicked soap glides further on wet than dry', gw.dist > gd.dist * 1.8, 'wet ' + gw.dist.toFixed(2) + ' dry ' + gd.dist.toFixed(2));
    ok('wet glide from 6 u/s is long (video: long slide)', gw.dist > 5, gw.dist.toFixed(2));
    // Top speed on the shower track.
    const top = simRun('shower', null, 6, (r) => { r.in.thr = 1; r.in.steer = 0; });
    ok('full throttle reaches 7..14 u/s', top.maxV > 7 && top.maxV < 14, top.maxV.toFixed(2));
    // Wall: low bounce, keeps sliding along it.
    {
      const T = getTrack('shower'); const i = 40; const r = new Racer('w', { bar: 'rosy', rocket: 'twin' }, 'cpu');
      // Fly into the left wall at an angle, pointed the way it moves.
      const ang = 0.85; const vx = T.tx[i] * Math.cos(ang) + T.nx[i] * Math.sin(ang), vz = T.tz[i] * Math.cos(ang) + T.nz[i] * Math.sin(ang);
      r.reset(T.px[i] + T.nx[i] * 2, T.pz[i] + T.nz[i] * 2, Math.atan2(vx, vz), i);
      r.vx = vx * 8; r.vz = vz * 8;
      let hit = null;
      for (let k = 0; k < 240 && !hit; k++) { r.step(CFG.dt, T, true); for (const e of r.events) if (e.type === 'wall') hit = { e, vn: r.vx * e.nx + r.vz * e.nz, vt: Math.abs(r.vx * -e.nz + r.vz * e.nx) }; r.events.length = 0; }
      ok('soap hits the wall', !!hit);
      if (hit) { ok('bounce off the wall is small', hit.vn < 2.2, 'out ' + hit.vn.toFixed(2)); ok('keeps sliding along the wall', hit.vt > 2.4, 'along ' + hit.vt.toFixed(2)); }
    }
    // Drains take only small bars.
    {
      const T = getTrack('shower'); const d = T.drains[0];
      const at = (size) => { const r = new Racer('d', { bar: 'rosy', rocket: 'twin' }, 'cpu'); r.reset(d.x + 0.1, d.z, 0, -1); r.size = size; for (let k = 0; k < 60; k++) { r.in.thr = 0; r.step(CFG.dt, T, true); } return r.alive; };
      ok('a new bar rides over the drain', at(1));
      ok('a worn bar slips down the drain', !at(0.6));
    }
    // Every part is a real trade.
    const base = displayStats({ bar: 'rosy', rocket: 'twin', mods: [] });
    for (const [kind, list] of [['bar', BARS], ['rocket', ROCKETS], ['mod', MODS]]) for (const id of Object.keys(list)) {
      if ((kind === 'bar' && id === 'rosy') || (kind === 'rocket' && id === 'twin')) continue;
      const lo = { bar: 'rosy', rocket: 'twin', mods: [] }; if (kind === 'mod') lo.mods = [id]; else lo[kind] = id;
      const s = displayStats(lo); const d = s.map((x, k) => x[1] - base[k][1]);
      const st = (list[id].st || {});
      const special = st.plug || st.horn || st.shield || st.startBoost || st.bubbleJet || st.chipless || st.draft || st.dryMu || st.sudsR || st.hop || st.magnet || st.cannon || st.bumpers || st.spool || st.bubbles || st.bTop;
      ok(kind + ' ' + id + ' has an upside and a downside', (d.some((v) => v > 0.05) || special) && (d.some((v) => v < -0.05) || st.sudsCost > 1 || st.wear > 1 || st.dryMu > 1), d.map((v) => v.toFixed(1)).join(','));
    }
    // The user's extra models load and become usable props.
    ok('the 20 extra designs loaded', PGLB.ok && Object.keys(PGLB.proto).length === 20, Object.keys(PGLB.proto).length + ' models');
    ok('golden soap builds from its own model', (() => { const g = soapGeometry('mid', { bar: 'golden', rocket: 'jet', mods: [] }); return g.barG.attributes.position.count > 1000 && g.flames.length === 2; })());
    // Pickups: coins add up, stars refill boost.
    {
      raceSetup({ track: 'shower', laps: 1, cpus: 0, mode: 'quick' });
      const me = RACE.me, coin = PICK.items.find((i) => i.kind === 'coin'), star = PICK.items.find((i) => i.kind === 'star');
      me.x = coin.x; me.z = coin.z; me.y = coin.y - 0.5; pickupsCollect(me);
      ok('driving through a soap coin collects it', me.coins === 1 && coin.cool > 0);
      me.boost = 10; me.x = star.x; me.z = star.z; pickupsCollect(me);
      ok('a boost star refills boost', me.boost >= 50, me.boost.toFixed(0));
    }
    // Razors shave the bar.
    {
      const T = getTrack('floor'); const rz = T.obst.find((o) => o.kind === 'razor');
      const r = new Racer('z', { bar: 'rosy', rocket: 'twin' }, 'cpu'); r.reset(rz.x + 1.6, rz.z, -Math.PI / 2, -1); r.vx = -6; r.vz = 0; const s0 = r.size;
      for (let k = 0; k < 60; k++) r.step(CFG.dt, T, true);
      ok('hitting a razor shaves soap off', r.size < s0 - 0.03, (s0 - r.size).toFixed(3));
    }
    // Turbo jet spools up; bubble jet trails don't spin people out.
    {
      const T = getTrack('shower'); const r = new Racer('j', { bar: 'rosy', rocket: 'jet' }, 'cpu'); const g = T.gridSlot(0); r.reset(g.x, g.z, g.yaw, g.i); r.boost = 100;
      r.in.boost = true; r.step(CFG.dt, T, true); const early = r.spoolK; for (let k = 0; k < 120; k++) r.step(CFG.dt, T, true);
      ok('turbo jet boost spools up over time', early < 0.1 && r.spoolK === 1, early.toFixed(2));
      SUDS.list = []; const sx = g.x + Math.sin(g.yaw) * 3, sz = g.z + Math.cos(g.yaw) * 3; const ws = SUDS.add(sx, sz, 0.65, null, 3.5); ws.weak = 1;
      ok('bubble jet trail is slippery but no spin out', SUDS.at(sx, sz, null) <= 0.3);
      SUDS.list = [];
    }
    // Broken or ancient saves are repaired, not crashes.
    {
      const bad = sanitizeProfile({ v: 1, bubbles: 'lots', eq: { bar: 'nope', mods: null, paint: -3 }, own: { bar: 'rosy' }, best: null, medals: 7 });
      const lo = (() => { const keep = P; P = bad; try { return myLoadout(); } finally { P = keep; } })();
      ok('a broken save loads safely', bad.bubbles === 0 && Array.isArray(bad.eq.mods) && Array.isArray(bad.own.bar) && typeof bad.medals === 'object' && cleanLoadout(lo).bar === 'rosy');
    }
    // Fun mods.
    {
      const T = getTrack('floor'); const rz = T.obst.find((o) => o.kind === 'razor');
      const r = new Racer('h', { bar: 'rosy', rocket: 'twin', mods: ['hop'] }, 'cpu'); r.reset(rz.x + 2.2, rz.z, -Math.PI / 2, -1); r.vx = -7; r.boost = 100; const s0 = r.size;
      r.step(CFG.dt, T, true); r.hop();
      for (let k = 0; k < 60; k++) r.step(CFG.dt, T, true);
      ok('Spring Sole hops clean over a razor', r.size > s0 - 0.01 && r.boost < 90, 'lost ' + (s0 - r.size).toFixed(3));
      raceSetup({ track: 'shower', laps: 1, cpus: 0, mode: 'quick' }); RACE.phase = 'race';
      const me = RACE.me; me.setLoadout({ bar: 'rosy', rocket: 'twin', mods: ['cannon'] }); me.sudsCd = 0; const n0 = SUDS.list.length;
      tryDropSuds(me); for (let k = 0; k < 90; k++) shotsUpdate(CFG.dt);
      const sp = SUDS.list[SUDS.list.length - 1];
      ok('Foam Cannon suds land ahead of you', SUDS.list.length === n0 + 1 && sp && ((sp.x - me.x) * Math.sin(me.yaw) + (sp.z - me.z) * Math.cos(me.yaw)) > 4);
      me.setLoadout({ bar: 'rosy', rocket: 'twin', mods: ['magnet'] }); const c = PICK.items.find((i) => i.kind === 'coin' && i.cool <= 0);
      me.x = c.x + 2.5; me.z = c.z; me.y = c.y - 0.5; me.coins = 0; for (let k = 0; k < 120; k++) pickupsCollect(me);
      ok('Coin Magnet pulls coins in from 2.5 away', me.coins >= 1, me.coins + ' coins');
      SUDS.list = [];
    }
    // A full CPU race finishes.
    raceSetup({ track: 'tub', laps: 1, cpus: 5, diff: 'scrub', mode: 'quick' });
    RACE.me.kind = 'cpu'; RACE.cpus.push(new CpuDriver(RACE.me, 'scrub', 3));
    RACE.phase = 'count'; RACE.t = -0.01;
    let steps = 0; while (steps < 120 * 90 && !RACE.racers.every((r) => r.finished)) { raceStep(CFG.dt); handleEvents(); steps++; }
    const fin = RACE.racers.filter((r) => r.finished).length;
    ok('CPU race: everyone finishes 1 lap of the tub in 90 s', fin === RACE.racers.length, fin + '/' + RACE.racers.length + ' in ' + (steps / 120).toFixed(1) + 's');
    for (const d of [...TRACKS, ...TRACKS.map((t) => TRACK_BY[t.id + '-r'])]) {
      raceSetup({ track: d.id, laps: 1, cpus: 7, diff: 'lather', mode: 'quick' });
      RACE.me.kind = 'cpu'; RACE.cpus.push(new CpuDriver(RACE.me, 'lather', 4));
      RACE.phase = 'count'; RACE.t = -0.01; steps = 0;
      while (steps < 120 * 100 && !RACE.racers.every((r) => r.finished)) { raceStep(CFG.dt); handleEvents(); steps++; }
      const f = RACE.racers.filter((r) => r.finished);
      const times = f.map((r) => r.finishT).sort((a, b) => a - b);
      ok(d.id + ': 8 CPUs finish a lap', f.length === 8, f.length + '/8, first ' + (times[0] || 0).toFixed(1) + 's last ' + (times[times.length - 1] || 0).toFixed(1) + 's');
    }
  } catch (e) { ok('no exceptions', false, e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : String(e)); }
  const pre = document.createElement('pre'); pre.id = 'smokeout'; pre.textContent = out.join('\n'); pre.style.cssText = 'position:fixed;inset:10px;z-index:999;background:#fff;overflow:auto;font:12px monospace;padding:10px;border:3px solid #000';
  document.body.appendChild(pre);
  document.title = (fail ? 'SMOKE FAIL ' : 'SMOKE PASS ') + pass + '/' + (pass + fail);
}

</script>
