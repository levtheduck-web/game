<style>
:root{
  --ink:#120d17; --ink2:#1c1422; --stone:#2c2134; --stone2:#3b2d45; --stone3:#57406a;
  --bone:#e8dcc4; --parch:#c9b48a; --gold:#e3b341; --crimson:#c2364a; --ember:#ef7d3c;
  --ghost:#8ff0de; --violet:#b48cf2; --moss:#7fa35a; --dim:#8a7a92;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--bone);overflow:hidden;
  font-family:'Pixelify Sans',ui-monospace,monospace;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative}
canvas#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:none}
.hud{position:absolute;pointer-events:none;font-size:14px;text-shadow:0 2px 0 #000}
#hudTL{left:10px;top:8px}
#hudTR{right:10px;top:8px;text-align:right;color:var(--parch)}
#hudMode{left:50%;bottom:76px;transform:translateX(-50%);display:flex;gap:12px;font-size:12px;white-space:nowrap;color:var(--dim)}
#hudMode b{font-weight:600}
#hudB{left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:6px;align-items:flex-end}
#hudB .slot.gap{margin-left:10px}
.slot .role{position:absolute;left:-4px;right:-4px;bottom:-14px;text-align:center;font-size:10px;color:var(--dim);letter-spacing:.5px;white-space:nowrap}
.slot .cdn{position:absolute;left:0;right:0;top:13px;text-align:center;font-size:15px;color:#fff;text-shadow:0 1px 0 #000,0 0 3px #000;font-weight:600}
.slot.ready{animation:rdy .4s ease-out}
@keyframes rdy{0%{box-shadow:0 0 0 3px #fff,0 0 14px #fff}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
#boss{left:50%;top:10px;transform:translateX(-50%);width:46%;text-align:center;display:none}
#boss .nm{font-family:'Jacquard 12',serif;font-size:24px;color:var(--ghost);line-height:1}
#boss .bar{height:8px;background:#000;border:2px solid var(--stone3);margin-top:3px}
#boss .bar i{display:block;height:100%;background:var(--ghost)}
.hpbar{width:170px;height:12px;background:#000;border:2px solid var(--stone3);position:relative}
.hpbar i{display:block;height:100%;background:var(--crimson)}
.hpbar b{position:absolute;inset:0;background:rgba(127,178,240,.55);transform-origin:left}
.row{display:flex;gap:10px;align-items:center;margin-top:5px}
.slot{width:46px;height:46px;background:rgba(18,13,23,.85);border:2px solid var(--stone3);position:relative}
.slot canvas{width:100%;height:100%;image-rendering:pixelated}
.slot .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7)}
.slot .k{position:absolute;left:2px;top:-2px;font-size:11px;color:var(--parch)}
.slot .lock{position:absolute;left:0;right:0;top:17px;text-align:center;font-size:9px;color:var(--dim);letter-spacing:.5px}
.rk{position:absolute;right:2px;bottom:-1px;font-size:12px;color:var(--gold);text-shadow:0 1px 0 #000;font-weight:600}
.powline{border:1px solid #8a6a2a;background:#1a1410;padding:6px 8px;margin:8px 0;font-size:15px}
.powline b{color:var(--gold)}
.rune{width:30px;height:30px;background:rgba(18,13,23,.85);border:2px solid #4a3a2a;position:relative}
.card.curse{border-color:var(--moss);background:#232a1e;cursor:default}
.card.curse .t{color:var(--moss)}
.beast{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--stone3)}
.beast canvas{image-rendering:pixelated;flex:none;background:#0c0910;border:2px solid var(--stone3)}
.beast .nm{font-size:19px;color:var(--gold)}
.beast b{color:var(--parch);font-weight:600}
.rune canvas{width:100%;height:100%;image-rendering:pixelated}
.sep{width:8px}
/* overlays */
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,6,14,.82);z-index:10;padding:16px}
.ov.on{display:flex}
.panel{background:var(--ink2);border:3px solid var(--stone3);box-shadow:0 0 0 3px #000,0 12px 40px #000;padding:18px 22px;max-width:760px;width:100%;max-height:92vh;overflow:auto}
h1,h2,h3{font-family:'Jacquard 12',serif;font-weight:400;margin:0;line-height:.95}
h1{font-size:96px;color:var(--bone);letter-spacing:2px;text-shadow:0 4px 0 #000,0 0 30px rgba(227,179,65,.25)}
h2{font-size:44px;color:var(--gold)}
h3{font-size:30px;color:var(--ghost)}
p{margin:8px 0;line-height:1.35}
.dim{color:var(--dim)}
.btn{pointer-events:auto;font-family:inherit;font-size:17px;background:var(--stone);color:var(--bone);border:2px solid var(--stone3);
  padding:8px 16px;margin:4px;cursor:pointer;box-shadow:0 3px 0 #000}
.btn:hover,.btn:focus-visible{background:var(--stone2);border-color:var(--gold);outline:none}
.btn.main{background:#4a2730;border-color:var(--crimson)}
.btn.main:hover{border-color:var(--gold)}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.card{flex:1 1 180px;background:var(--stone);border:2px solid var(--stone3);padding:10px;cursor:pointer;min-width:160px}
.card:hover{border-color:var(--gold);background:var(--stone2)}
.card.off{opacity:.45;cursor:default}
.card .t{display:flex;gap:8px;align-items:center;font-size:18px;color:var(--gold)}
.card .t canvas{width:32px;height:32px;image-rendering:pixelated;flex:none}
.card .d{font-size:14px;color:var(--bone);margin-top:6px;line-height:1.3}
.card .pr{float:right;color:var(--gold)}
.portrait{image-rendering:pixelated;border:3px solid var(--gold);background:#0c0910;box-shadow:0 0 0 3px #000}
.heirgrid{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.habits{list-style:none;padding:0;margin:8px 0}
.habits li{padding:4px 0;border-bottom:1px dashed var(--stone3);font-size:15px}
.habits li b{color:var(--ghost);font-weight:600}
.words{font-style:italic;color:var(--parch);font-size:17px}
.tree{display:flex;flex-direction:column;gap:0}
.gen{display:flex;gap:12px;align-items:center;padding:8px;border-left:3px solid var(--stone3);margin-left:20px;position:relative}
.gen:before{content:'';position:absolute;left:-12px;top:50%;width:21px;height:21px;background:var(--ink2);border:3px solid var(--stone3);transform:translateY(-50%) rotate(45deg)}
.gen.heir:before{border-color:var(--ghost)}
.gen.won:before{border-color:var(--gold)}
.gen .info{font-size:14px}
.gen .nm{font-size:19px;color:var(--bone)}
.tag{display:inline-block;font-size:12px;padding:1px 6px;border:1px solid;margin-left:6px}
.tag.heir{color:var(--ghost)}.tag.rest{color:var(--dim)}.tag.won{color:var(--gold)}.tag.succ{color:var(--parch)}
.titlebox{text-align:center}
.titlebox .sub{font-size:18px;color:var(--parch);margin-top:-4px}
.heirs-list{margin:14px auto;max-width:460px;text-align:left;font-size:15px}
.heirs-list div{padding:3px 0;border-bottom:1px dashed var(--stone3)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:10px 0}
.keys b{color:var(--gold);font-weight:600}
#cursor{position:fixed;pointer-events:none;z-index:5}
#tip{position:absolute;left:50%;top:34%;transform:translateX(-50%);max-width:70%;background:rgba(18,13,23,.88);border:2px solid var(--stone3);padding:6px 10px;font-size:14px;color:var(--bone);pointer-events:none;opacity:0;transition:opacity .4s;text-align:center}
#tip b{color:var(--gold)}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:'Jacquard 12',serif;font-size:44px;color:var(--gold);text-shadow:0 3px 0 #000;pointer-events:none;opacity:0;transition:opacity .4s;white-space:nowrap}
#smokeout{position:fixed;inset:0;background:#000;color:#9f9;font:12px monospace;overflow:auto;z-index:99;margin:0;padding:10px;white-space:pre-wrap}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   INHERITANCE  -  your last dead character is the next boss.
   Solo, local. Pixel canvas 320x192, DOM HUD/menus.
   #smoke runs the self-tests.
   ===================================================================== */
const W = 320, H = 192, T = 16, COLS = 20, ROWS = 12;   // the screen; small rooms are exactly this
// fighting rooms are much bigger than the screen and the camera follows you (tiles)
const ROOM_SIZE = {combat:[40, 24], guardian:[36, 22], founder:[36, 22]};
const cam = {x:0, y:0};
const SMOKE = location.hash.includes('smoke');
const cv = document.getElementById('game'), cx = cv.getContext('2d');
cx.imageSmoothingEnabled = false;

/* ---------- RNG ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd = mulberry32(Date.now() & 0xffffffff);
const seed = s => { rnd = mulberry32(s); };
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- palette ---------- */

  violet:'#b48cf2', moss:'#7fa35a', blue:'#7fb2f0', skin:'#e2b98f', brown:'#7a5233', dark:'#0b080e'

/* ---------- content ---------- */

// for a while powers sat on their own R slot: heirs, the tree and wills that had one get it back in a normal slot
function migrateSave(s){
  const fix = h => {
    if (!h || !h.spells) return;
    h.spells = padSlots(h.spells);
    if (!h.power) return;
    if (SPELLS[h.power] && !h.spells.includes(h.power)) { let i = h.spells.indexOf(null); if (i < 0) i = h.spells.length - 1; h.spells[i] = h.power; }
    delete h.power;
  };
  Object.values(s.heirs || {}).forEach(fix);
  (s.tree || []).forEach(fix);
  if (s.will && s.will.kind === 'power') s.will = {kind:'spell', id:s.will.id, rank:1};
  return s;
}

    fresh(); RUN.floor = 1; const easyH = spawnHeir(heirFromRun(null)); ok(easyH.maxHp === 215 && easyH.dmgMult === 0.45 && spawnFounder().maxHp === 800, `a fresh 100-health Heir has ${easyH.maxHp} health and hits at 45%; the Founder has 800`);
    // 29 big halls: the size, the layout, the camera, the edges
    fresh(3); RUN.ri = 1; enterRoom();
    ok(room.w === 40 && room.h === 24 && room.pw === 640 && P.x === 320 && P.y === (room.h - 2) * T + 6, 'combat rooms are four screens big and you walk in at the bottom middle');
    fresh(); ok(room.w === COLS && room.h === ROWS, 'start and choice rooms are still one screen');
    let sealed = 0, hallsChecked = 0, pillarTiles = 0;
    for (let i = 0; i < 40; i++) { seed(700 + i); for (const ty of ['combat', 'guardian']) {
      room = makeRoom(ty, true); hallsChecked++;
      const seen = new Set([(room.w / 2) + ',' + (room.h - 2)]), st = [[room.w / 2, room.h - 2]];
      while (st.length) { const [x, y] = st.pop(); for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + a, ny = y + b, k = nx + ',' + ny; if (!seen.has(k) && room.g[ny] && room.g[ny][nx] === 0) { seen.add(k); st.push([nx, ny]); } } }
      let free = 0; for (let y = 0; y < room.h; y++) for (let x = 0; x < room.w; x++) { if (!room.g[y][x]) free++; if (room.g[y][x] === 2) pillarTiles++; }
      if (free !== seen.size || room.g[room.h - 2][room.w / 2]) sealed++;
    } }
    ok(sealed === 0 && pillarTiles / hallsChecked > 20, `every floor tile is reachable in ${hallsChecked} generated halls (about ${Math.round(pillarTiles / hallsChecked)} pillar tiles each)`);
    fresh(3); RUN.ri = 1; enterRoom(); room.waves = [];
    ok(Math.abs(cam.y - (room.ph - H)) < 1 && Math.abs(cam.x - (P.x - W / 2)) < 1, 'the camera starts on you');
    P.x = room.pw - 30; P.y = 60; step(60);
    ok(Math.abs(cam.x - (room.pw - W)) < 1 && Math.abs(cam.y) < 1, 'it follows you and stops at the walls');
    ({x:P.x, y:P.y} = freeNear(300, 200, P.r)); step(60);
    ok(Math.abs(P.x - cam.x - W / 2) < 1 && Math.abs(P.y - cam.y - H / 2) < 1, 'in the middle of a hall you stay centred');
    input.mx = W / 2 + 40; input.my = H / 2; step(1); ok(Math.abs(P.aim) < 0.03, 'aiming goes through the camera (mouse to your right aims right)');
    input.mx = 160; input.my = 96;
    fresh(3); RUN.ri = 1; enterRoom(); room.waves = []; room.started = true; P.hp = P.maxHp = 1e4;
    const farSk = spawnFoe('skel', 40, P.y); farSk.cd = 0; farSk.spd = 0; step(60); const farCd = farSk.cd;
    ({x:farSk.x, y:farSk.y} = freeNear(P.x - 120, P.y, farSk.r)); step(60);
    ok(farCd <= 0 && farSk.cd > 1, 'archers out past the screen hold their fire until they are close');
    fresh(3); RUN.ri = 1; enterRoom(); room.waves = []; ({x:P.x, y:P.y} = freeNear(320, 200, P.r)); updateCam(0, true); shake = 0;
    const offF = spawnFoe('ghoul', 40, P.y); offF.cd = 99; offF.spd = 0; draw();
    const cX = Math.round(cam.x), cY = Math.round(cam.y), edx = offF.x - cX - W / 2, edy = offF.y - cY - H / 2, ek = Math.min((W / 2 - 5) / Math.max(1e-6, Math.abs(edx)), (H / 2 - 5) / Math.max(1e-6, Math.abs(edy)));
    const pip = cx.getImageData(Math.round(W / 2 + edx * ek), Math.round(H / 2 + edy * ek), 1, 1).data;
    ok(pip[0] === 194 && pip[1] === 54 && pip[2] === 74, 'a foe off the screen shows as a pip on the edge, pointing at it');
    fresh(3); RUN.ri = 1; enterRoom(); room.waves = []; room.started = true; const gold0 = RUN.gold;
    for (let i = 0; i < 5; i++) pickups.push({kind:'coin', x:40 + i * 10, y:60, vx:0, vy:0, t:1});
    step(120); ok(RUN.gold === gold0 + 5, 'once a hall is clear its coins fly to you from anywhere');
    ok(room.doors.length === 2 && room.doors[0].c === 9 && room.doors[1].c === 29 && room.doors.every(d => !room.g[2][d.c] && !room.g[2][d.c + 1]), 'doors spread along the top of the hall with clear floor in front of them');
    fresh(5); RUN.ri = 1; enterRoom(); ({x:P.x, y:P.y} = freeNear(120, 120, P.r)); step(40);
    ok(room.pending.length > 0 && room.pending.every(q => Math.hypot(q.x - P.x, q.y - P.y) <= 215), 'waves rise near you, not across the hall');
    fresh(); RUN.floor = 2; save.heirs[2] = heirFromRun(null); save.heirs[2].cause = 'x'; save.heirs[2].words = 'y'; RUN.plan = floorPlan(2); RUN.ri = RUN.plan.indexOf('guardian'); enterRoom(); ovOff(); state = 'play';
    ok(room.w === 36 && room.heir && dist(room.heir, P) < 200 && room.heir.y - cam.y > 0, 'the Heir waits in a big hall, close enough to see from the door');
    draw(); hud(); ok(true, 'a big hall draws');
    delete save.heirs[2];
    // 28 everything new draws
    fresh(); room.cleared = false; spawnFoe('spider', 100, 100).wind = 0.3; const dg = spawnFoe('digger', 140, 100); dg.under = true; dg.st = 'tell'; spawnFoe('digger', 180, 100).st = 'daze';
    const mm = spawnFoe('mourner', 220, 100); mm.tgt = foes[0]; mm.wind = 0.3; foes[0].hexT = 2; foes[0].rootT = 1;
    webs.push({x:120, y:140, r:14, t:3}); marks.push({x:200, y:140, t:0.3, max:0.6, r:18, dmg:1, owner:P, team:'p'});
    P.spells = ['blink', 'scythe', 'grasp', 'hex']; P.runes = ['rites', 'haunt', 'ricochet']; P.hp = 10; P.ranks = {hex:3};
    cast(P, 0, 0); cast(P, 1, 0); cast(P, 3, 0); fx.push({kind:'hands', x:100, y:120, t:0.1, max:0.45, r:18, col:C.ghost});
    shots.push({x:150, y:120, vx:50, vy:0, r:3, dmg:1, team:'p', owner:P, kind:'haunt', life:1, pierce:0, hits:new Set()}, {x:150, y:130, vx:50, vy:0, r:3, dmg:1, team:'e', owner:mm, kind:'tear', life:1, pierce:0, hits:new Set()});
    RUN.curses = ['marked']; draw(); hud(); ok(document.querySelector('#hudB .rk') && $('hudTR').textContent.includes('Marked'), 'new foes, spells and the HUD draw');
    showBestiary(); ok(document.querySelectorAll('.beast').length === Object.keys(LORE).length && document.querySelectorAll('.beast canvas').length === 8, 'the bestiary lists every foe');
    ovOff();
    ok(Object.keys(SPELLS).every(id => GLYPH[id]) && Object.keys(RUNES).every(id => GLYPH[id] && RUNE_COL[id]) && POWER_IDS.every(id => GLYPH[id] && iconCanvas({kind:'spell', id}).width === 16), 'every spell, rune and power has an icon');
  } catch (err) { fail++; out.push('FAIL threw: ' + err.message + '\n' + err.stack); }
  const pre = document.createElement('pre'); pre.id = 'smokeout'; pre.textContent = `SMOKE ${fail ? 'FAIL' : 'PASS'} ${pass}/${pass + fail}\n` + out.join('\n'); document.body.appendChild(pre);
  document.title = `SMOKE ${fail ? 'FAIL' : 'PASS'} ${pass}/${pass + fail}`;
}
