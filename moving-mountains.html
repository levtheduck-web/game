<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="Moving Mountains: remove a 2,700,000,000-rock mountain. Start with a spoon." />
<title>Moving Mountains</title>
<!--
  Moving Mountains is a Unity game. Its browser build is hosted on its own site, and this
  page frames it inside GLITCHBOX so it gets the arcade's menu, terms and bans. The Windows
  and Mac builds are on the GitHub release "moving-mountains-1" and are offered by the
  Download button (APPS in glitchbox-download.js).
-->
<script src="glitchbox-config.js"></script>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  #mm { position:fixed; inset:0; width:100%; height:100%; border:0; display:block; background:#000; }
</style>
</head>
<body>
<iframe id="mm" title="Moving Mountains" src="https://moving-mountains.levtheduck.workers.dev/"
  allow="fullscreen; autoplay; gamepad; pointer-lock; clipboard-write; screen-wake-lock" allowfullscreen></iframe>
<script>
(function () {
  var mm = document.getElementById('mm');
  // Keys only reach the game once its frame has focus. play.html focuses this page,
  // so pass it on down to the game inside.
  function focusGame() { try { mm.focus(); mm.contentWindow.focus(); } catch (e) {} }
  mm.addEventListener('load', focusGame);
  window.addEventListener('focus', focusGame);

  // The arcade's menu button. On phones the game keeps its own buttons in the top-left
  // corner, so the arcade's sits top-right there instead.
  var touch = matchMedia('(pointer:coarse)').matches && !matchMedia('(any-pointer:fine)').matches;
  var s = document.createElement('script');
  s.src = 'glitchbox-menu.js';
  s.dataset.pos = touch ? 'top-right' : 'top-left';
  document.head.appendChild(s);
})();
</script>
</body>
</html>
